<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>PRIME-CBT Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b1a; --card: #0f172a; --card-2: #1e293b; --line: #334155;
      --text: #f1f5f9; --muted: #94a3b8; --faint: #64748b;
      --primary: #34d399; --primary-2: #10b981; --danger: #f87171; --amber: #fbbf24; --blue: #60a5fa;
      --r: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }

    /* ---------- PIN lock screen ---------- */
    .lock { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 8px; }
    .lock h1 { font-size: 1.35rem; font-weight: 700; margin-top: 8px; text-align: center; }
    .lock .sub { color: var(--muted); font-size: .9rem; text-align: center; min-height: 1.3em; max-width: 280px; }
    .lock .sub.err { color: var(--danger); }
    .dots { display: flex; gap: 16px; margin: 22px 0 18px; }
    .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); transition: background .12s, border-color .12s; }
    .dot.on { background: var(--primary); border-color: var(--primary); }
    .dots.shake { animation: shake .35s; }
    @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
    .pad { display: grid; grid-template-columns: repeat(3, 74px); gap: 14px; }
    .pad button { height: 74px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); font-size: 1.5rem; font-weight: 500; transition: background .12s, transform .08s; }
    .pad button:active { background: var(--card-2); transform: scale(.94); }
    .pad .ghost { background: none; border-color: transparent; font-size: 1.1rem; color: var(--muted); }
    .pad button:disabled { opacity: .4; }

    /* ---------- shell (rearranged for live modern feel) ---------- */
    .app { max-width: 960px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
    .topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: rgba(6,11,26,.96); backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
    .topbar h2 { flex: 1; font-size: 1.3rem; font-weight: 700; letter-spacing: -.02em; }
    .iconbtn { width: 40px; height: 40px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; transition: all .2s; }
    .iconbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .iconbtn:hover { background: var(--card-2); transform: scale(1.05); }
    .content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 90px; }
    .content.no-padding { padding: 20px; }

    .drawer-back { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .25s cubic-bezier(0.4, 0, 0.2, 1); }
    .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(320px, 92vw); background: var(--card); border-right: 1px solid var(--line); z-index: 31; transform: translateX(-100%); transition: transform .28s cubic-bezier(0.32, 0.72, 0, 1); overflow-y: auto; padding: 20px 14px 32px; box-shadow: 8px 0 30px -10px rgba(0,0,0,.6); }
    body.menu-open .drawer { transform: none; }
    body.menu-open .drawer-back { opacity: 1; pointer-events: auto; }

    .brand { font-weight: 700; font-size: 1.25rem; padding: 6px 12px 18px; letter-spacing: -.01em; }
    .brand small { display: block; color: var(--muted); font-weight: 500; font-size: .82rem; margin-top: 3px; }
    .nav-group { color: var(--faint); font-size: .78rem; font-weight: 700; padding: 16px 10px 8px; letter-spacing: .01em; }
    .nav { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 13px 12px; border-radius: 12px; font-size: 1rem; font-weight: 500; color: var(--text); transition: all .2s; }
    .nav:hover { background: var(--card-2); transform: translateX(6px); }
    .nav.active { background: rgba(52,211,153,.18); color: var(--primary); font-weight: 700; box-shadow: 0 2px 8px rgba(52,211,153,.1); }

    /* ---------- common bits (upgraded) ---------- */
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .toolbar input, .toolbar select { flex: 1 1 160px; min-width: 0; font-size: .96rem; }
    input, select, textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; font-size: .96rem; transition: all .2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(52,211,153,.15); outline: none; }
    textarea { resize: vertical; line-height: 1.5; }
    input::placeholder, textarea::placeholder { color: var(--faint); }
    select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 19px) 55%, calc(100% - 14px) 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 34px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 12px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: .94rem; transition: all .2s; }
    .btn:active { transform: scale(.96); }
    .btn.primary { background: linear-gradient(135deg, #34d399, #10b981); color: #052e1f; border: 0; box-shadow: 0 4px 15px rgba(52,211,153,.3); }
    .btn.danger { color: var(--danger); }
    .btn.small { padding: 8px 13px; font-size: .84rem; border-radius: 10px; }
    .btn:disabled { opacity: .45; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,.1); }
    .row { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; transition: all .2s; }
    .row.tap { cursor: pointer; }
    .row.tap:hover { background: var(--card-2); transform: translateY(-2px); }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-weight: 600; font-size: 1rem; overflow-wrap: anywhere; line-height: 1.4; }
    .row-sub { color: var(--muted); font-size: .86rem; margin-top: 3px; overflow-wrap: anywhere; line-height: 1.35; }
    .row-sub2 { color: var(--faint); font-size: .8rem; margin-top: 2px; overflow-wrap: anywhere; }
    .row-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }

    .tag { display: inline-block; font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 9999px; background: rgba(96,165,250,.15); color: var(--blue); margin-left: 6px; vertical-align: middle; }
    .tag.green { background: rgba(52,211,153,.15); color: var(--primary); }
    .tag.amber { background: rgba(251,191,36,.15); color: var(--amber); }

    .empty { text-align: center; color: var(--muted); padding: 48px 12px; font-size: .96rem; }
    .count { color: var(--muted); font-size: .86rem; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 560px) { .stats { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 860px) { .stats { grid-template-columns: repeat(8, 1fr); } }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; text-align: center; transition: all .2s; }
    .stat:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,.15); }
    .stat b { display: block; font-size: 2.1rem; font-weight: 700; }
    .stat span { color: var(--muted); font-size: .82rem; margin-top: 4px; }
    .stat.hot b { color: var(--primary); }
    .h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; }

    /* ---------- bottom sheet (live feel) ---------- */
    .sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
    .sheet { width: 100%; max-width: 680px; max-height: 94dvh; background: var(--card); border: 1px solid var(--line); border-bottom: 0; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; animation: up .3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes up { from { transform: translateY(40px); opacity: .6; } }
    .sheet-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .sheet-head h3 { flex: 1; font-size: 1.15rem; font-weight: 700; }
    .sheet-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; flex: 1; }
    .sheet-foot { padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 10px; }

    .fld label { display: block; font-size: .86rem; font-weight: 600; color: var(--muted); margin-bottom: 7px; }
    .fld .hint { font-size: .8rem; color: var(--faint); margin-top: 5px; }
    .check { display: flex; align-items: center; gap: 11px; }
    .check input { width: 20px; height: 20px; accent-color: var(--primary); }

    .static { background: var(--bg); border: 1px dashed var(--line); border-radius: 12px; padding: 13px 14px; font-size: .94rem; white-space: pre-wrap; overflow-wrap: anywhere; }

    .mcq-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background: var(--card-2); padding: 10px; border-radius: 10px; }
    .mcq-row input[type=radio] { width: 22px; height: 22px; accent-color: var(--primary); }
    .mcq-row .letter { width: 20px; color: var(--muted); font-weight: 700; flex: none; }
    .mcq-in { flex: 1; min-width: 0; }

    .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--card-2); border: 1px solid var(--line); padding: 13px 18px; border-radius: 14px; font-size: .94rem; z-index: 60; opacity: 0; pointer-events: none; transition: all .3s cubic-bezier(0.34, 1.56, 0.64, 1); max-width: 92vw; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
    .toast.show { opacity: 1; transform: translateX(-50%); }
    .toast.err { border-color: var(--danger); color: #fecaca; }
    .loading { color: var(--muted); text-align: center; padding: 36px; font-size: .94rem; }
  </style>
</head>
<body>

  <!-- PIN screen -->
  <section class="lock" id="lock" hidden>
    <h1 id="lockTitle">PRIME-CBT Admin</h1>
    <p class="sub" id="lockSub"></p>
    <div class="dots" id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="pad" id="pad"></div>
  </section>

  <!-- Panel -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <button class="iconbtn" id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h2 id="pageTitle">Dashboard</h2>
      <button class="iconbtn" id="refreshBtn" aria-label="Refresh data"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9 9 9.01 9.01 0 0 0-9-9z"/><path d="M3 12h4l-1 2M16 12h4M3 12l1-2M16 12l1 2"/></svg></button>
    </header>
    <main class="content" id="view"></main>
  </div>

  <div class="drawer-back" id="drawerBack"></div>
  <nav class="drawer" id="drawer" aria-label="Admin sections"></nav>
  <div id="sheetRoot"></div>
  <div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';
  var API_URL = '/api/admin';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var clip = function (s, n) { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

  function ago(iso) {
    if (!iso) return 'never';
    var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 90) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    if (s < 86400 * 30) return Math.round(s / 86400) + ' d ago';
    return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function fmtDate(iso) { return iso ? new Date(iso).toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; }

  var toastTimer;
  function toast(msg, isErr) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, isErr ? 4500 : 2400);
  }

  /* ================= server calls ================= */
  async function api(action, payload) {
    var res;
    try {
      res = await fetch(API_URL, {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ action: action }, payload || {}))
      });
    } catch (e) { throw new Error('No connection. Check your internet and try again.'); }
    var data = {};
    try { data = await res.json(); } catch (e) { /* not JSON */ }
    if (res.status === 401 && action !== 'login') { showLock(); setMode('login'); }
    if (!res.ok) {
      var err = new Error(data.error || ('Request failed (' + res.status + ').'));
      err.status = res.status; err.data = data;
      throw err;
    }
    return data;
  }

  /* ================= PIN screen ================= */
  var mode = 'login', pin = '', firstPin = '', pinBusy = false;
  var lockCopy = {
    login: ['Enter your PIN', 'PRIME-CBT admin'],
    create: ['Create your PIN', 'Choose 4 digits. You only do this once.'],
    confirm: ['Confirm your PIN', 'Enter the same 4 digits again.']
  };

  (function buildPad() {
    var html = '';
    '123456789'.split('').forEach(function (n) { html += '<button type="button" data-k="' + n + '">' + n + '</button>'; });
    html += '<button type="button" class="ghost" disabled aria-hidden="true"></button>';
    html += '<button type="button" data-k="0">0</button>';
    html += '<button type="button" class="ghost" data-k="back" aria-label="Delete">⌫</button>';
    $('pad').innerHTML = html;
    $('pad').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-k]');
      if (b) press(b.getAttribute('data-k'));
    });
    document.addEventListener('keydown', function (e) {
      if ($('lock').hidden) return;
      if (/^\d$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace') press('back');
    });
  })();

  function drawDots() {
    var dots = $('dots').children;
    for (var i = 0; i < 4; i++) dots[i].classList.toggle('on', i < pin.length);
  }
  function setSub(text, isErr) { $('lockSub').textContent = text; $('lockSub').className = 'sub' + (isErr ? ' err' : ''); }
  function setMode(m, note, isErr) {
    mode = m; pin = '';
    $('lockTitle').textContent = lockCopy[m][0];
    setSub(note || lockCopy[m][1], isErr);
    drawDots();
  }
  function shake() {
    var d = $('dots');
    d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
  }
  function lockPad(off) { $('pad').querySelectorAll('button[data-k]').forEach(function (b) { b.disabled = off; }); }

  function showLock() {
    $('app').hidden = true;
    $('lock').hidden = false;
    document.body.classList.remove('menu-open');
    closeSheet();
  }

  async function press(k) {
    if (pinBusy) return;
    if (k === 'back') { pin = pin.slice(0, -1); drawDots(); return; }
    if (pin.length >= 4) return;
    pin += k;
    drawDots();
    if (pin.length < 4) return;

    if (mode === 'create') { firstPin = pin; setMode('confirm'); return; }
    if (mode === 'confirm' && pin !== firstPin) {
      shake(); firstPin = '';
      setTimeout(function () { setMode('create', 'Those did not match. Choose your PIN again.', true); }, 350);
      return;
    }
    pinBusy = true; lockPad(true);
    try {
      await api(mode === 'login' ? 'login' : 'setup', { pin: pin });
      enterApp();
    } catch (e) {
      shake();
      var again = mode;
      if (mode === 'confirm' && e.status === 409) again = 'login';
      setTimeout(function () { setMode(again === 'confirm' ? 'create' : again, e.message, true); }, 350);
    } finally { pinBusy = false; lockPad(false); }
  }

  /* ================= data lookups ================= */
  var lookups = {};
  async function lookup(table, labelKey) {
    if (!lookups[table]) {
      var d = await api('list', { table: table, limit: 500 });
      lookups[table] = d.rows.map(function (r) { return [r.id, r[labelKey] || r.code || r.id]; });
    }
    return lookups[table];
  }
  var studentCache = null;
  async function getStudents(force) {
    if (!studentCache || force) studentCache = (await api('students')).students;
    return studentCache;
  }

  /* ================= bottom sheet ================= */
  var sheetCleanup = null;
  function closeSheet() { $('sheetRoot').innerHTML = ''; if (sheetCleanup) { sheetCleanup(); sheetCleanup = null; } }
  function openSheet(title, bodyHtml, footHtml) {
    $('sheetRoot').innerHTML =
      '<div class="sheet-back" id="sheetBack"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="sheet-head"><h3>' + esc(title) + '</h3><button class="iconbtn" id="sheetX" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<div class="sheet-body" id="sheetBody">' + bodyHtml + '</div>' +
      (footHtml ? '<div class="sheet-foot" id="sheetFoot">' + footHtml + '</div>' : '') +
      '</div></div>';
    $('sheetX').onclick = closeSheet;
    $('sheetBack').addEventListener('mousedown', function (e) { if (e.target.id === 'sheetBack') closeSheet(); });
  }

  /* ================= form builder (upgraded) ================= */
  var LETTERS = 'ABCDEFGH';
  function mcqRow(i, val, checked) {
    return '<div class="mcq-row"><input type="radio" name="mcqc" value="' + i + '"' + (checked ? ' checked' : '') + ' aria-label="Correct answer"><span class="letter">' + LETTERS[i] + '</span>' +
      '<input type="text" class="mcq-in" value="' + esc(val) + '" placeholder="Option ' + LETTERS[i] + '">' +
      '<button type="button" class="iconbtn mcq-del" aria-label="Remove option"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
  }
  function redrawMcq(box) {
    var rows = box.querySelectorAll('.mcq-row');
    rows.forEach(function (r, i) {
      r.querySelector('input[type=radio]').value = i;
      r.querySelector('.letter').textContent = LETTERS[i];
      r.querySelector('.mcq-in').placeholder = 'Option ' + LETTERS[i];
    });
    box.querySelector('.mcq-add').hidden = rows.length >= 8;
  }
  function mcqHtml(row) {
    var opts = row && row.options, plain = !opts || (Array.isArray(opts) && opts.every(function (o) { return typeof o === 'string'; }));
    if (!plain) {
      return '<div class="fld"><label>Options (custom format)</label><textarea id="f_options_raw" rows="6" style="font-family:monospace">' + esc(JSON.stringify(opts, null, 2)) + '</textarea>' +
        '<div class="hint">This question stores its options in a different format, so they are shown as raw data.</div></div>' +
        '<div class="fld"><label for="f_correct_raw">Correct option number (first option is 0)</label><input type="number" id="f_correct_raw" min="0" value="' + esc(row.correct_index) + '"></div>';
    }
    var list = opts && opts.length ? opts : ['', '', '', ''];
    var correct = row && row.correct_index != null ? Number(row.correct_index) : -1;
    var html = '<div class="fld" id="mcqBox"><label>Options. Tick the correct one. *</label>';
    list.forEach(function (o, i) { html += mcqRow(i, o, i === correct); });
    html += '<button type="button" class="btn small mcq-add">Add option</button></div>';
    return html;
  }
  function fieldHtml(f, row, optsMap) {
    var v = row ? row[f.key] : (f.def != null ? f.def : '');
    if (v == null) v = '';
    var id = 'f_' + f.key;
    var label = '<label for="' + id + '">' + esc(f.label) + (f.required ? ' *' : '') + '</label>';
    var hint = f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '';
    if (f.type === 'mcq') return mcqHtml(row);
    if (f.type === 'bool') return '<div class="fld check"><input type="checkbox" id="' + id + '"' + (v ? ' checked' : '') + '><label for="' + id + '" style="margin:0">' + esc(f.label) + '</label></div>';
    if (f.type === 'static') return '<div class="fld"><label>' + esc(f.label) + '</label><div class="static">' + esc(v) + '</div></div>';
    if (f.type === 'textarea') return '<div class="fld">' + label + '<textarea id="' + id + '" rows="' + (f.rows || 3) + '" placeholder="' + esc(f.ph || '') + '">' + esc(v) + '</textarea>' + hint + '</div>';
    if (f.type === 'select') {
      var opts = optsMap[f.key] || [];
      var h = '<option value="">' + (f.required ? 'Choose…' : 'None') + '</option>';
      opts.forEach(function (o) { h += '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(v) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; });
      return '<div class="fld">' + label + '<select id="' + id + '">' + h + '</select>' + hint + '</div>';
    }
    var dl = '', listAttr = '';
    if (f.suggest) {
      listAttr = ' list="dl_' + f.key + '"';
      dl = '<datalist id="dl_' + f.key + '">' + f.suggest.map(function (s) { return '<option value="' + esc(s) + '">'; }).join('') + '</datalist>';
    }
    return '<div class="fld">' + label + '<input id="' + id + '" type="' + (f.type === 'number' ? 'number' : 'text') + '"' + (f.type === 'number' ? ' inputmode="numeric"' : '') + listAttr + ' value="' + esc(v) + '" placeholder="' + esc(f.ph || '') + '">' + dl + hint + '</div>';
  }
  function collect(fields) {
    var data = {};
    for (var i = 0; i < fields.length; i++) {
      var f = fields[i];
      if (f.type === 'static') continue;
      if (f.type === 'mcq') {
        var raw = $('f_options_raw');
        if (raw) {
          try { data.options = JSON.parse(raw.value); } catch (e) { throw new Error('The options are not valid JSON.'); }
          data.correct_index = Number($('f_correct_raw').value);
        } else {
          var ins = document.querySelectorAll('#mcqBox .mcq-in'), opts = [], chosen = -1;
          for (var j = 0; j < ins.length; j++) {
            var t = ins[j].value.trim();
            if (!t) throw new Error('Fill in or remove the empty option.');
            opts.push(t);
            if (ins[j].closest('.mcq-row').querySelector('input[type=radio]').checked) chosen = j;
          }
          if (opts.length < 2) throw new Error('Add at least 2 options.');
          if (chosen < 0) throw new Error('Tick the correct option.');
          data.options = opts; data.correct_index = chosen;
        }
        continue;
      }
      var el = $('f_' + f.key);
      if (!el) continue;
      var val = f.type === 'bool' ? el.checked : el.value.trim();
      if (f.required && val === '') throw new Error('Please fill in "' + f.label + '".');
      if (f.type === 'number') val = val === '' ? null : Number(val);
      data[f.key] = val;
    }
    return data;
  }

  async function openForm(sec, row, after) {
    var isEdit = !!row;
    var optsMap = {};
    for (var i = 0; i < sec.fields.length; i++) {
      var f = sec.fields[i];
      if (f.type === 'select') {
        if (f.lookup) optsMap[f.key] = await lookup(f.lookup, f.lookupLabel);
        else optsMap[f.key] = f.opts || [];
      }
    }
    var body = sec.fields.map(function (f) { return fieldHtml(f, row, optsMap); }).join('');
    var editable = sec.fields.some(function (f) { return f.type !== 'static'; });
    openSheet((isEdit ? 'Edit ' : 'Add ') + sec.noun, body,
      '<button class="btn" id="fCancel">Cancel</button>' + (editable ? '<button class="btn primary" id="fSave">Save</button>' : ''));
    $('fCancel').onclick = closeSheet;

    var box = $('mcqBox');
    if (box) {
      box.addEventListener('click', function (e) {
        if (e.target.closest('.mcq-add')) {
          var n = box.querySelectorAll('.mcq-row').length;
          var d = document.createElement('div');
          d.innerHTML = mcqRow(n, '', false);
          box.insertBefore(d.firstChild, box.querySelector('.mcq-add'));
          redrawMcq(box);
        } else if (e.target.closest('.mcq-del')) {
          if (box.querySelectorAll('.mcq-row').length <= 2) { toast('A question needs at least 2 options.', true); return; }
          e.target.closest('.mcq-row').remove();
          redrawMcq(box);
        }
      });
      redrawMcq(box);
    }
    if (!editable) return;
    $('fSave').onclick = async function () {
      var btn = $('fSave');
      try {
        var data = collect(sec.fields);
        btn.disabled = true;
        await api('save', { table: sec.table, id: isEdit ? row.id : undefined, data: data });
        delete lookups[sec.table];
        closeSheet();
        toast(isEdit ? 'Changes saved' : sec.noun.charAt(0).toUpperCase() + sec.noun.slice(1) + ' added');
        if (after) after();
      } catch (e) { btn.disabled = false; toast(e.message, true); }
    };
  }

    var filterOpts = null;
    if (sec.filter) filterOpts = sec.filter.lookup ? await lookup(sec.filter.lookup, sec.filter.lookupLabel) : sec.filter.opts;

    var top = '<div class="toolbar">';

    function rowHtml(r, i) {

      var acts = '';
      (sec.actions || []).forEach(function (a, ai) { acts += '<button class="btn small" data-act="' + ai + '" data-i="' + i + '">' + esc(typeof a.label === 'function' ? a.label(r) : a.label) + '</button>'; });
      if (sec.del !== false) acts += '<button class="btn small danger" data-del="' + i + '">Delete</button>';
      return '<div class="row' + (sec.edit !== false || sec.view ? ' tap' : '') + '" data-i="' + i + '"><div class="row-main"><div class="row-title">' + esc(d.title) +
        (d.tag ? '<span class="tag ' + (d.tagClass || '') + '">' + esc(d.tag) + '</span>' : '') + '</div>' +

    }
    function paint() {
      $('lRows').innerHTML = st.rows.length ? st.rows.map(rowHtml).join('') : '<div class="empty">' + esc(st.q || st.filter ? 'Nothing matches your search.' : (sec.empty || 'Nothing here yet.')) + '</div>';
      $('lCount').textContent = st.total ? st.rows.length + ' of ' + st.total : '';
      $('lMore').innerHTML = st.rows.length < st.total ? '<button class="btn" id="lMoreBtn">Load more</button>' : '';
    }
    async function load(reset) {
      if (st.busy) return;
      st.busy = true;
      if (reset) { st.offset = 0; st.rows = []; $('lRows').innerHTML = '<div class="loading">Loading…</div>'; }
      try {
        var filters = {};
        if (sec.filter && st.filter) filters[sec.filter.key] = st.filter;
        var d = await api('list', { table: sec.table, q: st.q, filters: filters, limit: PAGE, offset: st.offset });
        st.rows = st.rows.concat(d.rows); st.total = d.total; st.offset = st.rows.length;
        if (sec.prepare) await sec.prepare(d.rows);
        paint();
      } catch (e) { $('lRows').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
      st.busy = false;
    }
    sec._reload = function () { load(true); };

    var timer;
    if ($('lq')) $('lq').addEventListener('input', function (e) { clearTimeout(timer); timer = setTimeout(function () { st.q = e.target.value.trim(); load(true); }, 300); });
    if ($('lf')) $('lf').addEventListener('change', function (e) { st.filter = e.target.value; load(true); });
    if ($('lAdd')) $('lAdd').onclick = function () { openForm(sec, null, function () { load(true); }); };
    $('view').addEventListener('click', async function (e) {
      var tool = e.target.closest('[data-tool]');
      if (tool) { sec.tools[+tool.getAttribute('data-tool')].run(function () { load(true); }); return; }
      if (e.target.id === 'lMoreBtn') { load(false); return; }
      var del = e.target.closest('[data-del]');
      if (del) {
        var r = st.rows[+del.getAttribute('data-del')];
        if (!confirm('Delete this ' + sec.noun + '? This cannot be undone.' + (sec.delWarn ? '\n\n' + sec.delWarn : ''))) return;
        try { await api('remove', { table: sec.table, id: r.id }); toast('Deleted'); load(true); } catch (err) { toast(err.message, true); }
        return;
      }
      var act = e.target.closest('[data-act]');
      if (act) { sec.actions[+act.getAttribute('data-act')].run(st.rows[+act.getAttribute('data-i')], function () { load(true); }); return; }
      var rowEl = e.target.closest('.row.tap');
      if (rowEl) {
        var row = st.rows[+rowEl.getAttribute('data-i')];
        if (sec.view) sec.view(row, function () { load(true); });
        else if (sec.edit !== false) openForm(sec, row, function () { load(true); });
      }
    });
    load(true);

    // Real-time live updates
    var pollingTimer = setInterval(async function () {
      try {
        var now = Date.now();
        if (now - st.lastUpdate < 4000) return; // throttle
        st.lastUpdate = now;

        var filters = {};
        if (sec.filter && st.filter) filters[sec.filter.key] = st.filter;
        var d = await api('list', { table: sec.table, q: st.q, filters: filters, limit: 1, offset: 0 });
        if (d.rows.length > 0) {
          var fresh = d.rows[0];
          var existingIdx = st.rows.findIndex(r => r.id === fresh.id);
          if (existingIdx >= 0) {
            st.rows[existingIdx] = fresh;
          } else {
            st.rows.unshift(fresh);
            st.total++;
          }
          paint();
        }
      } catch (e) { /* silent */ }
    }, 2800);

    // Cleanup on destroy
    sec._destroy = function () {
      clearInterval(pollingTimer);
    };
  }

      '<div class="fld"><label for="nType">Type</label><select id="nType"><option value="info">General</option><option value="exam">Exams</option><option value="study">Study</option><option value="community">Community</option><option value="welcome">Welcome</option></select></div>' +
      '<div class="fld"><label for="nTitle">Title *</label><input id="nTitle" maxlength="120" placeholder="e.g. New past questions added"></div>' +
      '<div class="fld"><label for="nBody">Message</label><textarea id="nBody" rows="3" maxlength="600"></textarea></div>' +
      '<button class="btn primary" id="nSend">Send notification</button></div>' +
      '<div class="h3" style="margin-top:6px">Recently sent</div><div id="nHist" style="display:flex;flex-direction:column;gap:10px"><div class="loading">Loading live history…</div></div>';

    var students = [];
    function fillPick() {
      var q = $('nSearch').value.toLowerCase().trim();
      var m = students.filter(function (s) { return !q || (s.name + ' ' + s.email).toLowerCase().indexOf(q) > -1; }).slice(0, 60);
      $('nPick').innerHTML = m.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc((s.name || 'Student') + ' (' + s.email + ')') + '</option>'; }).join('');
      if (m.length === 1 || (to && m.length)) $('nPick').value = m[0].id;
    }
    $('nTo').addEventListener('change', async function () {
      $('nOne').hidden = $('nTo').value !== 'one';
      if (!$('nOne').hidden && !students.length) { try { students = await getStudents(); fillPick(); } catch (e) { toast(e.message, true); } }
    });
    $('nSearch').addEventListener('input', fillPick);
    if (to) {
      $('nTo').value = 'one'; $('nOne').hidden = false;
      try { students = await getStudents(); } catch (e) { /* shown below */ }
      var s = students.filter(function (x) { return x.id === to; })[0];
      if (s) { $('nSearch').value = s.email; fillPick(); $('nPick').value = to; }
    }

    $('nSend').onclick = async function () {
      var btn = $('nSend'), all = $('nTo').value === 'all';
      var title = $('nTitle').value.trim();
      if (!title) { toast('Add a title first.', true); return; }
      var target = all ? 'all' : $('nPick').value;
      if (!target) { toast('Choose a student.', true); return; }
      if (!confirm(all ? 'Send this to ALL students?' : 'Send this to the selected student?')) return;
      btn.disabled = true;
      try {
        var r = await api('notify', { to: target, title: title, body: $('nBody').value, type: $('nType').value });
        toast('Sent to ' + r.sent + (r.sent === 1 ? ' student' : ' students'));
        $('nTitle').value = ''; $('nBody').value = '';
        loadHist();
      } catch (e) { toast(e.message, true); }
      btn.disabled = false;
    };

    var items = [];
    async function loadHist() {
      try {
        items = (await api('notif_history')).items;
        $('nHist').innerHTML = items.length ? items.map(function (n, i) {
          return '<div class="row"><div class="row-main"><div class="row-title">' + esc(n.title) + '<span class="tag">' + esc(n.type || 'info') + '</span></div>' +
            (n.body ? '<div class="row-sub">' + esc(clip(n.body, 100)) + '</div>' : '') +
            '<div class="row-sub">Sent to ' + n.count + (n.count === 1 ? ' student' : ' students') + '  ' + esc(ago(n.last_at)) + '</div></div>' +
            '<div class="row-actions"><button class="btn small danger" data-d="' + i + '">Delete</button></div></div>';
        }).join('') : '<div class="empty">Nothing sent yet.</div>';
      } catch (e) { $('nHist').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
    }
    $('nHist').addEventListener('click', async function (e) {
      var b = e.target.closest('[data-d]');
      if (!b) return;
      var n = items[+b.getAttribute('data-d')];
      if (!confirm('Delete this notification for all ' + n.count + ' students who got it?')) return;
      try { await api('del_notifs', { title: n.title, body: n.body }); toast('Deleted'); loadHist(); } catch (err) { toast(err.message, true); }
    });
    loadHist();
  }

  function renderSecurity() {
    $('view').innerHTML = '<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="h3">Change your PIN</div>' +
      ['pCur:Current PIN', 'pNew:New PIN', 'pNew2:Repeat new PIN'].map(function (s) {
        var p = s.split(':');
        return '<div class="fld"><label for="' + p[0] + '">' + p[1] + '</label><input id="' + p[0] + '" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="off"></div>';
      }).join('') + '<button class="btn primary" id="pSave">Save new PIN</button>' +
      '<div class="count">Changing your PIN signs out every other device.</div></div>' +
      '<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="h3">This device</div><div class="count">You stay signed in here for 7 days.</div><button class="btn" id="pLock">Lock now</button></div>';
    $('pLock').onclick = lockNow;
    $('pSave').onclick = async function () {
      var cur = $('pCur').value, n1 = $('pNew').value, n2 = $('pNew2').value;
      if (!/^\d{4}\( /.test(cur) || !/^\d{4} \)/.test(n1)) { toast('PINs must be exactly 4 digits.', true); return; }
      if (n1 !== n2) { toast('The new PINs do not match.', true); return; }
      try { await api('change_pin', { current: cur, pin: n1 }); toast('PIN changed'); $('pCur').value = $('pNew').value = $('pNew2').value = ''; } catch (e) { toast(e.message, true); }
    };
  }

  /* ---------- sheets used by sections ---------- */
  async function openReplies(post) {
    openSheet('Replies', '<div class="loading">Loading live replies…</div>');
    var rows = [];
    async function load() {
      try {
        await getStudents();
        rows = (await api('list', { table: 'discussion_replies', filters: { post_id: post.id }, limit: 200 })).rows;
        $('sheetBody').innerHTML = rows.length ? rows.map(function (r, i) {
          return '<div class="row"><div class="row-main"><div class="row-title">' + esc(studentName(r.author_id)) + '</div><div class="row-sub">' + esc(r.body) + '</div><div class="row-sub">' + esc(ago(r.created_at)) + '</div></div>' +
            '<div class="row-actions"><button class="btn small danger" data-r="' + i + '">Delete</button></div></div>';
        }).join('') : '<div class="empty">No replies on this post.</div>';
      } catch (e) { $('sheetBody').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
    }
    $('sheetBody').addEventListener('click', async function (e) {
      var b = e.target.closest('[data-r]');
      if (!b || !confirm('Delete this reply?')) return;
      try { await api('remove', { table: 'discussion_replies', id: rows[+b.getAttribute('data-r')].id }); toast('Deleted'); load(); } catch (err) { toast(err.message, true); }
    });
    load();
  }

  async function openImport(done) {
    var courses = await lookup('courses', 'title');
    if (!courses.length) { toast('Add a course first.', true); return; }
    openSheet('Bulk import questions',
      '<div class="fld"><label for="iCourse">Course *</label><select id="iCourse">' + courses.map(function (c) { return '<option value="' + esc(c[0]) + '">' + esc(c[1]) + '</option>'; }).join('') + '</select></div>' +
      '<div class="fld"><label for="iText">Questions as JSON *</label><textarea id="iText" rows="9" style="font-family:monospace;font-size:.82rem" placeholder=\'[{"question":"2 + 2 = ?","options":["3","4","5","6"],"correct_index":1,"explanation":"Basic addition.","difficulty":"easy"}]\'></textarea>' +
      '<div class="hint">correct_index counts from 0, so the first option is 0. Up to 300 questions at a time. Everything is checked before anything is saved.</div></div>',
      '<button class="btn" id="iCancel">Cancel</button><button class="btn primary" id="iGo">Import</button>');
    $('iCancel').onclick = closeSheet;
    $('iGo').onclick = async function () {
      var items;
      try { items = JSON.parse($('iText').value); } catch (e) { toast('That is not valid JSON. Check the brackets and quotes.', true); return; }
      if (!Array.isArray(items)) { toast('The JSON must be a list: [ {...}, {...} ]', true); return; }
      var btn = $('iGo'); btn.disabled = true;
      try {
        var r = await api('import_questions', { course_id: $('iCourse').value, items: items });
        closeSheet(); toast(r.added + (r.added === 1 ? ' question' : ' questions') + ' imported'); done();
      } catch (e) { btn.disabled = false; toast(e.message, true); }
    };
  }

  /* ================= navigation & live ================= */
  var current = null;
  function buildNav() {
    var html = '<div class="brand">PRIME-CBT<small>Admin panel</small></div>', last = '';
    SECTIONS.forEach(function (s) {
      if (s.group !== last) { html += '<div class="nav-group">' + esc(s.group) + '</div>'; last = s.group; }
      html += '<button class="nav" data-go="' + s.id + '">' + esc(s.label) + '</button>';
    });
    html += '<div class="nav-group">Session</div><button class="nav" id="navLock">Lock panel</button>';
    $('drawer').innerHTML = html;
    $('navLock').onclick = lockNow;
  }
  function go(id) {
    var sec = SECTIONS.filter(function (s) { return s.id === id; })[0] || SECTIONS[0];
    current = sec.id;
    document.body.classList.remove('menu-open');
    $('pageTitle').textContent = sec.label;
    document.querySelectorAll('.nav[data-go]').forEach(function (n) { n.classList.toggle('active', n.getAttribute('data-go') === sec.id); });
    \( ('view').replaceWith( \)('view').cloneNode(false)); // drop old listeners
    window.scrollTo(0, 0);
    if (location.hash !== '#' + sec.id) history.replaceState(null, '', '#' + sec.id);
    if (sec.kind === 'dashboard') renderDashboard();
    else if (sec.kind === 'students') renderStudents();
    else if (sec.kind === 'notifications') renderNotifications();
    else if (sec.kind === 'security') renderSecurity();
    else renderList(sec);
  }
  async function lockNow() {
    try { await api('logout'); } catch (e) { /* still lock the screen */ }
    studentCache = null; lookups = {};
    showLock(); setMode('login');
  }
  function enterApp() {
    $('lock').hidden = true;
    $('app').hidden = false;
    studentCache = null; lookups = {};
    go((location.hash || '').replace('#', '') || 'dashboard');
  }

  $('menuBtn').onclick = function () { document.body.classList.add('menu-open'); };
  $('drawerBack').onclick = function () { document.body.classList.remove('menu-open'); };
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]');
    if (g && !g.closest('.pad')) go(g.getAttribute('data-go'));
  });

  // Live refresh button
  $('refreshBtn').onclick = function () {
    var sec = SECTIONS.find(s => s.id === current);
    if (sec && sec._reload) {
      sec._reload();
      toast('Live data refreshed', false);
    } else {
      toast('Nothing to refresh yet.', true);
    }
  };

  buildNav();

  /* ================= start (live) ================= */
  (async function init() {
    try {
      var s = await api('status');
      if (s.authed) { enterApp(); return; }
      $('lock').hidden = false;
      setMode(s.setup ? 'login' : 'create');
    } catch (e) {
      $('lock').hidden = false;
      $('pad').hidden = true; $('dots').hidden = true;
      setSub(e.message, true);
    }
  })();
})();
</script>
</body>
</html>
