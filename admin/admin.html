      var f = e.target.files && e.target.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () { $('iText').value = String(rd.result || ''); preview(); };
      rd.onerror = function () { toast('Could not read that file.', true); };
      rd.readAsText(f);
    });
    $('iGo').onclick = async function () {
      var course = $('iCourse').value;
      if (!course) { toast('Choose a course first.', true); return; }
      var r = preview();
      if (!r.items.length) { toast('No valid questions found. Check the format.', true); return; }
      var ok = await confirmBox({ title: 'Import ' + r.items.length + (r.items.length === 1 ? ' question?' : ' questions?'), text: r.errors.length ? r.errors.length + ' block(s) with problems will be skipped.' : '', yes: 'Import' });
      if (!ok) return;
      var btn = $('iGo'), saved = 0, failed = 0, lastErr = '';
      btn.disabled = true;
      for (var i = 0; i < r.items.length; i++) {
        btn.textContent = 'Importing ' + (i + 1) + ' of ' + r.items.length + '…';
        try {
          var it = r.items[i];
          await api('save', { table: 'questions', data: { course_id: course, question: it.question, options: it.options, correct_index: it.correct_index, explanation: it.explanation, difficulty: it.difficulty } });
          saved++;
        } catch (e) { failed++; lastErr = e.message; if (e.status === 401) break; }
      }
      if (!$('iGo')) return;
      if (failed) { btn.disabled = false; btn.textContent = 'Import'; toast(saved + ' imported, ' + failed + ' failed. ' + lastErr, true); if (saved && done) done(); return; }
      closeSheet(true);
      toast('Imported ' + saved + (saved === 1 ? ' question' : ' questions'));
      if (done) done();
    };
  }

  /* ================= questions from PDFs ================= */
  var AUTO_GENERATE = true;      // true = questions are made silently right after a file is uploaded. Set false to stop that.
  var MATH_COURSES = ['MTS', 'MAT', 'PHY', 'CHM', 'STA'];   // course codes that start with these get math written in LaTeX
  var QUESTIONS_PER_PDF = 20;   // questions requested from each PDF (5 to 40)
  var genBusy = false;

  function normName(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
  function isPdfMaterial(m) { return /\.(pdf|pptx?|docx|png|jpe?g|webp|gif)(\?|#|$)/i.test(m.file_url || '') || /^(pdf|slides|image)$/i.test(m.material_type || ''); }
  function matKind(m) {
    var u = String(m.file_url || '').split('?')[0].toLowerCase();
    if (/\.(png|jpe?g|webp|gif)$/.test(u) || /^image$/i.test(m.material_type || '')) return 'image';
    if (/\.(pptx|docx)$/.test(u)) return 'office';
    return 'pdf';
  }
  function courseHasMath(c) {
    var code = String((c && (c.code || c.title)) || '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').trim();
    return MATH_COURSES.some(function (p) { return code.indexOf(p) === 0; });
  }
  function sameCourse(c, text) {
    var t = normName(text), title = normName(c.title), code = normName(c.code);
    if (!t) return false;
    return t === title || (code && t === code) || (code.length >= 3 && (' ' + t + ' ').indexOf(' ' + code + ' ') > -1);
  }
  async function allCourses() { return (await fetchAllRows('courses')).rows; }
  async function allMaterials() { return (await fetchAllRows('materials')).rows; }
  function noCourseMsg(text) { return 'No course matches "' + (text || '') + '". Set the material\'s Course to the exact course title or code.'; }

  // Finds the course a material belongs to. Courses that share a code are treated as ONE course code:
  // no question is asked. If a course title matches the material's title/topic it is used, else the first one.
  async function resolveCourseForMaterial(m) {
    var matches = (await allCourses()).filter(function (c) { return sameCourse(c, m.course); });
    if (!matches.length) { toast(noCourseMsg(m.course), true); return null; }
    var hay = normName((m.title || '') + ' ' + (m.topic || ''));
    var best = matches.filter(function (c) { var t = normName(c.title); return t && hay.indexOf(t) > -1; })[0] || matches[0];
    return { course: best, chosen: true };
  }

  async function generateForCourse(course) {
    try {
      var mats = (await allMaterials()).filter(function (m) { return isPdfMaterial(m) && sameCourse(course, m.course); });
      if (!mats.length) { toast('No PDF/PPTX/DOCX/image files found for this course. Set each PDF material\'s Course to "' + (course.code || course.title) + '".', true); return; }
      runGeneration(course, mats, true);
    } catch (e) { toast(e.message, true); }
  }
  async function generateForMaterialRow(m) {
    try {
      if (!isPdfMaterial(m)) { toast('This file type cannot be used. Use PDF, PPTX, DOCX or an image.', true); return; }
      var r = await resolveCourseForMaterial(m);
      if (!r) return;
      runGeneration(r.course, [m], r.chosen);
    } catch (e) { toast(e.message, true); }
  }
  async function autoGenerateForUpload(d) {
    try {
      if (!isPdfMaterial(d)) return;
      var rows = [];
      try { rows = (await api('list', { table: 'materials', filters: { file_url: d.file_url }, limit: 1 })).rows; } catch (e) { /* fall back below */ }
      if (!rows.length) rows = (await allMaterials()).filter(function (x) { return x.file_url === d.file_url; });
      if (!rows.length) { toast('File saved. Use "Make questions" on it to create questions.', true); return; }
      var r = await resolveCourseForMaterial(d);
      if (!r) return;
      queueSilent(r.course, rows[0], r.chosen);
    } catch (e) { toast(e.message, true); }
  }

  /* ---------- reading files the server could not read ---------- */
  async function loadJsZip() {
    if (window.JSZip) return;
    await new Promise(function (ok, no) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      s.onload = ok;
      s.onerror = function () { no(new Error('File reader did not load. Check your internet')); };
      document.head.appendChild(s);
    });
  }
  function xmlText(xml) {
    return xml.replace(/<\/(a:p|w:p)>/g, '\n').replace(/<[^>]+>/g, '')
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
  }
  async function officeTextFromUrl(url) {
    await loadJsZip();
    var res = await fetch(url);
    if (!res.ok) throw new Error('Could not open the file (' + res.status + ')');
    var zip = await JSZip.loadAsync(await res.arrayBuffer());
    var names = Object.keys(zip.files), parts = [];
    var slides = names.filter(function (n) { return /^ppt\/slides\/slide\d+\.xml$/.test(n); })
      .sort(function (a, b) { return parseInt(a.replace(/\D/g, ''), 10) - parseInt(b.replace(/\D/g, ''), 10); });
    for (var i = 0; i < slides.length; i++) parts.push(xmlText(await zip.files[slides[i]].async('string')));
    if (zip.files['word/document.xml']) parts.push(xmlText(await zip.files['word/document.xml'].async('string')));
    var text = parts.join('\n').replace(/[ \t]+/g, ' ').replace(/\n\s*\n+/g, '\n').trim();
    if (text.length < 200) throw new Error('This file has no readable text');
    return text.slice(0, 150000);
  }
  async function ocrImageFromUrl(url, onProgress) {
    await loadTesseract();
    onProgress('Reading the image\u2026');
    var res = await fetch(url);
    if (!res.ok) throw new Error('Could not open the image (' + res.status + ')');
    var blob = await res.blob();
    var worker = await Tesseract.createWorker('eng'), r;
    try { r = await worker.recognize(blob); } finally { await worker.terminate(); }
    var text = ((r && r.data && r.data.text) || '').replace(/\s+/g, ' ').trim();
    if (text.length < 80) throw new Error('OCR could not read any text from this image');
    return text.slice(0, 150000);
  }
  // Reads a file in the browser: normal text first, then OCR for scans and images.
  async function clientReadMaterial(m, say) {
    var kind = matKind(m);
    if (kind === 'image') return ocrImageFromUrl(m.file_url, say);
    if (kind === 'office') return officeTextFromUrl(m.file_url);
    try { return await pdfTextFromUrl(m.file_url); }
    catch (e) { return ocrPdfFromUrl(m.file_url, say); }
  }
  function serverCouldNotRead(msg) {
    msg = String(msg || '');
    if (/key|limit|quota|busy|auth|network|timeout|rate/i.test(msg)) return false;
    return /read|text|scan|ocr|extract|empty|pars|unsupported|content|image/i.test(msg);
  }
  // One file -> questions. Asks the server first; if it cannot read the file, reads it here and tries again.
  async function generateCore(course, m, chosen, say) {
    var payload = { material_id: m.id, course_id: course.id, count: QUESTIONS_PER_PDF, text: '', chosen: !!chosen };
    if (courseHasMath(course)) { payload.math = true; payload.format = 'latex'; }   // asks the server to write equations in LaTeX
    if (matKind(m) === 'image') {
      say('Reading the image\u2026');
      payload.text = await clientReadMaterial(m, say);
      return api('generate_questions', payload, 280000);
    }
    try { return await api('generate_questions', payload, 280000); }
    catch (e) {
      if (e.status === 401 || !serverCouldNotRead(e.message)) throw e;
      say('The server could not read this file. Reading it here instead\u2026');
      payload.text = await clientReadMaterial(m, say);
      return api('generate_questions', payload, 280000);
    }
  }

  /* ================= keep everything in step with the Courses list ================= */
  var cmpName = function (s) { return normName(s).replace(/ /g, ''); };

  // A course was renamed or its code changed: every material filed under the old code/title moves to the new one.
  // (Questions are linked by course id, so they follow the course automatically.)
  async function syncCourseChange(oldRow, data) {
    try {
      var oc = cmpName(oldRow.code), ot = cmpName(oldRow.title);
      var nc = cmpName(data.code), nt = cmpName(data.title);
      if (oc === nc && ot === nt) return;
      var target = String(data.code || data.title || '').trim();
      if (!target) return;
      var others = (await allCourses()).filter(function (c) { return String(c.id) !== String(oldRow.id); });
      var codeShared = !!oc && others.some(function (c) { return cmpName(c.code) === oc; });
      var titleShared = !!ot && others.some(function (c) { return cmpName(c.title) === ot || cmpName(c.code) === ot; });
      var hits = (await allMaterials()).filter(function (m) {
        var t = cmpName(m.course);
        if (!t || t === cmpName(target)) return false;
        if (oc && t === oc) return !codeShared;      // other courses still use this code: leave their files alone
        if (ot && t === ot) return !titleShared;
        return false;
      });
      var ok = 0, bad = 0;
      for (var i = 0; i < hits.length; i++) {
        try { await api('save', { table: 'materials', id: hits[i].id, data: { course: target } }); ok++; }
        catch (e) { bad++; if (e.status === 401) break; }
      }
      delete lookups.courses;
      if (ok || bad) toast((ok ? ok + (ok === 1 ? ' material' : ' materials') + ' now filed under ' + target : '') + (bad ? (ok ? '. ' : '') + bad + ' could not be updated' : ''), !!bad && !ok, 6500);
      else if (codeShared && oc !== nc) toast('Saved. Another course still uses the code ' + (oldRow.code || oldRow.title) + ', so its files were left alone. Tap "Merge duplicates" to join them into one course.', false, 8000);
      delete lookups.courses;
      if (current === 'courses' || current === 'materials' || current === 'questions') go(current);   // redraw so every dropdown shows the new names
    } catch (e) { console.error('Course sync failed', e); toast('Course saved, but its files could not be updated: ' + e.message, true, 6500); }
  }

  // One course per code: refuse a second course with a code (or title, when there is no code) that already exists.
  async function checkCourseUnique(data, row) {
    data.title = String(data.title || '').replace(/\s+/g, ' ').trim();
    data.code = String(data.code || '').replace(/\s+/g, ' ').trim();
    var code = cmpName(data.code), title = cmpName(data.title);
    if (row && code && cmpName(row.code) === code) return;   // code unchanged: nothing new to clash with
    var dup = (await allCourses()).filter(function (c) {
      if (row && String(c.id) === String(row.id)) return false;
      return code ? cmpName(c.code) === code : (!cmpName(c.code) && cmpName(c.title) === title);
    })[0];
    if (dup) throw new Error('"' + (dup.code || dup.title) + '" is already a course (' + dup.title + '). Add your materials under it instead of creating it again.');
  }

  // Joins courses that share one code into a single course. Questions move to the kept course.
  // Materials are filed by code, so they already sit together and need no change.
  async function mergeDuplicateCourses(done) {
    try {
      var rows = (await fetchAllRows('courses')).rows, map = {}, groups = [];
      rows.forEach(function (c) {
        var k = cmpName(c.code) || ('t:' + cmpName(c.title));
        if (!map[k]) { map[k] = []; groups.push(map[k]); }
        map[k].push(c);
      });
      groups = groups.filter(function (g) { return g.length > 1; });
      if (!groups.length) { toast('No duplicate courses. Every code appears once.'); return; }
      var extra = groups.reduce(function (n, g) { return n + g.length - 1; }, 0);
      var ok = await confirmBox({ title: 'Merge duplicate courses?', text: groups.length + ' course code(s) appear more than once (' + groups.slice(0, 4).map(function (g) { return g[0].code || g[0].title; }).join(', ') + (groups.length > 4 ? '…' : '') + '). Each becomes one course. ' + extra + ' extra course(s) are removed and their questions move to the one kept. Your materials are not affected.', yes: 'Merge now' });
      if (!ok) return;
      var removed = 0, moved = 0, failed = 0;
      for (var gi = 0; gi < groups.length; gi++) {
        var g = groups[gi], keep = g[0];
        for (var di = 1; di < g.length; di++) {
          var dup = g[di], clean = true;
          toast('Merging ' + (keep.code || keep.title) + '…', false, 2500);
          var qs = (await fetchAllRows('questions', { filters: { course_id: dup.id } })).rows;
          for (var qi = 0; qi < qs.length; qi += 5) {
            var batch = qs.slice(qi, qi + 5);
            var res = await Promise.all(batch.map(function (q) { return api('save', { table: 'questions', id: q.id, data: { course_id: keep.id } }).then(function () { return 1; }, function () { return 0; }); }));
            res.forEach(function (r) { if (r) moved++; else { failed++; clean = false; } });
          }
          if (!clean) continue;   // never delete a course that still has questions
          try { await api('remove', { table: 'courses', id: dup.id }); removed++; } catch (e) { failed++; }
        }
      }
      delete lookups.courses;
      toast('Merged: ' + removed + ' duplicate course(s) removed, ' + moved + ' question(s) moved' + (failed ? '. ' + failed + ' item(s) failed, run it again.' : '.'), !!failed, 7000);
      if (done) done();
    } catch (e) { toast(e.message, true); }
  }

  async function courseDeleteNote(r) {
    var key = cmpName(r.code || r.title), tkey = cmpName(r.title);
    var others = (await allCourses()).filter(function (c) { return String(c.id) !== String(r.id); });
    if (key && others.some(function (c) { return cmpName(c.code || c.title) === key; })) return '';   // the code lives on in another course
    var n = (await allMaterials()).filter(function (m) { var t = cmpName(m.course); return t && (t === key || t === tkey); }).length;
    return n ? n + (n === 1 ? ' material is' : ' materials are') + ' filed under "' + (r.code || r.title) + '". They will stay in Materials but will no longer match any course.' : '';
  }

  // "Questions from PDFs" for a whole course now lives on the Questions page (it makes questions, so it belongs there).
  async function pickCourseForGeneration(done) {
    var rows;
    try { rows = await allCourses(); } catch (e) { toast(e.message, true); return; }
    var seen = {}, list = [];
    rows.forEach(function (c) { var k = cmpName(c.code || c.title); if (k && !seen[k]) { seen[k] = 1; list.push(c); } });
    if (!list.length) { toast('Add a course first.', true); return; }
    openSheet('Questions from PDFs',
      '<div class="fld"><label for="pgC">Course *</label><select id="pgC"><option value="">Choose…</option>' + list.map(function (c, i) { return '<option value="' + i + '">' + esc(c.code ? c.code + ' - ' + c.title : c.title) + '</option>'; }).join('') + '</select>' +
      '<div class="hint">Makes questions from every PDF, slide or Word file filed under this course.</div></div>',
      '<button class="btn" id="pgCancel">Cancel</button><button class="btn primary" id="pgGo">Make questions</button>');
    $('pgCancel').onclick = function () { closeSheet(); };
    $('pgGo').onclick = function () {
      var v = $('pgC').value;
      if (v === '') { toast('Choose a course first.', true); return; }
      closeSheet(true);
      generateForCourse(list[+v]);
    };
  }

  /* ---------- fix old questions: plain-text maths -> proper maths ---------- */
  async function fixOldMath(done) {
    var ids;
    try { ids = (await allCourses()).filter(courseHasMath).map(function (c) { return c.id; }); } catch (e) { toast(e.message, true); return; }
    if (!ids.length) { toast('No ' + MATH_COURSES.join('/') + ' courses found.', true); return; }
    var ok = await confirmBox({ title: 'Fix maths in old questions?', text: 'Old questions in your ' + MATH_COURSES.join(', ') + ' courses that show equations as plain text are rewritten with proper maths. The answers and the order of the options stay the same, and a question is only changed if all its ordinary words survive. This can take a few minutes.', yes: 'Fix now' });
    if (!ok) return;
    openSheet('Fixing maths in old questions', '<div class="count" id="fmTxt">Starting\u2026</div>', '<button class="btn primary" id="fmClose" disabled>Working\u2026</button>');
    var after = '', scanned = 0, changed = 0, rejected = 0, err = '';
    try {
      for (var n = 0; n < 400; n++) {
        if (!$('fmTxt')) break;   // the box was closed
        var r = await api('fix_math', { course_ids: ids, after: after, limit: 12 }, 280000);
        scanned += r.scanned || 0; changed += r.changed || 0; rejected += r.rejected || 0; after = r.next_after || after;
        if ($('fmTxt')) $('fmTxt').textContent = 'Checked ' + scanned + ' questions. Fixed ' + changed + (rejected ? '. Left ' + rejected + ' unchanged to be safe' : '') + '\u2026';
        if (r.done) break;
      }
    } catch (e) { err = e.message; }
    if ($('fmTxt')) {
      $('fmTxt').textContent = (err ? 'Stopped: ' + err + '. ' : 'Finished. ') + 'Checked ' + scanned + ' questions, fixed ' + changed + (rejected ? ', left ' + rejected + ' unchanged to be safe' : '') + '.';
      var b = $('fmClose'); b.disabled = false; b.textContent = 'Done';
      b.onclick = function () { closeSheet(); if (done) done(); };
    }
    toast((err ? '\u26A0\uFE0F ' : '\u2705 ') + changed + (changed === 1 ? ' question' : ' questions') + ' fixed', !!err && !changed, 6000);
  }

  /* ---------- silent background generation ---------- */
  var bgQueue = [], bgRunning = false, bgSum = null;
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  function chip(text) { var c = $('genChip'); if (!c) return; c.hidden = !text; if (text) $('genChipT').textContent = text; }
  // The server writes questions by itself the moment a file is saved. This follows that run and reports the number added.
  async function watchServerRun(m, say) {
    var started = Date.now(), base = Number(m.qgen_count) || 0, idle = 0;
    while (Date.now() - started < 12 * 60000) {
      await sleep(6000);
      var x = null;
      try { x = (await api('list', { table: 'materials', filters: { file_url: m.file_url }, limit: 1 })).rows[0]; } catch (e) { continue; }
      if (!x) return { saved: 0 };
      if (x.qgen_status === 'processing') { idle = 0; say('Writing questions\u2026 keep this tab open'); continue; }
      if (x.qgen_status === 'done' || x.qgen_status === 'partial') return { saved: Math.max(0, (Number(x.qgen_count) || 0) - base), total: Number(x.qgen_count) || 0 };
      if (x.qgen_status === 'failed') throw new Error(x.qgen_error || 'Question writing failed.');
      if (++idle >= 10) return { retry: true };   // never started after about a minute: start it from here
    }
    throw new Error('Still working in the background. Check Questions again in a few minutes.');
  }
  function queueSilent(course, m, chosen) {
    bgQueue.push({ course: course, m: m, chosen: chosen });
    if (!bgSum) bgSum = { added: 0, files: 0, failed: 0, already: 0, lastErr: '', course: '' };
    if (!bgRunning) pumpQueue(); else chip('Writing questions\u2026 ' + (bgQueue.length + 1) + ' files left');
  }
  async function pumpQueue() {
    bgRunning = true;
    while (bgQueue.length) {
      while (genBusy) await sleep(1500);   // wait if you opened "Make questions" by hand
      var job = bgQueue.shift(), left = bgQueue.length;
      var say = function (t) { chip((left ? '(' + left + ' more) ' : '') + t); };
      say('Writing questions for ' + clip(job.m.title || job.course.code || 'file', 28) + '\u2026');
      try {
        var r = await generateCore(job.course, job.m, job.chosen, say);
        if (r.busy) {                       // the server already started writing them in the background: watch it finish
          r = await watchServerRun(job.m, say);
          if (r.retry) r = await generateCore(job.course, job.m, job.chosen, say);
        }
        if (r.already || !(r.saved > 0)) { bgSum.already++; }
        else { bgSum.added += r.saved; bgSum.files++; bgSum.course = r.course_title || job.course.code || job.course.title || ''; }
      } catch (e) {
        bgSum.failed++; bgSum.lastErr = e.message;
        console.error('Auto questions failed', e);
        if (e.status === 401) { bgQueue.length = 0; break; }
      }
    }
    chip('');
    var s = bgSum; bgSum = null; bgRunning = false;
    if (s.added) {
      toast('\u2705 ' + s.added + (s.added === 1 ? ' question' : ' questions') + ' added' + (s.files === 1 && s.course ? ' to ' + s.course : ' from ' + s.files + ' files') + (s.failed ? ' (' + s.failed + ' failed)' : ''), false, 7000);
      if (current === 'questions') go('questions');
    } else if (s.failed) {
      toast('\u26A0\uFE0F Could not make questions: ' + s.lastErr + ' Use "Make questions" on the material to retry.', true, 8000);
    } else if (s.already) {
      toast('That file already has its questions. Nothing new to add.', false, 5000);
    }
  }

  async function runGeneration(course, mats, chosen) {
    if (genBusy) { toast('Questions are already being made. Please wait.', true); return; }
    genBusy = true;
    openSheet('Questions from PDFs: ' + (course.title || course.code),
      '<div class="count">Questions are written only from the PDFs of this course. Each one must quote a passage that really exists in the PDF, or it is thrown away.</div><div class="stack" id="genLog"></div>',
      '<button class="btn primary" id="genClose" disabled>Working…</button>');
    $('genLog').innerHTML = mats.map(function (m, i) {
      return '<div class="row"><div class="row-main"><div class="row-title">' + esc(m.title) + '</div><div class="row-sub" id="g_' + i + '">Waiting…</div></div></div>';
    }).join('');
    var say = function (i, text) { var el = $('g_' + i); if (el) el.textContent = text; };
    var total = 0, failed = 0, busyN = 0;
    for (var i = 0; i < mats.length; i++) {
      try {
        var pdfText = '';   // the server reads the file itself (text, or fast AI OCR for scans of any size)
        say(i, 'Reading the file and writing questions. Large or scanned PDFs can take a few minutes…');
        // One request only. (It used to be sent twice, which wasted time and could create duplicates.)
        var r = await generateCore(course, mats[i], chosen, function (t) { say(i, t); });
        if (r.busy) { busyN++; say(i, 'Already being written in the background. Check Questions again in a few minutes.'); continue; }
        total += r.saved;
        if (r.already) { say(i, 'This file already has ' + r.total + ' questions' + (r.course_title ? ' in ' + r.course_title : '') + '. Nothing more to add.'); continue; }
        say(i, r.saved + (r.saved === 1 ? ' question added' : ' questions added') + (r.course_title ? ' to ' + r.course_title : '') + (r.rejected ? '. ' + r.rejected + ' rejected (not backed by the PDF)' : '') + (r.duplicates ? '. ' + r.duplicates + ' already existed' : '') + '.');
      } catch (e) {
        failed++; say(i, 'Failed: ' + e.message);
        if (e.status === 401) break;
      }
    }
    genBusy = false;
    var btn = $('genClose');
    if (btn) {
      btn.disabled = false; btn.textContent = 'Done';
      btn.onclick = function () { closeSheet(); if (current === 'questions') go('questions'); };
    }
    if (busyN && !total && !failed) toast('Questions are already being written in the background.');
    else toast(total + (total === 1 ? ' question' : ' questions') + ' added' + (failed ? ', ' + failed + ' PDF(s) failed' : ''), !!failed && !total);
  }
/* ================= material levels ================= */
  async function renderMaterialLevels() {
    var rows = [], sig = '';
    $('view').innerHTML = '<div class="card stack"><div class="h3">Material levels</div>' +
      '<div class="count">Hide a level to remove it from the Materials page. A material\'s level comes from its course code (CHM 101 = 100 level).</div>' +
      '<div class="rows" id="mlRows"><div class="loading">Loading…</div></div></div>';

    function paint() {
      $('mlRows').innerHTML = rows.length ? rows.map(function (r, i) {
        return '<div class="row has-acts"><div class="row-main"><div class="row-title">' + r.level + ' Level' +
          '<span class="tag ' + (r.enabled ? 'green' : 'red') + '">' + (r.enabled ? 'Visible' : 'Hidden') + '</span></div></div>' +
          '<div class="row-actions"><button class="btn small" data-t="' + i + '">' + (r.enabled ? 'Hide' : 'Show') + '</button></div></div>';
      }).join('') : emptyHtml('No levels found. Run the SQL in Supabase first.');
    }
    async function pull() {
      var d = await api('list', { table: 'material_levels', limit: 50 });
      var next = d.rows.slice().sort(function (a, b) { return a.level - b.level; });
      var s = JSON.stringify(next);
      if (s === sig) return;
      sig = s; rows = next; paint();
    }

    $('view').addEventListener('click', async function (e) {
      if (e.target.closest('[data-retry]')) { try { await pull(); } catch (err) { toast(err.message, true); } return; }
      var b = e.target.closest('[data-t]'); if (!b) return;
      var r = rows[+b.getAttribute('data-t')];
      b.disabled = true;
      try {
        await api('save', { table: 'material_levels', id: r.id, data: { enabled: !r.enabled } });
        toast(r.level + ' Level ' + (r.enabled ? 'hidden' : 'visible'));
        sig = ''; await pull();
      } catch (err) { b.disabled = false; toast(err.message, true); }
    });

    try { await pull(); } catch (e) { $('mlRows').innerHTML = emptyHtml(e.message, true); }
    setTask(pull, 30000);
  }
  
  /* ================= navigation ================= */
  var current = '';

  function buildNav() {
    var h = '<div class="brand"><div class="mark">P</div><div><b>PRIME-CBT</b><small>Admin panel</small></div></div>', group = '';
    SECTIONS.forEach(function (s) {
      if (s.group !== group) { group = s.group; h += '<div class="nav-group">' + esc(group) + '</div>'; }
      h += '<button class="nav" data-go="' + s.id + '" data-nav="' + s.id + '">' + icon(s.icon) + '<span>' + esc(s.label) + '</span></button>';
    });
    h += '<div class="side-foot"><button class="nav" id="navLock">' + icon('lock') + '<span>Lock panel</span></button></div>';
    $('drawer').innerHTML = h;
    $('navLock').onclick = lockNow;

  }

  function markActive() {
    document.querySelectorAll('[data-nav]').forEach(function (el) { el.classList.toggle('active', el.getAttribute('data-nav') === current); });
  }

  async function go(id) {
    var sec = SECTIONS.filter(function (s) { return s.id === id; })[0];
    if (!sec) return;
    current = id;
    try { localStorage.setItem('pc-section', id); } catch (e) {}
    setTask(null);
    closeSheet(true);
    if (dlgDone) dlgDone(false);
    $('dialogRoot').innerHTML = ''; $('palRoot').innerHTML = '';
    document.body.classList.remove('menu-open');
    // Swap the content node so listeners from the previous section are dropped.
    var old = $('view'), fresh = old.cloneNode(false);
    old.parentNode.replaceChild(fresh, old);
    $('pageTitle').textContent = sec.label;
    markActive();
    window.scrollTo(0, 0);
    try {
      if (sec.kind === 'dashboard') await renderDashboard();
      else if (sec.kind === 'students') await renderStudents();
      else if (sec.kind === 'notifications') await renderNotifications();
      else if (sec.kind === 'levels') await renderMaterialLevels();
      else if (sec.kind === 'security') renderSecurity();
      else await renderList(sec);
    } catch (e) {
      if (current === id) $('view').innerHTML = emptyHtml(e.message || 'Something went wrong.', true);
    }
  }

  function enterApp() {
    if (!$('app').hidden) return;
    hint(true);
    $('splash').hidden = true;
    $('lock').hidden = true; $('app').hidden = false;
    buildNav();
    var saved = '', y = 0;
    try { saved = localStorage.getItem('pc-section') || ''; y = +sessionStorage.getItem('pc-scroll') || 0; } catch (e) {}
    if (!SECTIONS.some(function (s) { return s.id === saved; })) saved = 'dashboard';
    var dr = null;
    try { dr = JSON.parse(sessionStorage.getItem('pc-draft') || 'null'); } catch (e) {}
    go(saved).then(function () {
      if (y) window.scrollTo(0, y);
      var ms = dr && SECTIONS.filter(function (x) { return x.id === dr.sec; })[0];
      if (ms) openForm(ms, null, function () { go(ms.id); }, dr.v);
    });
  }

  async function lockNow() {
    try { await api('logout'); } catch (e) { /* locking locally anyway */ }
    lookups = {}; studentCache = null;
    showLock();
    setMode('login');
  }

  /* ================= start ================= */
  function init() {
    $('menuBtn').innerHTML = icon('menu');
    $('refreshBtn').innerHTML = icon('refresh');
    $('searchBtn').innerHTML = icon('search');
    themeIcons();

    $('menuBtn').onclick = function () { document.body.classList.toggle('menu-open'); };
    $('scrim').onclick = function () { document.body.classList.remove('menu-open'); };
    $('refreshBtn').onclick = function () { runTask(true); };
    $('searchBtn').onclick = openPalette;
    $('themeBtn').onclick = toggleTheme;

    // One delegated handler for every "go to section" and "open student" button.
    document.addEventListener('click', function (e) {
      var g = e.target.closest('[data-go]');
      if (g) { go(g.getAttribute('data-go')); return; }
      var s = e.target.closest('[data-student]');
      if (s) {
        var id = s.getAttribute('data-student');
        var found = (studentCache || []).filter(function (x) { return x.id === id; })[0];
        if (found) showStudent(found);
      }
    });

    var scrollT;
    window.addEventListener('scroll', function () {
      clearTimeout(scrollT);
      scrollT = setTimeout(function () { try { sessionStorage.setItem('pc-scroll', String(window.scrollY)); } catch (e) {} }, 150);
    }, { passive: true });

    $('pinIn').addEventListener('input', onPin);
    setMode('login');
    if (hint()) enterApp();   // was signed in: go straight to the panel, no PIN flash
    checkStatus();
    setTimeout(function () { try { $('pinIn').focus(); } catch (e) {} }, 60);
  }

    // API Keys section (added just before Settings)
  SECTIONS.splice(SECTIONS.length - 1, 0, {
    id: 'apikeys', label: 'API Keys', group: 'Security', icon: 'lock', kind: 'list', table: 'api_keys', noun: 'API key', search: false,
    empty: 'No API keys yet. Add your first Gemini key.',
    fields: [
      { key: 'label', label: 'Label', type: 'text', ph: 'e.g. Key 1' },
      { key: 'key', label: 'Gemini API key', type: 'text', required: true, ph: 'AIza…', hint: 'Use a key from a different Google Cloud project each time.' },
      { key: 'enabled', label: 'Enabled', type: 'bool', def: true }
    ],
    row: function (r) {
      var cooling = r.exhausted_until && new Date(r.exhausted_until) > new Date();
      return {
        title: r.label || 'API key',
        tag: !r.enabled ? 'Disabled' : cooling ? 'Limit hit' : 'Active',
        tagClass: !r.enabled ? 'red' : cooling ? 'amber' : 'green',
        sub: String(r.key || '').slice(0, 6) + '••••' + String(r.key || '').slice(-4),
        sub2: (r.uses || 0) + ' uses' + (cooling ? '  back ' + fmtDate(r.exhausted_until) : '')
      };
    }
  });


  init();
})();
</script>
</body>
