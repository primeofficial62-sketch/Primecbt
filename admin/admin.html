<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#101436">
  <title>PRIME-CBT Admin</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Math: KaTeX (equations) + mhchem (chemistry like \ce{H2SO4}) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/mhchem.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem('pc-theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script>
    // If anything goes wrong, show the reason on screen instead of a blank page.
    (function () {
      function show(msg, where) {
        var b = document.getElementById('boot'); if (!b) return;
        var l = document.getElementById('lock'); if (l) l.hidden = true;
        var sp = document.getElementById('splash'); if (sp) sp.hidden = true;
        b.hidden = false;
        b.innerHTML = '<div><b>The admin panel could not start.</b><br><code></code><br><button onclick="location.reload()">Reload</button></div>';
        b.querySelector('code').textContent = msg + (where ? '  (' + where + ')' : '');
      }
      window.addEventListener('error', function (e) { show(e.message || 'Unknown error', (e.filename || '').split('/').pop() + ':' + (e.lineno || '')); });
      window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.message) || String(e.reason || 'Unknown error')); });
    })();
  </script>
  <style>
    :root {
      --bg: #F1F3F9; --surface: #FFFFFF; --surface-2: #F6F7FC; --line: #E0E4F0; --line-2: #CBD1E6;
      --text: #11163A; --muted: #566086; --faint: #8790B0;
      --accent: #3350F2; --accent-2: #2339C9; --accent-soft: rgba(51,80,242,.10); --on-accent: #FFFFFF;
      --live: #0FA968; --live-soft: rgba(15,169,104,.13);
      --warn: #B86E00; --warn-soft: rgba(247,144,9,.15);
      --danger: #D93843; --danger-soft: rgba(217,56,67,.10);
      --side: #101436; --side-2: #1B2154; --side-text: #C3C9EC; --side-faint: #7F88BA;
      --shadow-lg: 0 24px 60px -20px rgba(8,10,40,.45);
      --r: 14px;
      --side-w: 268px;
      --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --display: 'Bricolage Grotesque', 'Manrope', system-ui, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0A0D1E; --surface: #131732; --surface-2: #1A1F42; --line: #272D58; --line-2: #363D70;
      --text: #EEF0FC; --muted: #A5ACD3; --faint: #7981AB;
      --accent: #8294FF; --accent-2: #9DAAFF; --accent-soft: rgba(130,148,255,.14); --on-accent: #0A0D1E;
      --live: #2DD48A; --live-soft: rgba(45,212,138,.14);
      --warn: #F5B544; --warn-soft: rgba(245,181,68,.14);
      --danger: #FF7A83; --danger-soft: rgba(255,122,131,.12);
      --side: #080A1A; --side-2: #151A3D; --side-text: #B3BAE3; --side-faint: #6F78A8;
      --shadow-lg: 0 24px 60px -20px rgba(0,0,0,.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45; min-height: 100dvh; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    h1, h2, h3 { font-family: var(--display); letter-spacing: -.01em; }

    /* ---------- PIN screen ---------- */
    .lock { min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--side); color: #fff; overflow-y: auto; }
    .lock-in { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; max-width: 340px; }
    .mark { width: 54px; height: 54px; border-radius: 16px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.3rem; margin-bottom: 8px; }
    .lock h1 { font-size: 1.45rem; font-weight: 700; text-align: center; }
    .lock .sub { color: #AAB1DA; font-size: .92rem; text-align: center; min-height: 1.4em; max-width: 280px; }
    .lock .sub.err { color: #FF9AA1; }
    .dots { display: flex; gap: 16px; margin: 22px 0 20px; }
    .dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); transition: background .12s, border-color .12s; }
    .dot.on { background: #fff; border-color: #fff; }
    .dots.shake { animation: shake .35s; }
    @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
    .pad { --k: clamp(58px, 19vw, 76px); display: grid; grid-template-columns: repeat(3, var(--k)); gap: clamp(10px, 2.2vh, 16px); }
    .pad button { width: var(--k); height: var(--k); border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: #fff; font-size: 1.5rem; font-weight: 500; transition: background .12s, transform .08s; }
    .pad button:hover { background: rgba(255,255,255,.14); }
    .pad button:active { background: rgba(255,255,255,.22); transform: scale(.94); }
    .pad .ghost { background: none; border-color: transparent; font-size: 1.15rem; color: #AAB1DA; }
    .pad button:disabled { opacity: .4; }
    @media (max-height: 600px) { .lock { place-items: start center; } .mark { width: 42px; height: 42px; } .dots { margin: 12px 0; } .pad { --k: 52px; gap: 8px; } }
    @media (prefers-reduced-motion: reduce) { .dots.shake { animation: none; } }

    .splash { min-height: 100dvh; display: grid; place-items: center; background: var(--side); }
    .splash .mark { margin: 0; }
    .boot { min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); font-size: .95rem; line-height: 1.6; }
    .boot b { color: var(--text); font-size: 1.05rem; }
    .boot code { display: inline-block; max-width: 100%; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); color: var(--danger); font-size: .82rem; overflow-wrap: anywhere; }
    .boot button { margin-top: 14px; padding: 10px 18px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 600; }

    .pinwrap { position: relative; display: block; margin: 20px 0 8px; padding: 22px 34px; border-radius: 18px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07); cursor: text; }
    .pinwrap:focus-within { border-color: #fff; }
    .pinwrap .dots { margin: 0; }
    .pinwrap input { position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; padding: 0; border: 0; border-radius: 18px; opacity: 0; background: transparent; color: transparent; caret-color: transparent; font-size: 16px; }
    .pinwrap input:focus { outline: none; }
    .lock .hint { color: #AAB1DA; font-size: .85rem; }

    /* ---------- shell ---------- */
    .shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100dvh; }
    .side { position: sticky; top: 0; height: 100dvh; background: var(--side); color: var(--side-text); overflow-y: auto; display: flex; flex-direction: column; padding: 18px 12px calc(18px + env(safe-area-inset-bottom)); z-index: 50; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 16px; color: #fff; }
    .brand .mark { width: 38px; height: 38px; border-radius: 11px; font-size: 1rem; margin: 0; }
    .brand b { display: block; font-family: var(--display); font-size: 1.05rem; line-height: 1.15; }
    .brand small { color: var(--side-faint); font-size: .76rem; }
    .nav-group { color: var(--side-faint); font-size: .76rem; font-weight: 600; padding: 16px 10px 6px; }
    .nav { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 10px 10px; border-radius: 10px; font-size: .93rem; font-weight: 500; color: var(--side-text); }
    .nav:hover { background: var(--side-2); color: #fff; }
    .nav.active { background: var(--side-2); color: #fff; font-weight: 600; }
    .nav.active::before { content: ""; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
    .side-foot { margin-top: auto; padding-top: 14px; }
    .scrim { position: fixed; inset: 0; background: rgba(6,8,28,.55); z-index: 45; opacity: 0; pointer-events: none; transition: opacity .2s; }

    .main { min-width: 0; display: flex; flex-direction: column; }
    .topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 8px clamp(12px, 3vw, 28px); padding-top: calc(8px + env(safe-area-inset-top)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .topbar h1 { flex: 1; min-width: 0; font-size: clamp(1.05rem, 2.4vw, 1.3rem); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .iconbtn { width: 40px; height: 40px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); display: inline-grid; place-items: center; flex: none; color: var(--text); }
    .iconbtn:hover { background: var(--surface-2); }
    #menuBtn { display: none; }
    .spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .live { display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px; border-radius: 99px; background: var(--live-soft); color: var(--live); font-size: .8rem; font-weight: 700; white-space: nowrap; }
    .live small { color: var(--muted); font-weight: 500; font-size: .76rem; }
    .live[data-s="sync"] { background: var(--accent-soft); color: var(--accent); }
    .live[data-s="off"] { background: var(--danger-soft); color: var(--danger); }
    .live[data-s="off"] .pulse, .live[data-s="sync"] .pulse { background: currentColor; }
    .live[data-s="off"] .pulse::after { display: none; }
    .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--live); position: relative; flex: none; }
    .pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit; animation: ping 1.9s ease-out infinite; }
    @keyframes ping { to { transform: scale(3.2); opacity: 0; } }
    .netbar { background: var(--danger-soft); color: var(--danger); font-size: .85rem; font-weight: 600; padding: 9px clamp(12px, 3vw, 28px); border-bottom: 1px solid var(--line); }

    .content { flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; padding: clamp(14px, 3vw, 28px); padding-bottom: calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; min-width: 0; }


    @media (max-width: 1023px) {
      .shell { grid-template-columns: minmax(0, 1fr); }
      .side { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); transform: translateX(-102%); transition: transform .22s; z-index: 50; }
      body.menu-open .side { transform: none; }
      body.menu-open .scrim { opacity: 1; pointer-events: auto; }
      #menuBtn { display: inline-grid; }
    }
    @media (min-width: 1024px) { .content { padding-bottom: 40px; } }
    @media (max-width: 560px) { .live small { display: none; } .live { padding: 8px; } .live b { display: none; } }

    /* ---------- controls ---------- */
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .bar .grow { flex: 1 1 auto; }
    input, select, textarea { width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; font-size: .94rem; min-height: 42px; }
    textarea { resize: vertical; line-height: 1.5; }
    input::placeholder, textarea::placeholder { color: var(--faint); }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
    select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
    .search { position: relative; flex: 1 1 220px; min-width: 0; }
    .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
    .search input { padding-left: 38px; }
    .bar select { flex: 0 1 180px; min-width: 0; }
    @media (max-width: 720px) { input, select, textarea { font-size: 16px; } .bar select { flex: 1 1 140px; } }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 14px; min-height: 42px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: .9rem; white-space: nowrap; }
    .btn:hover { background: var(--surface-2); }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
    .btn.primary:hover { background: var(--accent-2); }
    .btn.danger { color: var(--danger); }
    .btn.danger-solid { background: var(--danger); color: #fff; border-color: transparent; }
    .btn.small { min-height: 32px; padding: 5px 10px; font-size: .82rem; border-radius: 8px; }
    .btn:disabled { opacity: .5; pointer-events: none; }
    .btn svg.i { width: 17px; height: 17px; }

    .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
    .seg button { padding: 6px 11px; border-radius: 7px; font-size: .82rem; font-weight: 600; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(14px, 2.4vw, 20px); min-width: 0; }
    .card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .card-head h2, .h3 { font-size: 1.02rem; font-weight: 700; flex: 1; min-width: 0; }
    .link { color: var(--accent); font-weight: 600; font-size: .84rem; }
    .muted { color: var(--muted); }
    .small { font-size: .82rem; }

    .rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 10px; }
    .row { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; transition: border-color .15s; }
    .row.tap { cursor: pointer; }
    .row.tap:hover { border-color: var(--accent); }
    .row.fresh { animation: fresh 2.6s ease-out; }
    @keyframes fresh { from { background: var(--accent-soft); border-color: var(--accent); } }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-weight: 600; font-size: .95rem; overflow-wrap: anywhere; }
    .row-sub { color: var(--muted); font-size: .82rem; margin-top: 3px; overflow-wrap: anywhere; }
    .row-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; max-width: 50%; }
    @media (max-width: 460px) { .row.has-acts { flex-wrap: wrap; } .row.has-acts .row-actions { max-width: none; width: 100%; justify-content: flex-start; } }
    .tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: middle; }
    .tag.green { background: var(--live-soft); color: var(--live); }
    .tag.amber { background: var(--warn-soft); color: var(--warn); }
    .tag.red { background: var(--danger-soft); color: var(--danger); }
    .av { position: relative; width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: .8rem; flex: none; }
    .av.on::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--live); border: 2px solid var(--surface); }
    .empty { text-align: center; color: var(--muted); padding: 38px 14px; font-size: .92rem; grid-column: 1 / -1; }
    .empty .btn { margin-top: 12px; }
    .count { color: var(--muted); font-size: .82rem; }
    .more { text-align: center; }
    .loading { color: var(--muted); text-align: center; padding: 30px; font-size: .9rem; grid-column: 1 / -1; }
    .sk { border-radius: 10px; background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: sk 1.3s linear infinite; }
    @keyframes sk { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .sk, .pulse::after, .row.fresh, .spin svg { animation: none; } }

    /* ---------- dashboard ---------- */
    .dash-top { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 900px) { .dash-top { grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); } }
    .hero { background: var(--side); border-color: transparent; color: #fff; display: flex; flex-direction: column; gap: 6px; }
    [data-theme="dark"] .hero { background: var(--side-2); }
    .hero-head { display: flex; align-items: center; gap: 10px; font-weight: 600; color: #C9CFF0; }
    .hero .big { font-family: var(--display); font-weight: 800; font-size: clamp(3.4rem, 9vw, 5.2rem); line-height: 1; letter-spacing: -.03em; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .hero p { color: #AAB1DA; font-size: .88rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 11px 5px 5px; border-radius: 99px; background: rgba(255,255,255,.1); color: #fff; font-size: .82rem; font-weight: 600; max-width: 100%; }
    .chip:hover { background: rgba(255,255,255,.18); }
    .chip .av { width: 26px; height: 26px; font-size: .68rem; background: rgba(255,255,255,.18); color: #fff; }
    .chip span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
    .stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); }
    .stat { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; transition: border-color .15s; }
    .stat:hover { border-color: var(--accent); }
    .stat .ic { color: var(--accent); margin-bottom: 6px; }
    .stat b { font-family: var(--display); font-size: 1.8rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: .82rem; }
    .stat em { font-style: normal; color: var(--live); font-size: .76rem; font-weight: 600; margin-top: 2px; }
    .stat em.warn { color: var(--warn); }
    .chart { display: flex; align-items: flex-end; gap: clamp(2px, .8vw, 8px); height: 200px; }
    .col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; }
    .col .bw { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; }
    .col .val { font-size: .7rem; font-weight: 700; color: var(--muted); line-height: 1; font-variant-numeric: tabular-nums; }
    .col i { display: block; width: 100%; max-width: 34px; background: var(--accent); border-radius: 6px 6px 2px 2px; min-height: 3px; }
    .col i.zero { background: var(--line-2); }
    .col em { font-style: normal; font-size: .68rem; color: var(--faint); height: 1em; line-height: 1; white-space: nowrap; }
    .col.today em { color: var(--accent); font-weight: 700; }
    .panels { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
    .mini { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 9px 0; border-top: 1px solid var(--line); min-width: 0; }
    .mini:first-of-type { border-top: 0; padding-top: 0; }
    .mini .grow { flex: 1; min-width: 0; }
    .mini .t { font-weight: 600; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini .s { color: var(--muted); font-size: .78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini .r { color: var(--faint); font-size: .76rem; white-space: nowrap; }
    .mini:hover .t { color: var(--accent); }
    .summary { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 1fr)); }

  <div class="boot" id="boot" role="status" hidden></div>

        <button class="iconbtn" id="searchBtn" aria-label="Search and jump" title="Search (press /)"></button>
        <button class="iconbtn" id="themeBtn" aria-label="Switch light and dark theme" title="Switch theme"></button>
      </header>
      <div class="netbar" id="netbar" role="status" hidden>You are offline. Data will refresh as soon as the connection is back.</div>
      <main class="content" id="view"></main>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div id="sheetRoot"></div>
  <div id="dialogRoot"></div>
  <div id="palRoot"></div>
  <div class="genchip" id="genChip" hidden><i class="spin"></i><span class="t" id="genChipT"></span></div>
  <div class="toast" id="toast" role="status"></div>

  /* ---------- PDF auto-compress (runs only when a PDF is over the limit) ---------- */
var PDF_LIMIT = 50 * 1024 * 1024;
var PDF_TARGET = 47 * 1024 * 1024;
var PDF_INPUT_MAX = 300 * 1024 * 1024;

async function ensurePdfLib() {
  if (window.PDFLib) return;
  await new Promise(function (ok, no) {
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
    s.onload = ok;
    s.onerror = function () { no(new Error('Compressor did not load. Check your internet')); };
    document.head.appendChild(s);
  });
}

async function compressPdf(file, onProgress) {
  await ensurePdfLib();
  if (!window.pdfjsLib) throw new Error('PDF reader did not load');
  var buf = await file.arrayBuffer();
  var levels = [{ s: 2, q: 0.7 }, { s: 1.5, q: 0.6 }, { s: 1.2, q: 0.5 }, { s: 1, q: 0.4 }];
  var best = null;
  for (var li = 0; li < levels.length; li++) {
    var L = levels[li];
    var src = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
    var out = await PDFLib.PDFDocument.create();
    var font = await out.embedFont(PDFLib.StandardFonts.Helvetica);
    for (var p = 1; p <= src.numPages; p++) {
      onProgress('Compressing PDF… pass ' + (li + 1) + '/' + levels.length + ', page ' + p + '/' + src.numPages);
      var page = await src.getPage(p);
      var v1 = page.getViewport({ scale: 1 });
      var vp = page.getViewport({ scale: L.s });
      var cv = document.createElement('canvas');
      cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      var blob = await new Promise(function (r) { cv.toBlob(r, 'image/jpeg', L.q); });
      var img = await out.embedJpg(new Uint8Array(await blob.arrayBuffer()));
      cv.width = cv.height = 0;
      var pg = out.addPage([v1.width, v1.height]);
      pg.drawImage(img, { x: 0, y: 0, width: v1.width, height: v1.height });
      // invisible text layer so text extraction (question generation) still works
      if (!page.rotate) {
        try {
          var tc = await page.getTextContent();
          tc.items.forEach(function (it) {
            var str = (it.str || '').replace(/[^\x20-\x7E]/g, ' ').trim();
            if (!str) return;
            try { pg.drawText(str, { x: it.transform[4], y: it.transform[5], size: Math.abs(it.transform[3]) || 10, font: font, opacity: 0 }); } catch (e) {}
          });
        } catch (e) {}
      }
      page.cleanup();
    }
    var bytes = await out.save({ useObjectStreams: true });
    if (!best || bytes.length < best.length) best = bytes;
    if (bytes.length <= PDF_TARGET) break;
  }
  if (!best || best.length > PDF_LIMIT) throw new Error('Still over 50 MB after compression. Split the PDF');
  return new File([best], file.name, { type: 'application/pdf' });
}

  // Reads the text of a PDF that is already uploaded, so questions can be written from it.
  async function pdfTextFromUrl(url) {
    if (!window.pdfjsLib) throw new Error('PDF reader did not load. Reload the page');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    if (!res.ok) throw new Error('Could not open the PDF (' + res.status + ')');

    var parts = [], len = 0;
    for (var p = 1; p <= pdf.numPages && len < 150000; p++) {
      var tc = await (await pdf.getPage(p)).getTextContent();
      var t = tc.items.map(function (it) { return it.str; }).join(' ');
      parts.push(t); len += t.length;
    }
    var text = parts.join('\n').replace(/\s+/g, ' ').trim();

// Reads SCANNED PDFs in the browser (OCR), so large files never go to the server as images.
  async function loadTesseract() {

      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';

  async function ocrPdfFromUrl(url, onProgress) {
    if (!window.pdfjsLib) throw new Error('PDF reader did not load. Reload the page');
    await loadTesseract();
    var res = await fetch(url);
    if (!res.ok) throw new Error('Could not open the PDF (' + res.status + ')');
    var pdf = await pdfjsLib.getDocument({ data: await res.arrayBuffer() }).promise;
    var worker = await Tesseract.createWorker('eng');
    var parts = [], len = 0, MAX_CHARS = 120000, MAX_PAGES = 150;
    try {
      for (var p = 1; p <= pdf.numPages && p <= MAX_PAGES && len < MAX_CHARS; p++) {
        onProgress('Scanned PDF: reading page ' + p + ' of ' + Math.min(pdf.numPages, MAX_PAGES) + '… keep this screen open');
        var page = await pdf.getPage(p);
        var vp = page.getViewport({ scale: 2 });
        var cv = document.createElement('canvas');
        cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        var r = await worker.recognize(cv);
        var t = (r.data.text || '').replace(/\s+/g, ' ').trim();
        parts.push(t); len += t.length;
        cv.width = cv.height = 0; page.cleanup();
      }
    } finally { await worker.terminate(); }
    var text = parts.join('\n').trim();
    if (text.length < 200) throw new Error('OCR could not read any text from this PDF');
    return text.slice(0, 150000);
  }

        catch (e) { console.error('PDF autofill failed', e); if ($('upStatus')) $('upStatus').textContent = 'Could not read the PDF (' + e.message + '). Uploading anyway…'; }
        if (!$('upStatus')) { upBusy = false; return; }
      }

      if (isPdf && f.size > PDF_LIMIT) {
  try {
    f = await compressPdf(f, function (m) { var s = $('upStatus'); if (s) s.textContent = m; });
    setVal('f_size_bytes', f.size);
  } catch (e) {
    console.error('PDF compress failed', e);
    if ($('upStatus')) $('upStatus').textContent = 'Could not compress: ' + e.message;
    inp.value = ''; upBusy = false; return;
  }
  if (!$('upStatus')) { upBusy = false; return; }
}
      
      // 2. Then upload and fill the link
      st.textContent = 'Uploading ' + f.name + '…';
      try {
        var url = await uploadFile(f);
        if (!$('upStatus')) { upBusy = false; return; }
        $('f_file_url').value = url;
        if ($('curFileName')) $('curFileName').textContent = f.name;
        if ($('curFileLink')) $('curFileLink').href = url;
        $('upStatus').textContent = 'Uploaded: ' + f.name;
      } catch (e) {
        var hintMsg = /unknown action/i.test(e.message) ? ' Your server file api/admin.js has no "upload_url" action yet.' : '';
        if ($('upStatus')) $('upStatus').textContent = 'Fields filled, but the upload failed: ' + e.message + '.' + hintMsg;
        toast(e.message, true);
      }
      upBusy = false;
    });
  }

  async function courseOptions() {
    delete lookups.courses;   // never reuse an old copy: the list must always match the Courses page
    var rows = (await fetchAllRows('courses')).rows, seen = {}, out = [];
    // Materials are filed by COURSE CODE only. Courses that share a code (e.g. three CHM 101 topics) appear once.
    rows.forEach(function (c) {
      var value = c.code || c.title, k = normName(value);
      if (seen[k]) return;
      seen[k] = 1;
      out.push([value, c.code ? c.code : c.title]);
    });
    out.sort(function (a, b) { return azCompare(a[1], b[1]); });
    return out;
  }
  
  async function openForm(sec, row, after, draft) {
    var isEdit = !!row, optsMap = {};
    try {
      for (var i = 0; i < sec.fields.length; i++) {
        var f = sec.fields[i];
        if (f.type === 'select') {
          if (f.courseText) {
            var co = await courseOptions();
            if (!co.length) { toast('Add a course first, then add materials to it.', true); return; }
            if (row && row[f.key] && !co.some(function (o) { return normName(o[0]).replace(/ /g, '') === normName(row[f.key]).replace(/ /g, ''); })) co.push([row[f.key], row[f.key]]);
            optsMap[f.key] = co;
          } else {
            optsMap[f.key] = f.lookup ? await lookup(f.lookup, f.lookupLabel) : (f.opts || []).slice();
            if (row && row[f.key] && f.opts && !optsMap[f.key].some(function (o) { return o[0] === row[f.key]; })) optsMap[f.key].push([row[f.key], row[f.key]]);
          }
        }
      }
    } catch (e) { toast(e.message, true); return; }
    var body = sec.fields.map(function (f) { return fieldHtml(f, row, optsMap); }).join('');
    var editable = sec.fields.some(function (f) { return f.type !== 'static'; });
    openSheet((isEdit ? 'Edit ' : 'Add ') + sec.noun, body,
      '<button class="btn" id="fCancel">' + (editable ? 'Cancel' : 'Close') + '</button>' + (editable ? '<button class="btn primary" id="fSave">Save changes</button>' : ''));
    $('fCancel').onclick = function () { closeSheet(); };
    wireUpload();
    if (!isEdit && sec.id === 'materials') {
      var bodyEl = $('sheetBody');
      if (draft) Object.keys(draft).forEach(function (k) { var el = $(k); if (el) el.value = draft[k]; });
      var saveDraft = function () {
        var v = {};
        bodyEl.querySelectorAll('input:not([type=file]), select, textarea').forEach(function (el) { if (el.id) v[el.id] = el.value; });
        try { sessionStorage.setItem('pc-draft', JSON.stringify({ sec: sec.id, v: v })); } catch (e) {}
      };
      bodyEl.addEventListener('input', saveDraft);
      bodyEl.addEventListener('change', saveDraft);
    }
    var box = $('mcqBox');
    if (box) {
      box.addEventListener('click', function (e) {
        if (e.target.closest('.mcq-add')) {
          var n = box.querySelectorAll('.mcq-row').length, d = document.createElement('div');
          d.innerHTML = mcqRow(n, '', false);
          box.insertBefore(d.firstChild, box.querySelector('.mcq-add'));
          redrawMcq(box);
        } else if (e.target.closest('.mcq-del')) {
          if (box.querySelectorAll('.mcq-row').length <= 2) { toast('A question needs at least 2 options.', true); return; }
          e.target.closest('.mcq-row').remove(); redrawMcq(box);
        }
      });
      redrawMcq(box);
    }
    if (sec.id === 'questions') wireMathPreview();
    if (!editable) return;
    $('fSave').onclick = async function () {
      var btn = $('fSave');
      if (upBusy) { toast('Wait for the upload to finish.', true); return; }
      try {
        var data = collect(sec.fields);
        if (sec.id === 'materials' && !data.title) {
          var fn = String(data.file_url || '').split('?')[0].split('/').pop();
          try { fn = decodeURIComponent(fn); } catch (e) {}
          fn = fn.replace(/^\d{10,}-[0-9a-f]{6}-/, '').replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
          data.title = fn || (data.course + ' material');
        }
        if (sec.beforeSave) await sec.beforeSave(data, isEdit ? row : null);
        btn.disabled = true;
        await api('save', { table: sec.table, id: isEdit ? row.id : undefined, data: data });
        delete lookups[sec.table];
        clearDraft();
        closeSheet(true);
        toast(isEdit ? 'Changes saved' : sec.noun.charAt(0).toUpperCase() + sec.noun.slice(1) + ' added');
        if (after) after();
        if (sec.afterSave && !isEdit) sec.afterSave(data);
        if (sec.afterEdit && isEdit) sec.afterEdit(row, data);
      } catch (e) { btn.disabled = false; toast(e.message, true); }
    };
  }

  /* ---------- live math preview (question form) ---------- */
  function wireMathPreview() {
    var body = $('sheetBody'); if (!body) return;

  /* ================= helpers for list + course groups ================= */
  async function fetchAllRows(table, extra) {
    var all = [], total = null;
    for (var n = 0; n < 40; n++) {
      var d = await api('list', Object.assign({ table: table, limit: 500, offset: all.length }, extra || {}));
      all = all.concat(d.rows); total = d.total;
      if (!d.rows.length || all.length >= total) break;
    }
    return { rows: all, total: total == null ? all.length : total };
  }
  // A to Z, ignoring case, with numbers in natural order (MTS 106 before MTS 1010)
  function azCompare(a, b) { return String(a || '').trim().localeCompare(String(b || '').trim(), undefined, { numeric: true, sensitivity: 'base' }); }
  function freshView() { var old = $('view'), fresh = old.cloneNode(false); old.parentNode.replaceChild(fresh, old); }

  // Course overview: each course with its question count. Tap one to open its questions.
  async function renderGroups(sec) {
    freshView();
    $('pageTitle').textContent = sec.label;
    var data = null;
    var top = '<div class="bar"><span class="count grow" id="gCount" style="text-align:right"></span>';
    (sec.tools || []).forEach(function (t, i) { top += '<button class="btn" data-tool="' + i + '">' + icon(t.icon || 'upload') + esc(t.label) + '</button>'; });
    if (sec.add !== false) top += '<button class="btn primary" id="lAdd">' + icon('plus') + 'Add ' + esc(sec.noun) + '</button>';
    top += '</div><div class="rows" id="gRows"><div class="loading">Loading\u2026</div></div>';
    $('view').innerHTML = top;

    var plural = function (n) { return num(n) + (n === 1 ? ' question' : ' questions'); };
    function paint() {
      var h = '<div class="row tap" data-all="1"><div class="row-main"><div class="row-title">All questions<span class="tag">' + esc(num(data.total)) + '</span></div><div class="row-sub">See every question from every course</div></div></div>';
      data.groups.forEach(function (g, gi) {
        var multi = g.ids.length > 1, n = g.n;
        var name = multi ? g.code : (g.code ? g.code + ' - ' + g.titles[0] : g.titles[0]);
        g.name = name;
        h += '<div class="row tap" data-g="' + gi + '"><div class="row-main"><div class="row-title">' + esc(name) + '<span class="tag ' + (n ? 'green' : 'amber') + '">' + esc(plural(n)) + '</span></div><div class="row-sub">' + esc(multi ? g.titles.join(' \u00b7 ') : 'Tap to open the questions') + '</div></div></div>';
      });
      $('gRows').innerHTML = h;
      $('gCount').textContent = data.groups.length + (data.groups.length === 1 ? ' course' : ' courses');
    }
    async function pull() {
      var cs = await fetchAllRows('courses'), qs = await fetchAllRows(sec.table);
      var counts = {};
      qs.rows.forEach(function (r) { counts[r.course_id] = (counts[r.course_id] || 0) + 1; });
      var sig = JSON.stringify([cs.rows.map(function (c) { return [c.id, c.title, c.code]; }), counts, qs.total]);
      if (data && data.sig === sig) return;
      // One entry per course CODE. Courses that share a code (different topics) are merged into it.
      var map = {}, groups = [];
      cs.rows.forEach(function (c) {
        var k = normName(c.code || c.title);
        if (!map[k]) { map[k] = { code: c.code || c.title, ids: [], titles: [], n: 0 }; groups.push(map[k]); }
        map[k].ids.push(c.id); map[k].titles.push(c.title); map[k].n += counts[c.id] || 0;
      });
      groups.sort(function (a, b) { return azCompare(a.code, b.code); });
      data = { sig: sig, courses: cs.rows, groups: groups, counts: counts, total: qs.total };
      paint();
    }
    async function first() { try { await pull(); } catch (e) { if ($('gRows')) $('gRows').innerHTML = emptyHtml(e.message, true); } }
    var again = function () { pull().catch(function () {}); };

    $('view').addEventListener('click', function (e) {
      if (e.target.closest('[data-retry]')) { first(); return; }
      var tool = e.target.closest('[data-tool]');
      if (tool) { sec.tools[+tool.getAttribute('data-tool')].run(again); return; }
      if (e.target.closest('#lAdd')) { openForm(sec, null, again); return; }
      if (e.target.closest('[data-all]')) { renderList(sec, { course: '' }); return; }
      var c = e.target.closest('[data-g]');
      if (c && data) {
        var g = data.groups[+c.getAttribute('data-g')];
        $('pageTitle').textContent = sec.label + ' \u00b7 ' + g.code;
        renderList(sec, { course: g.ids.join(','), label: g.code });
      }
    });
    await first();
    setTask(pull, 30000);
  }

  /* ================= generic list view ================= */
  var PAGE = 30;
  async function renderList(sec, opts) {
    if (sec.groupByCourse && !opts) return renderGroups(sec);
    if (opts) freshView();
    var st = { q: '', filter: (opts && opts.course) || '', offset: 0, rows: [], total: 0, busy: false, sig: '' };
    var filterCourses = [];
    if (sec.filter && sec.filter.courseText) { try { filterCourses = await allCourses(); } catch (e) { filterCourses = []; } }
    var filterOpts = null;
    if (sec.filter) { try { filterOpts = sec.filter.courseText ? await courseOptions() : sec.filter.lookup ? await lookup(sec.filter.lookup, sec.filter.lookupLabel) : sec.filter.opts; } catch (e) { filterOpts = []; } }

    var top = '<div class="bar">';
    if (opts) top += '<button class="btn" id="lBack">\u2190 Courses</button>';
    if (sec.search !== false) top += '<label class="search">' + icon('search') + '<input type="search" id="lq" placeholder="Search ' + esc(sec.label.toLowerCase()) + '" aria-label="Search"></label>';
    if (filterOpts) top += '<select id="lf" aria-label="' + esc(sec.filter.label) + '"><option value="">' + esc(sec.filter.label) + '</option>' + filterOpts.map(function (o) { return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join('') + '</select>';
    top += '<span class="count grow" id="lCount" style="text-align:right"></span>';
    (sec.tools || []).forEach(function (t, i) { top += '<button class="btn" data-tool="' + i + '">' + icon(t.icon || 'upload') + esc(t.label) + '</button>'; });
    if (sec.add !== false) top += '<button class="btn primary" id="lAdd">' + icon('plus') + 'Add ' + esc(sec.noun) + '</button>';
    top += '</div><div class="rows" id="lRows"></div><div class="more" id="lMore"></div>';
    $('view').innerHTML = top;
    if (opts && opts.course && $('lf')) {
      if (String(opts.course).indexOf(',') > -1) {
        var extra = document.createElement('option');
        extra.value = opts.course; extra.textContent = opts.label || 'This course code';
        $('lf').appendChild(extra);
      }
      $('lf').value = opts.course;
    }

    function rowHtml(r, i, fresh) {
      var d = sec.row(r), acts = '';
      (sec.actions || []).forEach(function (a, ai) { acts += '<button class="btn small" data-act="' + ai + '" data-i="' + i + '">' + esc(typeof a.label === 'function' ? a.label(r) : a.label) + '</button>'; });
      if (sec.editBtn && sec.edit !== false) acts += '<button class="btn small" data-edit="' + i + '">Edit</button>';
      if (sec.del !== false) acts += '<button class="btn small danger" data-del="' + i + '">Delete</button>';
      var tap = sec.edit !== false || sec.view;
      return '<div class="row' + (tap ? ' tap' : '') + (acts ? ' has-acts' : '') + (fresh && fresh[r.id] ? ' fresh' : '') + '" data-i="' + i + '"><div class="row-main"><div class="row-title">' + esc(d.title) +
        (d.tag ? '<span class="tag ' + (d.tagClass || '') + '">' + esc(d.tag) + '</span>' : '') + '</div>' +
        (d.sub ? '<div class="row-sub">' + esc(d.sub) + '</div>' : '') + (d.sub2 ? '<div class="row-sub">' + esc(d.sub2) + '</div>' : '') + '</div>' +
        (acts ? '<div class="row-actions">' + acts + '</div>' : '') + '</div>';
    }
    function paint(fresh) {
      $('lRows').innerHTML = st.rows.length ? st.rows.map(function (r, i) { return rowHtml(r, i, fresh); }).join('') : emptyHtml(st.q || st.filter ? 'Nothing matches your search.' : (sec.empty || 'Nothing here yet.'));
      $('lCount').textContent = st.total ? st.rows.length + ' of ' + st.total : '';
      $('lMore').innerHTML = st.rows.length < st.total ? '<button class="btn" id="lMoreBtn">Load more</button>' : '';
    }
    function filtersNow() { var f = {}; if (sec.filter && st.filter) f[sec.filter.key] = st.filter; return f; }
    var compact = function (v) { return normName(v).replace(/ /g, ''); };
    function matchRow(r) {
      if (!(sec.filter && st.filter)) return true;
      var v = r[sec.filter.key];
      if (sec.filter.courseText) {
        if (compact(v) === compact(st.filter)) return true;
        var c = filterCourses.filter(function (x) { return sameCourse(x, st.filter); })[0];
        return !!c && sameCourse(c, v);
      }
      return String(st.filter).split(',').indexOf(String(v)) > -1;
    }
    // With a filter on, load everything and filter here, so it works even if the server ignores the filter.
    async function fetchRows(limit, offset) {
      if (sec.sort) {   // A to Z across ALL rows (not just the page loaded so far), then cut into pages
        var serverF = (sec.filter && st.filter && !(sec.filter.courseText || String(st.filter).indexOf(',') > -1)) ? filtersNow() : {};
        var all = await fetchAllRows(sec.table, { q: st.q, filters: serverF });
        var sorted = all.rows.filter(matchRow).sort(function (a, b) { return azCompare(sec.sort(a), sec.sort(b)); });
        return { rows: sorted.slice(offset, offset + limit), total: sorted.length };
      }
      if (!(sec.filter && st.filter)) return api('list', { table: sec.table, q: st.q, filters: filtersNow(), limit: limit, offset: offset });
      var d = await fetchAllRows(sec.table, { q: st.q, filters: (sec.filter.courseText || String(st.filter).indexOf(',') > -1) ? {} : filtersNow() });
      var rows = d.rows.filter(matchRow);
      return { rows: rows, total: rows.length };
    }
    async function load(reset) {
      if (st.busy) return;
      st.busy = true;
      if (reset) { st.offset = 0; st.rows = []; $('lRows').innerHTML = '<div class="loading">Loading…</div>'; }
      try {
        var d = await fetchRows(PAGE, st.offset);
        st.rows = st.rows.concat(d.rows); st.total = d.total; st.offset = st.rows.length;
        if (sec.prepare) await sec.prepare(d.rows);
        st.sig = JSON.stringify(st.rows) + '|' + st.total;
        paint();
      } catch (e) { $('lRows').innerHTML = emptyHtml(e.message, true); }
      st.busy = false;
    }
    async function refresh() {
      if (st.busy || (!st.rows.length && !st.sig)) return;
      st.busy = true;
      try {
        var n = Math.min(500, Math.max(PAGE, st.rows.length));
        var d = await fetchRows(n, 0);
        if (sec.prepare) await sec.prepare(d.rows);
        var sig = JSON.stringify(d.rows) + '|' + d.total;
        if (sig !== st.sig) {
          var old = {}, fresh = {};
          st.rows.forEach(function (r) { old[r.id] = 1; });
          d.rows.forEach(function (r) { if (!old[r.id]) fresh[r.id] = 1; });
          st.rows = d.rows; st.total = d.total; st.offset = d.rows.length; st.sig = sig;
          paint(fresh);
        }
      } finally { st.busy = false; }
    }
    var done = function () { load(true); };

    var timer;
    if ($('lq')) $('lq').addEventListener('input', function (e) { clearTimeout(timer); timer = setTimeout(function () { st.q = e.target.value.trim(); load(true); }, 300); });
    if ($('lf')) $('lf').addEventListener('change', function (e) { st.filter = e.target.value; load(true); });
    if ($('lAdd')) $('lAdd').onclick = function () { openForm(sec, null, done); };
    $('view').addEventListener('click', async function (e) {
      if (e.target.closest('[data-retry]')) { load(true); return; }
      if (e.target.closest('#lBack')) { $('pageTitle').textContent = sec.label; renderList(sec); return; }
      var ed = e.target.closest('[data-edit]');
      if (ed) { openForm(sec, st.rows[+ed.getAttribute('data-edit')], done); return; }
      var tool = e.target.closest('[data-tool]');
      if (tool) { sec.tools[+tool.getAttribute('data-tool')].run(done, st); return; }
      if (e.target.id === 'lMoreBtn') { load(false); return; }
      var del = e.target.closest('[data-del]');
      if (del) {
        var r = st.rows[+del.getAttribute('data-del')];
        var extraNote = '';
        if (sec.delCheck) { try { extraNote = await sec.delCheck(r); } catch (err) { extraNote = ''; } }
        var ok = await confirmBox({ title: 'Delete this ' + sec.noun + '?', text: 'This cannot be undone.' + (extraNote ? '\n\n' + extraNote : '') + (sec.delWarn ? '\n\n' + sec.delWarn : ''), yes: 'Delete', danger: true });
        if (!ok) return;
        try { await api('remove', { table: sec.table, id: r.id }); delete lookups[sec.table]; toast('Deleted'); load(true); } catch (err) { toast(err.message, true); }
        return;
      }
      var act = e.target.closest('[data-act]');
      if (act) { sec.actions[+act.getAttribute('data-act')].run(st.rows[+act.getAttribute('data-i')], done); return; }
      var rowEl = e.target.closest('.row.tap');
      if (rowEl) {
        var row = st.rows[+rowEl.getAttribute('data-i')];
        if (sec.view) sec.view(row, done); else if (sec.edit !== false) openForm(sec, row, done);
      }
    });
    await load(true);
    setTask(refresh, 30000);
  }

  /* ================= dashboard ================= */
  var dash = { metric: 'tests', days: 14, data: null };

  function skeletonDash() {
    return '<div class="dash-top"><div class="sk" style="height:260px"></div><div class="sk" style="height:260px"></div></div>' +
      '<div class="stats">' + new Array(10).join('<div class="sk" style="height:104px"></div>') + '</div>' +
      '<div class="panels"><div class="sk" style="height:240px"></div><div class="sk" style="height:240px"></div></div>';
  }

  async function renderDashboard() {
    $('view').innerHTML = skeletonDash();
    async function pull() {
      var stats = await api('stats');
      var rest = await Promise.all([
        getStudents(true).catch(function () { return null; }),
        api('list', { table: 'test_results', limit: 500 }).catch(function () { return null; }),
        api('list', { table: 'support_tickets', limit: 100 }).catch(function () { return null; }),
        api('list', { table: 'discussion_posts', limit: 30 }).catch(function () { return null; })
      ]);
      var byNew = function (a, b) { return new Date(b.created_at) - new Date(a.created_at); };
      dash.data = {
        stats: stats, students: rest[0],
        results: rest[1] ? { rows: rest[1].rows.slice().sort(byNew), total: rest[1].total } : null,
        tickets: rest[2] ? { rows: rest[2].rows.slice().sort(byNew), total: rest[2].total } : null,
        posts: rest[3] ? { rows: rest[3].rows.slice().sort(byNew), total: rest[3].total } : null
      };
      paintDash();
    }
    try { await pull(); } catch (e) { $('view').innerHTML = emptyHtml(e.message, true); }
    $('view').addEventListener('click', function (e) {
      if (e.target.closest('[data-retry]')) { go('dashboard'); return; }
      var m = e.target.closest('[data-metric]'), d = e.target.closest('[data-days]');
      if (m) { dash.metric = m.getAttribute('data-metric'); paintChart(); }
      if (d) { dash.days = +d.getAttribute('data-days'); paintChart(); }
    });
    setTask(pull, 15000);
  }

  function panel(title, goId, body) {
    return '<section class="card"><div class="card-head"><h2>' + esc(title) + '</h2><button class="link" data-go="' + goId + '">View all</button></div>' + body + '</section>';
  }
  function mini(attr, av, title, sub, right) {
    return '<button class="mini" ' + attr + '>' + av + '<div class="grow"><div class="t">' + esc(title) + '</div><div class="s">' + esc(sub) + '</div></div><div class="r">' + esc(right) + '</div></button>';
  }
  function avatar(name, on) { return '<span class="av' + (on ? ' on' : '') + '">' + esc(initials(name)) + '</span>'; }
  function studentNameFrom(list, id) { var s = (list || []).filter(function (x) { return x.id === id; })[0]; return s ? (s.name || s.email || 'Student') : 'Student'; }

  function paintDash() {
    var D = dash.data; if (!D || current !== 'dashboard') return;
    var s = D.stats || {}, studs = D.students, wk = Date.now() - 7 * 864e5;
    var online = studs ? studs.filter(isOnline).sort(function (a, b) { return new Date(b.last_seen) - new Date(a.last_seen); }) : [];
    var onlineN = studs ? online.length : s.online;
    var newWeek = studs ? studs.filter(function (x) { return x.joined && new Date(x.joined).getTime() > wk; }).length : null;
    var activeWeek = studs ? studs.filter(function (x) { return x.last_seen && new Date(x.last_seen).getTime() > wk; }).length : null;
    var testsWeek = D.results ? D.results.rows.filter(function (r) { return new Date(r.created_at).getTime() > wk; }).length : null;
    var openTickets = D.tickets ? D.tickets.rows.filter(function (t) { return !isClosed(t.status); }) : null;

    // hero: who is online right now
    var chips = online.slice(0, 10).map(function (x) { var n = x.name || x.email || 'Student'; return '<button class="chip" data-student="' + esc(x.id) + '">' + avatar(n) + '<span class="nm">' + esc(n) + '</span></button>'; }).join('');
    var lastSeen = studs ? studs.filter(function (x) { return x.last_seen; }).sort(function (a, b) { return new Date(b.last_seen) - new Date(a.last_seen); })[0] : null;
    var heroNote = onlineN ? (onlineN === 1 ? 'student active in the last 5 minutes' : 'students active in the last 5 minutes')
      : (lastSeen ? 'Nobody right now. Last seen: ' + (lastSeen.name || lastSeen.email || 'a student') + ', ' + ago(lastSeen.last_seen) : 'Nobody has been active yet.');
    var hero = '<section class="card hero" aria-live="polite"><div class="hero-head"><span class="pulse"></span>Online now</div><div class="big">' + num(onlineN) + '</div><p>' + esc(heroNote) + '</p>' +
      (chips ? '<div class="chips">' + chips + (online.length > 10 ? '<span class="chip" style="padding:5px 12px">+' + (online.length - 10) + ' more</span>' : '') + '</div>' : '') + '</section>';

    var chartCard = '<section class="card"><div class="card-head"><h2>Activity</h2>' +
      '<div class="seg" role="group" aria-label="What to chart"><button data-metric="tests" id="mTests">Tests taken</button><button data-metric="signups" id="mSignups">New students</button></div>' +
      '<div class="seg" role="group" aria-label="Time range"><button data-days="7" id="d7">7 days</button><button data-days="14" id="d14">14 days</button><button data-days="30" id="d30">30 days</button></div></div>' +
      '<div class="chart" id="chart"></div><p class="muted small" id="chartNote" style="margin-top:12px"></p></section>';

    var stat = function (val, label, ic, goId, note, warn) {
      return '<button class="stat" data-go="' + goId + '"><span class="ic">' + icon(ic) + '</span><b>' + num(val) + '</b><span>' + esc(label) + '</span>' + (note ? '<em' + (warn ? ' class="warn"' : '') + '>' + esc(note) + '</em>' : '') + '</button>';
    };
    var stats = '<div class="stats">' +
      stat(s.students, 'Students', 'users', 'students', newWeek ? '+' + newWeek + ' this week' : '') +
      stat(activeWeek, 'Active this week', 'activity', 'students', '') +
      stat(s.tests, 'Tests taken', 'chart', 'results', testsWeek ? '+' + testsWeek + ' this week' : '') +
      stat(s.questions, 'Questions', 'help', 'questions', '') +
      stat(s.courses, 'Courses', 'book', 'courses', '') +
      stat(s.materials, 'Materials', 'file', 'materials', '') +
      stat(s.posts, 'Discussion posts', 'chat', 'posts', '') +
      stat(s.tickets, 'Support tickets', 'life', 'support', openTickets && openTickets.length ? openTickets.length + ' open' : '', true) +
      stat(s.reviews, 'Reviews', 'star', 'reviews', s.reviews ? s.reviews + ' new' : '', true) + '</div>';

    var none = function (msg) { return '<div class="empty" style="padding:16px">' + msg + '</div>'; };
    var ticketsBody = !D.tickets ? none('Could not load tickets.')
      : openTickets.length ? openTickets.slice(0, 5).map(function (t) { return mini('data-go="support"', avatar(t.email || t.subject), t.subject || '(no subject)', t.email || '', ago(t.created_at)); }).join('')
      : none('No open tickets. You are all caught up.');
    var resBody = !D.results ? none('Could not load results.')
      : D.results.rows.length ? D.results.rows.slice(0, 6).map(function (r) { var n = studentNameFrom(studs, r.user_id); return mini('data-go="results"', avatar(n), n, r.course_title || r.course_code || 'Test', r.score + '/' + r.total_questions + '  ' + ago(r.created_at)); }).join('')
      : none('No tests taken yet.');
    var newStuds = studs ? studs.filter(function (x) { return x.joined; }).sort(function (a, b) { return new Date(b.joined) - new Date(a.joined); }).slice(0, 6) : [];
    var stuBody = !studs ? none('Could not load students.')
      : newStuds.length ? newStuds.map(function (x) { return mini('data-student="' + esc(x.id) + '"', avatar(x.name || x.email, isOnline(x)), x.name || x.email || 'Student', [x.department, x.level].filter(Boolean).join(', ') || x.email || '', ago(x.joined)); }).join('')
      : none('No students yet.');
    var postBody = !D.posts ? none('Could not load discussions.')
      : D.posts.rows.length ? D.posts.rows.slice(0, 5).map(function (p) { var n = studentNameFrom(studs, p.author_id); return mini('data-go="posts"', avatar(n), p.title, n, ago(p.created_at)); }).join('')
      : none('No discussion posts yet.');

    $('view').innerHTML = '<div class="dash-top">' + hero + chartCard + '</div>' + stats +
      '<div class="panels">' + panel('Open support tickets', 'support', ticketsBody) + panel('Latest test results', 'results', resBody) + panel('Newest students', 'students', stuBody) + panel('Recent discussions', 'posts', postBody) + '</div>';
    paintChart();
  }

  function paintChart() {
    var D = dash.data, el = $('chart'); if (!el || !D) return;
    ['mTests', 'mSignups'].forEach(function (id) { $(id).setAttribute('aria-pressed', String($(id).getAttribute('data-metric') === dash.metric)); });
    [7, 14, 30].forEach(function (n) { $('d' + n).setAttribute('aria-pressed', String(dash.days === n)); });
    var src = dash.metric === 'tests' ? (D.results ? D.results.rows.map(function (r) { return r.created_at; }) : null) : (D.students ? D.students.map(function (x) { return x.joined; }) : null);
    if (!src) { el.innerHTML = emptyHtml('This data could not be loaded.'); $('chartNote').textContent = ''; return; }
    var buckets = [], base = new Date(); base.setHours(0, 0, 0, 0);
    for (var i = dash.days - 1; i >= 0; i--) { var d = new Date(base); d.setDate(base.getDate() - i); buckets.push({ key: dayKey(d), date: d, v: 0 }); }
    var map = {}; buckets.forEach(function (b) { map[b.key] = b; });
    var inRange = 0;
    src.forEach(function (iso) { if (!iso) return; var b = map[dayKey(iso)]; if (b) { b.v++; inRange++; } });
    var max = Math.max(1, Math.max.apply(null, buckets.map(function (b) { return b.v; })));
    var step = dash.days > 14 ? 5 : dash.days > 7 ? 2 : 1;
    el.innerHTML = buckets.map(function (b, i) {
      var h = b.v ? Math.max(6, Math.round(b.v / max * 140)) : 3;
      var lbl = (i % step === 0 || i === buckets.length - 1) ? b.date.getDate() : '';
      var tip = b.date.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) + ': ' + b.v;
      return '<div class="col' + (i === buckets.length - 1 ? ' today' : '') + '" title="' + esc(tip) + '"><div class="bw">' + (dash.days <= 14 && b.v ? '<span class="val">' + b.v + '</span>' : '') + '<i class="' + (b.v ? '' : 'zero') + '" style="height:' + h + 'px"></i></div><em>' + lbl + '</em></div>';
    }).join('');
    var what = dash.metric === 'tests' ? 'tests taken' : 'new students';
    var trunc = dash.metric === 'tests' && D.results && D.results.rows.length < D.results.total;
    $('chartNote').textContent = num(inRange) + ' ' + what + ' in the last ' + dash.days + ' days.' + (trunc ? ' Based on the ' + num(D.results.rows.length) + ' most recent results loaded.' : '');
  }

  /* ---------- bulk question import ---------- */
  // Format: one question per block, blocks separated by a blank line.
  //   What is the capital of France?
  //   A. Berlin
  //   B. Paris
  //   C. Madrid
  //   D. Rome
  //   Answer: B
  //   Explanation: Paris has been the capital since ... (optional)
  //   Difficulty: easy (optional)
  function parseQuestions(text) {
    var blocks = String(text || '').replace(/\r/g, '').split(/\n\s*\n/), items = [], errors = [], n = 0;
    blocks.forEach(function (block) {
      var lines = block.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
      if (!lines.length) return;
      n++;
      var q = [], opts = [], ans = -1, expl = [], diff = '', zone = 'q';
      lines.forEach(function (line) {
        var m;
        if ((m = line.match(/^answer\s*[:\-]\s*\(?([A-Ha-h])\)?\b/i))) { ans = LETTERS.indexOf(m[1].toUpperCase()); zone = 'a'; return; }
        if ((m = line.match(/^explanation\s*[:\-]\s*(.*)$/i))) { expl = [m[1]]; zone = 'e'; return; }
        if ((m = line.match(/^difficulty\s*[:\-]\s*(\w+)/i))) { diff = m[1].toLowerCase(); zone = 'd'; return; }
        if ((m = line.match(/^([A-Ha-h])[.)]\s+(.*)$/)) && LETTERS[opts.length] === m[1].toUpperCase() && zone !== 'e') { opts.push(m[2].trim()); zone = 'o'; return; }
        if (zone === 'e') expl.push(line);
        else if (zone === 'o' && opts.length) opts[opts.length - 1] += ' ' + line;
        else if (zone === 'q') q.push(line);
      });
      if (q.length) q[0] = q[0].replace(/^\d+\s*[.)]\s*/, '');
      var question = q.join(' ').trim(), why = '';
      if (!question) why = 'no question text';
      else if (opts.length < 2) why = 'needs at least 2 options (A. B. ...)';
      else if (opts.some(function (o) { return !o; })) why = 'has an empty option';
      else if (ans < 0 || ans >= opts.length) why = 'missing or invalid "Answer: B" line';
      if (why) { errors.push('Question ' + n + ' ' + why + '.'); return; }
      items.push({ question: question, options: opts, correct_index: ans, explanation: expl.join(' ').trim(), difficulty: DIFFS.indexOf(diff) > -1 ? diff : '' });
    });
    return { items: items, errors: errors };
  }
