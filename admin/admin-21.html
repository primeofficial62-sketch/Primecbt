<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#101436">
  <title>PRIME-CBT Admin</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem('pc-theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script>
    // If anything goes wrong, show the reason on screen instead of a blank page.
    (function () {
      function show(msg, where) {
        var b = document.getElementById('boot'); if (!b) return;
        var l = document.getElementById('lock'); if (l) l.hidden = true;
        var sp = document.getElementById('splash'); if (sp) sp.hidden = true;
        b.hidden = false;
        b.innerHTML = '<div><b>The admin panel could not start.</b><br><code></code><br><button onclick="location.reload()">Reload</button></div>';
        b.querySelector('code').textContent = msg + (where ? '  (' + where + ')' : '');
      }
      window.addEventListener('error', function (e) { show(e.message || 'Unknown error', (e.filename || '').split('/').pop() + ':' + (e.lineno || '')); });
      window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.message) || String(e.reason || 'Unknown error')); });
    })();
  </script>
  <style>
    :root {
      --bg: #F1F3F9; --surface: #FFFFFF; --surface-2: #F6F7FC; --line: #E0E4F0; --line-2: #CBD1E6;
      --text: #11163A; --muted: #566086; --faint: #8790B0;
      --accent: #3350F2; --accent-2: #2339C9; --accent-soft: rgba(51,80,242,.10); --on-accent: #FFFFFF;
      --live: #0FA968; --live-soft: rgba(15,169,104,.13);
      --warn: #B86E00; --warn-soft: rgba(247,144,9,.15);
      --danger: #D93843; --danger-soft: rgba(217,56,67,.10);
      --side: #101436; --side-2: #1B2154; --side-text: #C3C9EC; --side-faint: #7F88BA;
      --shadow-lg: 0 24px 60px -20px rgba(8,10,40,.45);
      --r: 14px;
      --side-w: 268px;
      --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --display: 'Bricolage Grotesque', 'Manrope', system-ui, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0A0D1E; --surface: #131732; --surface-2: #1A1F42; --line: #272D58; --line-2: #363D70;
      --text: #EEF0FC; --muted: #A5ACD3; --faint: #7981AB;
      --accent: #8294FF; --accent-2: #9DAAFF; --accent-soft: rgba(130,148,255,.14); --on-accent: #0A0D1E;
      --live: #2DD48A; --live-soft: rgba(45,212,138,.14);
      --warn: #F5B544; --warn-soft: rgba(245,181,68,.14);
      --danger: #FF7A83; --danger-soft: rgba(255,122,131,.12);
      --side: #080A1A; --side-2: #151A3D; --side-text: #B3BAE3; --side-faint: #6F78A8;
      --shadow-lg: 0 24px 60px -20px rgba(0,0,0,.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45; min-height: 100dvh; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    h1, h2, h3 { font-family: var(--display); letter-spacing: -.01em; }

    /* ---------- PIN screen ---------- */
    .lock { min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--side); color: #fff; overflow-y: auto; }
    .lock-in { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; max-width: 340px; }
    .mark { width: 54px; height: 54px; border-radius: 16px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.3rem; margin-bottom: 8px; }
    .lock h1 { font-size: 1.45rem; font-weight: 700; text-align: center; }
    .lock .sub { color: #AAB1DA; font-size: .92rem; text-align: center; min-height: 1.4em; max-width: 280px; }
    .lock .sub.err { color: #FF9AA1; }
    .dots { display: flex; gap: 16px; margin: 22px 0 20px; }
    .dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); transition: background .12s, border-color .12s; }
    .dot.on { background: #fff; border-color: #fff; }
    .dots.shake { animation: shake .35s; }
    @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
    .pad { --k: clamp(58px, 19vw, 76px); display: grid; grid-template-columns: repeat(3, var(--k)); gap: clamp(10px, 2.2vh, 16px); }
    .pad button { width: var(--k); height: var(--k); border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: #fff; font-size: 1.5rem; font-weight: 500; transition: background .12s, transform .08s; }
    .pad button:hover { background: rgba(255,255,255,.14); }
    .pad button:active { background: rgba(255,255,255,.22); transform: scale(.94); }
    .pad .ghost { background: none; border-color: transparent; font-size: 1.15rem; color: #AAB1DA; }
    .pad button:disabled { opacity: .4; }
    @media (max-height: 600px) { .lock { place-items: start center; } .mark { width: 42px; height: 42px; } .dots { margin: 12px 0; } .pad { --k: 52px; gap: 8px; } }
    @media (prefers-reduced-motion: reduce) { .dots.shake { animation: none; } }

    .splash { min-height: 100dvh; display: grid; place-items: center; background: var(--side); }
    .splash .mark { margin: 0; }
    .boot { min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); font-size: .95rem; line-height: 1.6; }
    .boot b { color: var(--text); font-size: 1.05rem; }
    .boot code { display: inline-block; max-width: 100%; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); color: var(--danger); font-size: .82rem; overflow-wrap: anywhere; }
    .boot button { margin-top: 14px; padding: 10px 18px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 600; }

    .pinwrap { position: relative; display: block; margin: 20px 0 8px; padding: 22px 34px; border-radius: 18px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07); cursor: text; }
    .pinwrap:focus-within { border-color: #fff; }
    .pinwrap .dots { margin: 0; }
    .pinwrap input { position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; padding: 0; border: 0; border-radius: 18px; opacity: 0; background: transparent; color: transparent; caret-color: transparent; font-size: 16px; }
    .pinwrap input:focus { outline: none; }
    .lock .hint { color: #AAB1DA; font-size: .85rem; }

    /* ---------- shell ---------- */
    .shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100dvh; }
    .side { position: sticky; top: 0; height: 100dvh; background: var(--side); color: var(--side-text); overflow-y: auto; display: flex; flex-direction: column; padding: 18px 12px calc(18px + env(safe-area-inset-bottom)); z-index: 50; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 16px; color: #fff; }
    .brand .mark { width: 38px; height: 38px; border-radius: 11px; font-size: 1rem; margin: 0; }
    .brand b { display: block; font-family: var(--display); font-size: 1.05rem; line-height: 1.15; }
    .brand small { color: var(--side-faint); font-size: .76rem; }
    .nav-group { color: var(--side-faint); font-size: .76rem; font-weight: 600; padding: 16px 10px 6px; }
    .nav { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 10px 10px; border-radius: 10px; font-size: .93rem; font-weight: 500; color: var(--side-text); }
    .nav:hover { background: var(--side-2); color: #fff; }
    .nav.active { background: var(--side-2); color: #fff; font-weight: 600; }
    .nav.active::before { content: ""; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
    .side-foot { margin-top: auto; padding-top: 14px; }
    .scrim { position: fixed; inset: 0; background: rgba(6,8,28,.55); z-index: 45; opacity: 0; pointer-events: none; transition: opacity .2s; }

    .main { min-width: 0; display: flex; flex-direction: column; }
    .topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 8px clamp(12px, 3vw, 28px); padding-top: calc(8px + env(safe-area-inset-top)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .topbar h1 { flex: 1; min-width: 0; font-size: clamp(1.05rem, 2.4vw, 1.3rem); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .iconbtn { width: 40px; height: 40px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); display: inline-grid; place-items: center; flex: none; color: var(--text); }
    .iconbtn:hover { background: var(--surface-2); }
    #menuBtn { display: none; }
    .spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .live { display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px; border-radius: 99px; background: var(--live-soft); color: var(--live); font-size: .8rem; font-weight: 700; white-space: nowrap; }
    .live small { color: var(--muted); font-weight: 500; font-size: .76rem; }
    .live[data-s="sync"] { background: var(--accent-soft); color: var(--accent); }
    .live[data-s="off"] { background: var(--danger-soft); color: var(--danger); }
    .live[data-s="off"] .pulse, .live[data-s="sync"] .pulse { background: currentColor; }
    .live[data-s="off"] .pulse::after { display: none; }
    .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--live); position: relative; flex: none; }
    .pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit; animation: ping 1.9s ease-out infinite; }
    @keyframes ping { to { transform: scale(3.2); opacity: 0; } }
    .netbar { background: var(--danger-soft); color: var(--danger); font-size: .85rem; font-weight: 600; padding: 9px clamp(12px, 3vw, 28px); border-bottom: 1px solid var(--line); }

    .content { flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; padding: clamp(14px, 3vw, 28px); padding-bottom: calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; min-width: 0; }


    @media (max-width: 1023px) {
      .shell { grid-template-columns: minmax(0, 1fr); }
      .side { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); transform: translateX(-102%); transition: transform .22s; z-index: 50; }
      body.menu-open .side { transform: none; }
      body.menu-open .scrim { opacity: 1; pointer-events: auto; }
      #menuBtn { display: inline-grid; }
    }
    @media (min-width: 1024px) { .content { padding-bottom: 40px; } }
    @media (max-width: 560px) { .live small { display: none; } .live { padding: 8px; } .live b { display: none; } }

    /* ---------- controls ---------- */
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .bar .grow { flex: 1 1 auto; }
    input, select, textarea { width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; font-size: .94rem; min-height: 42px; }
    textarea { resize: vertical; line-height: 1.5; }
    input::placeholder, textarea::placeholder { color: var(--faint); }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
    select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
    .search { position: relative; flex: 1 1 220px; min-width: 0; }
    .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
    .search input { padding-left: 38px; }
    .bar select { flex: 0 1 180px; min-width: 0; }
    @media (max-width: 720px) { input, select, textarea { font-size: 16px; } .bar select { flex: 1 1 140px; } }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 14px; min-height: 42px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: .9rem; white-space: nowrap; }
    .btn:hover { background: var(--surface-2); }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
    .btn.primary:hover { background: var(--accent-2); }
    .btn.danger { color: var(--danger); }
    .btn.danger-solid { background: var(--danger); color: #fff; border-color: transparent; }
    .btn.small { min-height: 32px; padding: 5px 10px; font-size: .82rem; border-radius: 8px; }
    .btn:disabled { opacity: .5; pointer-events: none; }
    .btn svg.i { width: 17px; height: 17px; }

    .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
    .seg button { padding: 6px 11px; border-radius: 7px; font-size: .82rem; font-weight: 600; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(14px, 2.4vw, 20px); min-width: 0; }
    .card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .card-head h2, .h3 { font-size: 1.02rem; font-weight: 700; flex: 1; min-width: 0; }
    .link { color: var(--accent); font-weight: 600; font-size: .84rem; }
    .muted { color: var(--muted); }
    .small { font-size: .82rem; }

    .rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 10px; }
    .row { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; transition: border-color .15s; }
    .row.tap { cursor: pointer; }
    .row.tap:hover { border-color: var(--accent); }
    .row.fresh { animation: fresh 2.6s ease-out; }
    @keyframes fresh { from { background: var(--accent-soft); border-color: var(--accent); } }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-weight: 600; font-size: .95rem; overflow-wrap: anywhere; }
    .row-sub { color: var(--muted); font-size: .82rem; margin-top: 3px; overflow-wrap: anywhere; }
    .row-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; max-width: 50%; }
    @media (max-width: 460px) { .row.has-acts { flex-wrap: wrap; } .row.has-acts .row-actions { max-width: none; width: 100%; justify-content: flex-start; } }
    .tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: middle; }
    .tag.green { background: var(--live-soft); color: var(--live); }
    .tag.amber { background: var(--warn-soft); color: var(--warn); }
    .tag.red { background: var(--danger-soft); color: var(--danger); }
    .av { position: relative; width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: .8rem; flex: none; }
    .av.on::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--live); border: 2px solid var(--surface); }
    .empty { text-align: center; color: var(--muted); padding: 38px 14px; font-size: .92rem; grid-column: 1 / -1; }
    .empty .btn { margin-top: 12px; }
    .count { color: var(--muted); font-size: .82rem; }
    .more { text-align: center; }
    .loading { color: var(--muted); text-align: center; padding: 30px; font-size: .9rem; grid-column: 1 / -1; }
    .sk { border-radius: 10px; background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: sk 1.3s linear infinite; }
    @keyframes sk { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .sk, .pulse::after, .row.fresh, .spin svg { animation: none; } }

    /* ---------- dashboard ---------- */
    .dash-top { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 900px) { .dash-top { grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); } }
    .hero { background: var(--side); border-color: transparent; color: #fff; display: flex; flex-direction: column; gap: 6px; }
    [data-theme="dark"] .hero { background: var(--side-2); }
    .hero-head { display: flex; align-items: center; gap: 10px; font-weight: 600; color: #C9CFF0; }
    .hero .big { font-family: var(--display); font-weight: 800; font-size: clamp(3.4rem, 9vw, 5.2rem); line-height: 1; letter-spacing: -.03em; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .hero p { color: #AAB1DA; font-size: .88rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 11px 5px 5px; border-radius: 99px; background: rgba(255,255,255,.1); color: #fff; font-size: .82rem; font-weight: 600; max-width: 100%; }
    .chip:hover { background: rgba(255,255,255,.18); }
    .chip .av { width: 26px; height: 26px; font-size: .68rem; background: rgba(255,255,255,.18); color: #fff; }
    .chip span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
    .stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); }
    .stat { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; transition: border-color .15s; }
    .stat:hover { border-color: var(--accent); }
    .stat .ic { color: var(--accent); margin-bottom: 6px; }
    .stat b { font-family: var(--display); font-size: 1.8rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: .82rem; }
    .stat em { font-style: normal; color: var(--live); font-size: .76rem; font-weight: 600; margin-top: 2px; }
    .stat em.warn { color: var(--warn); }
    .chart { display: flex; align-items: flex-end; gap: clamp(2px, .8vw, 8px); height: 200px; }
    .col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; }
    .col .bw { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; }
    .col .val { font-size: .7rem; font-weight: 700; color: var(--muted); line-height: 1; font-variant-numeric: tabular-nums; }
    .col i { display: block; width: 100%; max-width: 34px; background: var(--accent); border-radius: 6px 6px 2px 2px; min-height: 3px; }
    .col i.zero { background: var(--line-2); }
    .col em { font-style: normal; font-size: .68rem; color: var(--faint); height: 1em; line-height: 1; white-space: nowrap; }
    .col.today em { color: var(--accent); font-weight: 700; }
    .panels { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
    .mini { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 9px 0; border-top: 1px solid var(--line); min-width: 0; }
    .mini:first-of-type { border-top: 0; padding-top: 0; }
    .mini .grow { flex: 1; min-width: 0; }
    .mini .t { font-weight: 600; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini .s { color: var(--muted); font-size: .78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini .r { color: var(--faint); font-size: .76rem; white-space: nowrap; }
    .mini:hover .t { color: var(--accent); }
    .summary { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 1fr)); }
    .summary div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
    .summary b { font-family: var(--display); font-size: 1.3rem; display: block; line-height: 1.2; }
    .summary span { color: var(--muted); font-size: .78rem; }

    /* ---------- forms and sheets ---------- */
    .layer { position: fixed; inset: 0; background: rgba(6,8,28,.58); z-index: 70; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
    @keyframes fade { from { opacity: 0; } }
    .sheet { width: 100%; max-width: 640px; max-height: 92dvh; background: var(--surface); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: up .2s ease-out; }
    @keyframes up { from { transform: translateY(24px); opacity: .6; } }
    @media (min-width: 720px) { .layer { align-items: center; padding: 24px; } .sheet { border-radius: 18px; max-height: 86dvh; } }
    @media (prefers-reduced-motion: reduce) { .sheet, .layer { animation: none; } }
    .sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .sheet-head h3 { flex: 1; font-size: 1.05rem; min-width: 0; overflow-wrap: anywhere; }
    .sheet-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .sheet-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; }
    .sheet-foot .btn { flex: 1 1 120px; }
    .dialog { width: min(92vw, 400px); background: var(--surface); border-radius: 18px; padding: 20px; box-shadow: var(--shadow-lg); margin: auto; animation: up .18s ease-out; }
    .layer.center { align-items: center; z-index: 80; }
    .dialog h3 { font-size: 1.1rem; margin-bottom: 8px; }
    .dialog p { color: var(--muted); font-size: .9rem; white-space: pre-line; }
    .dialog-foot { display: flex; gap: 10px; margin-top: 18px; }
    .dialog-foot .btn { flex: 1; }
    .fld label { display: block; font-size: .82rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .fld .hint { font-size: .78rem; color: var(--faint); margin-top: 5px; }
    .fld .ctr { float: right; font-weight: 500; color: var(--faint); }
    .check { display: flex; align-items: center; gap: 10px; }
    .check input { width: 20px; height: 20px; min-height: 0; accent-color: var(--accent); }
    .static { background: var(--surface-2); border: 1px dashed var(--line-2); border-radius: 10px; padding: 11px 12px; font-size: .92rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .mcq-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .mcq-row input[type=radio] { width: 22px; height: 22px; min-height: 0; flex: none; accent-color: var(--accent); }
    .mcq-row .letter { width: 18px; color: var(--muted); font-weight: 700; flex: none; }
    .kv { display: grid; grid-template-columns: minmax(80px, 110px) 1fr; gap: 8px 12px; font-size: .9rem; }
    .kv dt { color: var(--muted); }
    .kv dd { overflow-wrap: anywhere; }
    .split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 1024px) { .split { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .preview { border: 1px dashed var(--line-2); border-radius: 12px; padding: 12px 14px; background: var(--surface-2); }

    .pal-root { position: fixed; inset: 0; z-index: 90; display: flex; justify-content: center; align-items: flex-start; padding: 8vh 14px 14px; background: rgba(6,8,28,.55); }
    .pal { width: 100%; max-width: 560px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; }
    .pal input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 16px; font-size: 1rem; }
    .pal input:focus { outline: none; }
    .pal-list { max-height: 50dvh; overflow-y: auto; padding: 6px; }
    .pal-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px; border-radius: 10px; font-size: .92rem; }
    .pal-item small { margin-left: auto; color: var(--faint); }
    .pal-item.sel, .pal-item:hover { background: var(--accent-soft); color: var(--accent); }

    .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--side); color: #fff; padding: 11px 16px; border-radius: 12px; font-size: .9rem; font-weight: 500; z-index: 100; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: min(92vw, 460px); box-shadow: var(--shadow-lg); }
    .toast.show { opacity: 1; transform: translateX(-50%); }
    .toast.err { background: var(--danger); }

<body>

  <div class="boot" id="boot" role="status" hidden></div>

  <!-- PIN screen -->
  <div class="splash" id="splash"><div class="mark">P</div></div>

  <section class="lock" id="lock" hidden>
    <div class="lock-in">
      <div class="mark">P</div>
      <h1 id="lockTitle">PRIME-CBT Admin</h1>
      <p class="sub" id="lockSub"></p>
      <label class="pinwrap" for="pinIn">
        <div class="dots" id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        <input id="pinIn" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your 4-digit PIN">
      </label>
      <p class="hint">Tap the dots and type your PIN</p>
    </div>
  </section>

  <!-- Panel -->
  <div class="shell" id="app" hidden>
    <nav class="side" id="drawer" aria-label="Admin sections"></nav>
    <div class="main">
      <header class="topbar">
        <button class="iconbtn" id="menuBtn" aria-label="Open menu"></button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="live" id="live" data-s="live" title="Data refreshes automatically"><span class="pulse"></span><b id="liveTxt">Live</b><small id="liveSub"></small></div>
        <button class="iconbtn" id="refreshBtn" aria-label="Refresh now" title="Refresh now"></button>
        <button class="iconbtn" id="searchBtn" aria-label="Search and jump" title="Search (press /)"></button>
        <button class="iconbtn" id="themeBtn" aria-label="Switch light and dark theme" title="Switch theme"></button>
      </header>
      <div class="netbar" id="netbar" role="status" hidden>You are offline. Data will refresh as soon as the connection is back.</div>
      <main class="content" id="view"></main>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div id="sheetRoot"></div>
  <div id="dialogRoot"></div>
  <div id="palRoot"></div>
  <div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';
  // Where the server function lives. Keep '/api/admin' if the api folder is at the root of your Vercel project.
  var API_URL = '/api/admin';
  var ONLINE_MS = 5 * 60000;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var clip = function (s, n) { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
  var num = function (n) { return n == null || n === '' || isNaN(Number(n)) ? '–' : Number(n).toLocaleString(); };

  /* ---------- icons ---------- */
  var ICONS = {
    home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
    users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5a3.2 3.2 0 010 6M18 14.5c1.8.8 3 2.6 3 5.5"/>',
    life: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M5.6 5.6l3.9 3.9M14.5 14.5l3.9 3.9M18.4 5.6l-3.9 3.9M9.5 14.5l-3.9 3.9"/>',
    book: '<path d="M4 4.5A2.5 2.5 0 016.5 2H20v17H6.5A2.5 2.5 0 004 21.5z"/><path d="M4 21.5V4.5"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 115 .9c0 1.7-2.5 2-2.5 3.6M12 17h.01"/>',
    file: '<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
    award: '<circle cx="12" cy="9" r="6"/><path d="M8.5 14.5L7 21l5-3 5 3-1.5-6.5"/>',
    bell: '<path d="M6 16v-5a6 6 0 1112 0v5l1.5 2h-15z"/><path d="M10 21h4"/>',
    chat: '<path d="M21 12a8 8 0 01-11.5 7.2L3 21l1.8-5.5A8 8 0 1121 12z"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    school: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/>',
    layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
    stairs: '<path d="M3 20h5v-5h5v-5h5V5h3"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 118 0v3"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',
    refresh: '<path d="M20 11a8 8 0 00-14.5-4M4 4v4h4M4 13a8 8 0 0014.5 4M20 20v-4h-4"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    download: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
    upload: '<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
    more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
    activity: '<path d="M3 12h4l3-8 4 16 3-8h4"/>'
  };
  function icon(n, cls) { return '<svg class="i ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[n] || '') + '</svg>'; }

  /* ---------- helpers ---------- */
  function ago(iso) {
    if (!iso) return 'never';
    var t = new Date(iso).getTime();
    if (isNaN(t)) return '';
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 10) return 'just now';
    if (s < 60) return Math.floor(s) + 's ago';
    if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + ' h ago';
    if (s < 86400 * 30) return Math.floor(s / 86400) + ' d ago';
    return new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function fmtDate(iso) { return iso ? new Date(iso).toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; }
  function initials(name) {
    var p = String(name || '?').replace(/@.*/, '').trim().split(/[\s._-]+/).filter(Boolean);
    return ((p[0] || '?').charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : '')).toUpperCase();
  }
  function isOnline(s) { return s.last_seen && Date.now() - new Date(s.last_seen).getTime() < ONLINE_MS; }
  function dayKey(d) { d = new Date(d); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function isClosed(status) { return /resolv|clos/i.test(status || ''); }
  function download(name, text) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function toCsv(cols, rows) {
    var q = function (v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    return [cols.map(function (c) { return q(c[0]); }).join(',')].concat(rows.map(function (r) { return cols.map(function (c) { return q(c[1](r)); }).join(','); })).join('\n');
  }
  function emptyHtml(msg, retry) { return '<div class="empty">' + esc(msg) + (retry ? '<br><button class="btn" data-retry>Try again</button>' : '') + '</div>'; }

  var toastTimer;
  function toast(msg, isErr) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, isErr ? 4800 : 2600);
  }

  /* ---------- theme ---------- */
  function themeIcons() {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    $('themeBtn').innerHTML = icon(dark ? 'sun' : 'moon');
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', dark ? '#080A1A' : '#101436');
  }
  function toggleTheme() {
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('pc-theme', t); } catch (e) {}
    themeIcons();
  }

  /* ================= server calls ================= */
  var net = { ok: true };
  async function api(action, payload, timeoutMs) {
    var res, data = {}, ctrl = new AbortController(), timer = setTimeout(function () { ctrl.abort(); }, timeoutMs || 20000);
    try {
      res = await fetch(API_URL, {
        method: 'POST', credentials: 'same-origin', signal: ctrl.signal,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ action: action }, payload || {}))
      });
      try { data = await res.json(); } catch (e) { /* not JSON */ }
    } catch (e) {
      net.ok = false; updatePill();
      throw new Error(e && e.name === 'AbortError' ? 'The server took too long to respond. Check your connection and try again.' : 'No connection. Check your internet and try again.');
    } finally { clearTimeout(timer); }
    net.ok = true;
    if (res.status === 401 && action !== 'login') { showLock(); setMode('login'); }
    if (!res.ok) {
      var err = new Error(data.error || ('Request failed (' + res.status + ').'));
      err.status = res.status; err.data = data;
      throw err;
    }
    return data;
  }

  /* ================= live updates ================= */
  var live = { task: null, every: 0, last: 0, lastOk: 0, busy: false, failed: false };
  function setTask(fn, every) { live.task = fn; live.every = every || 0; live.last = Date.now(); live.lastOk = fn ? Date.now() : 0; live.failed = false; updatePill(); }
  async function runTask(manual) {
    if (!live.task || live.busy) return;
    live.busy = true; updatePill();
    if (manual) $('refreshBtn').classList.add('spin');
    try { await live.task(!manual); live.lastOk = Date.now(); live.failed = false; }
    catch (e) { live.failed = true; if (manual) toast(e.message, true); }
    live.last = Date.now(); live.busy = false;
    $('refreshBtn').classList.remove('spin');
    updatePill();
  }
  function layerOpen() { return !!($('sheetRoot').innerHTML || $('dialogRoot').innerHTML || $('palRoot').innerHTML); }
  function updatePill() {
    var el = $('live'); if (!el) return;
    var off = !navigator.onLine || !net.ok || live.failed, s = 'live', txt = 'Live', sub = '';
    if (off) { s = 'off'; txt = navigator.onLine ? 'Reconnecting' : 'Offline'; }
    else if (live.busy) { s = 'sync'; txt = 'Updating'; }
    else if (live.task && live.lastOk) sub = 'Updated ' + ago(new Date(live.lastOk).toISOString());
    el.setAttribute('data-s', s);
    $('liveTxt').textContent = txt; $('liveSub').textContent = sub;
    $('netbar').hidden = navigator.onLine;
  }
  setInterval(function () {
    updatePill();
    if (!live.task || $('app').hidden || document.hidden || !navigator.onLine || layerOpen() || live.busy) return;
    var every = live.failed ? Math.min(live.every, 8000) : live.every;
    if (Date.now() - live.last >= every) runTask(false);
  }, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && live.task && Date.now() - live.last > 4000) runTask(false); });
  window.addEventListener('online', function () { updatePill(); runTask(false); });
  window.addEventListener('offline', updatePill);

  /* ================= PIN screen ================= */
  var mode = 'login', pin = '', firstPin = '', pinBusy = false;
  var lockCopy = {
    login: ['Enter your PIN', 'PRIME-CBT admin'],
    create: ['Create your PIN', 'Choose 4 digits. You only do this once.'],
    confirm: ['Confirm your PIN', 'Enter the same 4 digits again.']
  };

  function drawDots() { var d = $('dots').children; for (var i = 0; i < 4; i++) d[i].classList.toggle('on', i < pin.length); }
  function setSub(text, isErr) { $('lockSub').textContent = text; $('lockSub').className = 'sub' + (isErr ? ' err' : ''); }
  function setMode(m, note, isErr) { mode = m; pin = ''; $('pinIn').value = ''; $('lockTitle').textContent = lockCopy[m][0]; setSub(note || lockCopy[m][1], isErr); drawDots(); }
  function shake() { var d = $('dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
  function hint(v) {
    try { if (v === undefined) return localStorage.getItem('pc-in') === '1'; if (v) localStorage.setItem('pc-in', '1'); else localStorage.removeItem('pc-in'); } catch (e) {}
    return false;
  }
  function showLock() {
    setTask(null);
    current = '';
    hint(false);
    $('splash').hidden = true;
    $('app').hidden = true; $('lock').hidden = false;
    document.body.classList.remove('menu-open');
    closeSheet(true); $('dialogRoot').innerHTML = ''; $('palRoot').innerHTML = '';
    setTimeout(function () { try { $('pinIn').focus(); } catch (e) {} }, 60);
  }

  var statusKnown = false, statusP = null, statusErr = '';
  function checkStatus() {
    statusP = (async function () {
      try {
        var s = await api('status');
        statusKnown = true; statusErr = '';
        if (s.authed) { enterApp(); return; }
        var want = s.setup ? 'login' : 'create';
        showLock();
        setMode(want);
      } catch (e) {
        statusKnown = false; statusErr = e.message;
        if ($('app').hidden) { $('splash').hidden = true; $('lock').hidden = false; setSub(e.message, true); }
        setTimeout(function () { if (!statusKnown && $('app').hidden) checkStatus(); }, 4000);
      }
    })();
    return statusP;
  }

  async function onPin() {
    if (pinBusy) return;
    var typed = $('pinIn').value.replace(/\D/g, '').slice(0, 4);
    $('pinIn').value = typed; pin = typed; drawDots();
    if (typed.length < 4) return;
    pinBusy = true;
    try {
      if (!statusKnown) {
        await (statusP || checkStatus());
        if (!$('app').hidden) return;
        if (!statusKnown) { shake(); setTimeout(function () { setMode('login', statusErr, true); }, 350); return; }
      }
      if (mode === 'create') { firstPin = typed; setMode('confirm'); return; }
      if (mode === 'confirm' && typed !== firstPin) {
        shake(); firstPin = '';
        setTimeout(function () { setMode('create', 'Those did not match. Choose your PIN again.', true); }, 350);
        return;
      }
      await api(mode === 'login' ? 'login' : 'setup', { pin: typed });
      enterApp();
    } catch (e) {
      shake();
      var again = mode;
      if (mode === 'confirm' && e.status === 409) again = 'login';
      setTimeout(function () { setMode(again === 'confirm' ? 'create' : again, e.message, true); }, 350);
    } finally { pinBusy = false; }
  }

  /* ================= data lookups ================= */
  var lookups = {};
  async function lookup(table, labelKey) {
    if (!lookups[table]) {
      var d = await api('list', { table: table, limit: 500 });
      lookups[table] = d.rows.map(function (r) { return [r.id, r[labelKey] || r.code || r.id]; });
    }
    return lookups[table];
  }
  var studentCache = null;
  async function getStudents(force) {
    if (!studentCache || force) studentCache = (await api('students')).students || [];
    return studentCache;
  }
  var courseName = function (id) { var m = (lookups.courses || []).filter(function (c) { return c[0] === id; })[0]; return m ? m[1] : ''; };
  var studentName = function (id) { var s = (studentCache || []).filter(function (x) { return x.id === id; })[0]; return s ? (s.name || s.email || 'Student') : 'Student'; };

  /* ================= sheets, dialogs, palette ================= */
  var sheetCleanup = null, lastFocus = null, dlgDone = null;
  function closeSheet(quiet) {
    $('sheetRoot').innerHTML = '';
    if (sheetCleanup) { sheetCleanup(); sheetCleanup = null; }
    if (!quiet && lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  }
  function openSheet(title, bodyHtml, footHtml) {
    if ($('sheetRoot').innerHTML) closeSheet(true); else lastFocus = document.activeElement;
    $('sheetRoot').innerHTML =
      '<div class="layer" id="sheetBack"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="sheet-head"><h3>' + esc(title) + '</h3><button class="iconbtn" id="sheetX" aria-label="Close">' + icon('x') + '</button></div>' +
      '<div class="sheet-body" id="sheetBody">' + bodyHtml + '</div>' +
      (footHtml ? '<div class="sheet-foot" id="sheetFoot">' + footHtml + '</div>' : '') + '</div></div>';
    $('sheetX').onclick = function () { closeSheet(); };
    $('sheetBack').addEventListener('mousedown', function (e) { if (e.target.id === 'sheetBack') closeSheet(); });
    var first = $('sheetBody').querySelector('input:not([type=radio]):not([type=checkbox]), textarea, select');
    if (first && window.innerWidth > 720) first.focus();
  }
  function confirmBox(o) {
    return new Promise(function (resolve) {
      var root = $('dialogRoot');
      root.innerHTML = '<div class="layer center" id="dlgBack"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">' + esc(o.title) + '</h3>' +
        (o.text ? '<p>' + esc(o.text) + '</p>' : '') +
        '<div class="dialog-foot"><button class="btn" id="dlgNo">Cancel</button><button class="btn ' + (o.danger ? 'danger-solid' : 'primary') + '" id="dlgYes">' + esc(o.yes || 'Confirm') + '</button></div></div></div>';

  function fieldHtml(f, row, optsMap) {

  function collect(fields) {
    var data = {};
    for (var i = 0; i < fields.length; i++) {
      var f = fields[i];
      if (f.type === 'static' || f.type === 'upload') continue;
      if (f.type === 'mcq') {
        var raw = $('f_options_raw');
        if (raw) {
          try { data.options = JSON.parse(raw.value); } catch (e) { throw new Error('The options are not valid JSON.'); }
          data.correct_index = Number($('f_correct_raw').value);
        } else {
          var ins = document.querySelectorAll('#mcqBox .mcq-in'), opts = [], chosen = -1;
          for (var j = 0; j < ins.length; j++) {
            var t = ins[j].value.trim();
            if (!t) throw new Error('Fill in or remove the empty option.');
            opts.push(t);
            if (ins[j].closest('.mcq-row').querySelector('input[type=radio]').checked) chosen = j;
          }
          if (opts.length < 2) throw new Error('Add at least 2 options.');
          if (chosen < 0) throw new Error('Tick the correct option.');
          data.options = opts; data.correct_index = chosen;
        }
        continue;
      }
      var el = $('f_' + f.key);
      if (!el) continue;
      var val = f.type === 'bool' ? el.checked : el.value.trim();

  /* ================= file upload ================= */
  var upBusy = false;
  async function uploadFile(file) {
    var d = await api('upload_url', { name: file.name, type: file.type });
    var fd = new FormData();
    fd.append('cacheControl', '3600');
    fd.append('', file);
    var res = await fetch(d.signedUrl, { method: 'PUT', body: fd });
    if (!res.ok) {
      var msg = '';
      try { msg = (await res.json()).message; } catch (e) { /* not JSON */ }
      throw new Error(msg || 'Upload failed (' + res.status + ').');
    }
    return d.publicUrl;
  }
  /* ---------- PDF autofill ---------- */
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  function setVal(id, v) {
    var el = $(id); if (!el || v === '' || v == null) return;
    el.value = v;
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
  async function autofillFromPdf(f) {
    if (!window.pdfjsLib) throw new Error('PDF reader did not load. Check your internet and reload');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
    setVal('f_page_count', pdf.numPages);
    setVal('f_size_bytes', f.size);
    setVal('f_material_type', 'PDF');
  }

  // Reads the text of a PDF that is already uploaded, so questions can be written from it.
  async function pdfTextFromUrl(url) {
    if (!window.pdfjsLib) throw new Error('PDF reader did not load. Reload the page');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var res = await fetch(url);
    if (!res.ok) throw new Error('Could not open the PDF (' + res.status + ')');
    var pdf = await pdfjsLib.getDocument({ data: await res.arrayBuffer() }).promise;
    var parts = [], len = 0;
    for (var p = 1; p <= pdf.numPages && len < 150000; p++) {
      var tc = await (await pdf.getPage(p)).getTextContent();
      var t = tc.items.map(function (it) { return it.str; }).join(' ');
      parts.push(t); len += t.length;
    }
    var text = parts.join('\n').replace(/\s+/g, ' ').trim();
    if (text.length < 200) throw new Error('This PDF has no readable text (it may be scanned images)');
    return text.slice(0, 150000);
  }

  function wireUpload() {
    var inp = $('f_upload'); if (!inp) return;
    inp.addEventListener('change', async function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var st = $('upStatus');
      if (f.size > 50 * 1024 * 1024) { st.textContent = 'That file is over 50 MB.'; inp.value = ''; return; }
      var ext = (f.name.split('.').pop() || '').toLowerCase();
      var isPdf = ext === 'pdf' || f.type === 'application/pdf';
      upBusy = true;

      // 1. Fill everything we can from the file itself, before any upload
      if ($('f_title') && !$('f_title').value.trim()) $('f_title').value = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
      setVal('f_size_bytes', f.size);
      if ($('f_material_type') && !$('f_material_type').value.trim()) {
        $('f_material_type').value = isPdf ? 'PDF' : /^(ppt|pptx)$/.test(ext) ? 'Slides' : /^(png|jpe?g|gif|webp|heic)$/.test(ext) ? 'Image' : 'Notes';
      }
      if (isPdf) {
        st.textContent = 'Reading PDF…';
        try { await autofillFromPdf(f); }
        catch (e) { console.error('PDF autofill failed', e); if ($('upStatus')) $('upStatus').textContent = 'Could not read the PDF (' + e.message + '). Uploading anyway…'; }
        if (!$('upStatus')) { upBusy = false; return; }
      }

      // 2. Then upload and fill the link
      st.textContent = 'Uploading ' + f.name + '…';
      try {
        var url = await uploadFile(f);
        if (!$('upStatus')) { upBusy = false; return; }
        $('f_file_url').value = url;
        $('upStatus').textContent = 'Uploaded: ' + f.name;
      } catch (e) {
        var hintMsg = /unknown action/i.test(e.message) ? ' Your server file api/admin.js has no "upload_url" action yet.' : '';
        if ($('upStatus')) $('upStatus').textContent = 'Fields filled, but the upload failed: ' + e.message + '.' + hintMsg;
        toast(e.message, true);
      }
      upBusy = false;
    });
  }

  async function openForm(sec, row, after) {
    var isEdit = !!row, optsMap = {};
    try {
      for (var i = 0; i < sec.fields.length; i++) {
        var f = sec.fields[i];
        if (f.type === 'select') {
          if (f.courseText) {
            var co = await courseOptions();

            if (row && row[f.key] && !co.some(function (o) { return o[0] === row[f.key]; })) co.push([row[f.key], row[f.key]]);
            optsMap[f.key] = co;
          } else optsMap[f.key] = f.lookup ? await lookup(f.lookup, f.lookupLabel) : (f.opts || []);
        }
      }

    var body = sec.fields.map(function (f) { return fieldHtml(f, row, optsMap); }).join('');

    openSheet((isEdit ? 'Edit ' : 'Add ') + sec.noun, body,
      '<button class="btn" id="fCancel">' + (editable ? 'Cancel' : 'Close') + '</button>' + (editable ? '<button class="btn primary" id="fSave">Save changes</button>' : ''));

    }
    if (!editable) return;
    $('fSave').onclick = async function () {
      var btn = $('fSave');

      try {
        var data = collect(sec.fields);

      $('lMore').innerHTML = st.rows.length < st.total ? '<button class="btn" id="lMoreBtn">Load more</button>' : '';
    }
    function filtersNow() { var f = {}; if (sec.filter && st.filter) f[sec.filter.key] = st.filter; return f; }
    var compact = function (v) { return normName(v).replace(/ /g, ''); };
    function matchRow(r) {
      if (!(sec.filter && st.filter)) return true;
      var v = r[sec.filter.key];
      if (sec.filter.courseText) {
        if (compact(v) === compact(st.filter)) return true;
        var c = filterCourses.filter(function (x) { return sameCourse(x, st.filter); })[0];
        return !!c && sameCourse(c, v);
      }
      return String(v) === String(st.filter);
    }
    // With a filter on, load everything and filter here, so it works even if the server ignores the filter.
    async function fetchRows(limit, offset) {
      if (!(sec.filter && st.filter)) return api('list', { table: sec.table, q: st.q, filters: filtersNow(), limit: limit, offset: offset });
      var d = await fetchAllRows(sec.table, { q: st.q, filters: sec.filter.courseText ? {} : filtersNow() });
      var rows = d.rows.filter(matchRow);
      return { rows: rows, total: rows.length };
    }
    async function load(reset) {
      if (st.busy) return;
      st.busy = true;
      if (reset) { st.offset = 0; st.rows = []; $('lRows').innerHTML = '<div class="loading">Loading…</div>'; }
      try {
        var d = await fetchRows(PAGE, st.offset);
        st.rows = st.rows.concat(d.rows); st.total = d.total; st.offset = st.rows.length;
        if (sec.prepare) await sec.prepare(d.rows);
        st.sig = JSON.stringify(st.rows) + '|' + st.total;
        paint();
      } catch (e) { $('lRows').innerHTML = emptyHtml(e.message, true); }
      st.busy = false;
    }
    async function refresh() {
      if (st.busy || (!st.rows.length && !st.sig)) return;
      st.busy = true;
      try {
        var n = Math.min(500, Math.max(PAGE, st.rows.length));
        var d = await fetchRows(n, 0);
        if (sec.prepare) await sec.prepare(d.rows);
        var sig = JSON.stringify(d.rows) + '|' + d.total;
        if (sig !== st.sig) {
          var old = {}, fresh = {};
          st.rows.forEach(function (r) { old[r.id] = 1; });
          d.rows.forEach(function (r) { if (!old[r.id]) fresh[r.id] = 1; });
          st.rows = d.rows; st.total = d.total; st.offset = d.rows.length; st.sig = sig;
          paint(fresh);
        }
      } finally { st.busy = false; }
    }
    var done = function () { load(true); };

    var timer;
    if ($('lq')) $('lq').addEventListener('input', function (e) { clearTimeout(timer); timer = setTimeout(function () { st.q = e.target.value.trim(); load(true); }, 300); });
    if ($('lf')) $('lf').addEventListener('change', function (e) { st.filter = e.target.value; load(true); });
    if ($('lAdd')) $('lAdd').onclick = function () { openForm(sec, null, done); };
    $('view').addEventListener('click', async function (e) {
      if (e.target.closest('[data-retry]')) { load(true); return; }
      if (e.target.closest('#lBack')) { $('pageTitle').textContent = sec.label; renderList(sec); return; }
      var ed = e.target.closest('[data-edit]');
      if (ed) { openForm(sec, st.rows[+ed.getAttribute('data-edit')], done); return; }
      var tool = e.target.closest('[data-tool]');
      if (tool) { sec.tools[+tool.getAttribute('data-tool')].run(done, st); return; }
      if (e.target.id === 'lMoreBtn') { load(false); return; }
      var del = e.target.closest('[data-del]');
      if (del) {
        var r = st.rows[+del.getAttribute('data-del')];
        var ok = await confirmBox({ title: 'Delete this ' + sec.noun + '?', text: 'This cannot be undone.' + (sec.delWarn ? '\n\n' + sec.delWarn : ''), yes: 'Delete', danger: true });
        if (!ok) return;
        try { await api('remove', { table: sec.table, id: r.id }); toast('Deleted'); load(true); } catch (err) { toast(err.message, true); }
        return;
      }
      var act = e.target.closest('[data-act]');
      if (act) { sec.actions[+act.getAttribute('data-act')].run(st.rows[+act.getAttribute('data-i')], done); return; }
      var rowEl = e.target.closest('.row.tap');
      if (rowEl) {
        var row = st.rows[+rowEl.getAttribute('data-i')];
        if (sec.view) sec.view(row, done); else if (sec.edit !== false) openForm(sec, row, done);
      }
    });
    await load(true);
    setTask(refresh, 30000);
  }

  async function renderDashboard() {
    $('view').innerHTML = skeletonDash();
    async function pull() {
      var stats = await api('stats');
      var rest = await Promise.all([
        getStudents(true).catch(function () { return null; }),
        api('list', { table: 'test_results', limit: 500 }).catch(function () { return null; }),
        api('list', { table: 'support_tickets', limit: 100 }).catch(function () { return null; }),
        api('list', { table: 'discussion_posts', limit: 30 }).catch(function () { return null; })
      ]);
      var byNew = function (a, b) { return new Date(b.created_at) - new Date(a.created_at); };
      dash.data = {
        stats: stats, students: rest[0],
        results: rest[1] ? { rows: rest[1].rows.slice().sort(byNew), total: rest[1].total } : null,
        tickets: rest[2] ? { rows: rest[2].rows.slice().sort(byNew), total: rest[2].total } : null,
        posts: rest[3] ? { rows: rest[3].rows.slice().sort(byNew), total: rest[3].total } : null
      };
      paintDash();
    }
    try { await pull(); } catch (e) { $('view').innerHTML = emptyHtml(e.message, true); }
    $('view').addEventListener('click', function (e) {
      if (e.target.closest('[data-retry]')) { go('dashboard'); return; }
      var m = e.target.closest('[data-metric]'), d = e.target.closest('[data-days]');
      if (m) { dash.metric = m.getAttribute('data-metric'); paintChart(); }

  function paintChart() {
    var D = dash.data, el = $('chart'); if (!el || !D) return;
    ['mTests', 'mSignups'].forEach(function (id) { $(id).setAttribute('aria-pressed', String($(id).getAttribute('data-metric') === dash.metric)); });

    var step = dash.days > 14 ? 5 : dash.days > 7 ? 2 : 1;

  /* ---------- bulk question import ---------- */
  // Format: one question per block, blocks separated by a blank line.
  //   What is the capital of France?
  //   A. Berlin
  //   B. Paris
  //   C. Madrid
  //   D. Rome
  //   Answer: B
  //   Explanation: Paris has been the capital since ... (optional)
  //   Difficulty: easy (optional)
  function parseQuestions(text) {
    var blocks = String(text || '').replace(/\r/g, '').split(/\n\s*\n/), items = [], errors = [], n = 0;
    blocks.forEach(function (block) {
      var lines = block.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
      if (!lines.length) return;
      n++;
      var q = [], opts = [], ans = -1, expl = [], diff = '', zone = 'q';
      lines.forEach(function (line) {
        var m;
        if ((m = line.match(/^answer\s*[:\-]\s*\(?([A-Ha-h])\)?\b/i))) { ans = LETTERS.indexOf(m[1].toUpperCase()); zone = 'a'; return; }
        if ((m = line.match(/^explanation\s*[:\-]\s*(.*)$/i))) { expl = [m[1]]; zone = 'e'; return; }
        if ((m = line.match(/^difficulty\s*[:\-]\s*(\w+)/i))) { diff = m[1].toLowerCase(); zone = 'd'; return; }
        if ((m = line.match(/^([A-Ha-h])[.)]\s+(.*)$/)) && LETTERS[opts.length] === m[1].toUpperCase() && zone !== 'e') { opts.push(m[2].trim()); zone = 'o'; return; }
        if (zone === 'e') expl.push(line);
        else if (zone === 'o' && opts.length) opts[opts.length - 1] += ' ' + line;
        else if (zone === 'q') q.push(line);
      });
      if (q.length) q[0] = q[0].replace(/^\d+\s*[.)]\s*/, '');
      var question = q.join(' ').trim(), why = '';
      if (!question) why = 'no question text';
      else if (opts.length < 2) why = 'needs at least 2 options (A. B. ...)';
      else if (opts.some(function (o) { return !o; })) why = 'has an empty option';
      else if (ans < 0 || ans >= opts.length) why = 'missing or invalid "Answer: B" line';
      if (why) { errors.push('Question ' + n + ' ' + why + '.'); return; }
      items.push({ question: question, options: opts, correct_index: ans, explanation: expl.join(' ').trim(), difficulty: DIFFS.indexOf(diff) > -1 ? diff : '' });
    });
    return { items: items, errors: errors };
  }

    var example = 'What is the capital of France?\nA. Berlin\nB. Paris\nC. Madrid\nD. Rome\nAnswer: B\nExplanation: Paris is the capital of France.\nDifficulty: easy\n\nWhich gas do plants absorb?\nA. Oxygen\nB. Nitrogen\nC. Carbon dioxide\nAnswer: C';
    openSheet('Bulk import questions',
      '<div class="fld"><label for="iCourse">Course *</label><select id="iCourse"><option value="">Choose…</option>' + courses.map(function (c) { return '<option value="' + esc(c[0]) + '">' + esc(c[1]) + '</option>'; }).join('') + '</select></div>' +
      '<div class="fld"><label for="iText">Questions *</label><textarea id="iText" rows="12" style="font-family:monospace;font-size:14px" placeholder="' + esc(example) + '"></textarea>' +
      '<div class="hint">One question per block, blocks separated by a blank line. Options start with A. B. C. and so on. Add an "Answer: B" line. "Explanation:" and "Difficulty: easy/medium/hard" are optional.</div></div>' +
      '<div class="fld"><label for="iFile">Or load a .txt file</label><input type="file" id="iFile" accept=".txt,text/plain"></div>' +
      '<div class="preview" id="iPrev" hidden></div>',
      '<button class="btn" id="iCancel">Cancel</button><button class="btn primary" id="iGo">Import</button>');
    $('iCancel').onclick = function () { closeSheet(); };

    function preview() {
      var r = parseQuestions($('iText').value), box = $('iPrev');
      box.hidden = !$('iText').value.trim();
      box.innerHTML = '<div class="row-title">' + r.items.length + (r.items.length === 1 ? ' question' : ' questions') + ' ready to import</div>' +
        (r.errors.length ? '<div class="row-sub" style="color:var(--danger)">' + r.errors.length + ' skipped:<br>' + r.errors.slice(0, 6).map(esc).join('<br>') + (r.errors.length > 6 ? '<br>and ' + (r.errors.length - 6) + ' more.' : '') + '</div>' : '');
      return r;
    }
    $('iText').addEventListener('input', preview);
    $('iFile').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () { $('iText').value = String(rd.result || ''); preview(); };
      rd.onerror = function () { toast('Could not read that file.', true); };
      rd.readAsText(f);
    });
    $('iGo').onclick = async function () {
      var course = $('iCourse').value;
      if (!course) { toast('Choose a course first.', true); return; }
      var r = preview();
      if (!r.items.length) { toast('No valid questions found. Check the format.', true); return; }
      var ok = await confirmBox({ title: 'Import ' + r.items.length + (r.items.length === 1 ? ' question?' : ' questions?'), text: r.errors.length ? r.errors.length + ' block(s) with problems will be skipped.' : '', yes: 'Import' });
      if (!ok) return;
      var btn = $('iGo'), saved = 0, failed = 0, lastErr = '';
      btn.disabled = true;
      for (var i = 0; i < r.items.length; i++) {
        btn.textContent = 'Importing ' + (i + 1) + ' of ' + r.items.length + '…';
        try {
          var it = r.items[i];
          await api('save', { table: 'questions', data: { course_id: course, question: it.question, options: it.options, correct_index: it.correct_index, explanation: it.explanation, difficulty: it.difficulty } });
          saved++;
        } catch (e) { failed++; lastErr = e.message; if (e.status === 401) break; }
      }
      if (!$('iGo')) return;
      if (failed) { btn.disabled = false; btn.textContent = 'Import'; toast(saved + ' imported, ' + failed + ' failed. ' + lastErr, true); if (saved && done) done(); return; }
      closeSheet(true);
      toast('Imported ' + saved + (saved === 1 ? ' question' : ' questions'));
      if (done) done();
    };
  }

  /* ================= questions from PDFs ================= */
  var AUTO_GENERATE = true;     // true = make questions automatically right after a PDF is uploaded. Set false to stop that.
  var QUESTIONS_PER_PDF = 20;   // questions requested from each PDF (5 to 40)
  var genBusy = false;

  function normName(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
  function isPdfMaterial(m) { return /\.pdf(\?|#|$)/i.test(m.file_url || '') || /pdf/i.test(m.material_type || ''); }
  function sameCourse(c, text) {
    var t = normName(text), title = normName(c.title), code = normName(c.code);
    if (!t) return false;
    return t === title || (code && t === code) || (code.length >= 3 && (' ' + t + ' ').indexOf(' ' + code + ' ') > -1);
  }
  async function allCourses() { return (await api('list', { table: 'courses', limit: 500 })).rows; }
  async function allMaterials() { return (await api('list', { table: 'materials', limit: 500 })).rows; }
  function noCourseMsg(text) { return 'No course matches "' + (text || '') + '". Set the material\'s Course to the exact course title or code.'; }

  async function generateForCourse(course) {
    try {
      var mats = (await allMaterials()).filter(function (m) { return isPdfMaterial(m) && sameCourse(course, m.course); });
      if (!mats.length) { toast('No PDFs found for this course. Set each PDF material\'s Course to "' + (course.code || course.title) + '".', true); return; }
      runGeneration(course, mats);
    } catch (e) { toast(e.message, true); }
  }
  async function generateForMaterialRow(m) {
    try {
      if (!isPdfMaterial(m)) { toast('This material is not a PDF.', true); return; }
      var course = (await allCourses()).filter(function (c) { return sameCourse(c, m.course); })[0];
      if (!course) { toast(noCourseMsg(m.course), true); return; }
      runGeneration(course, [m]);
    } catch (e) { toast(e.message, true); }
  }
  async function autoGenerateForUpload(d) {
    try {
      if (!isPdfMaterial(d)) return;
      var course = (await allCourses()).filter(function (c) { return sameCourse(c, d.course); })[0];
      if (!course) { toast('PDF saved, but no questions made. ' + noCourseMsg(d.course), true); return; }
      var rows = [];
      try { rows = (await api('list', { table: 'materials', filters: { file_url: d.file_url }, limit: 1 })).rows; } catch (e) { /* fall back below */ }
      if (!rows.length) rows = (await allMaterials()).filter(function (x) { return x.file_url === d.file_url; });
      if (!rows.length) { toast('PDF saved. Use "Make questions" on it to create questions.', true); return; }
      runGeneration(course, [rows[0]]);
    } catch (e) { toast(e.message, true); }
  }

  async function runGeneration(course, mats) {
    if (genBusy) { toast('Questions are already being made. Please wait.', true); return; }
    genBusy = true;
    openSheet('Questions from PDFs: ' + (course.title || course.code),
      '<div class="count">Questions are written only from the PDFs of this course. Each one must quote a passage that really exists in the PDF, or it is thrown away.</div><div class="stack" id="genLog"></div>',
      '<button class="btn primary" id="genClose" disabled>Working…</button>');
    $('genLog').innerHTML = mats.map(function (m, i) {
      return '<div class="row"><div class="row-main"><div class="row-title">' + esc(m.title) + '</div><div class="row-sub" id="g_' + i + '">Waiting…</div></div></div>';
    }).join('');
    var say = function (i, text) { var el = $('g_' + i); if (el) el.textContent = text; };
    var total = 0, failed = 0;
    for (var i = 0; i < mats.length; i++) {
      try {
        say(i, 'Reading the PDF…');
        var pdfText = await pdfTextFromUrl(mats[i].file_url);
        say(i, 'Writing questions. This can take up to a minute…');
        var r = await api('generate_questions', { material_id: mats[i].id, course_id: course.id, count: QUESTIONS_PER_PDF, text: pdfText }, 120000);
        total += r.saved;
        say(i, r.saved + (r.saved === 1 ? ' question added' : ' questions added') + (r.rejected ? '. ' + r.rejected + ' rejected (not backed by the PDF)' : '') + (r.duplicates ? '. ' + r.duplicates + ' already existed' : '') + '.');
      } catch (e) {
        failed++; say(i, 'Failed: ' + e.message);
        if (e.status === 401) break;
      }
    }
    genBusy = false;
    var btn = $('genClose');
    if (btn) {
      btn.disabled = false; btn.textContent = 'Done';
      btn.onclick = function () { closeSheet(); if (current === 'questions') go('questions'); };
    }
    toast(total + (total === 1 ? ' question' : ' questions') + ' added' + (failed ? ', ' + failed + ' PDF(s) failed' : ''), !!failed && !total);
  }

  /* ================= navigation ================= */
  var current = '';

  function buildNav() {
    var h = '<div class="brand"><div class="mark">P</div><div><b>PRIME-CBT</b><small>Admin panel</small></div></div>', group = '';
    SECTIONS.forEach(function (s) {
      if (s.group !== group) { group = s.group; h += '<div class="nav-group">' + esc(group) + '</div>'; }
      h += '<button class="nav" data-go="' + s.id + '" data-nav="' + s.id + '">' + icon(s.icon) + '<span>' + esc(s.label) + '</span></button>';
    });
    h += '<div class="side-foot"><button class="nav" id="navLock">' + icon('lock') + '<span>Lock panel</span></button></div>';
    $('drawer').innerHTML = h;
    $('navLock').onclick = lockNow;

  }

  function markActive() {
    document.querySelectorAll('[data-nav]').forEach(function (el) { el.classList.toggle('active', el.getAttribute('data-nav') === current); });
  }

  async function go(id) {
    var sec = SECTIONS.filter(function (s) { return s.id === id; })[0];
    if (!sec) return;
    current = id;
    try { localStorage.setItem('pc-section', id); } catch (e) {}
    setTask(null);
    closeSheet(true);
    if (dlgDone) dlgDone(false);
    $('dialogRoot').innerHTML = ''; $('palRoot').innerHTML = '';
    document.body.classList.remove('menu-open');
    // Swap the content node so listeners from the previous section are dropped.
    var old = $('view'), fresh = old.cloneNode(false);
    old.parentNode.replaceChild(fresh, old);
    $('pageTitle').textContent = sec.label;
    markActive();
    window.scrollTo(0, 0);
    try {
      if (sec.kind === 'dashboard') await renderDashboard();
      else if (sec.kind === 'students') await renderStudents();
      else if (sec.kind === 'notifications') await renderNotifications();
      else if (sec.kind === 'security') renderSecurity();
      else await renderList(sec);
    } catch (e) {
      if (current === id) $('view').innerHTML = emptyHtml(e.message || 'Something went wrong.', true);
    }
  }

  function enterApp() {
    if (!$('app').hidden) return;
    hint(true);
    $('splash').hidden = true;
    $('lock').hidden = true; $('app').hidden = false;
    buildNav();
    var saved = '', y = 0;
    try { saved = localStorage.getItem('pc-section') || ''; y = +sessionStorage.getItem('pc-scroll') || 0; } catch (e) {}
    if (!SECTIONS.some(function (s) { return s.id === saved; })) saved = 'dashboard';
    go(saved).then(function () { if (y) window.scrollTo(0, y); });
  }

  async function lockNow() {
    try { await api('logout'); } catch (e) { /* locking locally anyway */ }
    lookups = {}; studentCache = null;
    showLock();
    setMode('login');
  }

  /* ================= start ================= */
  function init() {
    $('menuBtn').innerHTML = icon('menu');
    $('refreshBtn').innerHTML = icon('refresh');
    $('searchBtn').innerHTML = icon('search');
    themeIcons();

    $('menuBtn').onclick = function () { document.body.classList.toggle('menu-open'); };
    $('scrim').onclick = function () { document.body.classList.remove('menu-open'); };
    $('refreshBtn').onclick = function () { runTask(true); };
    $('searchBtn').onclick = openPalette;
    $('themeBtn').onclick = toggleTheme;

    // One delegated handler for every "go to section" and "open student" button.
    document.addEventListener('click', function (e) {
      var g = e.target.closest('[data-go]');
      if (g) { go(g.getAttribute('data-go')); return; }
      var s = e.target.closest('[data-student]');
      if (s) {
        var id = s.getAttribute('data-student');
        var found = (studentCache || []).filter(function (x) { return x.id === id; })[0];
        if (found) showStudent(found);
      }
    });

    var scrollT;
    window.addEventListener('scroll', function () {
      clearTimeout(scrollT);
      scrollT = setTimeout(function () { try { sessionStorage.setItem('pc-scroll', String(window.scrollY)); } catch (e) {} }, 150);
    }, { passive: true });

    $('pinIn').addEventListener('input', onPin);
    setMode('login');
    if (hint()) enterApp();   // was signed in: go straight to the panel, no PIN flash
    checkStatus();
    setTimeout(function () { try { $('pinIn').focus(); } catch (e) {} }, 60);
  }

  init();
})();
</script>
</body>
</html>
