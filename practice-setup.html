<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>PRIME-CBT — Practice Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b1a;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --muted-light: #cbd5e1;
      --muted-dark: #64748b;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --teal: #2dd4bf;
      --red: #f87171;
      --font-display: 'Lora', serif;
      --font-body: 'Inter', sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Shell: top bar / scrolling content / bottom button ===== */
    .app {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      border-left: 1px solid rgba(51, 65, 85, 0.5);
      border-right: 1px solid rgba(51, 65, 85, 0.5);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s var(--ease), visibility 0s linear 0.35s;
    }
    .app.ready { opacity: 1; visibility: visible; transition: opacity 0.35s var(--ease), visibility 0s linear 0s; }

    .topbar {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 20px 12px;
      padding-top: max(14px, env(safe-area-inset-top));
      flex-shrink: 0;
      background: rgba(6, 11, 26, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 30;
    }
    .back-btn {
      width: 40px; height: 40px; flex-shrink: 0;
      border-radius: 11px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted-light); cursor: pointer;
      transition: background 0.25s var(--ease), color 0.25s var(--ease), transform 0.2s var(--ease);
    }
    .back-btn:active { transform: scale(0.94); }
    .back-btn svg { width: 18px; height: 18px; }
    .topbar-title { min-width: 0; }
    .topbar-title h1 { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
    .topbar-title p { font-size: 12.5px; color: var(--muted); margin-top: 1px; }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px 24px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }
    .content-inner { display: flex; flex-direction: column; gap: 22px; }

    .footer {
      flex-shrink: 0;
      padding: 14px 20px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 80%, rgba(6, 11, 26, 0));
      z-index: 30;
    }

    /* ===== Fade helper (smooth text/section changes) ===== */
    .fade { animation: fadeIn 0.3s var(--ease) both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== Topic card ===== */
    .topic-card {
      display: flex; align-items: center; gap: 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .topic-icon {
      width: 42px; height: 42px; flex-shrink: 0; border-radius: 12px;
      background: rgba(16, 185, 129, 0.15); color: var(--emerald-bright);
      display: flex; align-items: center; justify-content: center;
    }
    .topic-icon svg { width: 21px; height: 21px; }
    .topic-info { flex: 1; min-width: 0; }
    .topic-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .topic-name { font-size: 15px; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
    .topic-change {
      font-size: 12.5px; font-weight: 600; color: var(--emerald-bright);
      text-decoration: none; padding: 8px 10px; border-radius: 8px; flex-shrink: 0;
      transition: background 0.25s var(--ease);
    }
    .topic-card.missing { border-style: dashed; }
    .topic-card.missing .topic-icon { background: rgba(251, 191, 36, 0.12); color: #fbbf24; }

    .live-pill {
      display: none; align-items: center; gap: 8px; align-self: flex-start;
      font-size: 12px; font-weight: 600; color: var(--muted);
      background: var(--surface); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 999px;
    }
    .live-pill i {
      width: 8px; height: 8px; border-radius: 50%; background: var(--emerald-bright);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5); }
      70%  { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    /* ===== Sections ===== */
    .section-label {
      font-size: 12px; font-weight: 600; color: var(--muted);
      margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em;
    }

    .options-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 10px; }
    .option-chip {
      padding: 12px 8px; border-radius: 12px;
      background: var(--surface); border: 1.5px solid var(--border);
      color: var(--muted-light); font: inherit; font-size: 13.5px; font-weight: 600;
      cursor: pointer; user-select: none;
      transition: background 0.25s var(--ease), border-color 0.25s var(--ease),
                  color 0.25s var(--ease), box-shadow 0.25s var(--ease), transform 0.15s var(--ease);
    }
    .option-chip:active { transform: scale(0.96); }
    .option-chip.active {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(45, 212, 191, 0.12));
      border-color: var(--emerald); color: var(--emerald-bright);
      box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.2);
    }

    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mode-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid var(--border);
      border-radius: 16px; padding: 16px 12px;
      text-align: center; cursor: pointer; font: inherit; color: inherit;
      transition: background 0.28s var(--ease), border-color 0.28s var(--ease),
                  box-shadow 0.28s var(--ease), transform 0.2s var(--ease);
    }
    .mode-card:active { transform: scale(0.98); }
    .mode-card.active {
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.12), rgba(15, 23, 42, 0.8));
      border-color: var(--emerald);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.15);
    }
    .mode-icon {
      width: 42px; height: 42px; border-radius: 12px;
      background: rgba(16, 185, 129, 0.12); color: var(--emerald-bright);
      display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;
      transition: transform 0.3s var(--ease), background 0.3s var(--ease);
    }
    .mode-card.active .mode-icon { background: rgba(16, 185, 129, 0.22); transform: scale(1.08); }
    .mode-icon svg { width: 21px; height: 21px; }
    .mode-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .mode-desc { font-size: 11.5px; color: var(--muted); line-height: 1.35; }

    .toggle-row {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px 18px;
    }
    .toggle-info h3 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .toggle-info p { font-size: 12px; color: var(--muted); }
    .toggle {
      position: relative; width: 48px; height: 26px; flex-shrink: 0;
      background: var(--border); border: none; border-radius: 999px; cursor: pointer;
      transition: background 0.25s var(--ease);
    }
    .toggle.active { background: var(--emerald); }
    .toggle-thumb {
      position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
      background: #fff; border-radius: 50%;
      transition: transform 0.25s var(--ease);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
    }
    .toggle.active .toggle-thumb { transform: translateX(22px); }

    /* ===== Live summary ===== */
    .summary {
      background: rgba(16, 185, 129, 0.06);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 16px; padding: 14px 18px;
    }
    .summary-label { font-size: 11px; font-weight: 600; color: var(--emerald-bright); text-transform: uppercase; letter-spacing: 0.05em; }
    .summary-text { font-size: 14px; font-weight: 500; color: var(--text); margin-top: 4px; line-height: 1.5; }

    /* ===== Start button ===== */
    .start-btn {
      width: 100%; height: 50px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #022c22; font: inherit; font-size: 15px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; box-shadow: 0 6px 24px rgba(16, 185, 129, 0.3);
      transition: transform 0.2s var(--ease), box-shadow 0.25s var(--ease), opacity 0.25s var(--ease);
    }
    .start-btn:active { transform: scale(0.98); }
    .start-btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
    .start-btn svg { width: 17px; height: 17px; transition: transform 0.25s var(--ease); }

    /* ===== Toast ===== */
    .toast {
      position: absolute; left: 16px; right: 16px; bottom: 90px; z-index: 60; text-align: center;
      background: var(--surface); border: 1px solid var(--red);
      color: var(--text); font-size: 13px; font-weight: 600;
      padding: 12px 16px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      opacity: 0; transform: translateY(12px); pointer-events: none;
      transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ===== Focus (keyboard) ===== */
    .option-chip:focus-visible, .mode-card:focus-visible, .toggle:focus-visible,
    .back-btn:focus-visible, .start-btn:focus-visible, .topic-change:focus-visible {
      outline: 2px solid var(--emerald-bright); outline-offset: 2px;
    }

    /* ===== Hover only on devices that can hover ===== */
    @media (hover: hover) {
      .back-btn:hover { background: rgba(30, 41, 59, 0.95); color: var(--text); transform: translateX(-2px); }
      .option-chip:not(.active):hover { border-color: rgba(16, 185, 129, 0.4); color: var(--text); }
      .mode-card:not(.active):hover { transform: translateY(-2px); border-color: rgba(16, 185, 129, 0.35); }
      .topic-change:hover { background: rgba(16, 185, 129, 0.1); }
      .start-btn:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(16, 185, 129, 0.4); }
      .start-btn:not(:disabled):hover svg { transform: translateX(4px); }
    }

    /* ===== Responsive ===== */
    @media (max-width: 360px) {
      .topbar { padding-left: 12px; padding-right: 12px; gap: 10px; }
      .content { padding-left: 14px; padding-right: 14px; }
      .footer { padding-left: 14px; padding-right: 14px; }
      .options-row { grid-template-columns: repeat(2, 1fr); }
      .mode-card { padding: 14px 8px; }
      .toggle-row { padding: 12px 14px; }
    }

    @media (min-width: 600px) {
      .app { max-width: 640px; }
      .content { padding: 28px 32px 28px; }
      .footer { padding: 16px 32px; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
      .topbar { padding-left: 28px; padding-right: 28px; }
      .content-inner { gap: 26px; }
    }

    @media (min-width: 1024px) {
      .app { max-width: 720px; }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .topbar { padding-top: 8px; padding-bottom: 8px; }
      .footer { padding-top: 8px; padding-bottom: 8px; }
      .content { padding-top: 12px; }
      .start-btn { height: 44px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app" id="appRoot">

    <!-- Top Bar -->
    <div class="topbar">
      <button type="button" class="back-btn" id="backBtn" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="topbar-title">
        <h1>Set up practice</h1>
        <p>Customize your session</p>
      </div>
    </div>

    <!-- Content -->
    <div class="content">
      <div class="content-inner">

        <!-- Topic (comes from the page you picked it on) -->
        <div class="topic-card" id="topicCard">
          <div class="topic-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
            </svg>
          </div>
          <div class="topic-info">
            <div class="topic-label">Topic</div>
            <div class="topic-name" id="topicName"></div>
          </div>
          <a href="practice.html" class="topic-change" id="topicChange">Change</a>
        </div>

        <!-- Live: other students on this topic (Supabase Presence) -->
        <div class="live-pill" id="livePill"><i></i><span id="liveText"></span></div>

        <!-- Number of Questions -->
        <div>
          <div class="section-label">Number of Questions</div>
          <div class="options-row" id="questionCount">
            <button type="button" class="option-chip" data-value="10" aria-pressed="false">10</button>
            <button type="button" class="option-chip" data-value="20" aria-pressed="false">20</button>
            <button type="button" class="option-chip" data-value="30" aria-pressed="false">30</button>
            <button type="button" class="option-chip" data-value="50" aria-pressed="false">50</button>
          </div>
        </div>

        <!-- Difficulty -->
        <div>
          <div class="section-label">Difficulty</div>
          <div class="options-row" id="difficulty">
            <button type="button" class="option-chip" data-value="easy" aria-pressed="false">Easy</button>
            <button type="button" class="option-chip" data-value="medium" aria-pressed="false">Medium</button>
            <button type="button" class="option-chip" data-value="hard" aria-pressed="false">Hard</button>
            <button type="button" class="option-chip" data-value="mixed" aria-pressed="false">Mixed</button>
          </div>
        </div>

        <!-- Mode -->
        <div>
          <div class="section-label">Mode</div>
          <div class="mode-grid" id="modeSelect" role="radiogroup" aria-label="Mode">
            <button type="button" class="mode-card" data-value="practice" role="radio" aria-checked="false">
              <div class="mode-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 20h9"/>
                  <path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
                </svg>
              </div>
              <div class="mode-title">Practice</div>
              <div class="mode-desc">See answers instantly</div>
            </button>
            <button type="button" class="mode-card" data-value="timed" role="radio" aria-checked="false">
              <div class="mode-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M12 6v6l4 2"/>
                </svg>
              </div>
              <div class="mode-title">Timed</div>
              <div class="mode-desc">Race against time</div>
            </button>
          </div>
        </div>

        <!-- Randomize Toggle -->
        <div class="toggle-row">
          <div class="toggle-info">
            <h3>Randomize Questions</h3>
            <p>Shuffle the order of questions</p>
          </div>
          <button type="button" class="toggle" id="randomizeToggle" role="switch" aria-checked="false" aria-label="Randomize questions">
            <span class="toggle-thumb"></span>
          </button>
        </div>

        <!-- Live summary of the choices above -->
        <div class="summary" id="summary">
          <div class="summary-label">Your session</div>
          <div class="summary-text" id="summaryText"></div>
        </div>

      </div>
    </div>

    <!-- Bottom CTA -->
    <div class="footer">
      <button type="button" class="start-btn" id="startBtn" disabled>
        <span id="startLabel">Start Practice</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="profile-gate.js"></script>
  <script>
    // ========== SUPABASE CLIENT ==========
    const SUPABASE_URL = "https://xuofkjjhupgmrphzgyun.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GThKt7BvR1D81U939_EQkw_yCnTQ3xh";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener('DOMContentLoaded', () => {
      const $ = (id) => document.getElementById(id);

      const countGroup = $('questionCount');
      const diffGroup = $('difficulty');
      const modeGroup = $('modeSelect');
      const toggle = $('randomizeToggle');
      const startBtn = $('startBtn');

      const DIFF_LABEL = { easy: 'Easy', medium: 'Medium', hard: 'Hard', mixed: 'Mixed difficulty' };
      const MODE_LABEL = { practice: 'Practice mode', timed: 'Timed mode' };
      const DEFAULTS = { count: '10', difficulty: 'medium', mode: 'practice', randomize: true };

      const topic = (new URLSearchParams(window.location.search).get('topic') || '').trim();
      let user = null;

      // ----- Toast -----
      let toastTimer = null;
      function toast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
      }

      // ----- Reading / setting the choices -----
      const chipValue = (group) => { const el = group.querySelector('.active'); return el ? el.dataset.value : null; };
      const isRandom = () => toggle.classList.contains('active');

      function setActive(group, value) {
        let found = false;
        group.querySelectorAll('[data-value]').forEach((el) => {
          const on = el.dataset.value === String(value);
          if (on) found = true;
          el.classList.toggle('active', on);
          if (el.hasAttribute('aria-pressed')) el.setAttribute('aria-pressed', on);
          if (el.hasAttribute('aria-checked')) el.setAttribute('aria-checked', on);
        });
        return found;
      }
      function setRandom(on) {
        toggle.classList.toggle('active', !!on);
        toggle.setAttribute('aria-checked', !!on);
      }

      // ----- Live summary -----
      let lastSummary = '';
      function renderSummary() {
        const count = chipValue(countGroup);
        const diff = chipValue(diffGroup);
        const mode = chipValue(modeGroup);
        const text = count + ' questions · ' + DIFF_LABEL[diff] + ' · ' + MODE_LABEL[mode] + ' · ' +
                     (isRandom() ? 'Shuffled order' : 'Original order');
        const el = $('summaryText');
        if (text !== lastSummary) {
          lastSummary = text;
          el.textContent = text;
          el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade');
        }
        $('startLabel').textContent = mode === 'timed' ? 'Start Timed Practice' : 'Start Practice';
      }

      function bind(group) {
        group.querySelectorAll('[data-value]').forEach((el) => {
          el.addEventListener('click', () => { setActive(group, el.dataset.value); renderSummary(); });
        });
      }
      bind(countGroup);
      bind(diffGroup);
      bind(modeGroup);
      toggle.addEventListener('click', () => { setRandom(!isRandom()); renderSummary(); });

      // ----- Back -----
      $('backBtn').addEventListener('click', () => {
        if (window.history.length > 1) window.history.back();
        else window.location.href = 'practice.html';
      });

      // ----- Remembered choices (per account, on this device) -----
      const prefsKey = () => 'pcbt_practice_prefs_' + user.id;
      function loadPrefs() {
        try { return JSON.parse(localStorage.getItem(prefsKey())) || {}; } catch (e) { return {}; }
      }
      function savePrefs(p) {
        try { localStorage.setItem(prefsKey(), JSON.stringify(p)); } catch (e) {}
      }

      // ----- Students on this topic right now (Supabase Realtime Presence) -----
      function initPresence() {
        if (!topic) return;
        try {
          const slug = topic.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
          const ch = supabaseClient.channel('practice-' + slug, { config: { presence: { key: user.id } } });
          ch.on('presence', { event: 'sync' }, () => {
            const others = Math.max(0, Object.keys(ch.presenceState()).length - 1);
            const pill = $('livePill');
            if (others > 0) {
              $('liveText').textContent = others + (others === 1 ? ' other student is' : ' other students are') + ' practising this topic now';
              pill.style.display = 'inline-flex';
            } else {
              pill.style.display = 'none';
            }
          }).subscribe(async (status) => {
            if (status === 'SUBSCRIBED') await ch.track({ at: new Date().toISOString() });
          });
        } catch (e) { /* realtime unavailable: pill stays hidden */ }
      }

      // ----- Start -----
      startBtn.addEventListener('click', () => {
        if (!topic) { toast('Pick a topic first'); return; }

        const settings = {
          count: chipValue(countGroup),
          difficulty: chipValue(diffGroup),
          mode: chipValue(modeGroup),
          randomize: isRandom()
        };
        savePrefs(settings);

        const params = new URLSearchParams({
          topic: topic,
          count: settings.count,
          difficulty: settings.difficulty,
          mode: settings.mode,
          randomize: settings.randomize
        });
        window.location.href = 'cbt.html?' + params.toString();
      });

      // ----- Start-up: login check, topic, remembered choices -----
      async function init() {
        let session = null;
        try {
          const res = await supabaseClient.auth.getSession();
          session = res.data && res.data.session;
        } catch (e) { session = null; }

        if (!session) { window.location.replace('auth.html?mode=login'); return; }
        if (needsProfileSetup(session.user)) { window.location.replace('profile-setup.html'); return; }
        user = session.user;

        // Topic
        const card = $('topicCard');
        if (topic) {
          $('topicName').textContent = topic;
          startBtn.disabled = false;
        } else {
          card.classList.add('missing');
          $('topicName').textContent = 'No topic selected';
          $('topicChange').textContent = 'Choose';
          startBtn.disabled = true;
        }

        // Choices: last used by this student, otherwise the defaults
        const prefs = Object.assign({}, DEFAULTS, loadPrefs());
        if (!setActive(countGroup, prefs.count)) setActive(countGroup, DEFAULTS.count);
        if (!setActive(diffGroup, prefs.difficulty)) setActive(diffGroup, DEFAULTS.difficulty);
        if (!setActive(modeGroup, prefs.mode)) setActive(modeGroup, DEFAULTS.mode);
        setRandom(prefs.randomize !== false && prefs.randomize !== 'false');
        renderSummary();

        initPresence();
        $('appRoot').classList.add('ready');
      }

      init();
    });
  </script>
</body>
</html>
