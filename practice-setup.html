<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>PRIME-CBT — Practice Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b1a;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --muted-light: #cbd5e1;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --teal: #2dd4bf;
      --amber: #fbbf24;
      --font-display: 'Lora', serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 2xl;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      border-left: 1px solid rgba(51, 65, 85, 0.6);
      border-right: 1px solid rgba(51, 65, 85, 0.6);
    }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px 12px;
      padding-top: max(16px, env(safe-area-inset-top));
      flex-shrink: 0;
      background: rgba(6, 11, 26, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 30;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-light);
      cursor: pointer;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .back-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      color: var(--text);
      transform: translateX(-2px);
    }

    .back-btn:active {
      transform: scale(0.94);
    }

    .back-btn svg {
      width: 18px;
      height: 18px;
    }

    .topbar-title h1 {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
    }

    .topbar-title p {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* Content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 140px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }

    /* Section */
    .setup-section {
      margin-bottom: 24px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Option Chips */
    .options-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .option-chip {
      padding: 10px 16px;
      border-radius: 12px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--muted-light);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }

    .option-chip:hover {
      border-color: rgba(16, 185, 129, 0.4);
      color: var(--text);
    }

    .option-chip.active {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(45, 212, 191, 0.12));
      border-color: var(--emerald);
      color: var(--emerald-bright);
      box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.2);
    }

    /* Mode Cards */
    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .mode-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 16px 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.28s ease;
    }

    .mode-card:hover {
      transform: translateY(-2px);
      border-color: rgba(16, 185, 129, 0.35);
    }

    .mode-card.active {
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.12), rgba(15, 23, 42, 0.8));
      border-color: var(--emerald);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.15);
    }

    .mode-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--emerald-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      transition: transform 0.3s ease;
    }

    .mode-card.active .mode-icon {
      background: rgba(16, 185, 129, 0.22);
      transform: scale(1.08);
    }

    .mode-icon svg {
      width: 21px;
      height: 21px;
    }

    .mode-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .mode-desc {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.35;
    }

    /* Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 18px;
    }

    .toggle-info h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .toggle-info p {
      font-size: 12px;
      color: var(--muted);
    }

    .toggle {
      position: relative;
      width: 48px;
      height: 26px;
      background: var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.25s ease;
      flex-shrink: 0;
    }

    .toggle.active {
      background: var(--emerald);
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
    }

    .toggle.active .toggle-thumb {
      transform: translateX(22px);
    }

    /* Bottom CTA */
    .bottom-cta {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 75%, transparent);
      z-index: 40;
    }

    .start-btn {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #022c22;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(16, 185, 129, 0.3);
      transition: all 0.25s ease;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(16, 185, 129, 0.4);
    }

    .start-btn:active {
      transform: scale(0.98);
    }

    .start-btn svg {
      width: 17px;
      height: 17px;
      transition: transform 0.25s ease;
    }

    .start-btn:hover svg {
      transform: translateX(4px);
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Top Bar -->
    <div class="topbar">
      <button type="button" class="back-btn" onclick="history.back()" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="topbar-title">
        <h1>Set up practice</h1>
        <p>Customize your session</p>
      </div>
    </div>

    <!-- Content -->
    <div class="content">
      <!-- Number of Questions -->
      <div class="setup-section">
        <div class="section-label">Number of Questions</div>
        <div class="options-row" id="questionCount">
          <button type="button" class="option-chip active" data-value="10">10</button>
          <button type="button" class="option-chip" data-value="20">20</button>
          <button type="button" class="option-chip" data-value="30">30</button>
          <button type="button" class="option-chip" data-value="50">50</button>
        </div>
      </div>

      <!-- Difficulty -->
      <div class="setup-section">
        <div class="section-label">Difficulty</div>
        <div class="options-row" id="difficulty">
          <button type="button" class="option-chip" data-value="easy">Easy</button>
          <button type="button" class="option-chip active" data-value="medium">Medium</button>
          <button type="button" class="option-chip" data-value="hard">Hard</button>
          <button type="button" class="option-chip" data-value="mixed">Mixed</button>
        </div>
      </div>

      <!-- Mode -->
      <div class="setup-section">
        <div class="section-label">Mode</div>
        <div class="mode-grid" id="modeSelect">
          <div class="mode-card active" data-value="practice">
            <div class="mode-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
              </svg>
            </div>
            <div class="mode-title">Practice</div>
            <div class="mode-desc">See answers instantly</div>
          </div>
          <div class="mode-card" data-value="timed">
            <div class="mode-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 6v6l4 2"/>
              </svg>
            </div>
            <div class="mode-title">Timed</div>
            <div class="mode-desc">Race against time</div>
          </div>
        </div>
      </div>

      <!-- Randomize Toggle -->
      <div class="setup-section">
        <div class="toggle-row">
          <div class="toggle-info">
            <h3>Randomize Questions</h3>
            <p>Shuffle the order of questions</p>
          </div>
          <div class="toggle active" id="randomizeToggle" role="button" tabindex="0">
            <div class="toggle-thumb"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom CTA -->
    <div class="bottom-cta">
      <button type="button" class="start-btn" id="startBtn">
        Start Practice
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    function setupOptions(containerId) {
      const container = document.getElementById(containerId);
      container.querySelectorAll('.option-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          container.querySelectorAll('.option-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
        });
      });
    }

    setupOptions('questionCount');
    setupOptions('difficulty');

    document.querySelectorAll('.mode-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
      });
    });

    const toggle = document.getElementById('randomizeToggle');
    toggle.addEventListener('click', () => {
      toggle.classList.toggle('active');
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const topic = urlParams.get('topic') || 'General Academic Practice';
      
      const count = document.querySelector('#questionCount .active').dataset.value;
      const difficulty = document.querySelector('#difficulty .active').dataset.value;
      const mode = document.querySelector('#modeSelect .active').dataset.value;
      const randomize = document.getElementById('randomizeToggle').classList.contains('active');

      const params = new URLSearchParams({
        topic: topic,
        count: count,
        difficulty: difficulty,
        mode: mode,
        randomize: randomize
      });

      window.location.href = `cbt.html?${params.toString()}`;
    });
  </script>
</body>
</html>
