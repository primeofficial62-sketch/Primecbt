<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060b1a">
  <title>PRIME-CBT — PDF Reader</title>

  <!-- Start network connections immediately -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://xuofkjjhupgmrphzgyun.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <!-- PDF engine downloads in parallel with the page (deferred, never blocks paint) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- Non-blocking font -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>

  <style>
    :root {
      --bg: #060b1a;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --emerald: #10b981;
      --amber: #fbbf24;
      --pad: clamp(10px, 3vw, 24px);
      --bar-h: 64px;
      --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* ---------- Bars ---------- */
    .topbar, .bottom-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px var(--pad);
      background: rgba(6, 11, 26, 0.96);
      flex-shrink: 0;
      z-index: 30;
    }
    .topbar { padding-top: max(10px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); }
    .bottom-bar {
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .top-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .top-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .icon-btn, .nav-btn {
      width: 40px; height: 40px; flex-shrink: 0;
      border-radius: 11px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      cursor: pointer;
      text-decoration: none;
      transition: background .2s, color .2s, transform .15s;
    }
    .icon-btn:hover, .nav-btn:hover { background: rgba(30, 41, 59, 0.95); color: var(--text); }
    .icon-btn:active, .nav-btn:active { transform: scale(0.94); }
    .icon-btn.active { color: var(--amber); border-color: rgba(251, 191, 36, .4); background: rgba(251, 191, 36, .1); }
    .icon-btn.active svg { fill: currentColor; }
    .icon-btn svg, .nav-btn svg { width: 18px; height: 18px; }
    .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
    .nav-btn { color: var(--text); background: var(--surface); }

    .doc-title {
      font-size: clamp(13px, 1.8vw, 16px);
      font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0;
    }
    .doc-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title-wrap { min-width: 0; }

    .page-controls, .tools { display: flex; align-items: center; gap: 8px; }

    .page-info {
      display: flex; align-items: center; gap: 6px;
      font-size: 13.5px; font-weight: 600; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .page-info input {
      width: 52px; height: 36px;
      text-align: center;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      font: inherit; font-size: 16px;
      -moz-appearance: textfield;
    }
    .page-info input::-webkit-outer-spin-button,
    .page-info input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .page-info input:focus { outline: none; border-color: var(--emerald); }

    .zoom-controls {
      display: flex; align-items: center; gap: 2px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 11px; padding: 3px;
    }
    .zoom-btn {
      width: 34px; height: 34px; border-radius: 8px;
      background: none; border: none; color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .2s, color .2s;
    }
    .zoom-btn:hover { background: rgba(30, 41, 59, .8); color: var(--text); }
    .zoom-btn svg { width: 16px; height: 16px; }
    .zoom-label {
      min-width: 44px; text-align: center;
      font-size: 12px; font-weight: 600; color: var(--muted);
      font-variant-numeric: tabular-nums; cursor: pointer;
      background: none; border: none; font-family: inherit;
    }

    /* ---------- Viewer ---------- */
    .viewer {
      flex: 1;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: var(--bg);
      padding: var(--pad);
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.15) transparent;
      position: relative;
    }

    .pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: max-content;
      min-width: 100%;
    }

    .page {
      position: relative;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
      overflow: hidden;
      flex-shrink: 0;
      contain: layout paint;
    }
    .page canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    .page-label {
      position: absolute; bottom: 8px; right: 10px;
      font-size: 11px; font-weight: 600;
      color: rgba(15, 23, 42, .55);
      background: rgba(255, 255, 255, .75);
      padding: 2px 8px; border-radius: 999px;
      pointer-events: none;
    }

    /* ---------- States ---------- */
    .state {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 24px; text-align: center;
      color: var(--muted); font-size: 14px;
      background: var(--bg);
      z-index: 5;
    }
    .state-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .state button, .state a.btn {
      padding: 10px 18px; background: var(--emerald); color: #022c22;
      border: none; border-radius: 10px; font: inherit; font-weight: 600;
      cursor: pointer; text-decoration: none;
    }
    .state a.btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .state-hint { font-size: 12.5px; color: var(--muted); max-width: 300px; line-height: 1.5; }
    .state-hint a { color: var(--emerald); }
    .progress { width: min(260px, 70%); height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
    .progress > div { height: 100%; width: 0; background: var(--emerald); transition: width .2s; }
    .progress.indeterminate > div {
      width: 40%; position: absolute; left: -40%;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { to { left: 100%; } }

    .toast {
      position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); font-size: 13px;
      padding: 10px 16px; border-radius: 12px; z-index: 50;
      display: none; text-align: center;
    }
    .toast.show { display: block; }

    /* ---------- Light mode ---------- */
    .app.light-mode, .app.light-mode .viewer, .app.light-mode .state { background: #f1f5f9; }
    .app.light-mode .topbar, .app.light-mode .bottom-bar { background: rgba(248, 250, 252, .96); border-color: #cbd5e1; }
    .app.light-mode .doc-title { color: #0f172a; }
    .app.light-mode .doc-sub, .app.light-mode .page-info, .app.light-mode .zoom-label { color: #64748b; }
    .app.light-mode .icon-btn, .app.light-mode .nav-btn, .app.light-mode .zoom-controls,
    .app.light-mode .page-info input { background: #fff; border-color: #cbd5e1; color: #475569; }
    .app.light-mode .icon-btn:hover, .app.light-mode .nav-btn:hover { background: #f1f5f9; color: #0f172a; }
    .app.light-mode .icon-btn.active { color: #d97706; background: rgba(251,191,36,.15); }
    .app.light-mode .page-info input { color: #0f172a; }
    .app.light-mode .page { box-shadow: 0 6px 20px rgba(0, 0, 0, .12); }
    .app.light-mode .state, .app.light-mode .state-hint { color: #64748b; }
    .app.light-mode .progress { background: #e2e8f0; }

    /* ---------- AI explain ---------- */
    /* Permanent button: always on screen, sits just above the bottom bar (its height is measured by the script) */
    .explain-fab {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      bottom: calc(var(--bar-h) + 14px);
      z-index: 40;
      display: flex; align-items: center; gap: 8px;
      max-width: calc(100% - 28px);
      padding: 12px 18px 12px 14px;
      min-height: 46px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #022c22;
      border: none; border-radius: 999px;
      font: inherit; font-weight: 700; font-size: 13.5px;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(16, 185, 129, .35);
      transition: transform .15s, box-shadow .2s, opacity .2s;
    }
    .explain-fab svg { width: 18px; height: 18px; flex-shrink: 0; }
    .explain-fab:active { transform: scale(0.96); }
    .explain-fab:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
    .explain-fab:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    @media (hover: hover) { .explain-fab:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(16, 185, 129, .45); } }

    .explain-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
      max-height: 72vh; max-height: 72dvh;
      display: flex; flex-direction: column;
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: 18px 18px 0 0; box-shadow: 0 -12px 40px rgba(0, 0, 0, .5);
      padding-bottom: env(safe-area-inset-bottom);
      animation: exSheet .28s ease both;
    }
    @keyframes exSheet { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
    .explain-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 8px 18px; }
    .explain-title { font-size: 14px; font-weight: 700; color: var(--emerald); }
    .explain-body { overflow-y: auto; overscroll-behavior: contain; padding: 4px 18px 14px; font-size: 14.5px; line-height: 1.65; }
    .explain-body p { margin-bottom: 10px; }
    .explain-body ul { padding-left: 20px; margin-bottom: 10px; }
    .explain-body li { margin-bottom: 4px; }
    .explain-body .ex-error { color: var(--amber); }
    .explain-actions { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .explain-actions button {
      padding: 9px 14px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600;
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border); cursor: pointer;
    }
    .explain-actions button:disabled { opacity: .5; cursor: not-allowed; }
    @media (min-width: 900px) {
      .explain-sheet { left: auto; right: 24px; bottom: 24px; width: 440px; border: 1px solid var(--border); border-radius: 18px; }
      .explain-fab { right: 32px; bottom: calc(var(--bar-h) + 24px); }
    }
    .app.light-mode .explain-sheet { background: #fff; border-color: #cbd5e1; color: #0f172a; }
    .app.light-mode .explain-actions { border-color: #e2e8f0; }
    .app.light-mode .explain-actions button { background: #f1f5f9; color: #0f172a; border-color: #cbd5e1; }

    /* ---------- Small screens ---------- */
    @media (max-width: 480px) {
      .bottom-bar { justify-content: center; gap: 8px 14px; }
      .doc-sub { display: none; }
    }
    @media (min-width: 1024px) {
      .topbar, .bottom-bar { padding-left: 32px; padding-right: 32px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div class="app" id="app">

    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn" id="closeBtn" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="title-wrap">
          <div class="doc-title" id="documentTitle">Loading…</div>
          <div class="doc-sub" id="documentSub"></div>
        </div>
      </div>
      <div class="top-actions">
        <a class="icon-btn" id="downloadBtn" target="_blank" rel="noopener" aria-label="Open or download original" title="Open / download" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </a>
        <button class="icon-btn" id="bookmarkBtn" aria-label="Bookmark" title="Bookmark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
      </div>
    </header>

    <main class="viewer" id="viewer">
      <div class="pages" id="pages"></div>
      <div class="state" id="state">
        <div id="stateText">Loading document…</div>
        <div class="progress indeterminate" id="progressWrap"><div id="progressBar"></div></div>
        <div class="state-hint" id="stateHint" hidden></div>

    </main>

    <footer class="bottom-bar">
      <div class="page-controls">
        <button class="nav-btn" id="prevPage" disabled aria-label="Previous page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="page-info">
          <input type="number" id="pageInput" min="1" value="1" inputmode="numeric" aria-label="Current page" disabled>
          <span>/ <span id="totalPages">–</span></span>
        </div>
        <button class="nav-btn" id="nextPage" disabled aria-label="Next page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>

      <div class="tools">
        <div class="zoom-controls">
          <button class="zoom-btn" id="zoomOut" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/></svg>
          </button>
          <button class="zoom-label" id="zoomLabel" title="Reset to fit width">100%</button>
          <button class="zoom-btn" id="zoomIn" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/></svg>
          </button>
        </div>
      </div>
    </footer>

    <!-- AI: permanent "Explain this page" button + explanation panel -->
    <button type="button" class="explain-fab" id="explainFab" disabled aria-label="Explain the page I am on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>
        <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>
      </svg>
      <span id="explainFabLabel">Explain page</span>
    </button>

    <div class="explain-sheet" id="explainSheet" hidden role="dialog" aria-label="Page explanation">
      <div class="explain-head">
        <div class="explain-title" id="explainTitle">Page 1</div>
        <button class="icon-btn" id="explainClose" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="explain-body" id="explainBody"></div>
      <div class="explain-actions">
        <button type="button" id="exSimpler">Simpler</button>
        <button type="button" id="exExample">Give an example</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <!-- Inline modules are deferred, so this runs right after pdf.js has loaded -->
  <script type="module">
    const SUPABASE_URL = "https://xuofkjjhupgmrphzgyun.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GThKt7BvR1D81U939_EQkw_yCnTQ3xh";
    const SB_SCRIPTS = [
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js",
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ];
    const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;

    /* ================= Elements & storage keys ================= */
    const $ = id => document.getElementById(id);
    const app = $('app'), viewer = $('viewer'), pagesEl = $('pages');
    const BOOKMARK_KEY = 'primecbt_bookmarked_materials';
    const THEME_KEY = 'primecbt_reader_theme';
    const progressKey = id => 'primecbt_progress_' + id;

    const params = new URLSearchParams(location.search);
    const matId = params.get('id');
    const fileParam = params.get('file');
    const cacheKey = () => matId ? 'primecbt_mat_' + matId : (fileParam ? 'primecbt_matf_' + fileParam : null);

    /* ================= State ================= */
    let material = null;
    let pdfDoc = null;
    let totalPages = 0;
    let currentPage = 1;
    let zoom = 1;
    const MIN_ZOOM = 0.5, MAX_ZOOM = 3;
    const MAX_ACTIVE = 2;                 // parallel page renders
    const MAX_CANVAS_PIXELS = 6e6;        // keeps phones from running out of memory
    let pageEls = [];
    let pageAspect = [];
    let renderTasks = {};
    let rendered = {};
    let wanted = new Set();
    let active = 0;
    let layoutSig = '';
    let loadToken = 0;
    let nearIO = null, farIO = null;
    let currentLoadTask = null;
    let slowTimer = null;

    /* ---- AI explain state (declared up here so every function can reach it) ---- */
    const explainCache = new Map();
    let explainBusy = false, sheetPage = 0;

    /* ================= Helpers ================= */
    const storeGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
    const storeSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
    const idle = cb => ('requestIdleCallback' in window) ? requestIdleCallback(cb, { timeout: 2500 }) : setTimeout(cb, 400);

    let toastTimer;
    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    function showState(text, opts = {}) {
      clearTimeout(slowTimer);
      $('state').hidden = false;
      $('stateHint').hidden = true;
      const box = $('stateText');
      box.innerHTML = '';
      const span = document.createElement('div'); span.textContent = text; box.appendChild(span);
      $('progressWrap').style.display = opts.progress ? '' : 'none';

      if (opts.retry || opts.back || opts.open) {
        const row = document.createElement('div'); row.className = 'state-actions'; row.style.marginTop = '12px';
        if (opts.retry) {
          const b = document.createElement('button'); b.textContent = 'Try again'; b.onclick = () => loadMaterial(true);
          row.appendChild(b);
        }
        if (opts.open && material && material.file_url) {
          const a = document.createElement('a'); a.className = 'btn ghost'; a.href = material.file_url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open original';
          row.appendChild(a);
        }
        if (opts.back) {
          const a = document.createElement('a'); a.className = 'btn ghost'; a.href = 'materials.html'; a.textContent = 'Back to Materials';
          row.appendChild(a);
        }
        box.appendChild(row);
      }

      if (opts.progress) {
        slowTimer = setTimeout(() => {
          const h = $('stateHint');
          h.hidden = false;
          h.innerHTML = '';
          h.append('Taking longer than usual — your connection may be slow. ');
          if (material && material.file_url) {
            const a = document.createElement('a'); a.href = material.file_url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open original';
            h.appendChild(a);
          }
        }, 12000);
      }
    }
    function hideState() { clearTimeout(slowTimer); $('state').hidden = true; }

    function titleFromUrl(url) {
      try {
        const last = decodeURIComponent(new URL(url, location.href).pathname.split('/').pop() || '');
        return last.replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ').trim() || 'Document';
      } catch { return 'Document'; }
    }

    function fitWidth() {
      const cs = getComputedStyle(viewer);
      const avail = viewer.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      return Math.max(200, Math.min(avail, 900));
    }
    const pageWidth = () => fitWidth() * zoom;
    const computeSig = () => Math.round(pageWidth()) + '@' + (window.devicePixelRatio || 1);

    /* Keeps the AI button sitting just above the bottom bar, even when the bar wraps onto two rows */
    const bottomBar = document.querySelector('.bottom-bar');
    function syncBarHeight() {
      document.documentElement.style.setProperty('--bar-h', bottomBar.offsetHeight + 'px');
    }
    if ('ResizeObserver' in window) new ResizeObserver(syncBarHeight).observe(bottomBar);
    window.addEventListener('resize', syncBarHeight);
    syncBarHeight();

    /* ================= Supabase (loaded only when needed) ================= */
    let sbPromise = null;
    function loadScript(src) {
      return new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = src; s.async = true;
        s.onload = res; s.onerror = () => rej(new Error('script failed: ' + src));
        document.head.appendChild(s);
      });
    }
    function getSb() {
      if (sbPromise) return sbPromise;
      sbPromise = (async () => {
        if (!window.supabase) {
          for (const src of SB_SCRIPTS) {
            try { await loadScript(src); if (window.supabase) break; } catch {}
          }
        }
        if (!window.supabase) throw new Error('Could not reach the server.');
        return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      })();
      sbPromise.catch(() => { sbPromise = null; });
      return sbPromise;
    }

    /* ================= Material lookup (cached for instant opens) ================= */
    const COLS = 'id,title,category,file_url,file_type,pages,size_bytes';

    async function fetchMaterial() {
      const sb = await getSb();
      if (matId) {
        const { data, error } = await sb.from('materials').select(COLS).eq('id', matId).maybeSingle();
        if (error) throw error;
        return data;
      }
      if (fileParam) {
        const { data, error } = await sb.from('materials').select(COLS).eq('file_url', fileParam).maybeSingle();
        if (error) throw error;
        return data;
      }
      return undefined;
    }

    function cacheRow(row) {
      const k = cacheKey();
      if (k && row && row.file_url) storeSet(k, row);
    }
    function readCached() {
      const k = cacheKey();
      const c = k ? storeGet(k, null) : null;
      return c && c.file_url ? c : null;
    }

    async function revalidate(token) {
      try {
        const row = await fetchMaterial();
        if (token !== loadToken) return;
        if (!row) {
          const k = cacheKey(); if (k) { try { localStorage.removeItem(k); } catch {} }
          showState('This material no longer exists.', { back: true });
          return;
        }
        cacheRow(row);
        const fileChanged = material && row.file_url !== material.file_url;
        material = { ...material, ...row };
        applyMeta();
        if (fileChanged) { toast('This document was updated — reloading.'); loadMaterial(true); }
      } catch { /* offline or slow: keep showing the cached copy */ }
    }

    async function loadMaterial(forceFresh = false) {
      const token = ++loadToken;
      showState('Loading document…', { progress: true });
      $('progressWrap').classList.add('indeterminate');
      $('progressBar').style.width = '';

      try {
        let row = null, fromCache = false;

        if (fileParam && /^https?:\/\//i.test(fileParam)) {
          row = { id: null, title: titleFromUrl(fileParam), file_url: fileParam };
        } else if (!matId && !fileParam) {
          showState('No document was selected.', { back: true });
          return;
        } else if (!forceFresh) {
          row = readCached();
          fromCache = !!row;
        }

        if (!row) {
          row = await fetchMaterial();
          if (token !== loadToken) return;
          if (!row) { showState('This material no longer exists.', { back: true }); return; }
          cacheRow(row);
        }

        material = row;
        applyMeta();

        // Start the PDF download right away; check the database in parallel
        const opening = openPdf(row.file_url, token);
        if (fromCache) revalidate(token);
        await opening;
        if (token !== loadToken) return;
        idle(subscribeRealtime);
      } catch (err) {
        if (token !== loadToken) return;
        console.error(err);
        const name = err && err.name;
        let msg = 'Could not load this document.';
        if (name === 'MissingPDFException') msg = 'This file could not be found.';
        else if (name === 'InvalidPDFException') msg = 'This file is not a valid PDF.';
        else if (name === 'PasswordException') msg = 'This PDF is password protected.';
        else if (err && err.message) msg += ' ' + err.message;
        showState(msg, { retry: true, back: true, open: true });
      }
    }

    function applyMeta() {
      $('documentTitle').textContent = material.title || 'Document';
      document.title = (material.title || 'Document') + ' — PRIME-CBT';
      $('documentSub').textContent = material.category || '';
      const dl = $('downloadBtn');
      if (material.file_url) { dl.href = material.file_url; dl.hidden = false; }
      syncBookmarkBtn();
    }

    /* ================= PDF loading ================= */
    function pdfOptions(extra) {
      return Object.assign({
        rangeChunkSize: 262144,       // 256 KB chunks: first page shows without downloading the whole file
        disableAutoFetch: true,       // only fetch pages the user actually views
        disableStream: false,
        isEvalSupported: false,
        useSystemFonts: true,
        enableXfa: false
      }, extra || {});
    }

    async function getDocument(url, token, extra) {
      if (currentLoadTask) { try { currentLoadTask.destroy(); } catch {} }
      const task = pdfjsLib.getDocument(Object.assign({ url }, pdfOptions(extra)));
      currentLoadTask = task;
      task.onProgress = p => {
        if (token !== loadToken) return;
        if (p.total) {
          $('progressWrap').classList.remove('indeterminate');
          $('progressBar').style.width = Math.min(100, Math.round(p.loaded / p.total * 100)) + '%';
        }
      };
      return task.promise;
    }

    async function openPdf(url, token) {
      resetViewer();

      let doc;
      try {
        doc = await getDocument(url, token);
      } catch (err) {
        if (token !== loadToken) return;
        const n = err && err.name;
        if (n === 'MissingPDFException' || n === 'InvalidPDFException' || n === 'PasswordException') throw err;
        // Server may not allow range requests: fall back to a plain full download
        doc = await getDocument(url, token, { disableRange: true, disableStream: true, disableAutoFetch: false });
      }
      if (token !== loadToken) { try { doc.destroy(); } catch {} return; }

      pdfDoc = doc;
      totalPages = doc.numPages;

      const first = await doc.getPage(1);
      if (token !== loadToken) return;
      const vp = first.getViewport({ scale: 1 });
      pageAspect = new Array(totalPages).fill(vp.height / vp.width);

      $('totalPages').textContent = totalPages;
      $('pageInput').max = totalPages;
      $('pageInput').disabled = false;

      const saved = material && material.id ? storeGet(progressKey(material.id), 1) : 1;
      currentPage = Math.min(Math.max(1, +saved || 1), totalPages);

      buildPages();
      hideState();
      goToPage(currentPage, false);
      syncExplainFab();                 // the AI button is ready as soon as the document is open
    }

    function resetViewer() {
      cancelAllRenders();
      if (pdfDoc) { try { pdfDoc.destroy(); } catch {} pdfDoc = null; }
      if (nearIO) nearIO.disconnect();
      if (farIO) farIO.disconnect();
      pagesEl.innerHTML = '';
      pageEls = []; rendered = {}; wanted = new Set();
      // AI explain: start fresh for the new document
      sheetPage = 0;
      $('explainSheet').hidden = true;
      syncExplainFab();
    }

    /* ================= Page layout & observers ================= */
    function buildPages() {
      if (nearIO) nearIO.disconnect();
      if (farIO) farIO.disconnect();
      pagesEl.innerHTML = '';
      pageEls = []; rendered = {}; wanted = new Set();
      layoutSig = computeSig();
      const w = pageWidth();

      const frag = document.createDocumentFragment();
      for (let i = 1; i <= totalPages; i++) {
        const div = document.createElement('div');
        div.className = 'page';
        div.dataset.page = i;
        div.style.width = w + 'px';
        div.style.height = (w * pageAspect[i - 1]) + 'px';
        const label = document.createElement('div');
        label.className = 'page-label';
        label.textContent = i + ' / ' + totalPages;
        div.appendChild(label);
        frag.appendChild(div);
        pageEls.push(div);
      }
      pagesEl.appendChild(frag);
      setupObservers();
    }

    function setupObservers() {
      // Pages close to the screen get rendered (nearest first)
      nearIO = new IntersectionObserver(entries => {
        for (const e of entries) {
          const n = +e.target.dataset.page;
          if (e.isIntersecting) wanted.add(n); else wanted.delete(n);
        }
        pump();
      }, { root: viewer, rootMargin: '1000px 0px' });

      // Pages far away give their memory back
      farIO = new IntersectionObserver(entries => {
        for (const e of entries) {
          if (e.isIntersecting) continue;
          const n = +e.target.dataset.page;
          cancelRender(n);
          delete rendered[n];
          const c = e.target.querySelector('canvas');
          if (c) { c.width = 0; c.height = 0; c.remove(); }
        }
      }, { root: viewer, rootMargin: '3500px 0px' });

      pageEls.forEach(el => { nearIO.observe(el); farIO.observe(el); });
    }

    /* ================= Render queue ================= */
    function pump() {
      if (!pdfDoc) return;
      while (active < MAX_ACTIVE) {
        let best = null, bestDist = Infinity;
        for (const n of wanted) {
          if (rendered[n] === layoutSig || renderTasks[n]) continue;
          const d = Math.abs(n - currentPage);
          if (d < bestDist) { bestDist = d; best = n; }
        }
        if (best === null) break;
        renderPage(best);
      }
    }

    function cancelRender(n) {
      const slot = renderTasks[n];
      if (!slot) return;
      slot.cancelled = true;
      if (slot.rt) { try { slot.rt.cancel(); } catch {} }
    }
    function cancelAllRenders() {
      Object.keys(renderTasks).forEach(n => cancelRender(+n));
    }

    async function renderPage(num) {
      const doc = pdfDoc;
      const mySig = layoutSig;
      const slot = { rt: null, cancelled: false };
      renderTasks[num] = slot;
      active++;
      try {
        const page = await doc.getPage(num);
        if (slot.cancelled || doc !== pdfDoc) return;

        const base = page.getViewport({ scale: 1 });
        const cssW = pageWidth();
        const cssH = cssW * (base.height / base.width);
        let dpr = Math.min(window.devicePixelRatio || 1, 2);
        if (cssW * cssH * dpr * dpr > MAX_CANVAS_PIXELS) dpr = Math.max(0.8, Math.sqrt(MAX_CANVAS_PIXELS / (cssW * cssH)));
        const viewport = page.getViewport({ scale: (cssW / base.width) * dpr });

        const el = pageEls[num - 1];
        if (!el) return;

        // Fix the placeholder height if this page is a different size from page 1
        const aspect = base.height / base.width;
        if (Math.abs(aspect - pageAspect[num - 1]) > 0.005) {
          pageAspect[num - 1] = aspect;
          el.style.height = (cssW * aspect) + 'px';
        }

        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        const ctx = canvas.getContext('2d', { alpha: false });

        slot.rt = page.render({ canvasContext: ctx, viewport });
        await slot.rt.promise;
        if (slot.cancelled || doc !== pdfDoc) return;

        const old = el.querySelector('canvas');
        if (old) { old.width = 0; old.height = 0; old.remove(); }
        el.insertBefore(canvas, el.firstChild);
        rendered[num] = mySig;
        page.cleanup();
      } catch (err) {
        if (!(err && err.name === 'RenderingCancelledException')) console.error('Render error page', num, err);
      } finally {
        if (renderTasks[num] === slot) delete renderTasks[num];
        active--;
        pump();
      }
    }

    /* Resize / zoom: keep pages in place, resize them, re-render sharp copies */
    function relayout() {
      if (!pdfDoc || !pageEls.length) return;
      const anchor = pageEls[currentPage - 1];
      const frac = anchor ? (viewer.scrollTop - anchor.offsetTop) / Math.max(1, anchor.offsetHeight) : 0;

      cancelAllRenders();
      rendered = {}; wanted = new Set();
      layoutSig = computeSig();

      const w = pageWidth();
      pageEls.forEach((el, i) => {
        el.style.width = w + 'px';
        el.style.height = (w * pageAspect[i]) + 'px';   // old canvas stretches meanwhile = instant zoom feedback
      });
      if (anchor) viewer.scrollTop = anchor.offsetTop + frac * anchor.offsetHeight;

      // Re-run the observers so visible pages queue up again
      nearIO.disconnect();
      pageEls.forEach(el => nearIO.observe(el));
    }

    /* ================= Navigation ================= */
    function goToPage(n, smooth = true) {
      n = Math.min(Math.max(1, n), totalPages);
      const el = pageEls[n - 1];
      if (!el) return;
      currentPage = n;
      viewer.scrollTo({ top: Math.max(0, el.offsetTop - 12), behavior: smooth ? 'smooth' : 'auto' });
      updatePageInfo();
    }

    function updatePageInfo() {
      if (document.activeElement !== $('pageInput')) $('pageInput').value = currentPage;
      $('prevPage').disabled = currentPage <= 1;
      $('nextPage').disabled = currentPage >= totalPages;
      $('zoomLabel').textContent = Math.round(zoom * 100) + '%';
      syncExplainFab();   // AI: the button always names the page the student is on
    }

    function pageAtLine() {
      const line = viewer.scrollTop + viewer.clientHeight * 0.35;
      let lo = 0, hi = pageEls.length - 1;
      while (lo < hi) {
        const mid = (lo + hi + 1) >> 1;
        if (pageEls[mid].offsetTop <= line) lo = mid; else hi = mid - 1;
      }
      return lo + 1;
    }

    let scrollTick = false, saveTimer;
    viewer.addEventListener('scroll', () => {
      if (scrollTick || !pageEls.length) return;
      scrollTick = true;
      requestAnimationFrame(() => {
        scrollTick = false;
        const found = pageAtLine();
        if (found !== currentPage) {
          currentPage = found;
          updatePageInfo();
          pump();                                        // re-prioritise around the new page
          clearTimeout(saveTimer);
          saveTimer = setTimeout(() => {
            if (material && material.id) storeSet(progressKey(material.id), currentPage);
          }, 400);
        }
      });
    }, { passive: true });

    $('prevPage').addEventListener('click', () => goToPage(currentPage - 1));
    $('nextPage').addEventListener('click', () => goToPage(currentPage + 1));
    $('pageInput').addEventListener('change', e => goToPage(parseInt(e.target.value, 10) || currentPage));
    $('pageInput').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); goToPage(currentPage + 1); }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goToPage(currentPage - 1); }
      if (e.key === '+' || e.key === '=') setZoom(zoom + 0.1);
      if (e.key === '-') setZoom(zoom - 0.1);
    });

    /* ================= Zoom ================= */
    let zoomTimer;
    function setZoom(z) {
      const next = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, Math.round(z * 100) / 100));
      if (next === zoom) return;
      zoom = next;
      updatePageInfo();
      clearTimeout(zoomTimer);
      zoomTimer = setTimeout(relayout, 100);
    }
    $('zoomIn').addEventListener('click', () => setZoom(zoom + 0.15));
    $('zoomOut').addEventListener('click', () => setZoom(zoom - 0.15));
    $('zoomLabel').addEventListener('click', () => setZoom(1));

    let resizeTimer, lastWidth = window.innerWidth;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (window.innerWidth !== lastWidth) { lastWidth = window.innerWidth; relayout(); }
      }, 200);
    });

    /* ================= Bookmark / theme / close ================= */
    function syncBookmarkBtn() {
      const on = !!(material && material.id && storeGet(BOOKMARK_KEY, []).includes(material.id));
      $('bookmarkBtn').classList.toggle('active', on);
    }
    $('bookmarkBtn').addEventListener('click', () => {
      if (!material || !material.id) return;
      let list = storeGet(BOOKMARK_KEY, []);
      list = list.includes(material.id) ? list.filter(x => x !== material.id) : [...list, material.id];
      storeSet(BOOKMARK_KEY, list);
      syncBookmarkBtn();
    });

    if (storeGet(THEME_KEY, 'dark') === 'light') app.classList.add('light-mode');
    $('themeBtn').addEventListener('click', () => {
      app.classList.toggle('light-mode');
      storeSet(THEME_KEY, app.classList.contains('light-mode') ? 'light' : 'dark');
    });

    $('closeBtn').addEventListener('click', () => {
      if (history.length > 1) history.back(); else location.href = 'materials.html';
    });

    /* ================= Realtime (starts after the document is on screen) ================= */
    let channel = null;
    async function subscribeRealtime() {
      if (channel || !material || !material.id) return;
      try {
        const sb = await getSb();
        if (channel) return;
        channel = sb.channel('material-' + material.id)
          .on('postgres_changes',
            { event: 'UPDATE', schema: 'public', table: 'materials', filter: 'id=eq.' + material.id },
            payload => {
              const next = payload.new;
              const fileChanged = next.file_url !== material.file_url;
              material = { ...material, ...next };
              cacheRow(material);
              applyMeta();
              if (fileChanged) { toast('This document was updated — reloading.'); loadMaterial(true); }
            })
          .on('postgres_changes',
            { event: 'DELETE', schema: 'public', table: 'materials', filter: 'id=eq.' + material.id },
            () => showState('This material was removed.', { back: true }))
          .subscribe();
      } catch { /* realtime is optional */ }
    }

    let lastCheck = 0;
    document.addEventListener('visibilitychange', async () => {
      if (document.hidden || !material || !material.id) return;
      if (Date.now() - lastCheck < 30000) return;
      lastCheck = Date.now();
      try {
        const sb = await getSb();
        const { data } = await sb.from('materials').select('title,category,file_url').eq('id', material.id).maybeSingle();
        if (!data) { showState('This material was removed.', { back: true }); return; }
        const fileChanged = data.file_url !== material.file_url;
        material = { ...material, ...data };
        cacheRow(material);
        applyMeta();
        if (fileChanged) loadMaterial(true);
      } catch {}
    });

    /* ================= AI "Explain this page" ================= */
    const exKey = (page, mode) =>
      ((material && (material.id || material.file_url)) || '') + '|' + (material ? material.file_url : '') + '|' + page + '|' + mode;

    // The button is always on screen. It is greyed out only until the document has opened,
    // and it steps aside while the explanation panel is open.
    function syncExplainFab() {
      const fab = $('explainFab');
      const ready = !!pdfDoc && totalPages > 0;
      fab.disabled = !ready;
      fab.hidden = !$('explainSheet').hidden;
      $('explainFabLabel').textContent = ready ? 'Explain page ' + currentPage : 'Explain page';
      fab.setAttribute('aria-label', ready ? 'Explain page ' + currentPage : 'Explain this page (available once the document opens)');
    }

    // Reads the text of one page. If the page has no real text (scanned PDF), sends a small image instead.
    async function getPagePayload(n) {
      const page = await pdfDoc.getPage(n);
      const tc = await page.getTextContent();
      const text = tc.items.map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
      if (text.length >= 60) return { text: text.slice(0, 12000) };

      const base = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: Math.min(1400 / base.width, 2) });
      const c = document.createElement('canvas');
      c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      const image = c.toDataURL('image/jpeg', 0.7).split(',')[1];
      c.width = 0; c.height = 0;
      return { text: '', image };
    }

    // Turns the AI's simple markdown (paragraphs, "- " bullets, **bold**) into safe HTML
    function fmtExplain(t) {
      const esc = String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return esc.split(/\n{2,}/).map(p => {
        const lines = p.split('\n');
        if (lines.every(l => /^\s*[-*•]\s+/.test(l)))
          return '<ul>' + lines.map(l => '<li>' + l.replace(/^\s*[-*•]\s+/, '') + '</li>').join('') + '</ul>';
        return '<p>' + lines.join('<br>') + '</p>';
      }).join('').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }

    function setExBusy(b) {
      explainBusy = b;
      $('exSimpler').disabled = b;
      $('exExample').disabled = b;
    }

    function showExError(msg) {
      const p = document.createElement('p');
      p.className = 'ex-error';
      p.textContent = msg || 'Something went wrong.';
      const body = $('explainBody');
      body.innerHTML = '';
      body.appendChild(p);
    }

    async function runExplain(mode) {
      if (explainBusy || !pdfDoc || !material) return;
      const n = sheetPage;
      const ck = exKey(n, mode);
      const body = $('explainBody');

      if (explainCache.has(ck)) { body.innerHTML = fmtExplain(explainCache.get(ck)); body.scrollTop = 0; return; }

      setExBusy(true);
      body.innerHTML = '<div style="margin:8px 0 12px;color:var(--muted)">Reading page ' + n + '…</div><div class="progress indeterminate"><div></div></div>';
      try {
        const payload = await getPagePayload(n);
        const sb = await getSb();
        const { data: sess } = await sb.auth.getSession();
        const tok = sess && sess.session && sess.session.access_token;
        if (!tok) throw new Error('Please log in to use AI explanations.');
        const resp = await fetch('/api/explain', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
          body: JSON.stringify({
            material_key: String(material.id || material.file_url),
            file_url: material.file_url,
            title: material.title,
            category: material.category,
            page: n,
            mode,
            ...payload
          })
        });
        let data = null;
        try { data = await resp.json(); } catch {}
        if (!resp.ok || !data || !data.explanation) {
          throw new Error((data && data.error) || ('Server error ' + resp.status + '. Please try again.'));
        }
        if (n !== sheetPage) return;                     // user closed the panel meanwhile
        explainCache.set(ck, data.explanation);
        body.innerHTML = fmtExplain(data.explanation);
        body.scrollTop = 0;
      } catch (err) {
        if (n === sheetPage) showExError(err.message);
      } finally {
        setExBusy(false);
      }
    }

    function openExplain() {
      if (!pdfDoc) return;
      sheetPage = currentPage;                           // capture the page the student is on right now
      $('explainTitle').textContent = 'Page ' + sheetPage + ' — explanation';
      $('explainSheet').hidden = false;
      syncExplainFab();
      runExplain('explain');
    }

    function closeExplain() {
      $('explainSheet').hidden = true;
      sheetPage = 0;
      syncExplainFab();
    }

    $('explainFab').addEventListener('click', openExplain);
    $('explainClose').addEventListener('click', closeExplain);
    $('exSimpler').addEventListener('click', () => runExplain('simpler'));
    $('exExample').addEventListener('click', () => runExplain('example'));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('explainSheet').hidden) closeExplain(); });

    /* ================= Go ================= */
    loadMaterial();
  </script>
</body>
</html>
