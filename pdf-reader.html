<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>PRIME-CBT — PDF Reader</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #060b1a;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --amber: #fbbf24;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-body);
      background: #060b1a;
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 768px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #060b1a;
      position: relative;
      overflow: hidden;
      border-left: 1px solid rgba(51, 65, 85, 0.6);
      border-right: 1px solid rgba(51, 65, 85, 0.6);
    }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: rgba(6, 11, 26, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 30;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      color: var(--text);
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .icon-btn.active {
      color: var(--amber);
      border-color: rgba(251, 191, 36, 0.4);
      background: rgba(251, 191, 36, 0.1);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
    }

    .doc-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    /* PDF Viewport */
    .viewer {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background: #060b1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 110px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
      transform-origin: top center;
      transition: transform 0.2s ease;
    }

    .page {
      width: 100%;
      max-width: 600px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      position: relative;
    }

    .page-content {
      padding: 32px 24px;
      min-height: 520px;
      color: #cbd5e1;
      font-size: 14.5px;
      line-height: 1.7;
    }

    .page-content h2 {
      font-size: 17px;
      font-weight: 700;
      margin-top: 16px;
      margin-bottom: 10px;
      color: #f1f5f9;
    }

    .page-content h2:first-child {
      margin-top: 0;
    }

    .page-content p {
      margin-bottom: 12px;
    }

    .page-content ul {
      padding-left: 20px;
      margin-bottom: 12px;
    }

    .page-content li {
      margin-bottom: 6px;
    }

    .page-number-label {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 11px;
      font-weight: 500;
      color: rgba(148, 163, 184, 0.5);
    }

    /* Bottom Bar */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      background: rgba(6, 11, 26, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 30;
    }

    .page-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .nav-btn:hover {
      background: var(--surface-2);
    }

    .nav-btn:active {
      transform: scale(0.94);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
    }

    .page-info {
      font-size: 13.5px;
      font-weight: 600;
      min-width: 65px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    .page-info span {
      color: var(--text);
    }

    .tools {
      display: flex;
      gap: 8px;
    }

    /* Zoom controls */
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 3px;
    }

    .zoom-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: none;
      border: none;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .zoom-btn:hover {
      background: rgba(30, 41, 59, 0.8);
      color: var(--text);
    }

    .zoom-btn:active {
      transform: scale(0.92);
    }

    .zoom-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Light Mode Overrides */
    .app.light-mode {
      background: #f8fafc;
    }

    .app.light-mode .topbar,
    .app.light-mode .bottom-bar {
      background: rgba(248, 250, 252, 0.92);
      border-color: #cbd5e1;
    }

    .app.light-mode .doc-title {
      color: #0f172a;
    }

    .app.light-mode .viewer {
      background: #f8fafc;
    }

    .app.light-mode .page {
      background: #ffffff;
      border-color: #cbd5e1;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .app.light-mode .page-content {
      color: #334155;
    }

    .app.light-mode .page-content h2 {
      color: #0f172a;
    }

    .app.light-mode .icon-btn,
    .app.light-mode .nav-btn,
    .app.light-mode .zoom-controls {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #475569;
    }

    .app.light-mode .icon-btn:hover,
    .app.light-mode .nav-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .app.light-mode .page-info {
      color: #64748b;
    }

    .app.light-mode .page-info span {
      color: #0f172a;
    }
    
    .animate-fade-up, 
    .animate-scale, 
    .animate-fade-in,
    .animate-slide-up,
    [class*="animate-"] {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  </style>
</head>
<body>

  <div class="app" id="app">

    <!-- Top Bar -->
    <div class="topbar">
      <div class="top-left">
        <button class="icon-btn" onclick="history.back()" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
        <div class="doc-title" id="documentTitle">Loading Document...</div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="bookmarkBtn" title="Bookmark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
          </svg>
        </button>
        <button class="icon-btn" id="themeBtn" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- PDF Viewer -->
    <div class="viewer" id="viewer">
      <div id="dynamicContentContainer" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <!-- Course contents injected dynamically based on query parameters -->
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <div class="page-controls">
        <button class="nav-btn" id="prevPage" disabled aria-label="Previous Page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <div class="page-info">
          <span id="currentPage">1</span> / <span id="totalPages">3</span>
        </div>
        <button class="nav-btn" id="nextPage" aria-label="Next Page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>

      <div class="tools">
        <div class="zoom-controls">
          <button class="zoom-btn" id="zoomOut" title="Zoom out" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="M21 21l-4.35-4.35M8 11h6"/>
            </svg>
          </button>
          <button class="zoom-btn" id="zoomIn" title="Zoom in" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const courseData = {
      'bio101.pdf': {
        title: 'BIO 101 — Cell Biology',
        pages: [
          `<h2>1. Introduction to Cell Biology</h2>
           <p>The cell is the basic structural and functional unit of all living organisms. It is the smallest unit of life that can replicate independently.</p>
           <p>Cells are often called the "building blocks of life". The study of cells is called cell biology, cellular biology, or cytology.</p>
           <h2>Cell Theory</h2>
           <ul>
             <li>All living organisms are composed of one or more cells.</li>
             <li>The cell is the basic unit of structure and organization in organisms.</li>
             <li>Cells arise from pre-existing cells.</li>
           </ul>`,
          `<h2>2. Types of Cells</h2>
           <p><strong>Prokaryotic Cells</strong></p>
           <p>Prokaryotes are unicellular organisms that lack membrane-bound organelles and a true nucleus. Examples include bacteria and archaea.</p>
           <p><strong>Eukaryotic Cells</strong></p>
           <p>Eukaryotic cells contain a nucleus and other membrane-bound organelles. They can be unicellular or multicellular.</p>`,
          `<h2>3. Cell Organelles</h2>
           <p><strong>Mitochondria</strong> — Known as the powerhouse of the cell. They generate most of the cell’s supply of ATP through cellular respiration.</p>
           <p><strong>Nucleus</strong> — Contains the cell’s genetic material (DNA) and controls the cell’s activities.</p>`
        ]
      },
      'chm102.pdf': {
        title: 'CHM 102 — Organic Chemistry',
        pages: [
          `<h2>1. Introduction to Organic Chemistry</h2>
           <p>Organic chemistry is the study of the structure, properties, composition, reactions, and preparation of carbon-containing compounds.</p>
           <p>Carbon's unique ability to form stable covalent bonds with itself and other elements allows for millions of organic compounds.</p>`,
          `<h2>2. Hydrocarbons and Functional Groups</h2>
           <p>Hydrocarbons consist entirely of hydrogen and carbon. They are categorized into alkanes, alkenes, and alkynes.</p>
           <p>Functional groups are specific groupings of atoms within molecules that confer consistent chemical properties.</p>`,
          `<h2>3. Reaction Mechanisms</h2>
           <p>Substitution, addition, and elimination reactions form the core reaction types in foundational organic chemistry mechanisms.</p>`
        ]
      },
      'eco101.pdf': {
        title: 'ECO 101 — Macroeconomics',
        pages: [
          `<h2>1. Principles of Macroeconomics</h2>
           <p>Macroeconomics studies the behavior and performance of an economy as a whole, focusing on aggregate changes such as unemployment, growth rate, and inflation.</p>`,
          `<h2>2. Gross Domestic Product (GDP)</h2>
           <p>GDP is the total monetary or market value of all the finished goods and services produced within a country's borders in a specific time period.</p>`,
          `<h2>3. Monetary and Fiscal Policy</h2>
           <p>Governments and central banks use fiscal and monetary policies to steer economic growth, control inflation, and manage employment levels.</p>`
        ]
      },
      'ecology-guide.pdf': {
        title: 'Complete Study Guide — Ecology',
        pages: [
          `<h2>1. Introduction to Ecology</h2>
           <p>Ecology is the scientific study of the interactions between organisms and their environment, encompassing both biotic and abiotic components.</p>
           <h2>Ecosystem Dynamics</h2>
           <p>An ecosystem consists of a community of living organisms interacting with the non-living elements of their environment as a cohesive system.</p>`,
          `<h2>2. Energy Flow and Nutrient Cycles</h2>
           <p>Energy flows through ecosystems directionally—entering primarily via sunlight and leaving as heat—while chemical nutrients are continuously recycled through biogeochemical cycles.</p>`,
          `<h2>3. Population and Community Ecology</h2>
           <p>Population ecology examines how populations change over time and space, driven by natality, mortality, immigration, and environmental resistance factors.</p>`
        ]
      }
    };

    // Read parameter from URL
    const urlParams = new URLSearchParams(window.location.search);
    const requestedFile = urlParams.get('file') || 'bio101.pdf';

    const currentCourse = courseData[requestedFile] || courseData['bio101.pdf'];
    document.getElementById('documentTitle').textContent = currentCourse.title;

    const container = document.getElementById('dynamicContentContainer');
    const totalPages = currentCourse.pages.length;
    document.getElementById('totalPages').textContent = totalPages;

    currentCourse.pages.forEach((htmlContent, index) => {
      const pageNum = index + 1;
      const pageDiv = document.createElement('div');
      pageDiv.className = 'page';
      pageDiv.setAttribute('data-page', pageNum);
      pageDiv.innerHTML = `
        <div class="page-content">${htmlContent}</div>
        <div class="page-number-label">${pageNum} / ${totalPages}</div>
      `;
      container.appendChild(pageDiv);
    });

    let currentPage = 1;
    const viewer = document.getElementById('viewer');
    const pages = document.querySelectorAll('.page');

    function updatePageInfo() {
      document.getElementById('currentPage').textContent = currentPage;
      document.getElementById('prevPage').disabled = currentPage <= 1;
      document.getElementById('nextPage').disabled = currentPage >= totalPages;
    }

    document.getElementById('prevPage').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        updatePageInfo();
        const targetPage = viewer.querySelector(`[data-page="${currentPage}"]`);
        if (targetPage) {
          viewer.scrollTo({ top: targetPage.offsetTop - 16, behavior: 'smooth' });
        }
      }
    });

    document.getElementById('nextPage').addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage++;
        updatePageInfo();
        const targetPage = viewer.querySelector(`[data-page="${currentPage}"]`);
        if (targetPage) {
          viewer.scrollTo({ top: targetPage.offsetTop - 16, behavior: 'smooth' });
        }
      }
    });

    const observerOptions = {
      root: viewer,
      threshold: 0.5
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const pageNum = parseInt(entry.target.getAttribute('data-page'));
          if (pageNum) {
            currentPage = pageNum;
            updatePageInfo();
          }
        }
      });
    }, observerOptions);

    pages.forEach(page => observer.observe(page));

    document.getElementById('bookmarkBtn').addEventListener('click', function() {
      this.classList.toggle('active');
    });

    document.getElementById('themeBtn').addEventListener('click', () => {
      document.getElementById('app').classList.toggle('light-mode');
    });

    let scale = 1;
    document.getElementById('zoomIn').addEventListener('click', () => {
      scale = Math.min(scale + 0.1, 1.4);
      viewer.style.transform = `scale(${scale})`;
    });

    document.getElementById('zoomOut').addEventListener('click', () => {
      scale = Math.max(scale - 0.1, 0.8);
      viewer.style.transform = `scale(${scale})`;
    });

    updatePageInfo();
  </script>
</body>
</html>
