<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>PRIME-CBT — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060b1a;            /* deep navy-black */
    --surface: #0f172a;       /* slate-900 */
    --surface-2: #1e293b;     /* slate-800 */
    --border: #334155;        /* slate-700 */
    
    --text: #f1f5f9;          /* slate-100 */
    --muted-1: #cbd5e1;       /* slate-300 */
    --muted-2: #94a3b8;       /* slate-400 */
    --muted-3: #64748b;       /* slate-500 */
    --muted-4: #475569;       /* slate-600 */

    --emerald: #10b981;       /* emerald-500 */
    --emerald-bright: #34d399;/* emerald-400 */
    --teal: #2dd4bf;          /* teal-400 */
    --red: #f87171;           /* red-400 */
    --amber: #fbbf24;         /* amber-400 */
    --radius: 16px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  .app {
    width: 100%;
    max-width: 480px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100%;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    position: relative;
    overflow: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(12px);
    gap: 12px;
    z-index: 10;
    flex-shrink: 0;
  }

  .back-btn, .icon-btn {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: var(--surface-2);
    color: var(--text);
    text-decoration: none;
    flex-shrink: 0;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .back-btn:hover, .icon-btn:hover {
    background: var(--muted-4);
    border-color: var(--muted-3);
  }

  .back-btn svg, .icon-btn svg {
    width: 20px;
    height: 20px;
  }

  .topbar-text {
    flex: 1;
  }

  .topbar-text h1 {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
  }

  .topbar-text p {
    font-size: 0.75rem;
    color: var(--muted-2);
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    -webkit-overflow-scrolling: touch;
  }

  .profile-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    flex-shrink: 0;
  }

  .avatar-wrap {
    position: relative;
    margin-bottom: 4px;
  }

  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(124, 58, 237, 0.15);
    color: #a78bfa;
    border: 2px solid rgba(124, 58, 237, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.5rem;
  }

  .level-badge {
    position: absolute;
    bottom: 0;
    right: 0;
    background: var(--amber);
    color: var(--bg);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 10px;
    border: 2px solid var(--surface);
  }

  .profile-name {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
  }

  .profile-meta {
    font-size: 0.8rem;
    color: var(--muted-2);
    margin-bottom: 8px;
  }

  .profile-stats {
    width: 100%;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-top: 4px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    flex: 1;
  }

  .stat-num {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
  }

  .stat-num.emerald {
    color: var(--emerald-bright);
  }

  .stat-label {
    font-size: 0.7rem;
    color: var(--muted-2);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .stat-divider {
    width: 1px;
    height: 24px;
    background: var(--border);
  }

  .menu-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    flex-shrink: 0;
  }

  .menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    text-decoration: none;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    background: none;
    border-left: none;
    border-right: none;
    border-top: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .menu-card .menu-item:last-child {
    border-bottom: none;
  }

  .menu-item:hover {
    background: var(--surface-2);
  }

  .menu-left {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.9rem;
    font-weight: 500;
  }

  .menu-left svg {
    width: 20px;
    height: 20px;
    color: var(--muted-2);
  }

  .menu-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge {
    background: rgba(248, 113, 113, 0.15);
    color: var(--red);
    border: 1px solid rgba(248, 113, 113, 0.3);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 10px;
  }

  .chevron {
    width: 16px;
    height: 16px;
    color: var(--muted-3);
  }

  .logout-btn .menu-left svg {
    color: var(--red);
  }

  .logout-btn span {
    color: var(--red);
    font-weight: 600;
  }

  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(6, 11, 26, 0.75);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 100;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    transform: scale(0.95);
    transition: transform 0.2s ease;
  }

  .modal-overlay.active .modal-box {
    transform: scale(1);
  }

  .modal-box h3 {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }

  .modal-box p {
    font-size: 0.85rem;
    color: var(--muted-1);
    line-height: 1.4;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  .btn-cancel, .btn-confirm {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    border: none;
    text-decoration: none;
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .btn-cancel {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-cancel:hover {
    background: var(--muted-4);
    border-color: var(--muted-3);
  }

  .btn-confirm {
    background: rgba(248, 113, 113, 0.2);
    color: var(--red);
    border: 1px solid rgba(248, 113, 113, 0.4);
  }

  .btn-confirm:hover {
    background: rgba(248, 113, 113, 0.3);
    border-color: var(--red);
  }
</style>
</head>
<body>
  <div class="app">
    <!-- Top Bar -->
    <div class="topbar animate-fade-up">
      <a href="home.html" class="back-btn" aria-label="Back to Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>

      <div class="topbar-text">
        <h1>Profile</h1>
        <p>Your account & preferences</p>
      </div>

    
      </a>
    </div>

    <!-- Content -->
    <div class="content">
      <!-- Profile Header -->
      <section class="profile-header animate-fade-up delay-1">
        <div class="avatar-wrap">
          <div class="avatar">JD</div>
          <div class="level-badge">12</div>
        </div>
        <h2 class="profile-name">John Doe</h2>
        <p class="profile-meta">Computer Science · 300 Level</p>

        <div class="profile-stats">
          <div class="stat">
            <div class="stat-num emerald">14</div>
            <div class="stat-label">Day Streak</div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <div class="stat-num">2,450</div>
            <div class="stat-label">XP</div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <div class="stat-num">76%</div>
            <div class="stat-label">Accuracy</div>
          </div>
        </div>
      </section>

      <!-- Main Menu -->
      <section class="menu-card animate-fade-up delay-2">
        <a href="account.html" class="menu-item">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>My Account</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </a>

        <a href="progress.html" class="menu-item">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 20V10"/>
              <path d="M12 20V4"/>
              <path d="M6 20v-6"/>
            </svg>
            <span>My Progress</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </a>

        <a href="achievements.html" class="menu-item">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="6"/>
              <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
            </svg>
            <span>Achievements</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </a>

        <a href="leaderboard.html" class="menu-item">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Leaderboard</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </a>

        <a href="notification.html" class="menu-item">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
            </svg>
            <span>Notifications</span>
          </div>
          <div class="menu-right">
            <span class="badge">2</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18l6-6-6-6"/>
            </svg>
          </div>
        </a>
      </section>

      <!-- Settings & Logout -->
      <section class="menu-card animate-fade-up delay-3">
        <a href="settings.html" class="menu-item">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <span>Settings</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </a>

        <button type="button" class="menu-item logout-btn" id="logoutBtn">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" x2="9" y1="12" y2="12"/>
            </svg>
            <span>Log Out</span>
          </div>
        </button>
      </section>
    </div>
  </div>

  <!-- Logout Modal -->
  <div class="modal-overlay" id="logoutModal">
    <div class="modal-box">
      <h3>Log Out</h3>
      <p>Are you sure you want to log out of your PRIME-CBT account?</p>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="cancelLogout">Cancel</button>
        <a href="auth.html" class="btn-confirm">Log Out</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const logoutBtn = document.getElementById('logoutBtn');
      const logoutModal = document.getElementById('logoutModal');
      const cancelLogout = document.getElementById('cancelLogout');

      if (logoutBtn && logoutModal) {
        logoutBtn.addEventListener('click', () => {
          logoutModal.classList.add('active');
        });
      }

      if (cancelLogout && logoutModal) {
        cancelLogout.addEventListener('click', () => {
          logoutModal.classList.remove('active');
        });
      }

      if (logoutModal) {
        logoutModal.addEventListener('click', (e) => {
          if (e.target === logoutModal) {
            logoutModal.classList.remove('active');
          }
        });
      }
    });
  </script>
</body>
</html>
