<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060b1a">

  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060b1a;
    --surface: #0f172a;
    --surface-2: #1e293b;
    --border: #334155;

    --text: #f1f5f9;
    --muted-1: #cbd5e1;
    --muted-2: #94a3b8;
    --muted-3: #64748b;
    --muted-4: #475569;

    --emerald-bright: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --radius: 1rem;
    --pad: clamp(1rem, 4vw, 2rem);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Everything below is in rem, so the whole page scales fluidly with the screen */
  html {
    font-size: clamp(14px, 13px + 0.35vw, 18px);
    -webkit-text-size-adjust: 100%;
    background: var(--bg);
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 70rem;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  @media (min-width: 70rem) {
    .app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: max(1rem, env(safe-area-inset-top)) var(--pad) 1rem;
    padding-left: max(var(--pad), env(safe-area-inset-left));
    padding-right: max(var(--pad), env(safe-area-inset-right));
    border-bottom: 1px solid var(--border);
    background: rgba(15, 23, 42, 0.92);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }

  .back-btn {
    width: 2.75rem;
    height: 2.75rem;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0.75rem;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    text-decoration: none;
    flex-shrink: 0;
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .back-btn:hover { background: var(--muted-4); border-color: var(--muted-3); }
  .back-btn svg { width: 1.25rem; height: 1.25rem; }

  .topbar-text { flex: 1; min-width: 0; }
  .topbar-text h1 { font-size: 1.1rem; font-weight: 700; }
  .topbar-text p { font-size: 0.8rem; color: var(--muted-2); }

  /* ---------- Content (fluid grid, no fixed breakpoints needed) ---------- */
  .content {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr));
    align-content: start;
    align-items: start;
    gap: clamp(1rem, 3vw, 1.5rem);
    padding: var(--pad);
    padding-bottom: max(var(--pad), env(safe-area-inset-bottom));
    padding-left: max(var(--pad), env(safe-area-inset-left));
    padding-right: max(var(--pad), env(safe-area-inset-right));
  }

  .content > * { min-width: 0; }

  .full { grid-column: 1 / -1; }

  /* ---------- Status banner (shows real errors instead of failing silently) ---------- */
  .status {
    background: rgba(248, 113, 113, 0.12);
    border: 1px solid rgba(248, 113, 113, 0.35);
    color: var(--muted-1);
    border-radius: 0.75rem;
    padding: 0.75rem 1rem;
    font-size: 0.85rem;
    line-height: 1.45;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
    overflow-wrap: anywhere;
  }

  .status[hidden] { display: none; }
  .status strong { color: var(--red); }

  .status button {
    flex-shrink: 0;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.35rem 0.7rem;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }

  /* ---------- Profile header ---------- */
  .profile-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: clamp(1.25rem, 4vw, 2rem) clamp(1rem, 4vw, 1.75rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.6rem;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    transition: opacity 0.3s ease;
  }

  .profile-header.is-loading { opacity: 0.55; }

  .avatar-wrap { position: relative; margin-bottom: 0.25rem; }

  .avatar {
    width: 4.75rem;
    height: 4.75rem;
    border-radius: 50%;
    background: rgba(124, 58, 237, 0.15);
    color: #a78bfa;
    border: 2px solid rgba(124, 58, 237, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.6rem;
  }

  .level-badge {
    position: absolute;
    bottom: 0;
    right: 0;
    background: var(--amber);
    color: var(--bg);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 0.1rem 0.45rem;
    border-radius: 0.7rem;
    border: 2px solid var(--surface);
  }

  .profile-name {
    font-size: 1.25rem;
    font-weight: 700;
    max-width: 100%;
    overflow-wrap: anywhere;
  }

  .profile-meta {
    font-size: 0.85rem;
    color: var(--muted-2);
    margin-bottom: 0.5rem;
    max-width: 100%;
    overflow-wrap: anywhere;
    min-height: 1.2em;
  }

  .profile-stats {
    width: 100%;
    max-width: 34rem;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 0.75rem 0.5rem;
    margin-top: 0.25rem;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
    flex: 1;
    min-width: 0;
  }

  .stat-num {
    font-size: 1.15rem;
    font-weight: 700;
    max-width: 100%;
    overflow-wrap: anywhere;
  }

  .stat-num.emerald { color: var(--emerald-bright); }

  .stat-label {
    font-size: 0.68rem;
    color: var(--muted-2);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-align: center;
  }

  .stat-divider { width: 1px; height: 1.5rem; background: var(--border); flex-shrink: 0; }

  /* ---------- Menus ---------- */
  .menu-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
  }

  .menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    min-height: 3.25rem;
    padding: 0.85rem 1rem;
    text-decoration: none;
    color: var(--text);
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    width: 100%;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .menu-card .menu-item:last-child { border-bottom: none; }
  .menu-item:hover { background: var(--surface-2); }

  .menu-item:focus-visible,
  .back-btn:focus-visible,
  .btn-cancel:focus-visible,
  .btn-confirm:focus-visible,
  .status button:focus-visible {
    outline: 2px solid var(--emerald-bright);
    outline-offset: -2px;
  }

  .menu-left {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.95rem;
    font-weight: 500;
    min-width: 0;
  }

  .menu-left svg { width: 1.25rem; height: 1.25rem; color: var(--muted-2); flex-shrink: 0; }
  .menu-left span { min-width: 0; overflow-wrap: anywhere; }

  .menu-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }

  .badge {
    background: rgba(248, 113, 113, 0.15);
    color: var(--red);
    border: 1px solid rgba(248, 113, 113, 0.3);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 0.1rem 0.45rem;
    border-radius: 0.7rem;
  }

  .badge[hidden] { display: none; }

  .chevron { width: 1rem; height: 1rem; color: var(--muted-3); flex-shrink: 0; }

  .logout-btn .menu-left svg { color: var(--red); }
  .logout-btn span { color: var(--red); font-weight: 600; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    overflow-y: auto;
    background: rgba(6, 11, 26, 0.75);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .modal-overlay.active { opacity: 1; pointer-events: auto; }

  .modal-box {
    width: 100%;
    max-width: 22rem;
    margin: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    transform: scale(0.95);
    transition: transform 0.2s ease;
  }

  .modal-overlay.active .modal-box { transform: scale(1); }

  .modal-box h3 { font-size: 1.15rem; font-weight: 700; }
  .modal-box p { font-size: 0.9rem; color: var(--muted-1); line-height: 1.45; }

  .modal-actions { display: flex; gap: 0.65rem; margin-top: 0.5rem; }

  .btn-cancel, .btn-confirm {
    flex: 1;
    min-height: 2.75rem;
    padding: 0.6rem;
    border-radius: 0.65rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .btn-cancel { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-cancel:hover { background: var(--muted-4); border-color: var(--muted-3); }

  .btn-confirm {
    background: rgba(248, 113, 113, 0.2);
    color: var(--red);
    border: 1px solid rgba(248, 113, 113, 0.4);
  }

  .btn-confirm:hover { background: rgba(248, 113, 113, 0.3); border-color: var(--red); }
  .btn-confirm:disabled { opacity: 0.6; cursor: wait; }

  /* ---------- Entrance animation ---------- */
  .animate-fade-up { animation: fadeUp 0.4s ease both; }
  .delay-1 { animation-delay: 0.05s; }
  .delay-2 { animation-delay: 0.1s; }
  .delay-3 { animation-delay: 0.15s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  /* ---------- Edge cases ---------- */

  /* Tiny screens (small phones, split-screen, narrow foldables) */
  @media (max-width: 320px) {
    .profile-stats { flex-direction: column; gap: 0.6rem; }
    .stat { flex: none; width: 100%; }
    .stat-divider { width: 60%; height: 1px; }
    .modal-actions { flex-direction: column-reverse; }
  }

  /* Short landscape screens (phones turned sideways) */
  @media (max-height: 480px) and (orientation: landscape) {
    .topbar { position: static; }
    .modal-overlay { align-items: flex-start; }
  }

  /* Big TVs / ultrawide: keep content comfortably centred */
  @media (min-width: 1800px) {
    html { font-size: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .animate-fade-up { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>

  <script>
    /* ====== CONFIG: use the SAME URL and anon key as auth.html ====== */
    const SUPABASE_URL = 'https://xuofkjjhupgmrphzgyun.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_GThKt7BvR1D81U939_EQkw_yCnTQ3xh';

    const T = {
      profiles: 'profiles',            // id (= auth user id), full_name, department, study_level, xp, streak, level (optional)
      notifications: 'notifications',  // user_id, is_read
      results: 'test_results'          // user_id, score, total_questions
    };

    // Used only when the profile has no `level` value. Match your home page formula.
    const levelFromXp = (xp) => Math.floor(xp / 500) + 1;
    /* ================================================================ */

    const $ = (id) => document.getElementById(id);
    const fmt = (n) => Number(n || 0).toLocaleString();
    const initials = (name) =>
      (name || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();

    let sb = null;
    let uid = null;
    let authUser = null;
    let channel = null;
    let refreshTimer = null;

    function showStatus(message) {
      $('statusText').innerHTML = '<strong>Problem:</strong> ' +
        String(message).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
      $('statusBanner').hidden = false;
      $('profileHeader').classList.remove('is-loading');
    }

    function clearStatus() { $('statusBanner').hidden = true; }

    function renderFromAuthOnly() {
      const meta = (authUser && authUser.user_metadata) || {};
      const name = meta.full_name || meta.name || ((authUser && authUser.email) || '').split('@')[0] || 'Student';
      $('avatar').textContent = initials(name);
      $('profileName').textContent = name;
      $('profileMeta').textContent = (authUser && authUser.email) || '';
    }

    async function loadAll() {
      if (!sb || !uid) return;

      const results = await Promise.allSettled([
        sb.from(T.profiles).select('*').eq('id', uid).maybeSingle(),
        sb.from(T.notifications).select('id', { count: 'exact', head: true })
          .eq('user_id', uid).eq('is_read', false),
        sb.from(T.results).select('score,total_questions').eq('user_id', uid)
      ]);

      const labels = [T.profiles, T.notifications, T.results];
      const errors = [];
      const data = results.map((r, i) => {
        if (r.status === 'rejected') {
          errors.push(`${labels[i]}: ${(r.reason && r.reason.message) || r.reason}`);
          return null;
        }
        if (r.value.error) {
          errors.push(`${labels[i]}: ${r.value.error.message}`);
          return null;
        }
        return r.value;
      });

      const p = (data[0] && data[0].data) || {};
      const meta = authUser.user_metadata || {};
      const name =
        p.full_name || meta.full_name || meta.name ||
        (authUser.email || '').split('@')[0] || 'Student';

      $('avatar').textContent = initials(name);
      $('profileName').textContent = name;
      $('profileMeta').textContent =
        [p.department, p.study_level ? `${p.study_level} Level` : null]
          .filter(Boolean).join(' · ') || authUser.email || '';

      const xp = Number(p.xp || 0);
      $('levelBadge').textContent = p.level != null ? p.level : levelFromXp(xp);
      $('statStreak').textContent = fmt(p.streak);
      $('statXp').textContent = fmt(xp);

      // Accuracy from real results; "–" until the user has taken a test
      const rows = (data[2] && data[2].data) || [];
      const correct = rows.reduce((s, r) => s + Number(r.score || 0), 0);
      const total = rows.reduce((s, r) => s + Number(r.total_questions || 0), 0);
      $('statAcc').textContent = total > 0 ? Math.round((correct / total) * 100) + '%' : '–';

      // Unread notifications badge
      const unread = (data[1] && data[1].count) || 0;
      const badge = $('notifBadge');
      badge.textContent = unread > 99 ? '99+' : unread;
      badge.hidden = unread === 0;

      $('profileHeader').classList.remove('is-loading');

      if (errors.length) {
        console.error('[profile] load errors:', errors);
        showStatus(errors.join(' | '));
      } else {
        clearStatus();
      }
    }

    // Debounce so bursts of realtime events cause a single refresh
    function scheduleRefresh() {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(loadAll, 150);
    }

    function subscribeRealtime() {
      try {
        channel = sb.channel('profile-' + uid)
          .on('postgres_changes',
            { event: '*', schema: 'public', table: T.profiles, filter: `id=eq.${uid}` }, scheduleRefresh)
          .on('postgres_changes',
            { event: '*', schema: 'public', table: T.notifications, filter: `user_id=eq.${uid}` }, scheduleRefresh)
          .on('postgres_changes',
            { event: '*', schema: 'public', table: T.results, filter: `user_id=eq.${uid}` }, scheduleRefresh)
          .subscribe((status, err) => {
            if (status === 'CHANNEL_ERROR') console.error('[profile] realtime error:', err);
          });
      } catch (e) {
        console.error('[profile] realtime failed to start:', e);
      }
    }

    async function logout() {
      const btn = $('confirmLogout');
      btn.disabled = true;
      try {
        if (channel && sb) sb.removeChannel(channel);
        if (sb) await sb.auth.signOut();
      } catch (e) {
        console.error('[profile] signOut error:', e);
      }
      window.location.href = 'auth.html';
    }

    async function init() {
      // 1. Config and library checks, so a bad setup shows a clear message instead of a dead page
      if (!window.supabase || !window.supabase.createClient) {
        showStatus('The Supabase library did not load. Check your internet connection and reload.');
        return;
      }
      if (!/^https?:\/\//.test(SUPABASE_URL) || SUPABASE_ANON_KEY.indexOf('YOUR_') === 0) {
        showStatus('Supabase is not configured. Set SUPABASE_URL and SUPABASE_ANON_KEY in the script (same values as auth.html).');
        return;
      }

      try {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. Auth guard: no session means no access
        const { data, error } = await sb.auth.getSession();
        if (error) throw error;
        if (!data.session) { window.location.href = 'auth.html'; return; }

        authUser = data.session.user;
        uid = authUser.id;

        renderFromAuthOnly();
        await loadAll();
        subscribeRealtime();

        sb.auth.onAuthStateChange((event) => {
          if (event === 'SIGNED_OUT') window.location.href = 'auth.html';
        });
      } catch (e) {
        console.error('[profile] init error:', e);
        showStatus((e && e.message) || 'Something went wrong while loading your profile.');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const logoutModal = $('logoutModal');

      $('logoutBtn').addEventListener('click', () => logoutModal.classList.add('active'));
      $('cancelLogout').addEventListener('click', () => logoutModal.classList.remove('active'));
      $('confirmLogout').addEventListener('click', logout);
      $('statusRetry').addEventListener('click', () => {
        if (sb && uid) { loadAll(); } else { window.location.reload(); }
      });
      logoutModal.addEventListener('click', (e) => {
        if (e.target === logoutModal) logoutModal.classList.remove('active');
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') logoutModal.classList.remove('active');
      });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) loadAll();
      });

      init();
    });
  </script>
</body>
</html>
