<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070D1D">
  <title>PRIME-CBT — Profile</title>
  <link rel="icon" type="image/png" href="34a8580a-ede3-4350-a224-6f298b16a670_removalai_preview.png">
<link rel="apple-touch-icon" href="34a8580a-ede3-4350-a224-6f298b16a670_removalai_preview.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* PRIME-CBT palette (same as the home page) */
    --bg: #070D1D;
    --surface: #10182B;
    --surface-2: #1A2540;
    --surface-muted: #0D1424;
    --border: #273852;

    --text: #F1F5FF;
    --muted-1: #C3CEEA;
    --muted-2: #97A6CF;
    --muted-3: #7F8CAC;
    --muted-4: #2A3850;

    --emerald: #31D3A2;
    --emerald-bright: #31D3A2;
    --em-soft: rgba(49, 211, 162, 0.14);
    --on-em: #06101A;
    --red: #f87171;
    --amber: #fbbf24;
    --radius: 1.1rem;
    --pad: clamp(1rem, 4vw, 2rem);
    --nav-h: 72px;
    --serif: 'Lora', Georgia, serif;
    --glass: radial-gradient(120% 90% at 0% 0%, rgba(255,255,255,.055), transparent 55%), linear-gradient(160deg, #121C32, #0F1729);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* Everything below is in rem, so the whole page scales fluidly with the screen */
  html {
    font-size: clamp(16px, 15px + 0.35vw, 18px);
    -webkit-text-size-adjust: 100%;
    background: var(--bg);
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  /* Soft ambient glow behind the page (fixed, so scrolling stays cheap) */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(120% 40% at 100% 0%, rgba(70,110,210,.18), transparent 60%),
      radial-gradient(80% 35% at 0% 45%, rgba(49,211,162,.09), transparent 70%);
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }

  .app {
    width: 100%;
    max-width: 70rem;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 70rem) {
    .app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: max(1rem, env(safe-area-inset-top)) var(--pad) 1rem;
    padding-left: max(var(--pad), env(safe-area-inset-left));
    padding-right: max(var(--pad), env(safe-area-inset-right));
    border-bottom: 1px solid rgba(255,255,255,.07);
    /* Solid background instead of blur: blur is slow on mid/low-end phones */
    background: rgba(7, 13, 29, 0.95);
  }

  .back-btn, .icon-btn {
    width: 2.75rem;
    height: 2.75rem;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255,255,255,.04);
    color: var(--text);
    border: 1px solid rgba(255,255,255,.08);
    text-decoration: none;
    flex-shrink: 0;
    transition: background 0.2s ease, transform 0.15s ease;
  }

  .back-btn:hover, .icon-btn:hover { background: var(--em-soft); }
  .back-btn:active, .icon-btn:active { transform: scale(0.94); }
  .back-btn svg, .icon-btn svg { width: 1.25rem; height: 1.25rem; }

  .topbar-text { flex: 1; min-width: 0; }
  .topbar-text h1 { font-family: var(--serif); font-size: 1.45rem; font-weight: 600; line-height: 1.15; }
  .topbar-text p {
    font-size: 0.8rem; color: var(--muted-2); margin-top: 0.1rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------- Content (fluid grid, no fixed breakpoints needed) ---------- */
  .content {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr));
    align-content: start;
    align-items: start;
    gap: clamp(1rem, 3vw, 1.5rem);
    padding: var(--pad);
    padding-bottom: calc(var(--nav-h) + 3rem + env(safe-area-inset-bottom));
    padding-left: max(var(--pad), env(safe-area-inset-left));
    padding-right: max(var(--pad), env(safe-area-inset-right));
  }

  .content > * { min-width: 0; }

  .full { grid-column: 1 / -1; }

  /* ---------- Status banner (shows real errors instead of failing silently) ---------- */
  .status {
    background: rgba(248, 113, 113, 0.12);
    border: 1px solid rgba(248, 113, 113, 0.35);
    color: var(--muted-1);
    border-radius: 0.75rem;
    padding: 0.75rem 1rem;
    font-size: 0.85rem;
    line-height: 1.45;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
    overflow-wrap: anywhere;
  }

  .status[hidden] { display: none; }
  .status strong { color: var(--red); }

  .status button {
    flex-shrink: 0;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.35rem 0.7rem;
    min-height: 2.25rem;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }

  /* ---------- Profile header ---------- */
  .profile-header {
    background: radial-gradient(90% 120% at 100% 0%, rgba(49,211,162,.12), transparent 60%), var(--glass);
    border: 1px solid #2A4058;
    border-radius: var(--radius);
    padding: clamp(1.1rem, 4vw, 1.6rem);
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-areas: "av info" "stats stats";
    align-items: center;
    column-gap: 1.1rem;
    row-gap: 1.1rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.09), 0 18px 40px -22px rgba(49,211,162,.3);
    transition: opacity 0.3s ease;
  }

  .profile-header.is-loading { opacity: 0.55; }

  .avatar-wrap { grid-area: av; position: relative; }

  .avatar {
    width: 4.9rem;
    height: 4.9rem;
    border-radius: 50%;
    background: rgba(49, 211, 162, 0.14);
    color: var(--emerald);
    border: 2px solid rgba(49, 211, 162, 0.5);
    box-shadow: 0 0 0 5px rgba(49,211,162,.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.6rem;
    overflow: hidden;
  }

  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .level-badge {
    position: absolute;
    bottom: -0.15rem;
    right: -0.35rem;
    background: var(--emerald);
    color: var(--on-em);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.12rem 0.5rem;
    border-radius: 0.8rem;
    border: 2px solid var(--surface);
  }
  .level-badge::before { content: "Lv "; }

  .profile-info { grid-area: info; min-width: 0; }

  .profile-name {
    font-family: var(--serif);
    font-size: 1.45rem;
    font-weight: 600;
    line-height: 1.2;
    max-width: 100%;
    overflow-wrap: anywhere;
  }

  .profile-meta {
    font-size: 0.9rem;
    color: var(--muted-2);
    margin-top: 0.2rem;
    max-width: 100%;
    overflow-wrap: anywhere;
    min-height: 1.2em;
  }

  .profile-stats {
    grid-area: stats;
    width: 100%;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: rgba(5, 10, 22, .45);
    border: 1px solid var(--border);
    border-radius: 0.9rem;
    padding: 0.9rem 0.5rem;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
    flex: 1;
    min-width: 0;
  }

  .stat-num {
    font-family: var(--serif);
    font-size: 1.6rem;
    font-weight: 600;
    line-height: 1;
    max-width: 100%;
    overflow-wrap: anywhere;
  }

  .stat-num.emerald { color: var(--emerald-bright); }

  .stat-label {
    font-size: 0.74rem;
    color: var(--muted-2);
    font-weight: 500;
    text-align: center;
  }

  .stat-divider { width: 1px; height: 2rem; background: var(--border); flex-shrink: 0; }

  /* ---------- Menus ---------- */
  .menu-card {
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 12px 26px -16px rgba(0,0,0,.7);
  }

  .menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    min-height: 3.6rem;
    padding: 0.7rem 1rem;
    text-decoration: none;
    color: var(--text);
    background: none;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,.06);
    width: 100%;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .menu-card .menu-item:last-child { border-bottom: none; }
  .menu-item:hover { background: rgba(255,255,255,.03); }
  .menu-item:active { background: var(--em-soft); }

  .menu-item:focus-visible,
  .back-btn:focus-visible,
  .status button:focus-visible {
    outline: 2px solid var(--emerald-bright);
    outline-offset: -2px;
  }

  .menu-left {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    font-size: 1rem;
    font-weight: 500;
    min-width: 0;
  }

  /* Icons sit in small mint tiles */
  .menu-left svg {
    width: 2.35rem; height: 2.35rem; padding: 0.55rem;
    border-radius: 0.75rem;
    background: var(--em-soft);
    border: 1px solid rgba(49,211,162,.25);
    color: var(--emerald);
    flex-shrink: 0;
  }
  .menu-left span { min-width: 0; overflow-wrap: anywhere; }

  .menu-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }

  .chevron { width: 1rem; height: 1rem; color: var(--muted-3); flex-shrink: 0; }

  .menu-item.danger { color: var(--red); }
  .menu-item.danger .menu-left svg { background: rgba(248,113,113,.12); border-color: rgba(248,113,113,.3); color: var(--red); }

  /* ---------- Floating bottom navigation (same as the home page) ---------- */
  .bottom-nav {
    position: fixed; left: 50%; transform: translateX(-50%);
    width: calc(100% - 28px); max-width: 692px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 40;
    height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
    padding: 6px; border-radius: 26px;
    background: linear-gradient(180deg, rgba(18,28,50,.78), rgba(10,16,32,.86));
    border: 1px solid var(--border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 14px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    height: 100%; min-width: 0; background: none; border: none; color: var(--muted-3);
    font-size: 11px; font-weight: 500; border-radius: 20px; position: relative; cursor: pointer;
  }
  .nav-item svg { width: 24px; height: 24px; }
  .nav-item.active { color: var(--emerald); font-weight: 600; background: radial-gradient(70% 90% at 50% 0%, rgba(49,211,162,.16), rgba(49,211,162,.03)); }
  .nav-item.active::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; border-radius: 0 0 4px 4px; background: var(--emerald); box-shadow: 0 0 12px rgba(49,211,162,.5); }
  .nav-item.active svg { filter: drop-shadow(0 0 6px rgba(49,211,162,.5)); }

  .sheet-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(3,7,16,.82); display: none; align-items: flex-end; justify-content: center; }
  .sheet-backdrop.open { display: flex; }
  .sheet { width: 100%; max-width: 720px; background: var(--surface); border: 1px solid var(--border); border-radius: 24px 24px 0 0; padding: 20px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-head b { font-family: var(--serif); font-size: 1.1rem; }
  .sheet-head button { background: none; border: none; color: var(--emerald); font-size: 13px; font-weight: 600; cursor: pointer; }
  .more-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .more-tile { display: flex; align-items: center; gap: 10px; padding: 14px; background: var(--surface-muted); border: 1px solid var(--border); border-radius: 16px; font-size: .9rem; font-weight: 600; }
  .more-tile svg { width: 22px; height: 22px; color: var(--emerald); flex-shrink: 0; }

  /* ---------- Entrance animation ---------- */
  .animate-fade-up { animation: fadeUp 0.4s ease both; }
  .delay-1 { animation-delay: 0.05s; }
  .delay-2 { animation-delay: 0.1s; }
  .delay-3 { animation-delay: 0.15s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  /* ---------- Edge cases ---------- */

  /* Tiny screens: keep the three metrics in one row, just tighter */
  @media (max-width: 340px) {
    .profile-stats { padding: 0.65rem 0.25rem; }
    .stat-num { font-size: 1.15rem; }
    .stat-label { font-size: 0.62rem; }
    .avatar { width: 4rem; height: 4rem; font-size: 1.3rem; }
  }

  /* Short landscape screens (phones turned sideways) */
  @media (max-height: 480px) and (orientation: landscape) {
    .topbar { position: static; }
  }

  /* Big TVs / ultrawide: keep content comfortably centred */
  @media (min-width: 1800px) {
    html { font-size: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .animate-fade-up { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    /* ====== CONFIG: use the SAME URL and anon key as auth.html ====== */
    const SUPABASE_URL = 'https://xuofkjjhupgmrphzgyun.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_GThKt7BvR1D81U939_EQkw_yCnTQ3xh';

    const T = {
      profiles: 'profiles',            // id (= auth user id), full_name, department, study_level, xp, streak, level (optional)
      results: 'test_results'          // user_id, score, total_questions
    };

    // If the photo is saved as a file path in Supabase Storage, this is the bucket it lives in.
    const AVATAR_BUCKET = 'avatars';

    // Used only when the profile has no `level` value. Match your home page formula.
    const levelFromXp = (xp) => Math.floor(xp / 500) + 1;
    /* ================================================================ */

    const $ = (id) => document.getElementById(id);
    const fmt = (n) => Number(n || 0).toLocaleString();
    const initials = (name) =>
      (name || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();

    let sb = null;
    let uid = null;
    let authUser = null;
    let channel = null;
    let refreshTimer = null;

    function showStatus(message) {
      $('statusText').innerHTML = '<strong>Problem:</strong> ' +
        String(message).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
      $('statusBanner').hidden = false;
      $('profileHeader').classList.remove('is-loading');
    }

    function clearStatus() { $('statusBanner').hidden = true; }

    /* ---------- Photo: works with a full link, an uploaded image, or a Storage file path ---------- */
    function pickAvatar(p, meta) {
      const v = p.avatar_url || p.avatar || p.photo_url || p.image_url || p.profile_image || p.picture ||
                meta.avatar_url || meta.avatar || meta.picture || '';
      if (!v) return '';
      let url = v;
      if (!/^(https?:|data:|blob:)/i.test(v)) {
        try { url = sb.storage.from(AVATAR_BUCKET).getPublicUrl(v).data.publicUrl; } catch (e) { return ''; }
      }
      // Cache-bust when the profile changes, so a new photo shows right away
      const ver = p.updated_at || '';
      return ver && /^https?:/i.test(url) ? url + (url.indexOf('?') > -1 ? '&' : '?') + 'v=' + encodeURIComponent(ver) : url;
    }

    function setAvatar(name, url) {
      const box = $('avatar');
      box.textContent = initials(name);
      if (!url) return;
      const img = new Image();
      img.alt = '';
      img.onload = () => { box.textContent = ''; box.appendChild(img); };
      img.src = url;
    }

    function renderFromAuthOnly() {
      const meta = (authUser && authUser.user_metadata) || {};
      const name = meta.full_name || meta.name || ((authUser && authUser.email) || '').split('@')[0] || 'Student';
      setAvatar(name, pickAvatar({}, meta));
      $('profileName').textContent = name;
      $('profileMeta').textContent = (authUser && authUser.email) || '';
    }

    async function loadAll() {
      if (!sb || !uid) return;

      // Always use the freshest account data (name/photo saved from the account page)
      try {
        const { data: u } = await sb.auth.getUser();
        if (u && u.user) authUser = u.user;
      } catch (e) { /* keep the session copy */ }

      const results = await Promise.allSettled([
        sb.from(T.profiles).select('*').eq('id', uid).maybeSingle(),
        sb.from(T.results).select('score,total_questions').eq('user_id', uid)
      ]);

      const labels = [T.profiles, T.results];
      const errors = [];
      const data = results.map((r, i) => {
        if (r.status === 'rejected') {
          errors.push(`${labels[i]}: ${(r.reason && r.reason.message) || r.reason}`);
          return null;
        }
        if (r.value.error) {
          errors.push(`${labels[i]}: ${r.value.error.message}`);
          return null;
        }
        return r.value;
      });

      const p = (data[0] && data[0].data) || {};
      const meta = authUser.user_metadata || {};
      const name =
        p.full_name || p.name || p.display_name || meta.full_name || meta.name ||
        (authUser.email || '').split('@')[0] || 'Student';

      setAvatar(name, pickAvatar(p, meta));
      $('profileName').textContent = name;
      $('profileMeta').textContent =
        [p.department, p.study_level ? `${p.study_level} Level` : null]
          .filter(Boolean).join(' · ') || authUser.email || '';

      const xp = Number(p.xp || 0);
      $('levelBadge').textContent = p.level != null ? p.level : levelFromXp(xp);
      $('statStreak').textContent = fmt(p.streak);
      $('statXp').textContent = fmt(xp);

      // Accuracy from real results; "–" until the user has taken a test
      const rows = (data[1] && data[1].data) || [];
      const correct = rows.reduce((s, r) => s + Number(r.score || 0), 0);
      const total = rows.reduce((s, r) => s + Number(r.total_questions || 0), 0);
      $('statAcc').textContent = total > 0 ? Math.round((correct / total) * 100) + '%' : '–';

      $('profileHeader').classList.remove('is-loading');

      if (errors.length) {
        console.error('[profile] load errors:', errors);
        showStatus(errors.join(' | '));
      } else {
        clearStatus();
      }
    }

    // Debounce so bursts of realtime events cause a single refresh
    function scheduleRefresh() {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(loadAll, 150);
    }

    function subscribeRealtime() {
      try {
        channel = sb.channel('profile-' + uid)
          .on('postgres_changes',
            { event: '*', schema: 'public', table: T.profiles, filter: `id=eq.${uid}` }, scheduleRefresh)
          .on('postgres_changes',
            { event: '*', schema: 'public', table: T.results, filter: `user_id=eq.${uid}` }, scheduleRefresh)
          .subscribe((status, err) => {
            if (status === 'CHANNEL_ERROR') console.error('[profile] realtime error:', err);
          });
      } catch (e) {
        console.error('[profile] realtime failed to start:', e);
      }
    }

    async function init() {
      // 1. Config and library checks, so a bad setup shows a clear message instead of a dead page
      if (!window.supabase || !window.supabase.createClient) {
        showStatus('The Supabase library did not load. Check your internet connection and reload.');
        return;
      }
      if (!/^https?:\/\//.test(SUPABASE_URL) || SUPABASE_ANON_KEY.indexOf('YOUR_') === 0) {
        showStatus('Supabase is not configured. Set SUPABASE_URL and SUPABASE_ANON_KEY in the script (same values as auth.html).');
        return;
      }

      try {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. Auth guard: no session means no access
        const { data, error } = await sb.auth.getSession();
        if (error) throw error;
        if (!data.session) { window.location.href = 'auth.html'; return; }

        authUser = data.session.user;
        uid = authUser.id;

        renderFromAuthOnly();
        await loadAll();
        subscribeRealtime();

        sb.auth.onAuthStateChange((event) => {
          if (event === 'SIGNED_OUT') window.location.href = 'auth.html';
          if (event === 'USER_UPDATED') loadAll();
        });
      } catch (e) {
        console.error('[profile] init error:', e);
        showStatus((e && e.message) || 'Something went wrong while loading your profile.');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      $('statusRetry').addEventListener('click', () => {
        if (sb && uid) { loadAll(); } else { window.location.reload(); }
      });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) loadAll();
      });
      // Coming back from the account page (back button / bfcache): refresh so the edit shows
      window.addEventListener('pageshow', (e) => { if (e.persisted) loadAll(); });

      init();
    });
  </script>

  <!-- New: More sheet + Log out button (separate from the page script above, which is unchanged) -->
  <script>
    (function () {
      var sheet = document.getElementById('moreSheet');
      document.getElementById('moreBtnNav').addEventListener('click', function () { sheet.classList.add('open'); });
      document.getElementById('moreClose').addEventListener('click', function () { sheet.classList.remove('open'); });
      sheet.addEventListener('click', function (e) { if (e.target === sheet) sheet.classList.remove('open'); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') sheet.classList.remove('open'); });
      document.getElementById('logoutBtn').addEventListener('click', function () {
        if (typeof sb === 'undefined' || !sb) { window.location.href = 'auth.html?mode=login'; return; }
        sb.auth.signOut().then(function () { window.location.replace('auth.html?mode=login'); });
      });
    })();
  </script>
