<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>PRIME-CBT — AI Study Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { navy: '#060b1a' },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b1a;
      --card-bg: #0f172a; /* slate-900 */
      --card-bg-hover: #1e293b; /* slate-800 */
      --border: #334155; /* slate-700 */
      --muted: #94a3b8; /* slate-400 */
      --text-main: #f1f5f9; /* slate-100 */
      --emerald-bright: #34d399;
      --teal-bright: #2dd4bf;
      --amber: #fbbf24;
      --red: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      position: relative;
      border-left: 1px solid rgba(51, 65, 85, 0.4);
      border-right: 1px solid rgba(51, 65, 85, 0.4);
    }

    .topbar {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(6, 11, 26, 0.95);
      backdrop-filter: blur(12px);
      z-index: 10;
      flex-shrink: 0;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #cbd5e1;
      text-decoration: none;
      margin-right: 12px;
      transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
    }

    .back-btn:hover {
      background: #1e293b;
      border-color: #475569;
      transform: scale(0.95);
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
    }

    .topbar-text h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .topbar-text p {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .ai-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }

    .ai-welcome {
      text-align: center;
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .ai-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: #34d399;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    .ai-avatar svg {
      width: 28px;
      height: 28px;
    }

    .ai-welcome h2 {
      font-family: 'Lora', serif;
      font-size: 1.5rem;
      color: #f1f5f9;
    }

    .ai-welcome p {
      font-size: 0.9rem;
      color: #94a3b8;
      max-width: 300px;
    }

    .chat-stream {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      transition: opacity 0.3s ease, transform 0.3s ease;
      animation: fadeIn 0.3s ease forwards;
    }

    .message.user {
      background: #34d399;
      color: #060b1a;
      font-weight: 500;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: #0f172a;
      color: #f1f5f9;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }

    .prompt-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
    }

    .prompt-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
    }

    .prompt-card:hover {
      background: #1e293b;
      border-color: #475569;
      transform: translateY(-2px);
    }

    .prompt-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .prompt-icon.purple {
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: #34d399;
    }

    .prompt-icon.green {
      background: rgba(45, 212, 191, 0.15);
      border: 1px solid rgba(45, 212, 191, 0.3);
      color: #2dd4bf;
    }

    .prompt-icon svg {
      width: 18px;
      height: 18px;
    }

    .prompt-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    .prompt-desc {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .ai-input-dock {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: rgba(6, 11, 26, 0.95);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }

    .ai-input-form {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 6px 6px 16px;
      transition: border-color 0.3s ease, background-color 0.3s ease;
    }

    .ai-input-form:focus-within {
      border-color: #34d399;
      background: #1e293b;
    }

    .ai-input-form input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 0.95rem;
      color: #f1f5f9;
    }

    .ai-input-form input::placeholder {
      color: #64748b;
    }

    .ai-input-form button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #34d399;
      color: #060b1a;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .ai-input-form button:hover {
      background: #2dd4bf;
      transform: scale(0.95);
    }

    .ai-input-form button svg {
      width: 16px;
      height: 16px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Instant View Switcher */
.sub-view {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  background-color: var(--bg-dark);
  z-index: 100;
  display: none; /* Hidden by default */
  overflow-y: auto;
  max-width: 480px;
}

.sub-view.active {
  display: block; /* Shows immediately when clicked */
}

  </style>
</head>
<body>
  <div class="app ai-app">
    <!-- Top Bar -->
    <div class="topbar">
      <a href="home.html" class="back-btn" aria-label="Back to Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>

      <div class="topbar-text">
        <h1>AI Study Assistant</h1>
        <p>Powered by Groq Llama 3.3</p>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="ai-content" id="chatArea">
      <!-- Welcome -->
      <div class="ai-welcome" id="welcomeBlock">
        <div class="ai-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 8V4H8"/>
            <rect width="16" height="12" x="4" y="8" rx="2"/>
            <path d="M2 14h2"/><path d="M20 14h2"/>
            <path d="M15 13v2"/><path d="M9 13v2"/>
          </svg>
        </div>
        <h2>How can I help you today?</h2>
        <p>Ask me course questions, request topic explanations, or get study advice.</p>
      </div>

      <!-- Chat Messages -->
      <div class="chat-stream" id="chatStream"></div>

      <!-- Prompt Suggestions -->
      <div class="prompt-grid" id="promptSuggestions">
        <button class="prompt-card" type="button" data-prompt="Explain a topic simply to me">
          <div class="prompt-icon purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
              <path d="M12 17h.01"/>
            </svg>
          </div>
          <div>
            <div class="prompt-title">Explain a Topic</div>
            <div class="prompt-desc">Get simple explanations of any concept</div>
          </div>
        </button>

        <button class="prompt-card" type="button" data-prompt="Quiz me on Cell Biology">
          <div class="prompt-icon purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
            </svg>
          </div>
          <div>
            <div class="prompt-title">Quiz Me</div>
            <div class="prompt-desc">Generate practice questions on weak topics</div>
          </div>
        </button>

        <button class="prompt-card" type="button" data-prompt="What should I study next based on my performance?">
          <div class="prompt-icon green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 20v-6M6 20V10M18 20V4"/>
            </svg>
          </div>
          <div>
            <div class="prompt-title">What Should I Study Next?</div>
            <div class="prompt-desc">Personalized recommendation</div>
          </div>
        </button>

        <button class="prompt-card" type="button" data-prompt="Generate 5 practice questions for me on Organic Chemistry">
          <div class="prompt-icon purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 20h9"/>
              <path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-1.873.632a.5.5 0 0 1-.638-.638l.632-1.873a2 2 0 0 1 .506-.855z"/>
            </svg>
          </div>
          <div>
            <div class="prompt-title">Generate Questions</div>
            <div class="prompt-desc">Create custom questions from any topic</div>
          </div>
        </button>
      </div>
    </div>

    <!-- Input Dock -->
    <div class="ai-input-dock">
      <form id="chatForm" class="ai-input-form">
        <input type="text" id="chatInput" placeholder="Ask me anything..." autocomplete="off">
        <button type="submit" id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m22 2-7 20-4-9-9-4Z"/>
            <path d="M22 2 11 13"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const chatForm = document.getElementById('chatForm');
      const chatInput = document.getElementById('chatInput');
      const chatStream = document.getElementById('chatStream');
      const welcomeBlock = document.getElementById('welcomeBlock');
      const promptSuggestions = document.getElementById('promptSuggestions');
      const promptCards = document.querySelectorAll('.prompt-card');
      const chatArea = document.getElementById('chatArea');

      function addMessage(text, sender) {
        if (welcomeBlock) welcomeBlock.style.display = 'none';
        if (promptSuggestions) promptSuggestions.style.display = 'none';

        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', sender);
        messageDiv.textContent = text;
        chatStream.appendChild(messageDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
      }

      function handleUserSubmit(text) {
        if (!text.trim()) return;
        addMessage(text, 'user');
        chatInput.value = '';

        setTimeout(() => {
          let reply = "I'm analyzing your request using Llama 3.3. Let's break this down step by step to ensure you master the concept!";
          if (text.toLowerCase().includes('quiz')) {
            reply = "Here is a quick practice quiz question:\n\nWhich organelle is primarily responsible for ATP production in eukaryotic cells?\nA) Endoplasmic Reticulum\nB) Mitochondrion\nC) Golgi Apparatus\nD) Ribosome\n\nType your answer below!";
          } else if (text.toLowerCase().includes('study next')) {
            reply = "Based on your recent performance metrics, your accuracy in Cell Biology is 68%, while Organic Chemistry sits at 82%. I recommend dedicating your next 30 minutes to reviewing Cellular Respiration pathways.";
          }
          addMessage(reply, 'assistant');
        }, 600);
      }

      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        handleUserSubmit(chatInput.value);
      });

      promptCards.forEach(card => {
        card.addEventListener('click', () => {
          const promptText = card.getAttribute('data-prompt');
          if (promptText) {
            handleUserSubmit(promptText);
          }
        });
      });
    });
  </script>
</body>
</html>
