<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PRIME-CBT — Materials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b1a;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --muted-light: #cbd5e1;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --teal: #2dd4bf;
      --red: #f87171;
      --blue: #60a5fa;
      --pad: clamp(14px, 4vw, 32px);
      --font-body: 'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      min-height: 100dvh;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* ---------- Top bar ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px var(--pad);
      padding-top: max(12px, env(safe-area-inset-top));
      background: rgba(6, 11, 26, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .back-btn, .icon-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-light);
      text-decoration: none;
      transition: background .2s, color .2s, transform .15s;
    }
    .back-btn:hover, .icon-btn:hover { background: rgba(30, 41, 59, 0.95); color: var(--text); }
    .back-btn:active, .icon-btn:active { transform: scale(0.94); }
    .back-btn svg, .icon-btn svg { width: 20px; height: 20px; }

    .topbar-text { flex: 1; min-width: 0; text-align: center; }
    .topbar-text h1 { font-size: clamp(16px, 2.2vw, 20px); font-weight: 700; line-height: 1.2; }
    .topbar-text p {
      font-size: 12px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ---------- Search + categories ---------- */
    .search-wrap { padding: 8px var(--pad); }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 46px;
      padding: 0 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: border-color .2s;
    }
    .search-box:focus-within { border-color: var(--emerald); }
    .search-box svg { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
    .search-box input {
      flex: 1; min-width: 0;
      background: none; border: none; outline: none;
      color: var(--text);
      font: inherit;
      font-size: 16px; /* prevents iOS zoom on focus */
    }
    .search-box input::placeholder { color: var(--muted); }

    .categories {
      display: flex;
      gap: 8px;
      padding: 4px var(--pad) 12px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-chip {
      flex-shrink: 0;
      min-height: 38px;
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted-light);
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all .2s;
    }
    .cat-chip.active {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #022c22;
      font-weight: 600;
    }

    /* ---------- Content ---------- */
    .content {
      padding: 8px var(--pad) calc(40px + env(safe-area-inset-bottom));
    }

    .section { margin-bottom: 28px; }
    .section[hidden] { display: none; }

    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; gap: 12px;
    }
    .section-header h2 {
      font-size: 13px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .05em;
    }
    .count { font-size: 12px; color: var(--muted); }
    .clear-btn {
      background: none; border: none; color: var(--emerald-bright);
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 640px)  { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
    @media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; } }

    .material-card {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      text-decoration: none;
      transition: transform .25s, border-color .25s;
    }
    .material-card:hover { transform: translateY(-2px); border-color: rgba(16, 185, 129, .4); }
    .material-card:active { transform: scale(0.99); }

    .file-icon {
      width: 44px; height: 44px; flex-shrink: 0;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .file-icon svg { width: 22px; height: 22px; }
    .file-icon.pdf  { background: rgba(248, 113, 113, .12); color: var(--red); }
    .file-icon.note { background: rgba(16, 185, 129, .12);  color: var(--emerald-bright); }
    .file-icon.guide{ background: rgba(45, 212, 191, .12);  color: var(--teal); }
    .file-icon.doc  { background: rgba(96, 165, 250, .12);  color: var(--blue); }

    .material-body { flex: 1; min-width: 0; }
    .material-title {
      font-size: 14px; font-weight: 600; line-height: 1.35; margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      word-break: break-word;
    }
    .material-meta {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
      font-size: 12px; color: var(--muted);
    }
    .material-arrow { color: var(--muted); display: flex; flex-shrink: 0; }
    .material-arrow svg { width: 18px; height: 18px; }

    /* ---------- States ---------- */
    .state {
      text-align: center; color: var(--muted); font-size: 14px;
      padding: 40px 16px;
    }
    .state button {
      margin-top: 12px; padding: 10px 18px;
      background: var(--emerald); color: #022c22; border: none; border-radius: 10px;
      font: inherit; font-weight: 600; cursor: pointer;
    }

    .skeleton {
      height: 74px; border-radius: 16px;
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .live-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); margin-right: 6px; vertical-align: middle;
    }
    .live-dot.on { background: var(--emerald-bright); box-shadow: 0 0 0 3px rgba(52, 211, 153, .2); }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a href="home.html" class="back-btn" aria-label="Back to Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="topbar-text">
        <h1>Materials</h1>
        <p><span class="live-dot" id="liveDot"></span><span id="liveText">Connecting…</span></p>
      </div>
      <a href="downloads.html" class="icon-btn" aria-label="Downloads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </a>
    </header>

    <div class="search-wrap">
      <label class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="search" id="searchInput" placeholder="Search materials..." autocomplete="off" aria-label="Search materials">
      </label>
    </div>

    <nav class="categories" id="categories" aria-label="Categories"></nav>

    <main class="content">
      <section class="section" id="recentSection" hidden>
        <div class="section-header">
          <h2>Recently Opened</h2>
          <button class="clear-btn" id="clearRecent" type="button">Clear</button>
        </div>
        <div class="grid" id="recentGrid"></div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2 id="allTitle">All Materials</h2>
          <span class="count" id="countText"></span>
        </div>
        <div class="grid" id="allGrid">
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>
        <div class="state" id="stateBox" hidden></div>
      </section>
    </main>
  </div>

  <!-- Supabase client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.SUPABASE_URL = "https://xuofkjjhupgmrphzgyun.supabase.co";
    window.SUPABASE_ANON_KEY = "sb_publishable_GThKt7BvR1D81U939_EQkw_yCnTQ3xh";
  </script>

  <script>
    /* ================= Supabase client ================= */
    function getClient() {
      // Use whichever your shared config already exposes
      const existing = window.supabaseClient || window.sb || window.db;
      if (existing && typeof existing.from === 'function') return existing;
      if (window.supabase && typeof window.supabase.from === 'function') return window.supabase;

      const url = window.SUPABASE_URL;
      const key = window.SUPABASE_ANON_KEY;
      if (url && key && window.supabase && window.supabase.createClient) {
        return window.supabase.createClient(url, key);
      }
      return null;
    }
    const client = getClient();

    /* ================= State ================= */
    const RECENT_KEY = 'primecbt_recent_materials';
    let materials = [];
    let category = 'all';
    let query = '';

    const $ = id => document.getElementById(id);
    const els = {
      cats: $('categories'), search: $('searchInput'),
      recentSection: $('recentSection'), recentGrid: $('recentGrid'),
      allGrid: $('allGrid'), count: $('countText'), state: $('stateBox'),
      dot: $('liveDot'), live: $('liveText')
    };

    /* ================= Helpers ================= */
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const ICONS = {
      pdf:  '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/>',
      note: '<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>',
      guide:'<path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>',
      doc:  '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/>'
    };

    function iconClass(m) {
      if (m.category === 'Study Guides') return 'guide';
      if (m.category === 'Course Notes') return 'note';
      if (m.category === 'Handouts') return 'doc';
      return 'pdf';
    }

    function formatSize(bytes) {
      if (!bytes) return '';
      const mb = bytes / 1048576;
      return mb >= 1 ? mb.toFixed(1) + ' MB' : Math.max(1, Math.round(bytes / 1024)) + ' KB';
    }

    function metaParts(m) {
      const parts = [];
      if (m.pages) parts.push(m.pages + (m.pages === 1 ? ' page' : ' pages'));
      if (m.file_type) parts.push(String(m.file_type).toUpperCase());
      const size = formatSize(m.size_bytes);
      if (size) parts.push(size);
      if (!parts.length && m.category) parts.push(m.category);
      return parts;
    }

    function cardHTML(m) {
      const href = 'pdf-reader.html?id=' + encodeURIComponent(m.id) + '&file=' + encodeURIComponent(m.file_url || '');
      const meta = metaParts(m).map(p => '<span>' + esc(p) + '</span>').join('');
      return (
        '<a href="' + href + '" class="material-card" data-id="' + esc(m.id) + '">' +
          '<div class="file-icon ' + iconClass(m) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' + ICONS[iconClass(m)] + '</svg></div>' +
          '<div class="material-body"><div class="material-title">' + esc(m.title) + '</div><div class="material-meta">' + meta + '</div></div>' +
          '<div class="material-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>' +
        '</a>'
      );
    }

    /* ================= Recently opened (real, per-device) ================= */
    function getRecent() {
      try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; }
    }
    function pushRecent(id) {
      const list = [id, ...getRecent().filter(x => x !== id)].slice(0, 6);
      try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch {}
    }

    /* ================= Render ================= */
    function renderCategories() {
      const cats = [...new Set(materials.map(m => m.category).filter(Boolean))].sort();
      if (category !== 'all' && !cats.includes(category)) category = 'all';
      els.cats.innerHTML =
        ['all', ...cats].map(c =>
          '<button type="button" class="cat-chip' + (c === category ? ' active' : '') + '" data-category="' + esc(c) + '">' +
          (c === 'all' ? 'All' : esc(c)) + '</button>'
        ).join('');
    }

    function render() {
      // Recent
      const recentItems = getRecent().map(id => materials.find(m => String(m.id) === String(id))).filter(Boolean);
      els.recentSection.hidden = recentItems.length === 0;
      els.recentGrid.innerHTML = recentItems.map(cardHTML).join('');

      // Filtered list
      const list = materials.filter(m =>
        (category === 'all' || m.category === category) &&
        (!query || (m.title || '').toLowerCase().includes(query))
      );

      els.allGrid.innerHTML = list.map(cardHTML).join('');
      els.count.textContent = list.length ? list.length + (list.length === 1 ? ' item' : ' items') : '';

      if (!list.length) {
        els.state.hidden = false;
        els.state.textContent = materials.length
          ? 'No materials match your search.'
          : 'No materials have been uploaded yet.';
      } else {
        els.state.hidden = true;
      }
    }

    function setLive(on, text) {
      els.dot.classList.toggle('on', on);
      els.live.textContent = text;
    }

    function showError(msg) {
      els.allGrid.innerHTML = '';
      els.count.textContent = '';
      els.state.hidden = false;
      els.state.innerHTML = esc(msg) + '<br><button type="button" id="retryBtn">Try again</button>';
      $('retryBtn').addEventListener('click', loadMaterials);
    }

    /* ================= Data ================= */
    async function loadMaterials() {
      if (!client) {
        setLive(false, 'Not connected');
        showError('Could not connect to the database. Check your internet connection and try again.');
        return;
      }
      const { data, error } = await client
        .from('materials')
        .select('id,title,category,file_url,file_type,pages,size_bytes,created_at')
        .order('created_at', { ascending: false });

      if (error) {
        setLive(false, 'Offline');
        showError('Could not load materials. ' + (error.message || ''));
        return;
      }
      materials = data || [];
      renderCategories();
      render();
    }

    function subscribeRealtime() {
      if (!client || !client.channel) return;
      client
        .channel('materials-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'materials' }, loadMaterials)
        .subscribe(status => {
          if (status === 'SUBSCRIBED') setLive(true, 'Live');
          else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') setLive(false, 'Reconnecting…');
        });
    }

    /* ================= Events ================= */
    els.search.addEventListener('input', e => {
      query = e.target.value.toLowerCase().trim();
      render();
    });

    els.cats.addEventListener('click', e => {
      const chip = e.target.closest('.cat-chip');
      if (!chip) return;
      category = chip.dataset.category;
      renderCategories();
      render();
    });

    document.addEventListener('click', e => {
      const card = e.target.closest('.material-card');
      if (card) pushRecent(card.dataset.id);
    });

    $('clearRecent').addEventListener('click', () => {
      try { localStorage.removeItem(RECENT_KEY); } catch {}
      render();
    });

    // Refresh when the tab/app comes back to the foreground or the network returns
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadMaterials(); } });
    window.addEventListener('online', loadMaterials);
    window.addEventListener('pageshow', e => { if (e.persisted) { loadMaterials(); } });

    loadMaterials();
    subscribeRealtime();
  </script>
</body>
</html>
