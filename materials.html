<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PRIME-CBT — Materials</title>
<link rel="icon" type="image/png" href="34a8580a-ede3-4350-a224-6f298b16a670_removalai_preview.png">
<link rel="apple-touch-icon" href="34a8580a-ede3-4350-a224-6f298b16a670_removalai_preview.png">
  <!-- Open connections early -->
  <link rel="preconnect" href="https://xuofkjjhupgmrphzgyun.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Lora removed (not used on this page); fewer font weights = faster -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Warm up the page people open next -->
  <link rel="prefetch" href="pdf-reader.html">

  <style>
    :root {
      --bg: #060b1a;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --muted-light: #cbd5e1;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --teal: #2dd4bf;
      --red: #f87171;
      --blue: #60a5fa;
      --pad: clamp(14px, 4vw, 32px);
      --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      min-height: 100dvh;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* ---------- Top bar ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px var(--pad);
      padding-top: max(12px, env(safe-area-inset-top));
      /* Solid background instead of backdrop-filter blur: blur is very slow on mid/low-end phones */
      background: rgba(6, 11, 26, 0.97);
    }

    .back-btn, .icon-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-light);
      text-decoration: none;
      transition: background-color .2s, color .2s, transform .15s;
    }
    .back-btn:hover, .icon-btn:hover { background: rgba(30, 41, 59, 0.95); color: var(--text); }
    .back-btn:active, .icon-btn:active { transform: scale(0.94); }
    .back-btn svg, .icon-btn svg { width: 20px; height: 20px; }

    .topbar-text { flex: 1; min-width: 0; text-align: center; }
    .topbar-text h1 { font-size: clamp(16px, 2.2vw, 20px); font-weight: 700; line-height: 1.2; }
    .topbar-text p {
      font-size: 12px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ---------- Search + categories ---------- */
    .search-wrap { padding: 8px var(--pad); }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 46px;
      padding: 0 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: border-color .2s;
    }
    .search-box:focus-within { border-color: var(--emerald); }
    .search-box svg { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
    .search-box input {
      flex: 1; min-width: 0;
      background: none; border: none; outline: none;
      color: var(--text);
      font: inherit;
      font-size: 16px; /* prevents iOS zoom on focus */
    }
    .search-box input::placeholder { color: var(--muted); }

    .categories {
      display: flex;
      gap: 8px;
      padding: 4px var(--pad) 12px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-chip {
      flex-shrink: 0;
      min-height: 38px;
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted-light);
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color .2s, border-color .2s, color .2s;
    }
    .cat-chip.active {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #022c22;
      font-weight: 600;
    }

    /* ---------- Content ---------- */
    .content {
      padding: 8px var(--pad) calc(40px + env(safe-area-inset-bottom));
    }

    .section { margin-bottom: 28px; }
    .section[hidden] { display: none; }

    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; gap: 12px;
    }
    .section-header h2 {
      font-size: 13px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .05em;
    }
    .count { font-size: 12px; color: var(--muted); }
    .clear-btn {
      background: none; border: none; color: var(--emerald-bright);
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 640px)  { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
    @media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; } }

    .material-card {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      text-decoration: none;
      transition: transform .2s, border-color .2s;
      /* Browser skips layout/paint for cards that are off-screen */
      content-visibility: auto;
      contain-intrinsic-size: auto 74px;
    }
    .material-card:hover { transform: translateY(-2px); border-color: rgba(16, 185, 129, .4); }
    .material-card:active { transform: scale(0.99); }

    .file-icon {
      width: 44px; height: 44px; flex-shrink: 0;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .file-icon svg { width: 22px; height: 22px; }
    .file-icon.pdf  { background: rgba(248, 113, 113, .12); color: var(--red); }
    .file-icon.note { background: rgba(16, 185, 129, .12);  color: var(--emerald-bright); }
    .file-icon.guide{ background: rgba(45, 212, 191, .12);  color: var(--teal); }
    .file-icon.doc  { background: rgba(96, 165, 250, .12);  color: var(--blue); }

    .material-body { flex: 1; min-width: 0; }
    .material-title {
      font-size: 14px; font-weight: 600; line-height: 1.35; margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      word-break: break-word;
    }
    .material-meta {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
      font-size: 12px; color: var(--muted);
    }
    .material-arrow { color: var(--muted); display: flex; flex-shrink: 0; }
    .material-arrow svg { width: 18px; height: 18px; }

    /* ---------- States ---------- */
    .state {
      text-align: center; color: var(--muted); font-size: 14px;
      padding: 40px 16px;
    }
    .state button, .more-btn {
      margin-top: 12px; padding: 10px 18px;
      background: var(--emerald); color: #022c22; border: none; border-radius: 10px;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    .more-wrap { text-align: center; padding: 8px 0 0; }
    .more-wrap[hidden] { display: none; }

    .skeleton {
      height: 74px; border-radius: 16px;
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .live-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); margin-right: 6px; vertical-align: middle;
    }
    .live-dot.on { background: var(--emerald-bright); box-shadow: 0 0 0 3px rgba(52, 211, 153, .2); }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a href="home.html" class="back-btn" aria-label="Back to Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="topbar-text">
        <h1>Materials</h1>
        <p><span class="live-dot" id="liveDot"></span><span id="liveText">Connecting…</span></p>
      </div>
      <a href="downloads.html" class="icon-btn" aria-label="Downloads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </a>
    </header>

    <div class="search-wrap">
      <label class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="search" id="searchInput" placeholder="Search materials..." autocomplete="off" aria-label="Search materials">
      </label>
    </div>

    <nav class="categories" id="categories" aria-label="Categories"></nav>

    <main class="content">
      <section class="section" id="recentSection" hidden>
        <div class="section-header">
          <h2>Recently Opened</h2>
          <button class="clear-btn" id="clearRecent" type="button">Clear</button>
        </div>
        <div class="grid" id="recentGrid"></div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2 id="allTitle">All Materials</h2>
          <span class="count" id="countText"></span>
        </div>
        <div class="grid" id="allGrid">
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>
        <div class="more-wrap" id="moreWrap" hidden>
          <button class="more-btn" id="moreBtn" type="button">Show more</button>
        </div>
        <div class="state" id="stateBox" hidden></div>
      </section>
    </main>
  </div>

  <!-- No blocking <script src> here: the Supabase library is loaded in the background (see below) -->
  <script>
    window.SUPABASE_URL = "https://xuofkjjhupgmrphzgyun.supabase.co";
    window.SUPABASE_ANON_KEY = "sb_publishable_GThKt7BvR1D81U939_EQkw_yCnTQ3xh";
  </script>

  <script>
    (function () {
      'use strict';

      /* ================= Config ================= */
      const RECENT_KEY = 'primecbt_recent_materials';
      const CACHE_KEY  = 'primecbt_materials_cache_v1';
      const PAGE_SIZE  = 30;               // cards rendered at a time
      const MIN_REFRESH_MS = 30000;        // don't refetch more often than this on tab focus
      const NARROW_COLUMNS = 'id,title,file_url,category,file_type,pages,size_bytes,created_at';
      const KEEP_FIELDS = ['id','title','name','file_url','url','pdf_url','file','category','course','course_code','file_type','pages','size_bytes','created_at'];

      /* ================= State ================= */
      let materials = [];
      let category = 'all';
      let query = '';
      let shown = PAGE_SIZE;
      let filtered = [];
      let signature = '';
      let selectMode = 'narrow';           // falls back to '*' if columns differ
      let client = null;
      let loading = false;
      let lastLoad = 0;
      let realtimeStarted = false;

      const $ = id => document.getElementById(id);
      const els = {
        cats: $('categories'), search: $('searchInput'),
        recentSection: $('recentSection'), recentGrid: $('recentGrid'),
        allGrid: $('allGrid'), count: $('countText'), state: $('stateBox'),
        dot: $('liveDot'), live: $('liveText'),
        moreWrap: $('moreWrap'), moreBtn: $('moreBtn')
      };

      /* ================= Helpers ================= */
      const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

      const ICONS = {
        pdf:  '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/>',
        note: '<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>',
        guide:'<path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>',
        doc:  '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/>'
      };

      /* Tolerant field readers */
      const titleOf    = m => m.title || m.name || 'Untitled';
      const urlOf      = m => m.file_url || m.url || m.pdf_url || m.file || '';
      const categoryOf = m => m.category || m.course || m.course_code || '';

      function typeOf(m) {
        if (m.file_type) return String(m.file_type).toUpperCase();
        const ext = urlOf(m).split('?')[0].split('#')[0].split('.').pop();
        return ext && ext.length <= 5 && /^[a-z0-9]+$/i.test(ext) ? ext.toUpperCase() : '';
      }

      function iconClass(m) {
        const c = categoryOf(m);
        if (c === 'Study Guides') return 'guide';
        if (c === 'Course Notes') return 'note';
        if (c === 'Handouts') return 'doc';
        return 'pdf';
      }

      function formatSize(bytes) {
        if (!bytes) return '';
        const mb = bytes / 1048576;
        return mb >= 1 ? mb.toFixed(1) + ' MB' : Math.max(1, Math.round(bytes / 1024)) + ' KB';
      }

      function metaParts(m) {
        const parts = [];
        if (m.pages) parts.push(m.pages + (m.pages === 1 ? ' page' : ' pages'));
        const type = typeOf(m);
        if (type) parts.push(type);
        const size = formatSize(m.size_bytes);
        if (size) parts.push(size);
        if (!parts.length && categoryOf(m)) parts.push(categoryOf(m));
        return parts;
      }

      function cardHTML(m) {
        const href = 'pdf-reader.html?id=' + encodeURIComponent(m.id) + '&file=' + encodeURIComponent(urlOf(m));
        const meta = metaParts(m).map(p => '<span>' + esc(p) + '</span>').join('');
        const ic = iconClass(m);
        return (
          '<a href="' + href + '" class="material-card" data-id="' + esc(m.id) + '">' +
            '<div class="file-icon ' + ic + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' + ICONS[ic] + '</svg></div>' +
            '<div class="material-body"><div class="material-title">' + esc(titleOf(m)) + '</div><div class="material-meta">' + meta + '</div></div>' +
            '<div class="material-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>' +
          '</a>'
        );
      }

      /* Keep only the fields this page uses (smaller cache, faster JSON) */
      function slim(row) {
        const o = {};
        for (const k of KEEP_FIELDS) if (row[k] != null) o[k] = row[k];
        return o;
      }

      function sortNewestFirst(list) {
        return list.slice().sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
      }

      /* ================= Cache (instant repeat visits) ================= */
      function readCache() {
        try {
          const c = JSON.parse(localStorage.getItem(CACHE_KEY));
          if (c && Array.isArray(c.data)) return c;
        } catch {}
        return null;
      }
      function writeCache(data) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), mode: selectMode, data })); } catch {}
      }

      /* ================= Recently opened (per-device) ================= */
      function getRecent() {
        try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; }
      }
      function pushRecent(id) {
        const list = [id, ...getRecent().filter(x => x !== id)].slice(0, 6);
        try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch {}
      }

      /* ================= Render ================= */
      function renderCategories() {
        const cats = [...new Set(materials.map(categoryOf).filter(Boolean))].sort();
        if (category !== 'all' && !cats.includes(category)) category = 'all';
        els.cats.innerHTML =
          ['all', ...cats].map(c =>
            '<button type="button" class="cat-chip' + (c === category ? ' active' : '') + '" data-category="' + esc(c) + '">' +
            (c === 'all' ? 'All' : esc(c)) + '</button>'
          ).join('');
      }

      function renderRecent() {
        const recentItems = getRecent().map(id => materials.find(m => String(m.id) === String(id))).filter(Boolean);
        els.recentSection.hidden = recentItems.length === 0;
        els.recentGrid.innerHTML = recentItems.map(cardHTML).join('');
      }

      function render() {
        renderRecent();

        filtered = materials.filter(m =>
          (category === 'all' || categoryOf(m) === category) &&
          (!query || titleOf(m).toLowerCase().includes(query))
        );

        // Only the first chunk goes into the DOM; the rest is added on demand
        const visible = filtered.slice(0, shown);
        els.allGrid.innerHTML = visible.map(cardHTML).join('');
        els.count.textContent = filtered.length ? filtered.length + (filtered.length === 1 ? ' item' : ' items') : '';
        els.moreWrap.hidden = filtered.length <= shown;

        if (!filtered.length) {
          els.state.hidden = false;
          els.state.textContent = materials.length
            ? 'No materials match your search.'
            : 'No materials have been uploaded yet.';
        } else {
          els.state.hidden = true;
        }
      }

      function showMore() {
        const from = shown;
        shown += PAGE_SIZE;
        // Append only the new cards instead of re-rendering everything
        els.allGrid.insertAdjacentHTML('beforeend', filtered.slice(from, shown).map(cardHTML).join(''));
        els.moreWrap.hidden = filtered.length <= shown;
      }

      function setLive(on, text) {
        els.dot.classList.toggle('on', on);
        els.live.textContent = text;
      }

      function showError(msg) {
        els.allGrid.innerHTML = '';
        els.count.textContent = '';
        els.moreWrap.hidden = true;
        els.state.hidden = false;
        els.state.innerHTML = esc(msg) + '<br><button type="button" id="retryBtn">Try again</button>';
        $('retryBtn').addEventListener('click', () => loadMaterials(true));
      }

      function applyData(list) {
        const next = sortNewestFirst(list.map(slim));
        const sig = JSON.stringify(next);
        if (sig === signature) return false;   // nothing changed: skip re-render, no flicker
        signature = sig;
        materials = next;
        renderCategories();
        render();
        return true;
      }

      /* ================= Supabase (loaded in the background) ================= */
      let clientPromise = null;
      function loadClient() {
        if (clientPromise) return clientPromise;
        clientPromise = new Promise(resolve => {
          const make = () => {
            const existing = window.supabaseClient || window.sb || window.db;
            if (existing && typeof existing.from === 'function') return resolve(existing);
            if (window.supabase && typeof window.supabase.from === 'function') return resolve(window.supabase);
            if (window.supabase && window.supabase.createClient && window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
              return resolve(window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY));
            }
            resolve(null);
          };
          if (window.supabase && (window.supabase.createClient || window.supabase.from)) return make();
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
          s.async = true;
          s.onload = make;
          s.onerror = () => resolve(null);
          document.head.appendChild(s);
        }).then(c => (client = c));
        return clientPromise;
      }

      async function fetchRows() {
        if (selectMode === 'narrow') {
          const res = await client.from('materials').select(NARROW_COLUMNS).order('created_at', { ascending: false });
          if (!res.error) return res;
          selectMode = 'all';   // a column is named differently: use select('*') from now on
        }
        return client.from('materials').select('*');
      }

      async function loadMaterials(force) {
        if (loading) return;
        if (!force && Date.now() - lastLoad < MIN_REFRESH_MS) return;
        loading = true;
        const hadCache = materials.length > 0;
        try {
          await loadClient();
          if (!client) {
            setLive(false, 'Not connected');
            if (!hadCache) showError('Could not connect to the database. Check your internet connection and try again.');
            return;
          }

          const { data, error } = await fetchRows();

          if (error) {
            setLive(navigator.onLine, navigator.onLine ? 'Live' : 'Offline');
            if (!hadCache) showError('Could not load materials. ' + (error.message || ''));
            return;
          }

          lastLoad = Date.now();
          const rows = data || [];
          applyData(rows);
          writeCache(materials);
          setLive(true, 'Live');
          startRealtimeWhenIdle();
        } catch (err) {
          setLive(false, 'Offline');
          if (!hadCache) showError('Could not load materials. ' + (err && err.message ? err.message : 'Network error.'));
        } finally {
          loading = false;
        }
      }

      /* Realtime is a nice-to-have: start it AFTER the list is on screen, and debounce updates */
      let rtTimer = null;
      function onRealtimeChange() {
        clearTimeout(rtTimer);
        rtTimer = setTimeout(() => loadMaterials(true), 800);
      }
      function startRealtimeWhenIdle() {
        if (realtimeStarted || !client || !client.channel) return;
        realtimeStarted = true;
        const start = () => {
          client
            .channel('materials-live')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'materials' }, onRealtimeChange)
            .subscribe(status => {
              if (status === 'SUBSCRIBED') setLive(true, 'Live');
              else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') setLive(false, 'Reconnecting…');
            });
        };
        if ('requestIdleCallback' in window) requestIdleCallback(start, { timeout: 3000 });
        else setTimeout(start, 1000);
      }

      /* ================= Events ================= */
      let searchTimer = null;
      els.search.addEventListener('input', e => {
        const v = e.target.value.toLowerCase().trim();
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {   // debounce typing
          query = v;
          shown = PAGE_SIZE;
          render();
        }, 120);
      });

      els.cats.addEventListener('click', e => {
        const chip = e.target.closest('.cat-chip');
        if (!chip) return;
        category = chip.dataset.category;
        shown = PAGE_SIZE;
        renderCategories();
        render();
      });

      els.moreBtn.addEventListener('click', showMore);

      // Auto-load the next chunk when the button scrolls into view
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(entries => {
          if (entries[0].isIntersecting && !els.moreWrap.hidden) showMore();
        }, { rootMargin: '400px' }).observe(els.moreWrap);
      }

      document.addEventListener('click', e => {
        const card = e.target.closest('.material-card');
        if (card) pushRecent(card.dataset.id);
      });

      $('clearRecent').addEventListener('click', () => {
        try { localStorage.removeItem(RECENT_KEY); } catch {}
        renderRecent();
      });

      // Refresh when the app comes back to the foreground or the network returns (throttled)
      document.addEventListener('visibilitychange', () => { if (!document.hidden) loadMaterials(false); });
      window.addEventListener('online', () => loadMaterials(true));
      window.addEventListener('offline', () => setLive(false, 'Offline'));
      window.addEventListener('pageshow', e => { if (e.persisted) loadMaterials(false); });

      /* ================= Start ================= */
      // 1) Paint cached list immediately (no waiting for network)
      const cached = readCache();
      if (cached) {
        if (cached.mode === 'all') selectMode = 'all';
        applyData(cached.data);
        setLive(false, 'Updating…');
      }
      // 2) Fetch fresh data in the background
      loadMaterials(true);
    })();
  </script>
</body>
</html>
