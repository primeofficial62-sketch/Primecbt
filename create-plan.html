<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Create Study Plan — PRIME-CBT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b1a;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-2: #cbd5e1;
      --text-3: #94a3b8;
      --text-4: #64748b;
      --emerald-400: #34d399;
      --emerald-500: #10b981;
      --red-400: #f87171;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);

      /* Content column: fluid on small screens, centered max 720px on large ones */
      --col: 720px;
      --gutter: max(
        clamp(14px, 4vw, 28px),
        calc((100% - var(--col)) / 2),
        env(safe-area-inset-left)
      );
      --gutter-r: max(
        clamp(14px, 4vw, 28px),
        calc((100% - var(--col)) / 2),
        env(safe-area-inset-right)
      );
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    .app {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s var(--ease), visibility 0s linear 0.35s;
    }
    .app.ready { opacity: 1; visibility: visible; transition: opacity 0.35s var(--ease), visibility 0s linear 0s; }

    .topbar {
      flex-shrink: 0;
      min-height: 56px;
      padding-block: 8px;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-inline: var(--gutter) var(--gutter-r);
      display: flex; align-items: center; gap: 10px;
      background: rgba(6, 11, 26, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--surface-2);
      z-index: 40;
    }
    .icon-btn {
      width: 40px; height: 40px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 999px; color: var(--text-2); text-decoration: none;
      transition: background 0.25s var(--ease), transform 0.15s var(--ease);
    }
    .icon-btn:active { transform: scale(0.9); }
    .topbar h1 {
      font-size: clamp(0.98rem, 3.6vw, 1.15rem);
      font-weight: 600; letter-spacing: -0.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    main {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-block: clamp(14px, 3vw, 28px);
      padding-inline: var(--gutter) var(--gutter-r);
      padding-bottom: max(32px, calc(env(safe-area-inset-bottom) + 20px));
      display: flex; flex-direction: column; gap: clamp(16px, 3vw, 24px);
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }

    .block h2 { font-size: 0.9rem; font-weight: 600; margin-bottom: 10px; }
    .hint { font-size: 0.75rem; color: var(--text-4); margin-top: 8px; line-height: 1.45; }

    .field {
      width: 100%; height: 46px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 0 14px; color: var(--text); font: inherit; font-size: 16px;
      color-scheme: dark; outline: none;
      transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }
    .field:focus { border-color: var(--emerald-400); box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.15); }

    .opt-grid { display: grid; gap: 10px; }
    .opt-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .opt-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .opt-grid.days { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: clamp(4px, 1.4vw, 10px); }

    .option {
      min-height: 46px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      font: inherit; font-size: 0.85rem; font-weight: 500;
      cursor: pointer;
      padding: 0 6px;
      transition: background 0.25s var(--ease), border-color 0.25s var(--ease),
                  color 0.25s var(--ease), transform 0.15s var(--ease);
    }
    .option:active { transform: scale(0.96); }
    .option.selected {
      background: rgba(52, 211, 153, 0.12);
      border-color: var(--emerald-400);
      color: var(--emerald-400);
      font-weight: 600;
    }
    .opt-grid.days .option {
      min-height: 0; aspect-ratio: 1; max-height: 56px;
      border-radius: 999px; font-size: clamp(0.62rem, 2.4vw, 0.78rem); padding: 0;
    }

    .option:focus-visible, .cta:focus-visible, .icon-btn:focus-visible {
      outline: 2px solid var(--emerald-400); outline-offset: 2px;
    }

    .summary {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 16px; font-size: 0.85rem; color: var(--text-3); line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .summary b { color: var(--emerald-400); font-weight: 600; }

    .cta {
      width: 100%; height: 50px; border: none; border-radius: 14px;
      background: var(--emerald-500); color: #022c22;
      font: inherit; font-weight: 600; font-size: 0.92rem; cursor: pointer;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
      transition: background 0.25s var(--ease), transform 0.15s var(--ease), opacity 0.25s var(--ease);
    }
    .cta:active { transform: scale(0.98); }
    .cta:disabled { opacity: 0.6; cursor: default; }

    .toast {
      position: fixed; left: 50%;
      width: calc(100% - 32px); max-width: 420px;
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 60; text-align: center;
      background: var(--surface); border: 1px solid var(--emerald-400);
      color: var(--text); font-size: 0.85rem; font-weight: 600;
      padding: 13px 16px; border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      opacity: 0; transform: translate(-50%, 14px); pointer-events: none;
      transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { border-color: var(--red-400); }

    @media (hover: hover) {
      .icon-btn:hover { background: var(--surface-2); }
      .option:not(.selected):hover { background: var(--surface-2); color: var(--text); }
      .cta:not(:disabled):hover { background: #0fa574; }
    }

    /* Very small phones */
    @media (max-width: 360px) {
      .opt-grid { gap: 8px; }
      .opt-grid.three .option { font-size: 0.8rem; }
      .summary { padding: 12px; font-size: 0.8rem; }
    }

    /* Tablets and up: roomier controls */
    @media (min-width: 600px) {
      .opt-grid.two { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .option { min-height: 50px; font-size: 0.9rem; }
      .field { height: 50px; }
    }

    /* Large screens: sit the form in a card */
    @media (min-width: 900px) {
      main { padding-block: 40px; }
      .summary { font-size: 0.9rem; }
    }

    /* Short landscape phones */
    @media (max-height: 480px) and (orientation: landscape) {
      .topbar { min-height: 48px; }
      main { padding-top: 12px; }
      .opt-grid.days .option { max-height: 44px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>

</head>
<body>

  <div class="app" id="appRoot">
    <header class="topbar">
      <a href="home.html" class="icon-btn" aria-label="Back to Home">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </a>
      <h1>Create Study Plan</h1>
    </header>

    <main>
      <section class="block">
        <h2>When is your exam?</h2>
        <input type="date" id="examDate" class="field" aria-label="Exam date">
      </section>

      <section class="block">
        <h2>Target Score</h2>
        <div class="opt-grid three" id="scoreGroup">
          <button type="button" class="option selected" data-value="70%+">70%+</button>
          <button type="button" class="option" data-value="80%+">80%+</button>
          <button type="button" class="option" data-value="90%+">90%+</button>
        </div>
      </section>

      <section class="block">
        <h2>Daily Study Time</h2>
        <div class="opt-grid two" id="timeGroup">
          <button type="button" class="option" data-value="30 mins">30 mins</button>
          <button type="button" class="option selected" data-value="1 hour">1 hour</button>
          <button type="button" class="option" data-value="1.5 hours">1.5 hours</button>
          <button type="button" class="option" data-value="2+ hours">2+ hours</button>
        </div>
      </section>

      <section class="block">
        <h2>Study Days</h2>
        <div class="opt-grid days" id="daysGroup">
          <button type="button" class="option selected" data-day="Mon">Mon</button>
          <button type="button" class="option selected" data-day="Tue">Tue</button>
          <button type="button" class="option selected" data-day="Wed">Wed</button>
          <button type="button" class="option selected" data-day="Thu">Thu</button>
          <button type="button" class="option selected" data-day="Fri">Fri</button>
          <button type="button" class="option" data-day="Sat">Sat</button>
          <button type="button" class="option" data-day="Sun">Sun</button>
        </div>
      </section>

      <div class="summary" id="summary" aria-live="polite"></div>

      <div>
        <button type="button" id="generateBtn" class="cta">Create My Study Plan</button>
        <p class="hint" style="text-align:center">Your exam date is saved to your account, and study sessions for the next two weeks are added to My Study Plan.</p>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="profile-gate.js"></script>
  <script>
    // ========== SUPABASE CLIENT ==========
    const SUPABASE_URL = "https://xuofkjjhupgmrphzgyun.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GThKt7BvR1D81U939_EQkw_yCnTQ3xh";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener('DOMContentLoaded', () => {
      const $ = (id) => document.getElementById(id);
      const pad = (n) => String(n).padStart(2, '0');
      const dateStr = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      const parseDate = (s) => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
      const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const WINDOW_DAYS = 14;

      const examInput = $('examDate');
      const scoreGroup = $('scoreGroup');
      const timeGroup = $('timeGroup');
      const daysGroup = $('daysGroup');
      const generateBtn = $('generateBtn');

      let user = null;
      let hasExistingPlan = false;
      let pendingSessions = 0;   // live count of this student's unfinished plan sessions
      let busy = false;          // true while saving, so live updates don't fight the button label

      let toastTimer = null;
      function toast(msg, isError) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.toggle('error', !!isError);
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 3400);
      }

      // ----- Selections -----
      function selectedValue(group) {
        const el = group.querySelector('.option.selected');
        return el ? el.dataset.value : null;
      }
      function selectedDays() {
        return Array.from(daysGroup.querySelectorAll('.option.selected')).map((el) => el.dataset.day);
      }

      // The sessions this plan will add (today up to 14 days, stopping before the exam)
      function buildSessions() {
        const exam = examInput.value;
        const days = selectedDays();
        if (!exam || !days.length) return [];
        const timeLabel = selectedValue(timeGroup) || '1 hour';
        const score = selectedValue(scoreGroup) || '70%+';
        const start = new Date();
        start.setHours(0, 0, 0, 0);
        const examD = parseDate(exam);
        const out = [];
        for (let i = 0; i < WINDOW_DAYS; i++) {
          const d = new Date(start);
          d.setDate(start.getDate() + i);
          if (d >= examD) break;
          if (days.indexOf(DAY_NAMES[d.getDay()]) > -1) {
            out.push({ due_date: dateStr(d), title: 'Study session · ' + timeLabel, note: 'Target ' + score });
          }
        }
        return out;
      }

      function renderSummary() {
        const sum = $('summary');
        const exam = examInput.value;
        const days = selectedDays();
        if (!exam) { sum.textContent = 'Pick your exam date to see your plan.'; return; }
        if (!days.length) { sum.textContent = 'Select at least one study day.'; return; }
        const n = buildSessions().length;
        const left = Math.ceil((parseDate(exam) - new Date().setHours(0, 0, 0, 0)) / 86400000);
        let html = '<b>' + days.length + ' study ' + (days.length === 1 ? 'day' : 'days') + ' a week</b>, ' +
          (selectedValue(timeGroup) || '') + ' each. ';
        html += n ? 'This adds <b>' + n + ' ' + (n === 1 ? 'session' : 'sessions') + '</b> to your plan for the next two weeks. ' :
                    'No sessions fall before your exam date. ';
        if (left >= 0) html += left + (left === 1 ? ' day' : ' days') + ' until your exam.';
        if (pendingSessions > 0) {
          html += ' It replaces your ' + pendingSessions + ' unfinished ' + (pendingSessions === 1 ? 'session' : 'sessions') + ' from your earlier plan.';
        }
        sum.innerHTML = html;
      }

      function setButtonLabel() {
        if (busy) return;
        generateBtn.textContent = hasExistingPlan ? 'Update My Study Plan' : 'Create My Study Plan';
      }

      // ----- Option buttons -----
      function singleSelect(group) {
        const buttons = group.querySelectorAll('.option');
        buttons.forEach((btn) => btn.addEventListener('click', () => {
          buttons.forEach((b) => b.classList.remove('selected'));
          btn.classList.add('selected');
          renderSummary();
        }));
      }
      singleSelect(scoreGroup);
      singleSelect(timeGroup);
      daysGroup.querySelectorAll('.option').forEach((btn) => btn.addEventListener('click', () => {
        btn.classList.toggle('selected');
        renderSummary();
      }));
      examInput.addEventListener('input', renderSummary);

      // ----- Live data: unfinished sessions from the student's current plan -----
      async function refreshPending() {
        if (!user) return;
        const { count, error } = await supabaseClient
          .from('study_tasks')
          .select('id', { count: 'exact', head: true })
          .eq('user_id', user.id)
          .eq('plan_generated', true)
          .eq('is_done', false)
          .gte('due_date', dateStr(new Date()));
        if (error) return;
        pendingSessions = count || 0;
        renderSummary();
      }

      function startRealtime() {
        supabaseClient
          .channel('study-plan-' + user.id)
          .on('postgres_changes',
              { event: '*', schema: 'public', table: 'study_tasks', filter: 'user_id=eq.' + user.id },
              () => refreshPending())
          .subscribe();

        // Plan saved from another tab or device
        supabaseClient.auth.onAuthStateChange((event, session) => {
          if (event === 'SIGNED_OUT') { window.location.replace('auth.html?mode=login'); return; }
          if (event === 'USER_UPDATED' && session) {
            user = session.user;
            hasExistingPlan = !!(user.user_metadata && user.user_metadata.study_plan);
            setButtonLabel();
            renderSummary();
          }
        });

        // Keep the date limit and "days until exam" correct if the page stays open past midnight
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState !== 'visible') return;
          examInput.min = dateStr(new Date());
          renderSummary();
          refreshPending();
        });
      }

      // ----- Create the plan -----
      generateBtn.addEventListener('click', async () => {
        const examDate = examInput.value;
        const targetScore = selectedValue(scoreGroup) || '70%+';
        const studyTime = selectedValue(timeGroup) || '1 hour';
        const days = selectedDays();

        if (!examDate) { toast('Please select your exam date', true); return; }
        if (examDate < dateStr(new Date())) { toast('Choose an exam date from today onwards', true); return; }
        if (!days.length) { toast('Please select at least one study day', true); return; }

        busy = true;
        generateBtn.disabled = true;
        generateBtn.textContent = 'Creating your plan…';

        try {
          // 1. save exam date + plan settings on the account (home and My Study Plan read the date)
          const { error: metaErr } = await supabaseClient.auth.updateUser({
            data: {
              exam_date: examDate,
              study_plan: { target_score: targetScore, daily_time: studyTime, days: days, updated_at: new Date().toISOString() }
            }
          });
          if (metaErr) throw Object.assign(metaErr, { step: 'update account (auth.updateUser)' });

          // 2. replace unfinished sessions from an earlier plan
          const { error: delErr } = await supabaseClient
            .from('study_tasks')
            .delete()
            .eq('user_id', user.id)
            .eq('plan_generated', true)
            .eq('is_done', false)
            .gte('due_date', dateStr(new Date()));
          if (delErr) throw Object.assign(delErr, { step: 'delete old sessions (study_tasks)' });

          // 3. add the new sessions
          const sessions = buildSessions();
          if (sessions.length) {
            const rows = sessions.map((s) => ({
              user_id: user.id, title: s.title, note: s.note, due_date: s.due_date, plan_generated: true
            }));
            const { error: insErr } = await supabaseClient.from('study_tasks').insert(rows);
            if (insErr) throw Object.assign(insErr, { step: 'insert new sessions (study_tasks)' });
          }

          // 4. tell the student (shows as a popup on home and in Notifications)
          const pretty = parseDate(examDate).toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
          await supabaseClient.from('notifications').insert({
            user_id: user.id,
            title: 'Your study plan is ready 📅',
            body: (sessions.length ? sessions.length + ' study sessions added. ' : '') + 'Exam date: ' + pretty + '.',
            type: 'study'
          });

          toast('Study plan created ✅');
          setTimeout(() => { window.location.href = 'my-study-plan.html'; }, 900);
        } catch (err) {
          console.error('create plan failed at step:', err && err.step);
          console.error('message:', err && err.message, '| code:', err && err.code, '| details:', err && err.details, '| hint:', err && err.hint);
          console.error(err);
          toast("Couldn't save your plan. Please try again.", true);
          busy = false;
          generateBtn.disabled = false;
          setButtonLabel();
        }
      });

      // ----- Start: check login, pre-fill from an existing plan -----
      async function init() {
        let session = null;
        try {
          const res = await supabaseClient.auth.getSession();
          session = res.data && res.data.session;
        } catch (e) { session = null; }

        if (!session) { window.location.replace('auth.html?mode=login'); return; }
        if (needsProfileSetup(session.user)) { window.location.replace('profile-setup.html'); return; }

        user = session.user;
        const meta = user.user_metadata || {};
        const plan = meta.study_plan || null;
        hasExistingPlan = !!plan;

        examInput.min = dateStr(new Date());
        if (meta.exam_date && meta.exam_date >= dateStr(new Date())) examInput.value = meta.exam_date;

        if (plan) {
          const pick = (group, value) => {
            const btns = Array.from(group.querySelectorAll('.option'));
            if (!btns.some((b) => b.dataset.value === value)) return;
            btns.forEach((b) => b.classList.toggle('selected', b.dataset.value === value));
          };
          pick(scoreGroup, plan.target_score);
          pick(timeGroup, plan.daily_time);
          if (Array.isArray(plan.days) && plan.days.length) {
            daysGroup.querySelectorAll('.option').forEach((b) => {
              b.classList.toggle('selected', plan.days.indexOf(b.dataset.day) > -1);
            });
          }
        }

        setButtonLabel();
        renderSummary();
        $('appRoot').classList.add('ready');

        refreshPending();
        startRealtime();
      }

      init();
    });
  </script>
</body>
</html>
