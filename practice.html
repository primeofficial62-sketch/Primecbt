<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PRIME-CBT — Practice</title>
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b1a;
      --card: #0f172a;
      --card-hover: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --submuted: #64748b;
      --primary: #34d399;
      --teal: #2dd4bf;
      --blue: #60a5fa;
      --purple: #a78bfa;
      --amber: #fbbf24;
      --red: #f87171;
      --border: #334155;
      --radius: 16px;
      --pad: clamp(14px, 4vw, 32px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      min-height: 100dvh;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* ---------- Top bar ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 12px;
      padding: 14px var(--pad);
      padding-top: max(14px, env(safe-area-inset-top));
      background: rgba(6, 11, 26, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .back-btn, .icon-btn {
      width: 40px; height: 40px; flex-shrink: 0;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--text); text-decoration: none; cursor: pointer;
      transition: background .2s, transform .15s;
    }
    .back-btn:hover, .icon-btn:hover { background: var(--card-hover); }
    .back-btn:active, .icon-btn:active { transform: scale(0.92); }
    .back-btn svg, .icon-btn svg { width: 20px; height: 20px; }

    .topbar-text { flex: 1; min-width: 0; }
    .topbar-text h1 {
      font-size: clamp(1rem, 2.2vw, 1.2rem); font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .topbar-text p {
      font-size: .75rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .live-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--submuted); margin-right: 6px; vertical-align: middle;
    }
    .live-dot.on { background: var(--primary); box-shadow: 0 0 0 3px rgba(52, 211, 153, .2); }

    /* ---------- Search ---------- */
    .search-wrap {
      display: none;
      padding: 12px var(--pad);
      border-bottom: 1px solid var(--border);
      background: rgba(6, 11, 26, 0.95);
    }
    .search-wrap.active { display: block; }
    .search-box {
      display: flex; align-items: center; gap: 10px;
      height: 46px; padding: 0 14px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    }
    .search-box:focus-within { border-color: var(--primary); }
    .search-box svg { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
    .search-box input {
      flex: 1; min-width: 0;
      background: transparent; border: none; outline: none;
      color: var(--text); font-size: 16px; /* prevents iOS zoom */
    }
    .search-box input::placeholder { color: var(--submuted); }

    /* ---------- Content ---------- */
    .content { padding: var(--pad); padding-bottom: calc(var(--pad) + env(safe-area-inset-bottom)); }

    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px)  { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; } }
    @media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }

    .practice-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex; align-items: center; gap: 14px;
      min-width: 0;
      cursor: pointer; text-decoration: none; color: inherit;
      text-align: left; font: inherit; width: 100%;
      transition: background .2s, border-color .2s, transform .15s;
    }
    .practice-card:hover { background: var(--card-hover); border-color: #475569; }
    .practice-card:active { transform: scale(0.985); }

    .card-icon {
      width: 46px; height: 46px; flex-shrink: 0;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .card-icon svg { width: 22px; height: 22px; }
    .card-icon.blue   { background: rgba(96,165,250,.15);  color: var(--blue);   border: 1px solid rgba(96,165,250,.3); }
    .card-icon.purple { background: rgba(167,139,250,.15); color: var(--purple); border: 1px solid rgba(167,139,250,.3); }
    .card-icon.amber  { background: rgba(251,191,36,.15);  color: var(--amber);  border: 1px solid rgba(251,191,36,.3); }
    .card-icon.green  { background: rgba(52,211,153,.15);  color: var(--primary);border: 1px solid rgba(52,211,153,.3); }
    .card-icon.teal   { background: rgba(45,212,191,.15);  color: var(--teal);   border: 1px solid rgba(45,212,191,.3); }
    .card-icon.red    { background: rgba(248,113,113,.15); color: var(--red);    border: 1px solid rgba(248,113,113,.3); }

    .card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .card-title { font-size: .95rem; font-weight: 600; word-break: break-word; }
    .card-desc {
      font-size: .78rem; color: var(--muted); line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      word-break: break-word;
    }
    .card-meta { font-size: .72rem; color: var(--primary); font-weight: 600; }

    .card-arrow { color: var(--submuted); display: flex; flex-shrink: 0; transition: color .2s; }
    .practice-card:hover .card-arrow { color: var(--primary); }
    .card-arrow svg { width: 18px; height: 18px; }

    .state {
      text-align: center; padding: 40px 20px;
      color: var(--muted); font-size: .88rem;
      background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius);
    }
    .state[hidden] { display: none; }
    .state button {
      margin-top: 12px; padding: 10px 18px;
      background: var(--primary); color: #022c22; border: none; border-radius: 10px;
      font-weight: 600; cursor: pointer;
    }

    .skeleton {
      height: 80px; border-radius: var(--radius);
      background: linear-gradient(90deg, var(--card) 25%, var(--card-hover) 50%, var(--card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .toast {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(24px + env(safe-area-inset-bottom));
      max-width: calc(100% - 32px);
      background: var(--card-hover); border: 1px solid var(--border);
      padding: 10px 16px; border-radius: 12px; font-size: .85rem;
      display: none; z-index: 50; text-align: center;
    }
    .toast.show { display: block; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a href="home.html" class="back-btn" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="topbar-text">
        <h1 id="topbarTitle">Select Course</h1>
        <p><span class="live-dot" id="liveDot"></span><span id="topbarSubtitle">Connecting…</span></p>
      </div>
      <button class="icon-btn" id="toggleSearchBtn" type="button" aria-label="Toggle search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
    </header>

    <div class="search-wrap" id="searchWrap">
      <label class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="search" id="searchInput" placeholder="Search..." autocomplete="off" aria-label="Search">
      </label>
    </div>

    <main class="content">
      <div id="courseSection">
        <div class="grid" id="coursesGrid">
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>
        <div class="state" id="coursesState" hidden></div>
      </div>

      <div id="modeSection" hidden>
        <div class="grid" id="modesGrid"></div>
        <div class="state" id="modesState" hidden>No practice modes match your search.</div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.SUPABASE_URL = "https://xuofkjjhupgmrphzgyun.supabase.co";
    window.SUPABASE_ANON_KEY = "sb_publishable_GThKt7BvR1D81U939_EQkw_yCnTQ3xh";
  </script>

  <script>
    const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    const $ = id => document.getElementById(id);

    /* ================= Practice modes (app features, not data) ================= */
    const MODES = [
      { name: 'Quick Practice', desc: 'A short random set of questions to get started fast', color: 'green',
        icon: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>' },
      { name: 'Weak Topics', desc: 'Focus on the areas you need to improve', color: 'amber',
        icon: '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>' },
      { name: 'Past Questions', desc: 'Prepare with previous examinations', color: 'purple',
        icon: '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/>' },
      { name: 'Timed Practice', desc: 'Challenge yourself against the clock', color: 'teal',
        icon: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>' },
      { name: 'Mock Exam', desc: 'Full simulation of the real examination', color: 'red',
        icon: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>' }
    ];
    const COLORS = ['blue', 'purple', 'amber', 'green', 'teal', 'red'];
    const BOOK_ICON = '<path d="M4 19.5v-15A2.5 2.5 0 016.5 2H20v20H6.5a2.5 2.5 0 010-5H20"/>';
    const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>';

    /* ================= State ================= */
    let courses = [];
    let loaded = false;
    let query = '';

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function selectedId() {
      const m = location.hash.match(/course=([^&]+)/);
      return m ? decodeURIComponent(m[1]) : null;
    }
    const selectedCourse = () => courses.find(c => String(c.id) === selectedId()) || null;

    let toastTimer;
    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    function setLive(on) { $('liveDot').classList.toggle('on', on); }

    /* ================= Data ================= */
    async function loadCourses() {
      // Select all columns so this works with whatever your courses table has
      let res = await sb.from('courses').select('*, questions(count)');

      // If there is no questions relationship yet, load courses without counts
      if (res.error) res = await sb.from('courses').select('*');
      if (res.error) { showError(res.error.message); return; }

      const pick = (row, keys) => { for (const k of keys) if (row[k] != null && row[k] !== '') return row[k]; return ''; };

      const anyText = row => {
        for (const [k, v] of Object.entries(row)) {
          if (typeof v === 'string' && v.trim() && !/(^id$|_id$|created|updated|url|image|icon|color)/i.test(k)) return v;
        }
        return 'Untitled course';
      };

      courses = (res.data || []).map(c => ({
        ...c,
        title: pick(c, ['title', 'name', 'course_name', 'course_title', 'courseName', 'subject']) || anyText(c),
        code: pick(c, ['code', 'course_code']),
        description: pick(c, ['description', 'desc', 'details', 'summary']),
        count: Array.isArray(c.questions) && c.questions[0] ? Number(c.questions[0].count) : (c.questions ? 0 : null)
      }));

      courses.sort((a, b) =>
        (Number(a.sort_order ?? a.position ?? 0) - Number(b.sort_order ?? b.position ?? 0)) ||
        a.title.localeCompare(b.title));
      loaded = true;
      render();
    }

    let refetchTimer;
    const scheduleRefetch = () => { clearTimeout(refetchTimer); refetchTimer = setTimeout(loadCourses, 300); };

    function subscribeRealtime() {
      sb.channel('practice-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'courses' }, scheduleRefetch)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'questions' }, scheduleRefetch)
        .subscribe(status => {
          if (status === 'SUBSCRIBED') { realtimeOn = true; setLive(true); }
          else if (['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status)) { realtimeOn = false; setLive(false); }
        });
    }

    // Fallback: if realtime isn't connected, refresh every 20s so data still stays current
    let realtimeOn = false;
    setInterval(() => { if (!realtimeOn && !document.hidden) loadCourses(); }, 20000);

    /* ================= Render ================= */
    function showError(msg) {
      setLive(false);
      $('coursesGrid').innerHTML = '';
      const s = $('coursesState');
      s.hidden = false;
      s.innerHTML = 'Could not load courses. ' + esc(msg || '') + '<br><button type="button" id="retryBtn">Try again</button>';
      $('retryBtn').onclick = loadCourses;
      $('topbarSubtitle').textContent = 'Offline';
    }

    function courseCard(c, i) {
      const head = [c.code, c.description].filter(Boolean).join(' — ');
      const meta = c.count == null ? '' : '<div class="card-meta">' + c.count + (c.count === 1 ? ' question' : ' questions') + '</div>';
      return (
        '<button type="button" class="practice-card course-item" data-id="' + esc(c.id) + '">' +
          '<div class="card-icon ' + COLORS[i % COLORS.length] + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' + BOOK_ICON + '</svg></div>' +
          '<div class="card-body"><div class="card-title">' + esc(c.title) + '</div>' +
            (head ? '<div class="card-desc">' + esc(head) + '</div>' : '') + meta + '</div>' +
          '<div class="card-arrow">' + ARROW + '</div>' +
        '</button>'
      );
    }

    function modeCard(m, course) {
      const href = 'practice-setup.html?courseId=' + encodeURIComponent(course.id) +
                   '&course=' + encodeURIComponent(course.title) +
                   '&mode=' + encodeURIComponent(m.name);
      return (
        '<a href="' + href + '" class="practice-card mode-item">' +
          '<div class="card-icon ' + m.color + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' + m.icon + '</svg></div>' +
          '<div class="card-body"><div class="card-title">' + esc(m.name) + '</div><div class="card-desc">' + esc(m.desc) + '</div></div>' +
          '<div class="card-arrow">' + ARROW + '</div>' +
        '</a>'
      );
    }

    function render() {
      if (!loaded) return;
      const id = selectedId();
      const course = selectedCourse();

      // Selected course was removed (or bad link)
      if (id && !course) {
        toast('That course is no longer available.');
        history.replaceState(null, '', location.pathname + location.search);
        return render();
      }

      const q = query;

      if (course) {
        $('courseSection').hidden = true;
        $('modeSection').hidden = false;
        $('topbarTitle').textContent = course.title;
        $('topbarSubtitle').textContent = 'Choose how you want to practice' +
          (course.count != null ? ' · ' + course.count + (course.count === 1 ? ' question' : ' questions') : '');
        const list = MODES.filter(m => !q || (m.name + ' ' + m.desc).toLowerCase().includes(q));
        $('modesGrid').innerHTML = list.map(m => modeCard(m, course)).join('');
        $('modesState').hidden = list.length > 0;
        $('searchInput').placeholder = 'Search practice modes...';
      } else {
        $('courseSection').hidden = false;
        $('modeSection').hidden = true;
        $('topbarTitle').textContent = 'Select Course';
        $('topbarSubtitle').textContent = courses.length
          ? courses.length + (courses.length === 1 ? ' course available' : ' courses available')
          : 'Choose a subject to begin practicing';
        const list = courses.filter(c => !q || [c.title, c.code, c.description].join(' ').toLowerCase().includes(q));
        $('coursesGrid').innerHTML = list.map(courseCard).join('');
        const s = $('coursesState');
        if (list.length) s.hidden = true;
        else { s.hidden = false; s.textContent = courses.length ? 'No courses match your search.' : 'No courses have been added yet.'; }
        $('searchInput').placeholder = 'Search courses...';
      }
    }

    /* ================= Events ================= */
    $('coursesGrid').addEventListener('click', e => {
      const card = e.target.closest('.course-item');
      if (!card) return;
      resetSearch();
      location.hash = 'course=' + encodeURIComponent(card.dataset.id);
    });

    $('backBtn').addEventListener('click', e => {
      if (selectedId()) {
        e.preventDefault();
        resetSearch();
        history.pushState(null, '', location.pathname + location.search);
        render();
      }
    });

    window.addEventListener('hashchange', () => { resetSearch(); render(); });
    window.addEventListener('popstate', render);

    function resetSearch() {
      query = '';
      $('searchInput').value = '';
      $('searchWrap').classList.remove('active');
    }

    $('toggleSearchBtn').addEventListener('click', () => {
      const wrap = $('searchWrap');
      wrap.classList.toggle('active');
      if (wrap.classList.contains('active')) $('searchInput').focus();
      else { query = ''; $('searchInput').value = ''; render(); }
    });

    $('searchInput').addEventListener('input', e => { query = e.target.value.toLowerCase().trim(); render(); });

    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadCourses(); });
    window.addEventListener('online', loadCourses);
    window.addEventListener('pageshow', e => { if (e.persisted) loadCourses(); });

    loadCourses();
    subscribeRealtime();
  </script>
</body>
</html>
