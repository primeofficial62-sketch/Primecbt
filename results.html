<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070D1D">
  <title>PRIME-CBT — Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Lets the score ring animate when the number is set */
    @property --p { syntax: '<number>'; inherits: false; initial-value: 0; }

    :root {
      /* PRIME-CBT palette (same as the home page) */
      --bg: #070D1D;
      --surface: #10182B;
      --surface-2: #1A2540;
      --border: #273852;
      --text: #F1F5FF;
      --muted: #97A6CF;
      --muted-light: #C3CEEA;
      --emerald: #31D3A2;
      --emerald-bright: #31D3A2;
      --em-soft: rgba(49, 211, 162, 0.14);
      --on-em: #06101A;
      --teal: #31D3A2;
      --amber: #fbbf24;
      --red: #f87171;
      --font-display: 'Lora', Georgia, serif;
      --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --pad: clamp(1rem, 4vw, 2rem);
      --glass: radial-gradient(120% 90% at 0% 0%, rgba(255,255,255,.055), transparent 55%), linear-gradient(160deg, #121C32, #0F1729);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: clamp(14px, 13px + 0.35vw, 18px); -webkit-text-size-adjust: 100%; background: var(--bg); }
    body {
      font-family: var(--font-body); background: var(--bg); color: var(--text);
      min-height: 100vh; min-height: 100dvh; display: flex; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    /* Soft ambient glow behind the page (fixed, so scrolling stays cheap) */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(120% 40% at 100% 0%, rgba(70,110,210,.18), transparent 60%), radial-gradient(80% 35% at 0% 40%, rgba(49,211,162,.09), transparent 70%);
    }
    .app { width: 100%; max-width: 48rem; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    @media (min-width: 52rem) { .app { border-left: 1px solid rgba(255,255,255,.07); border-right: 1px solid rgba(255,255,255,.07); } }

    .content {
      flex: 1; display: flex; flex-direction: column; gap: clamp(1rem, 3vw, 1.5rem);
      padding: max(var(--pad), env(safe-area-inset-top)) var(--pad) var(--pad);
      padding-left: max(var(--pad), env(safe-area-inset-left));
      padding-right: max(var(--pad), env(safe-area-inset-right));
    }
    .content > * { min-width: 0; }
    [hidden] { display: none !important; }

    /* ---------- Status / loading / empty ---------- */
    .status {
      background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.35);
      color: var(--muted-light); border-radius: .75rem; padding: .75rem 1rem;
      font-size: .88rem; line-height: 1.45; display: flex; align-items: flex-start;
      justify-content: space-between; gap: .75rem; overflow-wrap: anywhere;
    }
    .status strong { color: var(--red); }
    .status button {
      flex-shrink: 0; background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: .5rem; padding: .35rem .7rem; font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer;
    }
    .center-state {
      background: var(--glass); border: 1px dashed var(--border); border-radius: 1rem;
      padding: 2.5rem 1.25rem; text-align: center; color: var(--muted); font-size: .95rem; line-height: 1.55;
    }
    .center-state a { color: var(--emerald-bright); font-weight: 600; text-decoration: none; }
    .spinner {
      width: 2rem; height: 2rem; border-radius: 50%; margin: 0 auto .75rem;
      border: 3px solid var(--border); border-top-color: var(--emerald); animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Hero: score ring ---------- */
    .hero {
      text-align: center; padding: clamp(1.1rem, 4vw, 1.6rem) 1rem;
      background: radial-gradient(90% 120% at 50% 0%, rgba(49,211,162,.12), transparent 65%), var(--glass);
      border: 1px solid #2A4058; border-radius: 1.3rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.09), 0 18px 40px -22px rgba(49,211,162,.3);
    }
    .hero-emoji { font-size: clamp(1.8rem, 6vw, 2.4rem); margin-bottom: .35rem; display: inline-block; }
    .ring {
      --p: 0; --c: #31D3A2; transition: --p 1s ease;
      position: relative; width: clamp(9rem, 38vw, 11.5rem); aspect-ratio: 1; margin: .4rem auto 1rem;
      border-radius: 50%; display: grid; place-items: center;
      background: conic-gradient(var(--c) calc(var(--p) * 1%), #1E2B47 0);
      box-shadow: 0 0 32px -8px var(--c);
    }
    .ring::before { content: ""; position: absolute; inset: .8rem; border-radius: 50%; background: #0F1729; }
    .hero-title { font-family: var(--font-display); font-size: clamp(1.5rem, 5vw, 2.1rem); font-weight: 700; margin-bottom: .3rem; }
    .hero-score {
      position: relative; font-family: var(--font-display); font-size: clamp(2.4rem, 10vw, 3.4rem); font-weight: 700;
      color: var(--text); line-height: 1; letter-spacing: -.02em;
    }
    .hero-meta { font-size: 1rem; color: var(--muted); }
    .hero-meta strong { color: var(--emerald-bright); font-weight: 600; }
    .hero-sub { font-size: .85rem; color: var(--muted); margin-top: .25rem; overflow-wrap: anywhere; }
    .badge-pill {
      display: inline-flex; align-items: center; background: var(--em-soft); color: var(--emerald-bright);
      border: 1px solid rgba(49,211,162,.28);
      font-size: .8rem; font-weight: 600; padding: .3rem .8rem; border-radius: 999px; margin-top: .85rem;
    }

    /* ---------- Stats ---------- */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 8.5rem), 1fr)); gap: .75rem; }
    .stat-card {
      background: var(--glass); border: 1px solid var(--border); border-radius: 1rem;
      padding: 1rem .75rem; text-align: center; min-width: 0;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 12px 26px -16px rgba(0,0,0,.7);
    }
    .stat-value { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; margin-bottom: .15rem; }
    .stat-value.green { color: var(--emerald-bright); }
    .stat-value.red { color: var(--red); }
    .stat-value.amber { color: var(--amber); }
    .stat-value.blue { color: #8FA6E8; }
    .stat-label { font-size: .8rem; color: var(--muted); }

    /* ---------- Sections ---------- */
    .section-title { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; margin-bottom: .75rem; color: var(--text); }
    .topic-item {
      background: var(--glass); border: 1px solid var(--border); border-radius: 1rem;
      padding: .85rem 1rem; margin-bottom: .55rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 12px 26px -16px rgba(0,0,0,.7);
    }
    .topic-header { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-bottom: .5rem; }
    .topic-name { font-size: .95rem; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
    .topic-score { font-size: .88rem; font-weight: 600; flex-shrink: 0; }
    .topic-bar { height: .45rem; background: rgba(5,10,22,.55); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .topic-fill { height: 100%; width: 0; border-radius: 999px; transition: width .9s cubic-bezier(.22,1,.36,1); }
    .topic-fill.emerald { background: linear-gradient(90deg, #27B58A, #31D3A2); box-shadow: 0 0 10px rgba(49,211,162,.4); }
    .topic-fill.amber { background: var(--amber); }
    .topic-fill.red { background: var(--red); }
    .topic-score.emerald { color: var(--emerald-bright); }
    .topic-score.amber { color: var(--amber); }
    .topic-score.red { color: var(--red); }

    .recommend-card {
      background: radial-gradient(90% 120% at 100% 0%, rgba(49,211,162,.12), transparent 60%), var(--glass);
      border: 1px solid rgba(49,211,162,.3); border-radius: 1.1rem; padding: 1rem;
      display: flex; align-items: center; gap: .85rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07);
    }
    .recommend-icon {
      width: 2.9rem; height: 2.9rem; border-radius: .9rem; background: var(--em-soft); border: 1px solid rgba(49,211,162,.28);
      display: flex; align-items: center; justify-content: center; font-size: 1.35rem; flex-shrink: 0;
    }
    .recommend-body { min-width: 0; }
    .recommend-body h3 { font-size: .98rem; font-weight: 600; margin-bottom: .15rem; overflow-wrap: anywhere; }
    .recommend-body p { font-size: .85rem; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }

    /* ---------- Correction section ---------- */
    .tabs { display: flex; gap: .5rem; margin-bottom: .85rem; flex-wrap: wrap; }
    .tab {
      min-height: 2.5rem; padding: 0 1.1rem; border-radius: 999px; font: inherit; font-size: .85rem; font-weight: 600;
      border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer;
      transition: background .2s, color .2s, border-color .2s;
    }
    .tab[aria-pressed="true"] { border-color: var(--emerald); color: var(--on-em); background: var(--emerald); }

    .rev-item {
      background: var(--glass); border: 1px solid var(--border); border-radius: 1.1rem;
      padding: 1rem; margin-bottom: .75rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 12px 26px -16px rgba(0,0,0,.7);
    }
    .rev-item.bad { border-color: rgba(248,113,113,.4); }
    .rev-item.good { border-color: rgba(49,211,162,.35); }
    .rev-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .6rem; }
    .rev-num { font-size: .8rem; font-weight: 700; color: var(--muted); }
    .tag { font-size: .72rem; font-weight: 700; padding: .2rem .6rem; border-radius: 999px; }
    .tag.bad { background: rgba(248,113,113,.15); color: var(--red); }
    .tag.good { background: var(--em-soft); color: var(--emerald-bright); }
    .tag.skip { background: rgba(251,191,36,.15); color: var(--amber); }
    .rev-q { font-size: .98rem; font-weight: 600; line-height: 1.5; margin-bottom: .75rem; overflow-wrap: anywhere; white-space: pre-line; }
    .rev-ans {
      border-radius: .75rem; padding: .6rem .8rem; font-size: .88rem; line-height: 1.45;
      margin-bottom: .5rem; overflow-wrap: anywhere; border: 1px solid transparent;
    }
    .rev-ans small { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; margin-bottom: .15rem; opacity: .85; }
    .rev-ans.you-bad { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.4); color: var(--red); }
    .rev-ans.you-skip { background: rgba(251,191,36,.08); border-color: rgba(251,191,36,.35); color: var(--amber); }
    .rev-ans.correct { background: var(--em-soft); border-color: rgba(49,211,162,.4); color: var(--emerald-bright); }
    .rev-exp { font-size: .85rem; color: var(--muted-light); line-height: 1.55; margin-top: .6rem; overflow-wrap: anywhere; white-space: pre-line; }
    .rev-exp b { color: var(--muted); font-weight: 700; }

    /* ---------- Bottom actions ---------- */
    .bottom-actions {
      position: sticky; bottom: 0; z-index: 40; display: flex; flex-direction: column; gap: .5rem;
      padding: 1rem var(--pad); padding-bottom: max(1rem, env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 75%, rgba(7,13,29,0));
    }
    .btn {
      min-height: 3rem; border-radius: .95rem; font: inherit; font-size: .95rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none;
      padding: .5rem 1.25rem; cursor: pointer; border: none; transition: transform .15s ease;
    }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible, .tab:focus-visible, .status button:focus-visible { outline: 2px solid var(--emerald-bright); outline-offset: 2px; }
    .btn-primary { background: linear-gradient(135deg, #31D3A2, #27B58A); color: var(--on-em); box-shadow: 0 6px 20px rgba(49,211,162,.28); }
    .btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    @media (min-width: 40rem) {
      .bottom-actions { flex-direction: row; justify-content: center; }
      .bottom-actions .btn { flex: 0 1 18rem; }
    }
    @media (max-height: 480px) and (orientation: landscape) { .bottom-actions { position: static; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <main class="content">
      <div class="status" id="statusBanner" role="alert" hidden>
        <span id="statusText"></span>
        <button type="button" id="statusRetry">Retry</button>
      </div>

      <div class="center-state" id="loadingState">
        <div class="spinner" aria-hidden="true"></div>
        Calculating your result…
      </div>

      <div class="center-state" id="emptyState" hidden></div>

      <div id="resultWrap" hidden style="display:flex;flex-direction:column;gap:clamp(1rem,3vw,1.5rem)">
        <div class="hero">
          <div class="hero-emoji" id="heroEmoji"></div>
          <div class="ring" id="ring">
            <div class="hero-score" id="heroScore"></div>
          </div>
          <div class="hero-title" id="heroTitle"></div>
          <div class="hero-meta" id="heroMeta"></div>
          <div class="hero-sub" id="heroSub"></div>
          <div class="badge-pill" id="heroBadge"></div>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="section" id="topicSection" hidden>
          <h2 class="section-title">Topic Performance</h2>
          <div id="topicList"></div>
        </div>

        <div class="section">
          <h2 class="section-title">Recommendation</h2>
          <div class="recommend-card">
            <div class="recommend-icon" id="recIcon"></div>
            <div class="recommend-body">
              <h3 id="recTitle"></h3>
              <p id="recText"></p>
            </div>
          </div>
        </div>

        <div class="section" id="reviewSection">
          <h2 class="section-title">Correction</h2>
          <div class="tabs" role="group" aria-label="Filter questions">
            <button type="button" class="tab" id="tabWrong" aria-pressed="true"></button>
            <button type="button" class="tab" id="tabAll" aria-pressed="false"></button>
          </div>
          <div id="reviewList"></div>
        </div>
      </div>
    </main>

    <div class="bottom-actions" id="bottomActions" hidden>
      <a class="btn btn-primary" id="practiceMoreBtn" href="practice-setup.html">Practice More</a>
      <a class="btn btn-secondary" href="home.html">Back to Home</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (() => {
    'use strict';

    /* ====== CONFIG ======
       The quiz page sends the user here as results.html?result=<id>.
       The page loads that saved attempt from Supabase through get_practice_result(),
       then RE-CALCULATES the score from the stored answers and the correct answers.
       Nothing is read from the URL except the id, so the score cannot be faked or go stale. */
    const CONFIG = {
      SUPABASE_URL: 'https://xuofkjjhupgmrphzgyun.supabase.co',
      SUPABASE_ANON_KEY: 'sb_publishable_GThKt7BvR1D81U939_EQkw_yCnTQ3xh',
      RPC_NAME: 'get_practice_result',
      loginPage: 'login.html',
      setupPage: 'practice-setup.html',
      homePage: 'home.html'
    };
    /* ==================== */

    const $ = (id) => document.getElementById(id);
    const LETTERS = 'ABCDEFGHIJ';
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const tier = (p) => (p >= 70 ? 'emerald' : p >= 50 ? 'amber' : 'red');
    const optText = (o) => (o && typeof o === 'object') ? (o.text ?? o.label ?? '') : String(o ?? '');
    const toIdx = (v) => (v === null || v === undefined || v === '' || isNaN(Number(v))) ? null : Number(v);

    const resultId = (new URLSearchParams(location.search).get('result') || '').trim();
    let db = null;
    let viewAll = false;
    let model = null;

    function showStatus(msg) {
      $('statusText').innerHTML = '<strong>Problem:</strong> ' + esc(msg);
      $('statusBanner').hidden = false;
    }
    function showEmpty(msg, linkText, href) {
      $('loadingState').hidden = true;
      $('resultWrap').style.display = 'none';
      $('bottomActions').hidden = true;
      const box = $('emptyState');
      box.hidden = false;
      box.innerHTML = esc(msg) + (href ? '<br><a href="' + esc(href) + '">' + esc(linkText) + '</a>' : '');
    }
    function formatDuration(sec) {
      if (sec == null || !isFinite(sec) || sec <= 0) return '–';
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
      if (h > 0) return h + 'h ' + String(m).padStart(2, '0') + 'm';
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    /* ---------- Strict scoring ----------
       A question is correct ONLY when an answer was given AND it equals the correct option.
       Unanswered questions are never correct and are counted separately.
       Percentage = correct / total questions in the attempt (unanswered count against you). */
    function buildModel(raw) {
      const rawItems = Array.isArray(raw.items) ? raw.items : [];
      const items = rawItems.map((it, i) => {
        const options = Array.isArray(it.options) ? it.options : [];
        const correctIdx = toIdx(it.correct_index);
        const selectedIdx = toIdx(it.selected_index);
        const valid = correctIdx !== null && correctIdx >= 0 && correctIdx < options.length;
        const answered = selectedIdx !== null;
        return {
          pos: it.position != null ? Number(it.position) : i,
          question: it.question || '',
          options, correctIdx, selectedIdx, valid, answered,
          isCorrect: valid && answered && selectedIdx === correctIdx,
          explanation: (it.explanation || '').trim(),
          topic: (it.topic || '').trim()
        };
      }).sort((a, b) => a.pos - b.pos);

      const total = items.length;
      const correct = items.filter((x) => x.isCorrect).length;
      const unanswered = items.filter((x) => !x.answered).length;
      const wrong = total - correct - unanswered;
      const percentage = total > 0 ? Math.round((correct / total) * 100) : 0;

      if (raw.correct != null && Number(raw.correct) !== correct) {
        console.warn('[results] server score', raw.correct, 'differs from recalculated', correct, '- using recalculated.');
      }

      const byTopic = new Map();
      items.forEach((x) => {
        if (!x.topic) return;
        if (!byTopic.has(x.topic)) byTopic.set(x.topic, { name: x.topic, c: 0, t: 0 });
        const g = byTopic.get(x.topic); g.t++; if (x.isCorrect) g.c++;
      });
      const topics = [...byTopic.values()]
        .map((g) => ({ ...g, p: g.t ? Math.round((g.c / g.t) * 100) : 0 }))
        .sort((a, b) => a.p - b.p);

      return {
        items, total, correct, wrong, unanswered, percentage, topics,
        mode: raw.mode === 'timed' ? 'timed' : 'practice',
        title: raw.course_title || '', code: raw.course_code || '', courseId: raw.course_id || '',
        duration: raw.duration_seconds != null ? Number(raw.duration_seconds) : null,
        invalid: items.filter((x) => !x.valid).length
      };
    }

    /* ---------- Render ---------- */
    function render(m) {
      const p = m.percentage;
      $('heroEmoji').textContent = p >= 70 ? '🎉' : p >= 50 ? '👍' : '📚';
      $('heroTitle').textContent = p >= 70 ? 'Great Job!' : p >= 50 ? 'Good Effort!' : 'Keep Practicing!';
      $('heroScore').textContent = p + '%';
      $('heroMeta').innerHTML = `<strong>${m.correct}</strong> / ${m.total} Correct`;
      $('heroSub').textContent = [m.code, m.title && m.title !== m.code ? m.title : ''].filter(Boolean).join(' • ');
      $('heroSub').hidden = !$('heroSub').textContent;
      $('heroBadge').textContent = m.mode === 'timed' ? 'Timed Exam Complete' : 'Practice Complete';

      const tc = tier(p) === 'emerald' ? 'green' : tier(p) === 'amber' ? 'amber' : 'red';
      const cards = [
        { v: p + '%', c: tc, l: 'Accuracy' },
        { v: formatDuration(m.duration), c: 'blue', l: 'Time Taken' },
        { v: m.correct, c: 'green', l: 'Correct' },
        { v: m.wrong, c: 'red', l: 'Incorrect' }
      ];
      if (m.unanswered > 0) cards.push({ v: m.unanswered, c: 'amber', l: 'Unanswered' });
      $('statsGrid').innerHTML = cards.map((x) =>
        `<div class="stat-card"><div class="stat-value ${x.c}">${esc(x.v)}</div><div class="stat-label">${x.l}</div></div>`).join('');

      // Topic performance only when the questions carry topics
      if (m.topics.length) {
        $('topicSection').hidden = false;
        $('topicList').innerHTML = m.topics.map((g) => {
          const t = tier(g.p);
          return `<div class="topic-item">
            <div class="topic-header"><span class="topic-name">${esc(g.name)}</span><span class="topic-score ${t}">${g.p}% (${g.c}/${g.t})</span></div>
            <div class="topic-bar"><div class="topic-fill ${t}" data-w="${g.p}"></div></div></div>`;
        }).join('');
        requestAnimationFrame(() => setTimeout(() => {
          document.querySelectorAll('.topic-fill').forEach((b) => { b.style.width = b.dataset.w + '%'; });
        }, 150));
      }

      // Recommendation from real numbers
      const weakest = m.topics.length > 1 ? m.topics[0] : null;
      if (weakest && weakest.p < 70) {
        $('recIcon').textContent = '🎯';
        $('recTitle').textContent = 'Focus on ' + weakest.name;
        $('recText').textContent = `You scored ${weakest.p}% (${weakest.c}/${weakest.t}) here. Check the corrections below first.`;
      } else if (p >= 70) {
        $('recIcon').textContent = '✅';
        $('recTitle').textContent = 'Strong result';
        $('recText').textContent = `You got ${m.correct} of ${m.total} right. Keep practicing regularly to stay sharp.`;
      } else {
        $('recIcon').textContent = '📖';
        $('recTitle').textContent = 'Review your mistakes';
        $('recText').textContent = `You missed ${m.wrong + m.unanswered} of ${m.total} questions. Go through the corrections below.`;
      }

      const q = m.courseId ? `?course=${encodeURIComponent(m.courseId)}` : '';
      $('practiceMoreBtn').href = CONFIG.setupPage + q;
      $('practiceMoreBtn').textContent = m.title ? `Practice More ${m.title}` : 'Practice More';

      renderReview();

      $('loadingState').hidden = true;
      $('emptyState').hidden = true;
      $('resultWrap').hidden = false;
      $('resultWrap').style.display = 'flex';
      $('bottomActions').hidden = false;
    }

    function renderReview() {
      const m = model;
      const missed = m.items.filter((x) => !x.isCorrect);
      $('tabWrong').textContent = `Needs correction (${missed.length})`;
      $('tabAll').textContent = `All questions (${m.total})`;
      $('tabWrong').setAttribute('aria-pressed', String(!viewAll));
      $('tabAll').setAttribute('aria-pressed', String(viewAll));

      const list = viewAll ? m.items : missed;
      if (!list.length) {
        $('reviewList').innerHTML = '<div class="center-state">🎉 Perfect score — nothing to correct.</div>';
        return;
      }
      $('reviewList').innerHTML = list.map((x) => {
        const state = x.isCorrect ? 'good' : x.answered ? 'bad' : 'skip';
        const tagText = x.isCorrect ? 'Correct' : x.answered ? 'Incorrect' : 'Unanswered';
        const label = (i) => `${LETTERS[i] || i + 1}. ${optText(x.options[i])}`;

        let youBlock = '';
        if (!x.isCorrect) {
          youBlock = x.answered
            ? `<div class="rev-ans you-bad"><small>Your answer</small>${esc(label(x.selectedIdx))}</div>`
            : `<div class="rev-ans you-skip"><small>Your answer</small>You didn’t answer this question</div>`;
        }
        const correctBlock = x.valid
          ? `<div class="rev-ans correct"><small>Correct answer</small>${esc(label(x.correctIdx))}</div>`
          : `<div class="rev-ans you-skip"><small>Correct answer</small>Not available for this question</div>`;
        const exp = x.explanation ? `<div class="rev-exp"><b>Explanation:</b> ${esc(x.explanation)}</div>` : '';

        return `<article class="rev-item ${state === 'good' ? 'good' : 'bad'}">
          <div class="rev-head"><span class="rev-num">Question ${x.pos + 1}</span><span class="tag ${state}">${tagText}</span></div>
          <div class="rev-q">${esc(x.question)}</div>
          ${youBlock}${correctBlock}${exp}
        </article>`;
      }).join('');
    }

    /* ---------- Load ---------- */
    async function load() {
      $('statusBanner').hidden = true;
      $('loadingState').hidden = false;
      $('emptyState').hidden = true;

      if (!resultId) return showEmpty('No result selected.', 'Start a practice session', CONFIG.setupPage);
      if (!window.supabase || !window.supabase.createClient) {
        $('loadingState').hidden = true;
        return showStatus('The app did not load. Check your connection and retry.');
      }
      if (!db) db = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

      try {
        const { data: { session }, error: sErr } = await db.auth.getSession();
        if (sErr) throw sErr;
        if (!session) {
          const next = location.pathname.split('/').pop() + location.search;
          return location.replace(`${CONFIG.loginPage}?next=${encodeURIComponent(next)}`);
        }

        const { data, error } = await db.rpc(CONFIG.RPC_NAME, { p_result_id: resultId });
        if (error) throw error;
        if (!data) return showEmpty('We couldn’t find that result. It may belong to another account.', 'Start a practice session', CONFIG.setupPage);

        const raw = typeof data === 'string' ? JSON.parse(data) : data;
        model = buildModel(raw);
        if (!model.total) return showEmpty('This session has no questions, so there is nothing to score.', 'Start a practice session', CONFIG.setupPage);

        render(model);
        if (model.invalid > 0) {
          showStatus(`${model.invalid} question(s) have no valid answer key and were counted as not correct.`);
        }
      } catch (e) {
        console.error('[results] load failed:', e);
        $('loadingState').hidden = true;
        showStatus('Could not load your result: ' + ((e && e.message) || e));
      }
    }

    $('statusRetry').addEventListener('click', load);
    $('tabWrong').addEventListener('click', () => { viewAll = false; renderReview(); });
    $('tabAll').addEventListener('click', () => { viewAll = true; renderReview(); });
    document.addEventListener('DOMContentLoaded', load);
  })();
  </script>

  <!-- New: fills and colours the score ring from the score the page already shows (separate from the page script above, which is unchanged) -->
  <script>
    (function () {
      var score = document.getElementById('heroScore'), ring = document.getElementById('ring');
      function sync() {
        var n = parseInt(score.textContent, 10);
        if (isNaN(n)) { ring.style.setProperty('--p', 0); return; }
        n = Math.max(0, Math.min(100, n));
        ring.style.setProperty('--c', n >= 70 ? '#31D3A2' : n >= 50 ? '#fbbf24' : '#f87171');
        ring.style.setProperty('--p', n);
      }
      new MutationObserver(sync).observe(score, { childList: true, characterData: true, subtree: true });
      sync();
    })();
  </script>
</body>
</html>
