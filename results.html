<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>PRIME-CBT — Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b1a;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --muted-light: #cbd5e1;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --teal: #2dd4bf;
      --amber: #fbbf24;
      --red: #f87171;
      --font-display: 'Lora', serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      border-left: 1px solid rgba(51, 65, 85, 0.4);
      border-right: 1px solid rgba(51, 65, 85, 0.4);
    }

    /* Content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 160px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }

    /* Hero Score */
    .hero {
      text-align: center;
      margin-bottom: 24px;
      position: relative;
    }

    .hero-emoji {
      font-size: 42px;
      margin-bottom: 8px;
      display: inline-block;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .hero-score {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--emerald-bright), var(--teal));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .hero-meta {
      font-size: 14px;
      color: var(--muted);
    }

    .hero-meta strong {
      color: var(--emerald-bright);
      font-weight: 600;
    }

    .improvement {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--emerald-bright);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      margin-top: 10px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 12px;
      text-align: center;
      transition: all 0.25s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .stat-value.green { color: var(--emerald-bright); }
    .stat-value.red { color: var(--red); }
    .stat-value.amber { color: var(--amber); }
    .stat-value.blue { color: #60a5fa; }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
    }

    /* Section */
    .section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 14.5px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--muted-light);
    }

    /* Topic Performance */
    .topic-item {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }

    .topic-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .topic-name {
      font-size: 13.5px;
      font-weight: 600;
    }

    .topic-score {
      font-size: 12.5px;
      font-weight: 600;
    }

    .topic-bar {
      height: 5px;
      background: rgba(51, 65, 85, 0.6);
      border-radius: 999px;
      overflow: hidden;
    }

    .topic-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Recommendation */
    .recommend-card {
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.1), rgba(15, 23, 42, 0.8));
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .recommend-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .recommend-body h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .recommend-body p {
      font-size: 12px;
      color: var(--muted);
    }

    /* Bottom Actions */
    .bottom-actions {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 75%, transparent);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 40;
    }

    .btn {
      height: 48px;
      border-radius: 14px;
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #022c22;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.28);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(16, 185, 129, 0.38);
    }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--surface-2);
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn-row .btn {
      flex: 1;
    }

    .btn:active {
      transform: scale(0.97);
    }

    [class*="animate-"] {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="content">
      <!-- Hero -->
      <div class="hero">
        <div class="hero-emoji">🎉</div>
        <div class="hero-title">Great Job!</div>
        <div class="hero-score">82%</div>
        <div class="hero-meta">
          <strong>24</strong> / 30 Correct
        </div>
        <div class="improvement">
          Session Complete
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value green">82%</div>
          <div class="stat-label">Accuracy</div>
        </div>
        <div class="stat-card">
          <div class="stat-value blue">--:--</div>
          <div class="stat-label">Time Taken</div>
        </div>
        <div class="stat-card">
          <div class="stat-value green">24</div>
          <div class="stat-label">Correct</div>
        </div>
        <div class="stat-card">
          <div class="stat-value red">6</div>
          <div class="stat-label">Incorrect</div>
        </div>
      </div>

      <!-- Topic Performance -->
      <div class="section">
        <h2 class="section-title">Topic Performance</h2>
        <div class="topic-item">
          <div class="topic-header">
            <span class="topic-name" id="perfTopicName">General Study</span>
            <span class="topic-score" style="color: var(--emerald-bright)" id="perfTopicScore">82%</span>
          </div>
          <div class="topic-bar">
            <div class="topic-fill" style="width: 0; background: linear-gradient(90deg, #10b981, #34d399)" data-width="82%"></div>
          </div>
        </div>
      </div>

      <!-- Recommendation -->
      <div class="section">
        <h2 class="section-title">Recommendation</h2>
        <div class="recommend-card">
          <div class="recommend-icon">🎯</div>
          <div class="recommend-body">
            <h3>Keep building momentum</h3>
            <p>Review the explanations for any missed items to master this subject.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Actions -->
    <div class="bottom-actions">
      <button type="button" class="btn btn-primary" onclick="location.href='practice.html'">
        Practice More
      </button>
      <div class="btn-row">
        <button type="button" class="btn btn-secondary" onclick="location.href='practice.html'">
          Back to Practice
        </button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const topic = params.get('topic') || 'General Study';
    const score = parseInt(params.get('score')) || 0;
    const total = parseInt(params.get('total')) || 0;
    const incorrect = parseInt(params.get('incorrect')) || (total - score);
    const percentage = total > 0 ? Math.round((score / total) * 100) : 82;

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelector('.hero-title').textContent = percentage >= 50 ? 'Great Job!' : 'Keep Practicing!';
      document.querySelector('.hero-score').textContent = `${percentage}%`;
      document.querySelector('.hero-meta').innerHTML = `<strong>${score}</strong> / ${total} Correct`;

      const statValues = document.querySelectorAll('.stat-value');
      if(statValues.length >= 4) {
        statValues[0].textContent = `${percentage}%`;
        statValues[2].textContent = score;
        statValues[3].textContent = incorrect;
      }

      const topicNameEl = document.getElementById('perfTopicName');
      const topicScoreEl = document.getElementById('perfTopicScore');
      if (topicNameEl) topicNameEl.textContent = topic;
      if (topicScoreEl) topicScoreEl.textContent = `${percentage}%`;

      const recommendTitle = document.querySelector('.recommend-body h3');
      const recommendDesc = document.querySelector('.recommend-body p');
      if (recommendTitle && recommendDesc) {
        recommendTitle.textContent = `${topic} Performance`;
        recommendDesc.textContent = percentage >= 70 
          ? `You performed well in ${topic}. Keep up the solid progress!` 
          : `Review your incorrect options in ${topic} to strengthen your core understanding.`;
      }

      const primaryBtn = document.querySelector('.btn-primary');
      if(primaryBtn) {
        primaryBtn.textContent = `Practice More ${topic}`;
        primaryBtn.onclick = () => location.href = `practice.html`;
      }

      setTimeout(() => {
        document.querySelectorAll('.topic-fill').forEach(bar => {
          const targetWidth = `${percentage}%`;
          bar.style.width = targetWidth;
        });
      }, 400);
    });
  </script>
</body>
</html>
