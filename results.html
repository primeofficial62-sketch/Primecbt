<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060b1a">
  <title>PRIME-CBT — Results</title>
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b1a;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --muted-light: #cbd5e1;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --teal: #2dd4bf;
      --amber: #fbbf24;
      --red: #f87171;
      --font-display: 'Lora', Georgia, serif;
      --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --pad: clamp(1rem, 4vw, 2rem);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* Everything is in rem, so the page scales fluidly with the screen */
    html {
      font-size: clamp(14px, 13px + 0.35vw, 18px);
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 64rem;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    @media (min-width: 64rem) {
      .app { border-left: 1px solid rgba(51, 65, 85, 0.5); border-right: 1px solid rgba(51, 65, 85, 0.5); }
    }

    /* ---------- Content ---------- */
    .content {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr));
      align-content: start;
      align-items: start;
      gap: clamp(1rem, 3vw, 1.5rem);
      padding: max(var(--pad), env(safe-area-inset-top)) var(--pad) var(--pad);
      padding-left: max(var(--pad), env(safe-area-inset-left));
      padding-right: max(var(--pad), env(safe-area-inset-right));
    }

    .content > * { min-width: 0; }
    .full { grid-column: 1 / -1; }

    /* ---------- Status banner ---------- */
    .status {
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: var(--muted-light);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 0.88rem;
      line-height: 1.45;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      overflow-wrap: anywhere;
    }
    .status.info { background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.35); }
    .status[hidden] { display: none; }
    .status strong { color: var(--red); }
    .status.info strong { color: var(--amber); }
    .status button {
      flex-shrink: 0;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.35rem 0.7rem;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .status button[hidden] { display: none; }

    /* ---------- Empty state ---------- */
    .empty-state {
      background: rgba(15, 23, 42, 0.8);
      border: 1px dashed var(--border);
      border-radius: 1rem;
      padding: 2.5rem 1.25rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
    }
    .empty-state a { color: var(--emerald-bright); font-weight: 600; text-decoration: none; }

    /* ---------- Hero ---------- */
    .hero { text-align: center; padding: clamp(0.5rem, 3vw, 1.5rem) 0; }

    .hero-emoji { font-size: clamp(2.5rem, 8vw, 3.5rem); margin-bottom: 0.5rem; display: inline-block; }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .hero-score {
      font-size: clamp(3rem, 12vw, 5rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--emerald-bright), var(--teal));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin-bottom: 0.4rem;
    }

    .hero-meta { font-size: 1rem; color: var(--muted); overflow-wrap: anywhere; }
    .hero-meta strong { color: var(--emerald-bright); font-weight: 600; }
    .hero-sub { font-size: 0.85rem; color: var(--muted); margin-top: 0.25rem; overflow-wrap: anywhere; }

    .improvement {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: rgba(16, 185, 129, 0.12);
      color: var(--emerald-bright);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      margin-top: 0.75rem;
    }

    /* ---------- Stats ---------- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr));
      gap: 0.75rem;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1rem 0.75rem;
      text-align: center;
      min-width: 0;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .stat-card:hover { transform: translateY(-2px); border-color: rgba(16, 185, 129, 0.3); }

    .stat-value { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.15rem; overflow-wrap: anywhere; }
    .stat-value.green { color: var(--emerald-bright); }
    .stat-value.red { color: var(--red); }
    .stat-value.amber { color: var(--amber); }
    .stat-value.blue { color: #60a5fa; }
    .stat-label { font-size: 0.8rem; color: var(--muted); }

    /* ---------- Sections ---------- */
    .section-title { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--muted-light); }

    .topic-item {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 0.9rem;
      padding: 0.8rem 1rem;
      margin-bottom: 0.5rem;
    }

    .topic-header { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; margin-bottom: 0.45rem; }
    .topic-name { font-size: 0.95rem; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
    .topic-score { font-size: 0.88rem; font-weight: 600; flex-shrink: 0; }

    .topic-bar { height: 0.4rem; background: rgba(51, 65, 85, 0.6); border-radius: 999px; overflow: hidden; }
    .topic-fill { height: 100%; width: 0; border-radius: 999px; transition: width 0.9s cubic-bezier(0.22, 1, 0.36, 1); }
    .topic-fill.emerald { background: linear-gradient(90deg, #10b981, #34d399); }
    .topic-fill.amber { background: var(--amber); }
    .topic-fill.red { background: var(--red); }

    .topic-score.emerald { color: var(--emerald-bright); }
    .topic-score.amber { color: var(--amber); }
    .topic-score.red { color: var(--red); }

    .recommend-card {
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.1), rgba(15, 23, 42, 0.8));
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 1rem;
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .recommend-icon {
      width: 2.9rem;
      height: 2.9rem;
      border-radius: 0.8rem;
      background: rgba(16, 185, 129, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      flex-shrink: 0;
    }

    .recommend-body { min-width: 0; }
    .recommend-body h3 { font-size: 0.98rem; font-weight: 600; margin-bottom: 0.15rem; overflow-wrap: anywhere; }
    .recommend-body p { font-size: 0.85rem; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }

    /* ---------- Bottom actions (sticky, never covers content) ---------- */
    .bottom-actions {
      position: sticky;
      bottom: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 1rem var(--pad);
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-left: max(var(--pad), env(safe-area-inset-left));
      padding-right: max(var(--pad), env(safe-area-inset-right));
      background: linear-gradient(to top, var(--bg) 75%, rgba(6, 11, 26, 0));
    }

    .btn {
      min-height: 3rem;
      border-radius: 0.9rem;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      gap: 0.5rem;
      padding: 0.5rem 1.25rem;
      cursor: pointer;
      border: none;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      overflow-wrap: anywhere;
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible, .status button:focus-visible { outline: 2px solid var(--emerald-bright); outline-offset: 2px; }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #022c22;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.28);
    }
    .btn-primary:hover { box-shadow: 0 10px 24px rgba(16, 185, 129, 0.38); }

    .btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { background: var(--surface-2); }

    @media (min-width: 40rem) {
      .bottom-actions { flex-direction: row; justify-content: center; }
      .bottom-actions .btn { flex: 0 1 18rem; }
    }

    /* ---------- Edge cases ---------- */
    @media (max-height: 480px) and (orientation: landscape) {
      .bottom-actions { position: static; }
    }

    @media (min-width: 1800px) { html { font-size: 20px; } }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="content">
      <!-- Status / save messages -->
      <div class="status full" id="statusBanner" role="alert" hidden>
        <span id="statusText"></span>
        <button type="button" id="statusRetry" hidden>Retry</button>
      </div>

      <!-- Empty state -->
      <div class="empty-state full" id="emptyState" hidden></div>

      <!-- Everything below is only shown when there is a real result -->
      <div class="full" id="resultWrap" hidden style="display:none">
        <div class="content" style="padding:0">
          <!-- Hero -->
          <div class="hero full">
            <div class="hero-emoji" id="heroEmoji"></div>
            <div class="hero-title" id="heroTitle"></div>
            <div class="hero-score" id="heroScore"></div>
            <div class="hero-meta" id="heroMeta"></div>
            <div class="hero-sub" id="heroSub"></div>
            <div class="improvement" id="heroBadge"></div>
          </div>

          <!-- Stats -->
          <div class="stats-grid full" id="statsGrid"></div>

          <!-- Topic Performance -->
          <div class="section">
            <h2 class="section-title">Topic Performance</h2>
            <div id="topicList"></div>
          </div>

          <!-- Recommendation -->
          <div class="section">
            <h2 class="section-title">Recommendation</h2>
            <div class="recommend-card">
              <div class="recommend-icon" id="recIcon"></div>
              <div class="recommend-body">
                <h3 id="recTitle"></h3>
                <p id="recText"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Actions -->
    <div class="bottom-actions" id="bottomActions" hidden>
      <a class="btn btn-primary" id="practiceMoreBtn" href="practice.html">Practice More</a>
      <a class="btn btn-secondary" href="home.html">Back to Home</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    /* ====== CONFIG ======
       Where the result comes from (first match wins):
       1. URL params:  results.html?score=24&total=30&topic=Genetics  (optional: incorrect, time, course, mode)
       2. The submitted exam session saved by the exam page (key below). For scoring, each question needs
          its correct answer:  questions: [ { id, topic, correct }, … ]  and  answers: { id: chosen }.
    */
    const SESSION_KEY = 'cbt_session';
    const SUPABASE_URL = 'https://xuofkjjhupgmrphzgyun.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_GThKt7BvR1D81U939_EQkw_yCnTQ3xh';
    const RESULTS_TABLE = 'test_results';
    const SETUP_URL = 'practice-setup.html';
    /* ==================== */

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pct = (c, t) => (t > 0 ? Math.round((c / t) * 100) : 0);
    const tier = (p) => (p >= 70 ? 'emerald' : p >= 50 ? 'amber' : 'red');

    let store = null;
    let sessionObj = null;
    let result = null;

    /* ---------- Helpers ---------- */
    function showStatus(message, type) {
      const el = $('statusBanner');
      el.classList.toggle('info', type === 'info');
      $('statusText').innerHTML = '<strong>' + (type === 'info' ? 'Note:' : 'Problem:') + '</strong> ' + esc(message);
      $('statusRetry').hidden = type === 'info';
      el.hidden = false;
    }
    function clearStatus() { $('statusBanner').hidden = true; }

    function formatDuration(sec) {
      if (sec == null || !isFinite(sec) || sec <= 0) return '–';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      if (h > 0) return h + 'h ' + String(m).padStart(2, '0') + 'm';
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function readSession() {
      const stores = [];
      try { stores.push(window.sessionStorage); } catch (e) {}
      try { stores.push(window.localStorage); } catch (e) {}
      for (const s of stores) {
        try {
          const raw = s.getItem(SESSION_KEY);
          if (raw) { store = s; return JSON.parse(raw); }
        } catch (e) { /* ignore unreadable value */ }
      }
      return null;
    }

    function writeSession() {
      if (!store || !sessionObj) return;
      try { store.setItem(SESSION_KEY, JSON.stringify(sessionObj)); } catch (e) {}
    }

    /* ---------- Build the result from real data ---------- */
    function fromParams() {
      const p = new URLSearchParams(window.location.search);
      const total = parseInt(p.get('total'), 10);
      const score = parseInt(p.get('score'), 10);
      if (!(total > 0) || isNaN(score)) return null;

      const incorrectParam = parseInt(p.get('incorrect'), 10);
      const wrong = !isNaN(incorrectParam) ? incorrectParam : Math.max(total - score, 0);
      const time = parseInt(p.get('time'), 10);

      return {
        source: 'params',
        mode: p.get('mode') === 'exam' ? 'exam' : 'practice',
        code: p.get('course') || '',
        title: '',
        topic: p.get('topic') || '',
        total,
        correct: score,
        wrong,
        unanswered: Math.max(total - score - wrong, 0),
        duration: !isNaN(time) ? time : null,
        topics: []
      };
    }

    function fromSession(s) {
      if (!s || s.status !== 'submitted' || !Array.isArray(s.questions) || !s.questions.length) return null;

      const answers = s.answers || {};
      const byTopic = new Map();
      let correct = 0, wrong = 0, unanswered = 0, gradable = 0;

      s.questions.forEach((q, i) => {
        const id = q && typeof q === 'object' && q.id != null ? String(q.id) : String(i);
        const key = q && typeof q === 'object'
          ? (q.correct != null ? q.correct : (q.correct_answer != null ? q.correct_answer : q.answer))
          : null;
        if (key == null) return;
        gradable++;

        const given = Array.isArray(answers) ? answers[i] : (answers[id] !== undefined ? answers[id] : answers[i]);
        const has = given !== undefined && given !== null && given !== '';
        const isCorrect = has && String(given).trim().toLowerCase() === String(key).trim().toLowerCase();

        if (isCorrect) correct++; else if (has) wrong++; else unanswered++;

        const topic = (q && q.topic) || s.topic || '';
        if (topic) {
          if (!byTopic.has(topic)) byTopic.set(topic, { name: topic, c: 0, t: 0 });
          const g = byTopic.get(topic);
          g.t++;
          if (isCorrect) g.c++;
        }
      });

      if (gradable !== s.questions.length) return { ungradable: true };

      let duration = s.duration_seconds != null ? Number(s.duration_seconds) : null;
      if (duration == null && s.started_at && s.submitted_at) {
        duration = Math.round((new Date(s.submitted_at) - new Date(s.started_at)) / 1000);
      }

      const topics = [...byTopic.values()].map((g) => ({ name: g.name, c: g.c, t: g.t, p: pct(g.c, g.t) }))
        .sort((a, b) => a.p - b.p);

      return {
        source: 'session',
        mode: s.mode === 'practice' ? 'practice' : 'exam',
        code: s.course_code || '',
        title: s.course_title || '',
        topic: topics.length === 1 ? topics[0].name : (s.topic || ''),
        total: s.questions.length,
        correct, wrong, unanswered,
        duration,
        topics
      };
    }

    /* ---------- Render ---------- */
    function render(r) {
      const percentage = pct(r.correct, r.total);
      const label = r.topic || r.title || r.code || '';

      $('heroEmoji').textContent = percentage >= 70 ? '🎉' : percentage >= 50 ? '👍' : '📚';
      $('heroTitle').textContent = percentage >= 70 ? 'Great Job!' : percentage >= 50 ? 'Good Effort!' : 'Keep Practicing!';
      $('heroScore').textContent = percentage + '%';
      $('heroMeta').innerHTML = `<strong>${r.correct}</strong> / ${r.total} Correct`;
      $('heroSub').textContent = [r.code, r.title && r.title !== r.code ? r.title : ''].filter(Boolean).join(' • ');
      $('heroSub').hidden = !$('heroSub').textContent;
      $('heroBadge').textContent = r.mode === 'practice' ? 'Practice Complete' : 'Exam Complete';

      const cards = [
        { v: percentage + '%', c: tier(percentage) === 'emerald' ? 'green' : tier(percentage) === 'amber' ? 'amber' : 'red', l: 'Accuracy' },
        { v: formatDuration(r.duration), c: 'blue', l: 'Time Taken' },
        { v: r.correct, c: 'green', l: 'Correct' },
        { v: r.wrong, c: 'red', l: 'Incorrect' }
      ];
      if (r.unanswered > 0) cards.push({ v: r.unanswered, c: 'amber', l: 'Unanswered' });
      $('statsGrid').innerHTML = cards.map((x) =>
        `<div class="stat-card"><div class="stat-value ${x.c}">${esc(x.v)}</div><div class="stat-label">${x.l}</div></div>`).join('');

      // Topic performance: per-topic when known, otherwise one overall row
      const rows = r.topics.length
        ? r.topics
        : [{ name: label || 'Overall', c: r.correct, t: r.total, p: percentage }];
      $('topicList').innerHTML = rows.map((g) => {
        const t = tier(g.p);
        return `
          <div class="topic-item">
            <div class="topic-header">
              <span class="topic-name">${esc(g.name)}</span>
              <span class="topic-score ${t}">${g.p}%</span>
            </div>
            <div class="topic-bar"><div class="topic-fill ${t}" data-w="${g.p}"></div></div>
          </div>`;
      }).join('');
      requestAnimationFrame(() => setTimeout(() => {
        document.querySelectorAll('.topic-fill').forEach((b) => { b.style.width = b.dataset.w + '%'; });
      }, 150));

      // Recommendation from the actual numbers
      const weakest = r.topics.length > 1 ? r.topics[0] : null;
      if (weakest && weakest.p < 70) {
        $('recIcon').textContent = '🎯';
        $('recTitle').textContent = 'Focus on ' + weakest.name;
        $('recText').textContent = `You scored ${weakest.p}% (${weakest.c}/${weakest.t}) here. Review the questions you missed in this topic first.`;
      } else if (percentage >= 70) {
        $('recIcon').textContent = '✅';
        $('recTitle').textContent = label ? `Strong result in ${label}` : 'Strong result';
        $('recText').textContent = `You got ${r.correct} of ${r.total} right. Keep practicing regularly to stay sharp.`;
      } else {
        $('recIcon').textContent = '📖';
        $('recTitle').textContent = label ? `Review ${label}` : 'Review your mistakes';
        $('recText').textContent = `You missed ${r.wrong + r.unanswered} of ${r.total} questions. Go through those answers to strengthen your understanding.`;
      }

      $('practiceMoreBtn').textContent = label ? `Practice More ${label}` : 'Practice More';

      $('resultWrap').hidden = false;
      $('resultWrap').style.display = '';
      $('bottomActions').hidden = false;
      $('emptyState').hidden = true;
    }

    function renderEmpty(message) {
      $('resultWrap').hidden = true;
      $('resultWrap').style.display = 'none';
      $('bottomActions').hidden = true;
      $('emptyState').hidden = false;
      $('emptyState').innerHTML = esc(message) + '<br><a href="' + esc(SETUP_URL) + '">Start a practice session</a>';
    }

    /* ---------- Save to Supabase so Profile + Progress update live ---------- */
    async function saveResult(force) {
      if (!result) return;

      // Don't save twice for the same attempt
      if (result.source === 'session') {
        if (sessionObj && sessionObj.result_saved) return;
      } else if (!force) {
        const nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
        if (nav && nav.type !== 'navigate') return; // reload / back-forward: already saved
      }

      if (!window.supabase || !window.supabase.createClient) {
        showStatus('The Supabase library did not load, so this result was not saved.');
        return;
      }

      try {
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error: authError } = await sb.auth.getSession();
        if (authError) throw authError;
        if (!data.session) {
          showStatus('You are not signed in, so this result was not saved to your progress.', 'info');
          return;
        }

        const { error } = await sb.from(RESULTS_TABLE).insert({
          user_id: data.session.user.id,
          course_code: result.code || null,
          course_title: result.title || null,
          topic: result.topic || null,
          mode: result.mode,
          score: result.correct,
          total_questions: result.total,
          duration_seconds: result.duration && result.duration > 0 ? Math.round(result.duration) : 0
        });
        if (error) throw error;

        if (result.source === 'session' && sessionObj) {
          sessionObj.result_saved = true;
          writeSession();
        }
        clearStatus();
      } catch (e) {
        console.error('[results] save failed:', e);
        showStatus('Your result could not be saved: ' + ((e && e.message) || e));
      }
    }

    /* ---------- Init ---------- */
    document.addEventListener('DOMContentLoaded', () => {
      $('statusRetry').addEventListener('click', () => saveResult(true));

      sessionObj = readSession();
      result = fromParams();
      if (!result) result = fromSession(sessionObj);

      if (result && result.ungradable) {
        result = null;
        renderEmpty('This session has no answer key, so a score cannot be calculated.');
        return;
      }
      if (!result) {
        renderEmpty('No results to show yet.');
        return;
      }

      render(result);
      saveResult(false);
    });
  </script>
</body>
</html>
