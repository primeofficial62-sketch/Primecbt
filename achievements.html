<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070D1C">
  <title>Achievements — PRIME-CBT</title>
  <link rel="icon" type="image/png" href="34a8580a-ede3-4350-a224-6f298b16a670_removalai_preview.png">
  <link rel="apple-touch-icon" href="34a8580a-ede3-4350-a224-6f298b16a670_removalai_preview.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#070D1C; --surface:#10192B; --surface-2:#17233A; --border:#2A3850; --inactive:#344256;
      --text:#F4F6FC; --muted:#9BA8BE; --placeholder:#6F7F99;
      --emerald:#31D3A2; --emerald-hover:#4BE0B5; --on-emerald:#070D1C; --red:#F87171; --amber:#E3A84A;
      --card:linear-gradient(160deg,#15233C 0%,#0D1627 100%); --line:rgba(49,211,162,.22);
    }
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { -webkit-text-size-adjust:100%; }
    [hidden] { display:none !important; }
    body {
      font-family:'Inter',system-ui,sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; line-height:1.5;
      background:radial-gradient(760px 420px at 50% -90px, rgba(49,211,162,.13), transparent 70%), var(--bg);
      min-height:100vh; min-height:100dvh; display:flex; justify-content:center;
      padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
    }
    :focus-visible { outline:2px solid var(--emerald); outline-offset:2px; }
    .stage { width:100%; max-width:560px; min-height:100dvh; display:flex; flex-direction:column; }
    @media (min-width:640px){ .stage { border-left:1px solid rgba(42,56,80,.6); border-right:1px solid rgba(42,56,80,.6); } }

    .top { position:sticky; top:0; z-index:40; background:rgba(7,13,28,.88); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--border); padding:env(safe-area-inset-top) 16px 0; }
    .top-row { height:60px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .left { display:flex; align-items:center; gap:10px; min-width:0; }
    .icon-btn { width:44px; height:44px; flex-shrink:0; border-radius:50%; background:var(--surface); border:1px solid var(--border); color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:color .2s,border-color .2s; }
    .icon-btn:hover { color:var(--text); border-color:var(--inactive); }
    h1.title { font-family:'Lora',serif; font-size:20px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .live { display:none; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:11px; font-weight:500; color:var(--muted); flex-shrink:0; }
    @media (min-width:360px){ .live { display:inline-flex; } }
    .live-dot { width:7px; height:7px; border-radius:50%; background:#64748b; }
    .live-dot.on { background:var(--emerald); animation:pulse 2s ease-in-out infinite; }
    .live-dot.off { background:var(--amber); }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(49,211,162,.5);} 50%{box-shadow:0 0 0 5px rgba(49,211,162,0);} }

    main { flex:1; min-width:0; padding:20px 16px max(40px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:20px; transition:border-color .25s; }
    @media (hover:hover){ .card:hover { border-color:rgba(49,211,162,.45); } }
    .muted { color:var(--muted); }
    .banner { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-radius:16px; border:1px solid rgba(248,113,113,.3); background:rgba(248,113,113,.1); color:#FCA5A5; font-size:13px; }
    .banner button { background:none; border:none; color:#FECACA; font:inherit; font-weight:600; text-decoration:underline; text-underline-offset:2px; min-height:44px; padding:0 8px; cursor:pointer; }

    /* level */
    .level-top { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; }
    .level-top .lbl { font-size:13px; color:var(--muted); }
    .level-title { font-family:'Lora',serif; font-size:clamp(28px,8vw,34px); font-weight:700; line-height:1.15; margin-top:2px; }
    .level-badge { width:64px; height:64px; flex-shrink:0; border-radius:50%; background:rgba(49,211,162,.12); border:2px solid rgba(49,211,162,.5); box-shadow:0 0 0 6px rgba(49,211,162,.07); display:flex; align-items:center; justify-content:center; font-family:'Lora',serif; font-size:26px; font-weight:700; color:var(--emerald); }
    .xp-row { display:flex; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:8px; }
    .xp-row span:first-child { font-weight:600; } .xp-row span:last-child { color:var(--placeholder); }
    .track { height:10px; border-radius:999px; background:#1E2B44; overflow:hidden; }
    .fill { height:100%; border-radius:999px; background:linear-gradient(90deg,#31D3A2,#5EEAD4); transition:width .6s cubic-bezier(.4,0,.2,1); }
    .hint { font-size:12px; color:var(--placeholder); margin-top:8px; }

    /* streak */
    .streak { display:flex; align-items:center; gap:16px; }
    .streak-ico { width:52px; height:52px; flex-shrink:0; border-radius:16px; background:rgba(227,168,74,.14); color:var(--amber); display:flex; align-items:center; justify-content:center; }
    .streak-t { font-size:20px; font-weight:700; }
    .streak-s { font-size:13px; color:var(--muted); margin-top:2px; }
    .week { display:flex; justify-content:space-between; gap:6px; margin-top:16px; padding-top:16px; border-top:1px solid var(--border); }
    .day { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px; color:var(--placeholder); }
    .day i { width:28px; height:28px; border-radius:50%; border:1.5px solid var(--inactive); display:flex; align-items:center; justify-content:center; }
    .day.on i { background:rgba(49,211,162,.15); border-color:var(--emerald); color:var(--emerald); }
    .day.today { color:var(--text); font-weight:600; }
    .day.today:not(.on) i { border-style:dashed; border-color:var(--amber); }

    /* achievements */
    .head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
    .head h3 { font-family:'Lora',serif; font-size:19px; font-weight:700; }
    #achCount { font-size:13px; color:var(--muted); }
    .chips { display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    .chip { min-height:44px; padding:0 18px; border-radius:999px; background:var(--surface); border:1px solid var(--border); color:var(--muted); font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; transition:all .2s; }
    .chip[aria-pressed="true"] { background:var(--emerald); border-color:var(--emerald); color:var(--on-emerald); }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    @media (min-width:520px){ .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    .ach { display:flex; flex-direction:column; align-items:center; text-align:center; padding:16px 12px; border-radius:22px; min-width:0; }
    .ach.on { border-color:rgba(49,211,162,.45); box-shadow:0 0 26px rgba(49,211,162,.09); }
    .ach:not(.on) { background:linear-gradient(160deg,#101A2D,#0B1322); border-color:var(--border); }
    .ring { width:48px; height:48px; border-radius:50%; margin-bottom:10px; display:flex; align-items:center; justify-content:center; background:#18243C; color:#64748b; }
    .ach.on .ring { background:rgba(49,211,162,.15); color:var(--emerald); }
    .a-title { font-size:14px; font-weight:600; max-width:100%; overflow-wrap:anywhere; }
    .ach:not(.on) .a-title { color:var(--muted); }
    .a-desc { font-size:12px; color:var(--placeholder); margin-top:3px; max-width:100%; overflow-wrap:anywhere; }
    .a-track { width:100%; height:6px; border-radius:99px; background:#1E2B44; overflow:hidden; margin-top:12px; }
    .a-fill { height:100%; border-radius:99px; background:rgba(49,211,162,.75); transition:width .6s; }
    .a-num { font-size:11px; color:var(--placeholder); margin-top:5px; }
    .done { margin-top:10px; font-size:11px; font-weight:700; color:var(--emerald); background:rgba(49,211,162,.12); border-radius:99px; padding:3px 10px; }
    .empty { grid-column:1/-1; font-size:14px; color:var(--placeholder); padding:4px; }
    .sk { color:transparent !important; background:linear-gradient(90deg,#17233A 25%,#223250 50%,#17233A 75%); background-size:200% 100%; animation:shimmer 1.4s linear infinite; border-radius:10px; }
    @keyframes shimmer { to { background-position:-200% 0; } }
    @media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation:none !important; transition:none !important; } }
  </style>
</head>
<body>
<div class="stage">
  <header class="top">
    <div class="top-row">
      <div class="left">
        <button id="backBtn" type="button" class="icon-btn" aria-label="Go back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h1 class="title">Achievements</h1>
      </div>
      <span id="livePill" class="live" role="status" aria-live="polite"><span id="liveDot" class="live-dot"></span><span id="liveText">Connecting</span></span>
    </div>
  </header>

  <main>
    <div id="errorBanner" class="banner" hidden>
      <span id="errorText">Couldn’t load your achievements.</span>
      <button id="retryBtn" type="button">Retry</button>
    </div>

    <section class="card" aria-label="Level progress">
      <div class="level-top">
        <div style="min-width:0">
          <p class="lbl">Current level</p>
          <h2 id="levelTitle" class="level-title sk">Level 1</h2>
        </div>
        <div class="level-badge"><span id="levelBadge">—</span></div>
      </div>
      <div class="xp-row"><span id="xpNow">—</span><span id="xpNext">—</span></div>
      <div class="track" id="levelBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="levelFill" class="fill" style="width:0%"></div></div>
      <p id="xpToNext" class="hint">&nbsp;</p>
    </section>

    <section class="card" aria-label="Streak">
      <div class="streak">
        <div class="streak-ico" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        </div>
        <div style="min-width:0">
          <p id="streakTitle" class="streak-t">—</p>
          <p id="streakSub" class="streak-s">&nbsp;</p>
        </div>
      </div>
      <div id="week" class="week" aria-label="Last 7 days"></div>
    </section>

    <section aria-label="Achievements">
      <div class="head"><h3>Achievements</h3><span id="achCount"></span></div>
      <div class="chips" role="group" aria-label="Filter achievements">
        <button type="button" class="chip" data-f="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-f="unlocked" aria-pressed="false">Unlocked</button>
        <button type="button" class="chip" data-f="locked" aria-pressed="false">In progress</button>
      </div>
      <div id="achGrid" class="grid"><p class="empty">Loading achievements…</p></div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  'use strict';

  const CONFIG = {
    SUPABASE_URL: 'https://xuofkjjhupgmrphzgyun.supabase.co',
    SUPABASE_ANON_KEY: 'sb_publishable_GThKt7BvR1D81U939_EQkw_yCnTQ3xh',
    loginPage: 'auth.html',   // your sign-up / log-in page
    tables: { results: 'practice_results', achievements: 'achievements' },
    xpPerLevel: 250,          // Level n starts at (n-1) * xpPerLevel total XP
    statsRowLimit: 5000
  };

  const $ = (id) => document.getElementById(id);
  const el = {
    back: $('backBtn'), dot: $('liveDot'), liveText: $('liveText'),
    err: $('errorBanner'), errText: $('errorText'), retry: $('retryBtn'),
    levelTitle: $('levelTitle'), levelBadge: $('levelBadge'), levelFill: $('levelFill'), levelBar: $('levelBar'),
    xpNow: $('xpNow'), xpNext: $('xpNext'), xpToNext: $('xpToNext'),
    streakTitle: $('streakTitle'), streakSub: $('streakSub'), week: $('week'),
    grid: $('achGrid'), count: $('achCount')
  };

  el.back.addEventListener('click', () => {
    if (history.length > 1) history.back(); else location.href = document.referrer || 'home.html';
  });

  if (!window.supabase) {
    el.errText.textContent = 'Couldn’t load the app. Check your connection and refresh.';
    el.retry.hidden = true; el.err.hidden = false;
    return;
  }
  const db = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const T = CONFIG.tables;
  const state = { user: null, rows: [], catalog: [], filter: 'all' };

  /* ---------- helpers ---------- */
  function setLive(s) {
    el.dot.classList.remove('on', 'off');
    if (s === 'live') { el.dot.classList.add('on'); el.liveText.textContent = 'Live'; }
    else if (s === 'offline') { el.dot.classList.add('off'); el.liveText.textContent = 'Offline'; }
    else el.liveText.textContent = 'Connecting';
  }
  const showError = (m) => { el.errText.textContent = m; el.err.hidden = false; };
  function redirectToLogin() {
    // After logging in, auth.html sends the person back to this page
    const next = location.pathname.split('/').pop() + location.search;
    location.replace(`${CONFIG.loginPage}?mode=login&next=${encodeURIComponent(next)}`);
  }
  const fmt = (n) => Math.round(n).toLocaleString();
  const localDay = (d) => new Date(d).toLocaleDateString('en-CA');
  const dayNum = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
  const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  /* ---------- metrics from live results ---------- */
  function computeMetrics(rows) {
    let xp = 0, questions = 0, best = 0;
    const days = new Set();
    for (const r of rows) {
      xp += r.xp_earned || 0;
      questions += r.total_questions || 0;
      if (r.total_questions > 0) best = Math.max(best, Math.round((r.correct_answers / r.total_questions) * 100));
      days.add(localDay(r.created_at));
    }
    const practicedToday = days.has(localDay(new Date()));
    let current = 0;
    const cursor = new Date();
    if (!practicedToday) cursor.setDate(cursor.getDate() - 1);
    while (days.has(localDay(cursor))) { current++; cursor.setDate(cursor.getDate() - 1); }
    const sorted = [...days].map(dayNum).sort((a, b) => a - b);
    let longest = 0, run = 0;
    sorted.forEach((n, i) => { run = i > 0 && n - sorted[i - 1] === 1 ? run + 1 : 1; longest = Math.max(longest, run); });
    return { total_xp: xp, questions_answered: questions, sessions: rows.length, best_score_pct: best, streak_days: longest, current_streak: current, practicedToday, days };
  }

  /* ---------- icons (static, trusted markup) ---------- */
  const ICONS = {
    trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
    flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
    bars: '<path d="M12 20v-6M6 20V10M18 20V4"/>',
    medal: '<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>',
    crown: '<path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/>',
    star: '<path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>'
  };
  function icon(name) {
    const wrap = document.createElement('div');
    wrap.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.trophy}</svg>`;
    return wrap.firstChild;
  }

  /* ---------- render ---------- */
  function renderLevel(m) {
    const per = CONFIG.xpPerLevel;
    const level = Math.floor(m.total_xp / per) + 1;
    const start = (level - 1) * per, next = level * per;
    const pct = Math.min(100, Math.max(0, ((m.total_xp - start) / per) * 100));
    el.levelTitle.classList.remove('sk');
    el.levelTitle.textContent = `Level ${level}`;
    el.levelBadge.textContent = String(level);
    el.xpNow.textContent = `${fmt(m.total_xp)} XP`;
    el.xpNext.textContent = `${fmt(next)} XP`;
    el.levelFill.style.width = pct + '%';
    el.levelBar.setAttribute('aria-valuenow', String(Math.round(pct)));
    el.xpToNext.textContent = `${fmt(next - m.total_xp)} XP to Level ${level + 1}`;
  }

  function renderStreak(m) {
    const n = m.current_streak;
    el.streakTitle.textContent = `${n} Day Streak`;
    let sub;
    if (n === 0) sub = 'Practice today to start a streak.';
    else if (m.practicedToday) sub = 'You’ve practiced today. Come back tomorrow to keep it going.';
    else sub = 'Practice today to keep your streak alive.';
    if (m.streak_days > n) sub += ` Longest: ${m.streak_days} ${m.streak_days === 1 ? 'day' : 'days'}.`;
    el.streakSub.textContent = sub;

    // last 7 days, oldest first
    const cells = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const on = m.days.has(localDay(d));
      const cell = mk('div', 'day' + (on ? ' on' : '') + (i === 0 ? ' today' : ''));
      const dot = mk('i');
      if (on) dot.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
      cell.setAttribute('aria-label', `${d.toLocaleDateString(undefined, { weekday: 'long' })}: ${on ? 'practiced' : 'no practice'}`);
      cell.append(dot, mk('span', null, d.toLocaleDateString(undefined, { weekday: 'narrow' })));
      cells.push(cell);
    }
    el.week.replaceChildren(...cells);
  }

  const formatMetric = (metric, v) => metric === 'best_score_pct' ? `${fmt(v)}%` : fmt(v);

  function renderAchievements(m) {
    const all = state.catalog.map((a) => {
      const value = Object.prototype.hasOwnProperty.call(m, a.metric) ? m[a.metric] : null;
      return { ...a, value, unlocked: value !== null && value >= a.threshold };
    });
    all.sort((a, b) => (b.unlocked - a.unlocked) || ((a.sort_order ?? 0) - (b.sort_order ?? 0)));
    const unlocked = all.filter((a) => a.unlocked).length;
    el.count.textContent = all.length ? `${unlocked} / ${all.length} unlocked` : '';

    const list = all.filter((a) => state.filter === 'all' || (state.filter === 'unlocked' ? a.unlocked : !a.unlocked));
    if (!list.length) {
      const msg = !all.length ? 'No achievements have been set up yet.'
        : state.filter === 'unlocked' ? 'Nothing unlocked yet. Finish a practice session to earn your first one.'
        : 'You’ve unlocked everything. Well done!';
      el.grid.replaceChildren(mk('p', 'empty', msg));
      return;
    }

    el.grid.replaceChildren(...list.map((a) => {
      const card = mk('div', 'card ach' + (a.unlocked ? ' on' : ''));
      const ring = mk('div', 'ring'); ring.append(icon(a.icon));
      card.append(ring, mk('p', 'a-title', a.title), mk('p', 'a-desc', a.description || ''));
      if (a.unlocked) {
        card.append(mk('span', 'done', 'Unlocked'));
      } else if (a.value !== null) {
        const track = mk('div', 'a-track'), fill = mk('div', 'a-fill');
        fill.style.width = Math.min(100, (a.value / a.threshold) * 100) + '%';
        track.append(fill);
        card.append(track, mk('p', 'a-num', `${formatMetric(a.metric, a.value)} / ${formatMetric(a.metric, a.threshold)}`));
      }
      return card;
    }));
  }

  function renderAll() {
    const m = computeMetrics(state.rows);
    renderLevel(m); renderStreak(m); renderAchievements(m);
  }

  document.querySelectorAll('.chip').forEach((chip) => chip.addEventListener('click', () => {
    state.filter = chip.dataset.f;
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
    if (state.user) renderAll();
  }));

  /* ---------- data ---------- */
  async function refresh() {
    const [res, cat] = await Promise.allSettled([
      db.from(T.results).select('xp_earned,total_questions,correct_answers,created_at')
        .eq('user_id', state.user.id).order('created_at', { ascending: false }).limit(CONFIG.statsRowLimit),
      db.from(T.achievements).select('*').order('sort_order', { ascending: true })
    ]);
    let failed = false;
    if (res.status === 'fulfilled' && !res.value.error) state.rows = res.value.data || []; else { failed = true; console.error('[achievements] results:', res.reason || res.value.error); }
    if (cat.status === 'fulfilled' && !cat.value.error) state.catalog = cat.value.data || []; else { failed = true; console.error('[achievements] catalog:', cat.reason || cat.value.error); }
    if (failed) {
      showError('Some of your data couldn’t be loaded. Check your connection and try again.');
      if (!state.catalog.length && el.grid.textContent.startsWith('Loading')) {
        el.grid.replaceChildren(mk('p', 'empty', 'Couldn’t load achievements.'));
        return;
      }
    } else el.err.hidden = true;
    renderAll();
  }
  el.retry.addEventListener('click', refresh);

  /* ---------- realtime ---------- */
  let channel = null, debounce = null;
  const schedule = () => { clearTimeout(debounce); debounce = setTimeout(refresh, 400); };
  function subscribe() {
    if (channel) db.removeChannel(channel);
    const uid = state.user.id;
    channel = db.channel('achievements-' + uid)
      .on('postgres_changes', { event: '*', schema: 'public', table: T.results, filter: `user_id=eq.${uid}` }, schedule)
      .on('postgres_changes', { event: '*', schema: 'public', table: T.achievements }, schedule)
      .subscribe((s) => {
        if (s === 'SUBSCRIBED') setLive(navigator.onLine ? 'live' : 'offline');
        else if (['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(s)) setLive('offline');
      });
  }
  window.addEventListener('online', () => { setLive('live'); schedule(); });
  window.addEventListener('offline', () => setLive('offline'));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && state.user) schedule(); });
  window.addEventListener('pageshow', (e) => { if (e.persisted && state.user) schedule(); });
  setInterval(() => { if (state.user) renderAll(); }, 60000); // a streak can lapse at midnight

  db.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') redirectToLogin(); });

  /* ---------- boot ---------- */
  (async function init() {
    setLive('connecting');
    try {
      const { data: { session } } = await db.auth.getSession();
      if (!session) return redirectToLogin();
      const { data: { user }, error } = await db.auth.getUser();
      if (error || !user) return redirectToLogin();
      state.user = user;
      await refresh();
      subscribe();
    } catch (err) {
      console.error('[achievements] init failed:', err);
      setLive('offline');
      showError('Couldn’t connect. Check your connection and try again.');
    }
  })();
})();
</script>
</body>
</html>
