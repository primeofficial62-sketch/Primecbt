<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>PRIME-CBT — Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { navy: '#060b1a' },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    :root {
      --bg: #060b1a;
      --border: #334155;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg);
      color: #f1f5f9;
      overflow-y: auto;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 42rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      background-color: rgba(6, 11, 26, 0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .back-btn {
      width: 2.5rem;
      height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      color: #cbd5e1;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background-color: rgba(30, 41, 59, 0.8);
    }

    .back-btn svg {
      width: 1.25rem;
      height: 1.25rem;
    }

    .topbar-text {
      text-align: center;
      flex: 1;
    }

    .topbar-text h1 {
      font-size: 1.125rem;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: -0.025em;
    }

    .topbar-text p {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 0.125rem;
    }

    .text-btn {
      font-size: 0.75rem;
      font-weight: 600;
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.2);
      padding: 0.375rem 0.75rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .text-btn:hover {
      background: rgba(52, 211, 153, 0.2);
    }

    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-tabs::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      padding: 0.375rem 0.875rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      color: #94a3b8;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-chip.active {
      background-color: #34d399;
      color: #022c22;
      border-color: #34d399;
      font-weight: 600;
    }

    .filter-chip:hover:not(.active) {
      background-color: #1e293b;
      color: #f1f5f9;
    }

    .content {
      padding: 0.5rem 1rem 2rem 1rem;
      flex: 1;
    }

    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .notif-card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 1rem;
      padding: 1rem;
      display: flex;
      align-items: flex-start;
      gap: 0.875rem;
      position: relative;
      transition: all 0.2s;
      cursor: pointer;
    }

    .notif-card:hover {
      border-color: #334155;
      transform: translateY(-1px);
    }

    .notif-card.unread {
      background-color: rgba(15, 23, 42, 0.95);
      border-color: rgba(52, 211, 153, 0.3);
    }

    .notif-icon {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .notif-icon svg {
      width: 1.125rem;
      height: 1.125rem;
    }

    .notif-icon.green { background-color: rgba(52, 211, 153, 0.15); color: #34d399; }
    .notif-icon.amber { background-color: rgba(251, 191, 36, 0.15); color: #fbbf24; }
    .notif-icon.purple { background-color: rgba(168, 85, 247, 0.15); color: #a855f7; }
    .notif-icon.blue { background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; }

    .notif-body {
      flex: 1;
      min-width: 0;
    }

    .notif-title {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .notif-desc {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 0.25rem;
      line-height: 1.4;
    }

    .notif-time {
      font-size: 0.6875rem;
      color: #64748b;
      margin-top: 0.375rem;
    }

    .unread-dot {
      width: 0.5rem;
      height: 0.5rem;
      background-color: #34d399;
      border-radius: 9999px;
      flex-shrink: 0;
      margin-top: 0.25rem;
    }

    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1rem;
      color: #64748b;
    }

    .empty-state.show {
      display: flex;
    }

    .empty-icon {
      width: 3rem;
      height: 3rem;
      border-radius: 1rem;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      margin-bottom: 1rem;
    }

    .empty-icon svg {
      width: 1.5rem;
      height: 1.5rem;
    }

    .empty-state p {
      font-size: 0.875rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .empty-state span {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.25rem;
    }

    /* Remove slide-up, fade-in, and scale entrance animations globally */
    .animate-fade-up,
    .animate-scale,
    .animate-fade-in,
    .animate-slide-up,
    [class*="animate-"] {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  </style>
  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>

</head>
<body>
  <div class="app">
    <!-- Top Bar -->
    <div class="topbar">
      <a href="home.html" class="back-btn" aria-label="Back to Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>

      <div class="topbar-text">
        <h1>Notifications</h1>
        <p id="subText">Stay updated</p>
      </div>

      <button class="text-btn" id="markAllBtn" type="button">Mark all read</button>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button class="filter-chip active" type="button" data-type="all">All</button>
      <button class="filter-chip" type="button" data-type="exams">Exams</button>
      <button class="filter-chip" type="button" data-type="study">Study</button>
      <button class="filter-chip" type="button" data-type="community">Community</button>
    </div>

    <!-- Content -->
    <div class="content">
      <div class="notif-list" id="notifList"></div>

      <!-- Empty State -->
      <div class="empty-state" id="notifEmptyState">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </div>
        <p id="emptyTitle">No notifications yet</p>
        <span id="emptyText">New updates will show up here as they happen.</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="profile-gate.js"></script>
  <script>
    // ========== SUPABASE CLIENT ==========
    const SUPABASE_URL = "https://xuofkjjhupgmrphzgyun.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GThKt7BvR1D81U939_EQkw_yCnTQ3xh";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener('DOMContentLoaded', () => {
      const listEl = document.getElementById('notifList');
      const emptyState = document.getElementById('notifEmptyState');
      const emptyTitle = document.getElementById('emptyTitle');
      const emptyText = document.getElementById('emptyText');
      const subText = document.getElementById('subText');
      const markAllBtn = document.getElementById('markAllBtn');
      const filterChips = document.querySelectorAll('.filter-chip');

      let items = [];
      let activeFilter = 'all';
      let loaded = false;
      let currentUser = null;

      // ----- Icons / colours per notification type -----
      const ICONS = {
        star: '<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
        cap:  '<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
        book: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
        chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
        bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>'
      };
      const TYPE_META = {
        welcome:   { cls: 'green',  icon: ICONS.star },
        exam:      { cls: 'amber',  icon: ICONS.cap },
        exams:     { cls: 'amber',  icon: ICONS.cap },
        study:     { cls: 'blue',   icon: ICONS.book },
        community: { cls: 'purple', icon: ICONS.chat }
      };
      const DEFAULT_META = { cls: 'green', icon: ICONS.bell };

      function categoryOf(type) {
        if (type === 'exam' || type === 'exams') return 'exams';
        if (type === 'study') return 'study';
        if (type === 'community') return 'community';
        return 'other'; // welcome, info... only show under "All"
      }

      function timeAgo(iso) {
        const secs = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
        if (secs < 60) return 'Just now';
        const mins = Math.floor(secs / 60);
        if (mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
        const days = Math.floor(hrs / 24);
        if (days === 1) return 'Yesterday';
        if (days < 7) return days + ' days ago';
        return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
      }

      // ----- Render -----
      function buildCard(n) {
        const meta = TYPE_META[n.type] || DEFAULT_META;

        const card = document.createElement('div');
        card.className = 'notif-card' + (n.is_read ? '' : ' unread');
        card.dataset.id = n.id;

        const icon = document.createElement('div');
        icon.className = 'notif-icon ' + meta.cls;
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' + meta.icon + '</svg>';

        const body = document.createElement('div');
        body.className = 'notif-body';
        const title = document.createElement('div');
        title.className = 'notif-title';
        title.textContent = n.title || '';
        body.appendChild(title);
        if (n.body) {
          const desc = document.createElement('div');
          desc.className = 'notif-desc';
          desc.textContent = n.body;
          body.appendChild(desc);
        }
        const time = document.createElement('div');
        time.className = 'notif-time';
        time.textContent = timeAgo(n.created_at);
        body.appendChild(time);

        card.appendChild(icon);
        card.appendChild(body);
        if (!n.is_read) {
          const dot = document.createElement('div');
          dot.className = 'unread-dot';
          card.appendChild(dot);
        }

        card.addEventListener('click', () => markRead(n.id));
        return card;
      }

      function render() {
        listEl.innerHTML = '';
        const unread = items.filter(n => !n.is_read).length;
        subText.textContent = unread ? unread + ' unread' : 'Stay updated';
        markAllBtn.style.display = unread ? '' : 'none';

        const visible = items
          .filter(n => activeFilter === 'all' || categoryOf(n.type) === activeFilter)
          .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        visible.forEach(n => listEl.appendChild(buildCard(n)));

        if (loaded && visible.length === 0) {
          if (items.length === 0) {
            emptyTitle.textContent = 'No notifications yet';
            emptyText.textContent = 'New updates will show up here as they happen.';
          } else {
            emptyTitle.textContent = 'No notifications found';
            emptyText.textContent = 'Try another category or check back later.';
          }
          emptyState.classList.add('show');
        } else {
          emptyState.classList.remove('show');
        }
      }

      // ----- Actions -----
      async function markRead(id) {
        const n = items.find(x => x.id === id);
        if (!n || n.is_read) return;
        n.is_read = true;
        render();
        await supabaseClient.from('notifications').update({ is_read: true }).eq('id', id);
      }

      markAllBtn.addEventListener('click', async () => {
        if (!currentUser) return;
        items.forEach(n => { n.is_read = true; });
        render();
        await supabaseClient
          .from('notifications')
          .update({ is_read: true })
          .eq('user_id', currentUser.id)
          .eq('is_read', false);
      });

      filterChips.forEach(chip => {
        chip.addEventListener('click', () => {
          filterChips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          activeFilter = chip.getAttribute('data-type');
          render();
        });
      });

      // ----- Load + realtime -----
      async function init() {
        let session = null;
        try {
          const res = await supabaseClient.auth.getSession();
          session = res.data && res.data.session;
        } catch (e) { session = null; }

        if (!session) {
          window.location.replace('auth.html?mode=login');
          return;
        }
        if (needsProfileSetup(session.user)) {
          window.location.replace('profile-setup.html');
          return;
        }

        currentUser = session.user;

        const { data, error } = await supabaseClient
          .from('notifications')
          .select('*')
          .eq('user_id', currentUser.id)
          .order('created_at', { ascending: false })
          .limit(100);

        items = error ? [] : (data || []);
        loaded = true;
        render();

        supabaseClient
          .channel('notif-page-' + currentUser.id)
          .on('postgres_changes',
            { event: '*', schema: 'public', table: 'notifications', filter: 'user_id=eq.' + currentUser.id },
            (payload) => {
              if (payload.eventType === 'INSERT') {
                if (!items.some(n => n.id === payload.new.id)) items.unshift(payload.new);
              } else if (payload.eventType === 'UPDATE') {
                const i = items.findIndex(n => n.id === payload.new.id);
                if (i > -1) items[i] = payload.new; else items.unshift(payload.new);
              } else if (payload.eventType === 'DELETE') {
                items = items.filter(n => n.id !== payload.old.id);
              }
              render();
            })
          .subscribe();

        // keep "x minutes ago" fresh
        setInterval(render, 60000);
      }

      init();
    });
  </script>
</body>
</html>
