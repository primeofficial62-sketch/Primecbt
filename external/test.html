<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070D1C"><meta name="robots" content="noindex,nofollow"><title>Test | PRIME-CBT External Exams</title><link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script defer src="app.js"></script></head><body data-page="test"><main class="app-shell">
<header class="topbar"><a class="brand" href="home.html"><span class="brand-mark">P</span><span><span class="brand-name">PRIME-<span>CBT</span></span><span class="brand-caption">EXTERNAL EXAMINATIONS</span></span></a><a class="icon-button" href="more.html" aria-label="Profile">{{USER}}</a></header>
<h1 class="page-title">Test yourself.</h1><p class="page-subtitle">Choose a simulator and build an examination session.</p>
<button type="button" class="sim-card" data-exam-preset="JAMB"><span class="feature-icon">{{MONITOR}}</span><span><h3>General CBT Simulator</h3><p>Build a practice session from available external exam subjects.</p></span><span class="arrow">›</span></button>
<button type="button" class="sim-card" data-exam-preset="JAMB"><span class="feature-icon">{{BOOK}}</span><span><h3>JAMB CBT Simulator</h3><p>Prepare with JAMB subject combinations and timed practice.</p></span><span class="arrow">›</span></button>
<button type="button" class="sim-card" data-exam-preset="WAEC"><span class="feature-icon">{{FILE}}</span><span><h3>WAEC / NECO CBT</h3><p>Practise across your selected secondary-school subjects.</p></span><span class="arrow">›</span></button>
<button type="button" class="sim-card" data-mode-preset="challenge"><span class="feature-icon">{{SPARK}}</span><span><h3>Challenge Simulator</h3><p>Challenge mode will use the same verified question bank.</p></span><span class="arrow">›</span></button>
<section class="panel"><h2 style="font-size:17px;margin:0 0 4px">Set up your CBT</h2><p class="small muted">Only published and verified questions can be used in a live attempt.</p>
<div class="field"><label for="examCode">Examination</label><select id="examCode"><option value="JAMB">JAMB / UTME</option><option value="WAEC">WAEC</option><option value="NECO">NECO</option><option value="GCE">GCE</option><option value="POST_UTME">Post-UTME</option></select></div>
<div class="field"><label>Subjects</label><div id="examSubjects"><div class="empty-state">Loading available subjects…</div></div></div>
<div class="form-row"><div class="field"><label for="questionCount">Questions</label><select id="questionCount"><option value="20">20 questions</option><option value="40" selected>40 questions</option><option value="60">60 questions</option><option value="100">100 questions</option></select></div><div class="field"><label for="examDuration">Duration</label><select id="examDuration"><option value="1800">30 minutes</option><option value="3600">1 hour</option><option value="5400">1.5 hours</option><option value="7200" selected>2 hours</option><option value="10800">3 hours</option></select></div></div>
<div class="field"><label for="examMode">Mode</label><select id="examMode"><option value="practice">Practice mode</option><option value="timed">Timed examination</option><option value="challenge">Challenge mode</option></select></div>
<button class="btn-primary" id="startExam" style="width:100%">Start examination</button></section>
<nav class="bottom-nav" id="bottomNav" aria-label="External Exams navigation"></nav><button id="logoutButton" class="hidden" type="button"></button></main></body></html>
