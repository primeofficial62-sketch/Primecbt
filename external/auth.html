<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070D1C"><meta name="robots" content="noindex,nofollow"><title>External Exams Sign In | PRIME-CBT</title>
<style>
:root{color-scheme:dark;--bg:#070D1C;--panel:#10192B;--line:#26364D;--text:#F4F6FC;--muted:#9AA8BC;--green:#31D3A2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}main{width:min(100%,440px);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{width:42px;height:42px;border-radius:13px;background:var(--green);color:#07131c;display:grid;place-items:center;font-weight:900;font-size:23px}.brand strong{display:block}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em}.scope{font-size:12px;color:var(--green);font-weight:700;letter-spacing:.08em;margin-bottom:12px}h1{font-size:25px;line-height:1.2;margin:0 0 8px}p{color:var(--muted);margin:0 0 22px}label{display:block;font-size:13px;font-weight:650;margin:15px 0 7px}input{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:#091322;color:var(--text);padding:0 14px;font:inherit;outline:none}input:focus{border-color:var(--green)}button{width:100%;height:50px;border:0;border-radius:999px;background:var(--green);color:#06151b;font:700 15px inherit;margin-top:18px;cursor:pointer}button.secondary{background:transparent;color:var(--text);border:1px solid var(--line);margin-top:12px}.switch{text-align:center;font-size:13px;margin-top:20px}.switch a{color:var(--green);text-decoration:none;font-weight:700}.message{display:none;padding:12px 14px;border:1px solid #9b4545;border-radius:12px;color:#ffc4c4;margin:14px 0}.message.ok{border-color:var(--green);color:var(--green)}#registerFields{display:none}.fine{font-size:12px;text-align:center;margin:18px 0 0;color:var(--muted)}
</style></head><body><main><div class="brand"><span class="mark">P</span><span><strong>PRIME-CBT</strong><small>EXTERNAL EXAMINATIONS</small></span></div><div class="scope">A SEPARATE EXAM PREPARATION ACCOUNT</div><h1 id="heading">Welcome back</h1><p id="subheading">Sign in to your JAMB, WAEC, NECO and external examination workspace.</p><div class="message" id="message" role="alert"></div><form id="authForm"><div id="registerFields"><label for="fullName">Full name</label><input id="fullName" autocomplete="name" maxlength="100" placeholder="Your full name"></div><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Enter your password"><button id="submit" type="submit">Sign in to External Exams</button></form><button class="secondary" id="google" type="button">Continue with Google</button><div class="switch" id="switchText">New to External Exams? <a href="auth.html?mode=register">Create an account</a></div><p class="fine">Your External Exams login is kept separate from PRIME CAMPUS on this device.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script>
(function(){const URL='https://xuofkjjhupgmrphzgyun.supabase.co',KEY='sb_publishable_GThKt7BvR1D81U939_EQkw_yCnTQ3xh';const db=window.supabase.createClient(URL,KEY,{auth:{storageKey:'prime-external-auth-v1',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),isRegister=params.get('mode')==='register';function belongs(u){const m=u?.user_metadata||{};return m.prime_experience==='external_exams'||m.pathway==='exam_preparation'}function message(s,ok){$('message').textContent=s;$('message').className='message'+(ok?' ok':'');$('message').style.display='block'}function route(s){if(!s?.user)return;if(!belongs(s.user)){message('This login belongs to PRIME CAMPUS, not External Exams. Your University session has not been changed. Sign in with the External Exams account instead.',false);return}location.replace('home.html')}$('heading').textContent=isRegister?'Create your External Exams account':'Welcome back';$('subheading').textContent=isRegister?'Create a dedicated account for JAMB, WAEC, NECO and other external examinations.':'Sign in to your JAMB, WAEC, NECO and external examination workspace.';$('registerFields').style.display=isRegister?'block':'none';$('fullName').required=isRegister;$('password').autocomplete=isRegister?'new-password':'current-password';$('submit').textContent=isRegister?'Create External Exams account':'Sign in to External Exams';$('switchText').innerHTML=isRegister?'Already registered? <a href="auth.html?mode=login">Sign in</a>':'New to External Exams? <a href="auth.html?mode=register">Create an account</a>';if(params.get('error')==='wrong-account')message('That account is not registered for External Exams. Your University portal is unaffected.',false);db.auth.getSession().then(({data})=>route(data?.session)).catch(()=>{});$('authForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('submit');b.disabled=true;b.textContent='Please wait…';try{const email=$('email').value.trim(),password=$('password').value;if(isRegister){const full_name=$('fullName').value.trim(),{data,error}=await db.auth.signUp({email,password,options:{data:{full_name,pathway:'exam_preparation',prime_experience:'external_exams'},emailRedirectTo:location.origin+'/external/auth.html?mode=login'}});if(error)throw error;if(data.session)route(data.session);else message('Account created. Check your email to verify it, then sign in here.',true)}else{const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;if(!belongs(data.user)){await db.auth.signOut();message('This account is registered for PRIME CAMPUS, not External Exams. Your University portal is unaffected.',false)}else route(data.session)}}catch(err){message(err.message||'Unable to continue. Please try again.',false)}finally{b.disabled=false;b.textContent=isRegister?'Create External Exams account':'Sign in to External Exams'}});$('google').addEventListener('click',async()=>{const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/external/auth.html?mode=login'}});if(error)message(error.message,false)})})();
</script></body></html>
