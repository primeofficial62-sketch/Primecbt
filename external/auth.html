<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="0;url=/auth.html?mode=login&amp;experience=external">
  <title>Redirecting | PRIME-CBT External Exams</title>
</head>
<body>
  <p>Opening the PRIME-CBT sign-in page…</p>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      if (!params.has('mode')) params.set('mode', 'login');
      params.set('experience', 'external');
      const query = params.toString();
      location.replace('/auth.html' + (query ? '?' + query : '') + location.hash);
    })();
  </script>
</body>
</html>
