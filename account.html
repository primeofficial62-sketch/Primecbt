<body class="text-slate-100 antialiased flex justify-center">

  <div class="w-full max-w-2xl relative sm:border-x border-slate-800/60 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-[#060b1a]/90 backdrop-blur-md border-b border-slate-800 px-3 sm:px-5 pt-[env(safe-area-inset-top)]">
      <div class="h-14 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 sm:gap-3 min-w-0">
          <button id="backBtn" type="button" aria-label="Go back" class="w-10 h-10 shrink-0 flex items-center justify-center rounded-full hover:bg-slate-800/80 transition active:scale-90 text-slate-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          </button>
          <h1 class="text-base sm:text-lg font-semibold tracking-tight text-slate-100 truncate">My Account</h1>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <span id="livePill" role="status" aria-live="polite" class="hidden min-[400px]:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border border-slate-700 bg-slate-900/80 text-[11px] font-medium text-slate-400">
            <span id="liveDot" class="live-dot w-1.5 h-1.5 rounded-full bg-slate-500"></span><span id="liveText">Connecting</span>
          </span>
          <button id="editToggleBtn" type="button" disabled class="text-xs font-semibold text-emerald-400 hover:text-emerald-300 px-3 py-2 rounded-lg bg-emerald-500/10 border border-emerald-500/20 transition active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed">
            Edit Profile
          </button>
        </div>
      </div>
    </header>

    <main class="px-3 sm:px-6 pt-5 sm:pt-6 pb-[max(3rem,env(safe-area-inset-bottom))] space-y-5 sm:space-y-6 flex-1 min-w-0">

      <!-- Error banner -->
      <div id="errorBanner" hidden class="rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-xs text-red-300 flex items-center justify-between gap-3">
        <span id="errorText">Couldn’t load your account.</span>
        <button id="retryBtn" type="button" class="shrink-0 font-semibold text-red-200 underline underline-offset-2">Retry</button>
      </div>

      <!-- Profile header -->
      <section class="bg-slate-900 border border-slate-700 rounded-2xl p-4 sm:p-6 flex flex-col items-center text-center card">
        <div class="relative mb-3">
          <div id="avatar" class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-slate-800 border-2 border-emerald-500/40 flex items-center justify-center text-xl sm:text-2xl font-bold text-slate-200 overflow-hidden shadow-inner">
            <span id="avatarInitials">&nbsp;</span>
            <img id="avatarImg" alt="" hidden class="w-full h-full object-cover" />
          </div>
          <button id="avatarBtn" type="button" aria-label="Change photo" disabled class="absolute bottom-0 right-0 w-8 h-8 bg-emerald-500 text-slate-950 rounded-full flex items-center justify-center border-2 border-slate-900 shadow hover:bg-emerald-400 transition active:scale-90 disabled:opacity-50">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>

      <!-- Quick metrics -->

          <p class="text-[11px] sm:text-xs text-slate-400 font-medium">Total XP</p>

        </div>
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 sm:p-4 text-center card min-w-0">
          <p class="text-[11px] sm:text-xs text-slate-400 font-medium">Streak</p>
          <p id="statStreak" class="text-sm sm:text-lg font-bold text-amber-400 mt-1 truncate">—</p>
        </div>
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 sm:p-4 text-center card min-w-0">
          <p class="text-[11px] sm:text-xs text-slate-400 font-medium">Accuracy</p>
          <p id="statAcc" class="text-sm sm:text-lg font-bold text-slate-100 mt-1 truncate">—</p>
        </div>

      <!-- Personal & academic details -->
      <section class="bg-slate-900 border border-slate-700 rounded-2xl p-4 sm:p-6 space-y-4 card">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Personal &amp; Academic Details</h3>

        <form id="accountForm" class="space-y-3.5" novalidate>

            <input type="text" id="fullName" autocomplete="name" maxlength="120" disabled class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500 disabled:opacity-70 disabled:cursor-not-allowed transition">
          </div>
          <div>
            <label for="email" class="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
            <input type="email" id="email" autocomplete="email" disabled readonly class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-200 disabled:opacity-70 disabled:cursor-not-allowed">
          </div>
          <div class="grid grid-cols-1 min-[380px]:grid-cols-2 gap-3">
            <div>
              <label for="department" class="block text-xs font-medium text-slate-400 mb-1">Department</label>
              <input type="text" id="department" maxlength="120" disabled class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500 disabled:opacity-70 disabled:cursor-not-allowed transition">

              <label for="level" class="block text-xs font-medium text-slate-400 mb-1">Level</label>
              <input type="text" id="level" maxlength="40" disabled class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500 disabled:opacity-70 disabled:cursor-not-allowed transition">

            <button type="button" id="cancelEditBtn" class="min-h-[44px] bg-slate-800 border border-slate-700 text-slate-300 text-sm px-4 py-2.5 rounded-xl hover:bg-slate-700 transition active:scale-95">Cancel</button>

      <!-- Recent practice -->
      <section class="space-y-3" aria-live="polite">

          <p class="text-xs text-slate-500 px-1">Loading your sessions…</p>

      <!-- Security -->
      <section class="space-y-3 pb-4">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 px-1">Security &amp; Session</h3>

        <div class="bg-slate-900 border border-slate-700 rounded-2xl card overflow-hidden">

                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <span class="min-w-0">
                <span class="block text-xs sm:text-sm font-semibold text-slate-100">Change Password</span>

          </button>
          <form id="pwForm" hidden class="px-4 pb-4 space-y-3 border-t border-slate-800 pt-4" novalidate>

            <div>
              <label for="newPw" class="block text-xs font-medium text-slate-400 mb-1">New password</label>
              <input type="password" id="newPw" autocomplete="new-password" minlength="8" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500 transition">
            </div>
            <div>
              <label for="confirmPw" class="block text-xs font-medium text-slate-400 mb-1">Confirm new password</label>
              <input type="password" id="confirmPw" autocomplete="new-password" minlength="8" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500 transition">
            </div>
            <p id="pwMsg" class="text-xs" role="alert" hidden></p>
            <button type="submit" id="pwSave" class="w-full min-h-[44px] bg-emerald-500 text-slate-950 font-semibold text-sm rounded-xl hover:bg-emerald-400 transition active:scale-95 disabled:opacity-60">Update Password</button>
          </form>
        </div>

        <button id="logoutBtn" type="button" class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 flex items-center gap-3 text-left card disabled:opacity-60">
          <span class="w-9 h-9 shrink-0 rounded-lg bg-red-500/15 flex items-center justify-center text-red-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </span>
          <span>
            <span class="block text-xs sm:text-sm font-semibold text-red-400">Log Out</span>
            <span class="block text-[11px] sm:text-xs text-slate-400 mt-0.5">Sign out from this device</span>
          </span>
        </button>
      </section>
    </main>

    <!-- Toast -->
    <div id="toast" role="status" aria-live="polite" hidden class="fixed left-1/2 -translate-x-1/2 bottom-[max(1.25rem,env(safe-area-inset-bottom))] z-50 max-w-[90vw] px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-600 text-xs sm:text-sm text-slate-100 shadow-xl"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (() => {
    'use strict';

    /* ============================================================
       CONFIG — everything on this page is read live from Supabase.
       ============================================================ */
    const CONFIG = {
      SUPABASE_URL: 'https://xuofkjjhupgmrphzgyun.supabase.co',
      SUPABASE_ANON_KEY: 'sb_publishable_GThKt7BvR1D81U939_EQkw_yCnTQ3xh',
      loginPage: 'login.html',          // where signed-out users are sent
      tables: { profiles: 'profiles', results: 'practice_results' },
      avatarBucket: 'avatars',
      maxAvatarBytes: 2 * 1024 * 1024,
      recentLimit: 5,
      statsRowLimit: 5000
    };

    const $ = (id) => document.getElementById(id);
    const el = {
      back: $('backBtn'), edit: $('editToggleBtn'),
      pill: $('livePill'), dot: $('liveDot'), liveText: $('liveText'),
      err: $('errorBanner'), errText: $('errorText'), retry: $('retryBtn'),
      avatarInitials: $('avatarInitials'), avatarImg: $('avatarImg'), avatarBtn: $('avatarBtn'), avatarFile: $('avatarFile'),
      name: $('displayName'), sub: $('displaySub'), plan: $('planBadge'), planText: $('planText'),
      xp: $('statXp'), streak: $('statStreak'), acc: $('statAcc'),
      form: $('accountForm'), fullName: $('fullName'), email: $('email'), dept: $('department'), level: $('level'),
      formMsg: $('formMsg'), actions: $('formActions'), save: $('saveBtn'), cancel: $('cancelEditBtn'),
      recent: $('recentList'),
      pwToggle: $('pwToggle'), pwForm: $('pwForm'), pwChevron: $('pwChevron'), pwUser: $('pwUsername'),
      newPw: $('newPw'), confirmPw: $('confirmPw'), pwMsg: $('pwMsg'), pwSave: $('pwSave'),
      logout: $('logoutBtn'), toast: $('toast')
    };

    const goBack = () => {
      if (history.length > 1) history.back();
      else location.href = document.referrer || './';
    };
    el.back.addEventListener('click', goBack);

    if (!window.supabase) {
      el.errText.textContent = 'Couldn’t load the app. Check your connection and refresh.';
      el.retry.hidden = true; el.err.hidden = false;
      return;
    }

    const db = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const T = CONFIG.tables;

    const state = { user: null, profile: null, results: [], editing: false, recent: [] };

    /* ---------- helpers ---------- */
    let toastTimer;
    function toast(msg) {
      el.toast.textContent = msg; el.toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.toast.hidden = true; }, 3200);
    }
    function setLive(status) {
      el.dot.classList.remove('on', 'off');
      if (status === 'live') { el.dot.classList.add('on'); el.liveText.textContent = 'Live'; }
      else if (status === 'offline') { el.dot.classList.add('off'); el.liveText.textContent = 'Offline'; }
      else el.liveText.textContent = 'Connecting';
    }
    function showError(msg) { el.errText.textContent = msg; el.err.hidden = false; }
    function clearError() { el.err.hidden = true; }
    function redirectToLogin() {
      const next = location.pathname.split('/').pop() + location.search;
      location.replace(`${CONFIG.loginPage}?next=${encodeURIComponent(next)}`);
    }
    const initials = (name) => {
      const parts = (name || '').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '';
      return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
    };

    /* ---------- render ---------- */
    function currentName() {
      const p = state.profile, u = state.user;
      return (p && p.full_name) || (u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name)) || (u.email ? u.email.split('@')[0] : '');
    }

    function renderProfile() {
      const p = state.profile || {}, u = state.user;
      const name = currentName();
      el.name.textContent = name || 'Add your name';
      const sub = [p.department, p.level].filter(Boolean).join(' · ');
      el.sub.textContent = sub || 'Add your department and level';

      if (p.avatar_url) { el.avatarImg.src = p.avatar_url; el.avatarImg.hidden = false; el.avatarInitials.hidden = true; }
      else { el.avatarImg.hidden = true; el.avatarInitials.hidden = false; el.avatarInitials.textContent = initials(name) || '?'; }

      if (p.plan) { el.planText.textContent = p.plan; el.plan.hidden = false; } else { el.plan.hidden = true; }

      el.email.value = u.email || '';
      el.pwUser.value = u.email || '';
      if (!state.editing) fillForm();
    }

    function fillForm() {
      const p = state.profile || {};
      el.fullName.value = p.full_name || (state.user.user_metadata && (state.user.user_metadata.full_name || state.user.user_metadata.name)) || '';
      el.dept.value = p.department || '';
      el.level.value = p.level || '';
    }

    function localDay(d) { return new Date(d).toLocaleDateString('en-CA'); } // YYYY-MM-DD in the user's timezone

    function renderStats() {
      const rows = state.results;
      let xp = 0, correct = 0, total = 0;
      const days = new Set();
      for (const r of rows) {
        xp += r.xp_earned || 0;
        correct += r.correct_answers || 0;
        total += r.total_questions || 0;
        days.add(localDay(r.created_at));
      }
      el.xp.textContent = xp.toLocaleString();
      el.acc.textContent = total > 0 ? Math.round((correct / total) * 100) + '%' : '—';

      // Streak: consecutive days with activity, counting back from today (or yesterday if nothing today yet)
      let streak = 0;
      const cursor = new Date();
      if (!days.has(localDay(cursor))) cursor.setDate(cursor.getDate() - 1);
      while (days.has(localDay(cursor))) { streak++; cursor.setDate(cursor.getDate() - 1); }
      el.streak.textContent = streak + (streak === 1 ? ' Day' : ' Days');
    }

    const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
    function timeAgo(iso) {
      const diff = (new Date(iso).getTime() - Date.now()) / 1000;
      const abs = Math.abs(diff);
      if (abs < 60) return 'Just now';
      if (abs < 3600) return rtf.format(Math.round(diff / 60), 'minute');
      if (abs < 86400) return rtf.format(Math.round(diff / 3600), 'hour');
      if (abs < 7 * 86400) return rtf.format(Math.round(diff / 86400), 'day');
      return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderRecent() {
      const list = state.recent;
      if (!list.length) {
        const p = document.createElement('p');
        p.className = 'text-xs sm:text-sm text-slate-500 px-1';
        p.textContent = 'No practice sessions yet. Finish one and it will show up here.';
        el.recent.replaceChildren(p);
        return;
      }
      el.recent.replaceChildren(...list.map((r) => {
        const pct = r.total_questions > 0 ? Math.round((r.correct_answers / r.total_questions) * 100) : null;
        const good = pct !== null && pct >= 50;
        const row = document.createElement('div');
        row.className = 'bg-slate-900 border border-slate-700 rounded-2xl p-3.5 sm:p-4 flex items-center justify-between gap-3 card';

        const left = document.createElement('div');
        left.className = 'flex items-center gap-3 min-w-0';
        const badge = document.createElement('div');
        badge.className = 'w-11 h-11 rounded-xl border flex items-center justify-center text-xs font-bold shrink-0 ' +
          (good ? 'bg-emerald-500/15 border-emerald-500/30 text-emerald-400' : 'bg-amber-500/15 border-amber-500/30 text-amber-400');
        badge.textContent = pct === null ? '—' : pct + '%';
        const text = document.createElement('div');
        text.className = 'min-w-0';
        const title = document.createElement('p');
        title.className = 'text-xs sm:text-sm font-semibold text-slate-100 truncate';
        title.textContent = (r.courses && r.courses.title) || 'Practice session';
        const meta = document.createElement('p');
        meta.className = 'text-[11px] sm:text-xs text-slate-400 mt-0.5 truncate';
        meta.dataset.time = r.created_at;
        meta.dataset.prefix = (r.mode === 'timed' ? 'Timed test' : 'Practice session');
        meta.textContent = `${meta.dataset.prefix} · ${timeAgo(r.created_at)}`;
        text.append(title, meta);
        left.append(badge, text);

        row.append(left);
        if (r.xp_earned) {
          const xp = document.createElement('span');
          xp.className = 'text-xs sm:text-sm font-medium text-emerald-400 shrink-0';
          xp.textContent = `+${r.xp_earned.toLocaleString()} XP`;
          row.append(xp);
        }
        return row;
      }));
    }
    // keep "x minutes ago" fresh
    setInterval(() => {
      el.recent.querySelectorAll('[data-time]').forEach((m) => {
        m.textContent = `${m.dataset.prefix} · ${timeAgo(m.dataset.time)}`;
      });
    }, 30000);

    /* ---------- data ---------- */
    async function loadProfile() {
      const { data, error } = await db.from(T.profiles).select('*').eq('id', state.user.id).maybeSingle();
      if (error) throw error;
      state.profile = data;
      renderProfile();
    }
    async function loadStats() {
      const { data, error } = await db.from(T.results)
        .select('xp_earned,total_questions,correct_answers,created_at')
        .eq('user_id', state.user.id)
        .order('created_at', { ascending: false })
        .limit(CONFIG.statsRowLimit);
      if (error) throw error;
      state.results = data || [];
      renderStats();
    }
    async function loadRecent() {
      const { data, error } = await db.from(T.results)
        .select('id,mode,total_questions,correct_answers,xp_earned,created_at,courses(title)')
        .eq('user_id', state.user.id)
        .order('created_at', { ascending: false })
        .limit(CONFIG.recentLimit);
      if (error) throw error;
      state.recent = data || [];
      renderRecent();
    }

    async function refresh() {
      const settled = await Promise.allSettled([loadProfile(), loadStats(), loadRecent()]);
      const failed = settled.filter((s) => s.status === 'rejected');
      if (failed.length) {
        console.error('[account] load errors:', failed.map((f) => f.reason));
        showError('Some of your data couldn’t be loaded. Check your connection and try again.');
        if (state.recent.length === 0 && el.recent.textContent.startsWith('Loading')) {
          el.recent.replaceChildren(Object.assign(document.createElement('p'), { className: 'text-xs text-slate-500 px-1', textContent: 'Couldn’t load your sessions.' }));
        }
      } else clearError();
    }
    el.retry.addEventListener('click', refresh);

    /* ---------- realtime ---------- */
    let channel = null, debounce = null;
    const scheduleRefresh = () => { clearTimeout(debounce); debounce = setTimeout(refresh, 400); };
    function subscribe() {
      if (channel) db.removeChannel(channel);
      const uid = state.user.id;
      channel = db.channel('account-' + uid)
        .on('postgres_changes', { event: '*', schema: 'public', table: T.profiles, filter: `id=eq.${uid}` }, scheduleRefresh)
        .on('postgres_changes', { event: '*', schema: 'public', table: T.results, filter: `user_id=eq.${uid}` }, scheduleRefresh)
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') setLive(navigator.onLine ? 'live' : 'offline');
          else if (['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status)) setLive('offline');
        });
    }
    window.addEventListener('online', () => { setLive('live'); scheduleRefresh(); });
    window.addEventListener('offline', () => setLive('offline'));
    document.addEventListener('visibilitychange', () => { if (!document.hidden && state.user) scheduleRefresh(); });
    window.addEventListener('pageshow', (e) => { if (e.persisted && state.user) scheduleRefresh(); });

    /* ---------- edit profile ---------- */
    function setEditing(on) {
      state.editing = on;
      [el.fullName, el.dept, el.level].forEach((i) => { i.disabled = !on; });
      el.actions.hidden = !on;
      el.formMsg.hidden = true;
      el.edit.textContent = on ? 'Cancel' : 'Edit Profile';
      if (on) el.fullName.focus(); else fillForm();
    }
    el.edit.addEventListener('click', () => setEditing(!state.editing));
    el.cancel.addEventListener('click', () => setEditing(false));

    el.form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const full_name = el.fullName.value.trim();
      if (!full_name) { el.formMsg.textContent = 'Enter your full name.'; el.formMsg.hidden = false; el.fullName.focus(); return; }
      el.save.disabled = true; el.save.textContent = 'Saving…';
      const { data, error } = await db.from(T.profiles).upsert({
        id: state.user.id,
        full_name,
        department: el.dept.value.trim() || null,
        level: el.level.value.trim() || null,
        updated_at: new Date().toISOString()
      }).select().single();
      el.save.disabled = false; el.save.textContent = 'Save Changes';
      if (error) {
        console.error('[account] save failed:', error);
        el.formMsg.textContent = 'Couldn’t save your changes. Try again.'; el.formMsg.hidden = false;
        return;
      }
      state.profile = data;
      setEditing(false);
      renderProfile();
      toast('Profile updated');
    });

    /* ---------- avatar ---------- */
    el.avatarBtn.addEventListener('click', () => el.avatarFile.click());
    el.avatarFile.addEventListener('change', async () => {
      const file = el.avatarFile.files[0];
      el.avatarFile.value = '';
      if (!file) return;
      if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { toast('Choose a PNG, JPG or WebP image.'); return; }
      if (file.size > CONFIG.maxAvatarBytes) { toast('Image must be under 2 MB.'); return; }
      el.avatarBtn.disabled = true;
      try {
        const ext = file.type === 'image/png' ? 'png' : file.type === 'image/webp' ? 'webp' : 'jpg';
        const path = `${state.user.id}/avatar-${Date.now()}.${ext}`;
        const up = await db.storage.from(CONFIG.avatarBucket).upload(path, file, { upsert: true, contentType: file.type });
        if (up.error) throw up.error;
        const { data: pub } = db.storage.from(CONFIG.avatarBucket).getPublicUrl(path);
        const { data, error } = await db.from(T.profiles).upsert({ id: state.user.id, avatar_url: pub.publicUrl, updated_at: new Date().toISOString() }).select().single();
        if (error) throw error;
        state.profile = data;
        renderProfile();
        toast('Photo updated');
      } catch (err) {
        console.error('[account] avatar failed:', err);
        toast('Couldn’t upload your photo. Try again.');
      } finally { el.avatarBtn.disabled = false; }
    });

    /* ---------- password ---------- */
    el.pwToggle.addEventListener('click', () => {
      const open = el.pwForm.hidden;
      el.pwForm.hidden = !open;
      el.pwToggle.setAttribute('aria-expanded', String(open));
      el.pwChevron.style.transform = open ? 'rotate(90deg)' : '';
      if (open) el.newPw.focus();
    });
    function pwMessage(text, ok) {
      el.pwMsg.textContent = text;
      el.pwMsg.className = 'text-xs ' + (ok ? 'text-emerald-400' : 'text-red-400');
      el.pwMsg.hidden = !text;
    }
    el.pwForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const a = el.newPw.value, b = el.confirmPw.value;
      if (a.length < 8) return pwMessage('Use at least 8 characters.', false);
      if (a !== b) return pwMessage('Passwords don’t match.', false);
      el.pwSave.disabled = true; el.pwSave.textContent = 'Updating…';
      const { error } = await db.auth.updateUser({ password: a });
      el.pwSave.disabled = false; el.pwSave.textContent = 'Update Password';
      if (error) { console.error('[account] password failed:', error); return pwMessage(error.message || 'Couldn’t update your password.', false); }
      el.newPw.value = ''; el.confirmPw.value = '';
      pwMessage('', true);
      el.pwForm.hidden = true; el.pwToggle.setAttribute('aria-expanded', 'false'); el.pwChevron.style.transform = '';
      toast('Password updated');
    });

    /* ---------- logout ---------- */
    el.logout.addEventListener('click', async () => {
      el.logout.disabled = true;
      const { error } = await db.auth.signOut();
      if (error) { el.logout.disabled = false; toast('Couldn’t sign out. Try again.'); return; }
      location.replace(CONFIG.loginPage);
    });

    db.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') redirectToLogin(); });

    /* ---------- boot ---------- */
    (async function init() {
      setLive('connecting');
      try {
        const { data: { session } } = await db.auth.getSession();
        if (!session) return redirectToLogin();
        const { data: { user }, error } = await db.auth.getUser();
        if (error || !user) return redirectToLogin();
        state.user = user;
        el.edit.disabled = false; el.avatarBtn.disabled = false;
        renderProfile(); // email + name fallback appear immediately
        await refresh();
        subscribe();
      } catch (err) {
        console.error('[account] init failed:', err);
        setLive('offline');
        showError('Couldn’t connect. Check your connection and try again.');
      }
    })();
  })();
  </script>
</body>
</html>
