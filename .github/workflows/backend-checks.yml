name: Backend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "security/**"]

permissions:
  contents: read

jobs:
  syntax-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check backend JavaScript syntax
        run: |
          node --check api/admin.js
          node --check api/assistant.js
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check PDF conversion Edge Function
        run: deno check supabase/functions/convert-to-pdf/index.ts
      - name: Run backend and security regression tests
        run: node --test tests/*.test.mjs
