<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>AI CBT Session - PRIME-CBT</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --bg: #060b1a;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --teal: #2dd4bf;
      --red: #f87171;
      --amber: #fbbf24;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
    }

    .topbar {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .back-btn:hover {
      background: var(--slate-700);
      border-color: var(--slate-600);
    }

    .topbar-text h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    .topbar-text p {
      font-size: 12px;
      color: var(--slate-400);
      margin: 2px 0 0 0;
    }

    .cbt-palette-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .option-btn {
      padding: 14px 16px;
      text-align: left;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--emerald-bright);
      background: rgba(52, 211, 153, 0.05);
      transform: translateY(-1px);
    }

    .explanation-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      display: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .explanation-box.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .explanation-box.correct-feedback {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid var(--emerald);
      color: var(--emerald-bright);
    }

    .explanation-box.incorrect-feedback {
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid var(--red);
      color: var(--red);
    }

    .question-tracker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .tracker-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--slate-400);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tracker-btn:hover {
      border-color: var(--slate-500);
      background: var(--slate-700);
      color: var(--text);
    }

    .tracker-btn.active {
      background: var(--emerald-bright) !important;
      border-color: var(--emerald-bright) !important;
      color: #060b1a !important;
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
      transform: scale(1.05);
    }

    .tracker-btn.answered {
      border-color: var(--emerald);
      color: var(--emerald-bright);
      background: rgba(16, 185, 129, 0.1);
    }

    .btn {
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
    }

    .btn:hover:not(:disabled) {
      background: var(--slate-700);
      border-color: var(--slate-600);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Smooth Transition Panels & States */
    .fade-container {
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      transform: translateY(0);
    }

    .fade-container.hidden-state {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      display: none !important;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .loading-pulse {
      animation: pulseGlow 1.8s infinite ease-in-out;
    }
    
    /* Instant View Switcher */
.sub-view {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  background-color: var(--bg-dark);
  z-index: 100;
  display: none; /* Hidden by default */
  overflow-y: auto;
  max-width: 480px;
}

.sub-view.active {
  display: block; /* Shows immediately when clicked */
}


  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <a href="practice.html" class="back-btn" aria-label="Back to Practice">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <div class="topbar-text">
        <h1 id="cbtTitle">AI CBT Session</h1>
        <p id="cbtSubtitle">Live AI-generated examination</p>
      </div>
    </div>

    <div class="content" style="padding: 20px; flex: 1; display: flex; flex-direction: column; justify-content: center;">
      <!-- Loading State Panel -->
      <div id="loadingState" class="fade-container" style="display: flex; align-items: center; justify-content: center;">
        <div class="cbt-palette-card loading-pulse" style="text-align: center; max-width: 360px; width: 100%; padding: 32px 24px;">
          <div style="font-size: 32px; margin-bottom: 12px;">🤖</div>
          <h3 style="font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 6px;">Generating Session</h3>
          <p style="font-size: 0.9rem; color: var(--slate-400); margin-bottom: 24px;">Gemini AI is crafting your customized questions & explanations...</p>
          
          <div style="background: var(--surface-2); border-radius: 999px; height: 8px; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--border);">
            <div id="loadingProgressBar" style="width: 0%; height: 100%; background: linear-gradient(90deg, var(--emerald), var(--teal)); transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);"></div>
          </div>
          <div id="loadingPercentage" style="font-size: 0.85rem; font-weight: 600; color: var(--emerald-bright);">0%</div>
        </div>
      </div>
      
      <!-- Question Container Panel -->
      <div id="questionContainer" class="cbt-palette-card fade-container hidden-state">
        <div id="questionText" style="font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; line-height: 1.5; color: var(--text);"></div>
        <div id="optionsList" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;"></div>
        
        <div id="explanationBox" class="explanation-box"></div>
        
        <div style="display: flex; justify-content: space-between; margin-top: 25px;">
          <button id="prevQBtn" class="btn" disabled>Previous</button>
          <button id="nextQBtn" class="btn" style="background: linear-gradient(135deg, var(--emerald), var(--teal)); color: #060b1a; border-color: transparent; font-weight: 700;">Next Question</button>
        </div>

        <div id="trackerContainer" class="question-tracker"></div>
      </div>
    </div>
  </div>

  <div id="toastNotification" style="position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--surface); color: var(--emerald-bright); border: 1px solid var(--emerald); padding: 12px 20px; border-radius: 12px; font-weight: 600; font-size: 0.9rem; box-shadow: 0 10px 25px rgba(0,0,0,0.4); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; display: flex; align-items: center; gap: 8px;">
    <span>✨</span> Successfully Generated!
  </div>

  <script>
    // CHANGED: switched from Groq to Gemini. Get your key from
    // https://aistudio.google.com/apikey — Gemini keys start with "AIza".
    const GEMINI_API_KEY = "AQ.Ab8RN6KedyJK-vCpr9zjOoAauIBCdFay3ghz2A1YBeAvG4o_bA";

    document.addEventListener('DOMContentLoaded', async () => {
      conqst urlParams = new URLSearchParams(window.location.search);
      const topic = urlParams.get('topic') || 'Cell Biology';
      const count = urlParams.get('count') || '5';
      const difficulty = urlParams.get('difficulty') || 'medium';
      const mode = urlParams.get('mode') || 'practice';
      const randomize = urlParams.get('randomize') === 'true';
      
      document.getElementById('cbtTitle').textContent = `AI Session: ${topic}`;
      document.getElementById('cbtSubtitle').textContent = `${count} Questions • ${difficulty.toUpperCase()} • ${mode.toUpperCase()} Mode`;
      
      let questions = [];
      let currentIndex = 0;
      let userAnswers = {};

      const progressBar = document.getElementById('loadingProgressBar');
      const percentageText = document.getElementById('loadingPercentage');
      let currentProgress = 0;
      const progressInterval = setInterval(() => {
        if (currentProgress < 90) {
          currentProgress += Math.floor(Math.random() * 8) + 3;
          if (currentProgress > 90) currentProgress = 90;
          progressBar.style.width = `${currentProgress}%`;
          percentageText.textContent = `${currentProgress}%`;
        }
      }, 150);

      // NEW: fallback mock question bank, used if the Groq call fails for any
      // reason (missing/invalid key, network error, rate limit, bad response).
      function getMockQuestions(topicName, questionCount) {
        const bank = [
          {
            question: `Sample question on ${topicName} (AI unavailable — offline question bank in use).`,
            options: ["Option A", "Option B", "Option C", "Option D"],
            answer: "Option A",
            explanation: "This is a placeholder question shown because the AI service was unreachable. Check your Gemini API key and try again for real AI-generated questions."
          }
        ];
        const result = [];
        for (let i = 0; i < questionCount; i++) {
          result.push(bank[0]);
        }
        return result;
      }

      try {
        const prompt = `You are an expert academic examiner for PRIME-CBT. Generate a rigorous set of exactly ${count} multiple-choice questions based on the academic subject or material: "${topic}". 
        Difficulty level: ${difficulty}. Mode: ${mode}.
        Ensure the questions test deep understanding appropriate for university-level study.

        You must output ONLY a valid JSON object in this exact structure, with no markdown code blocks, backticks, or extra commentary:
        {
          "quiz": [
            {
              "question": "Clear, specific question text here?",
              "options": ["Option A", "Option B", "Option C", "Option D"],
              "answer": "Exact matching correct option string from the options list",
              "explanation": "Clear explanation of why this correct answer is right, and why alternate typical choices are incorrect."
            }
          ]
        }`;

        // CHANGED: Gemini's endpoint takes the key as a URL param (not an
        // Authorization header), and the request/response shape is different
        // from Groq's OpenAI-style format.
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: 'application/json' }
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || `Gemini API request failed with status ${response.status}`);
        }

        // CHANGED: Gemini nests the text differently than Groq —
        // candidates[0].content.parts[0].text instead of choices[0].message.content
        if (!data.candidates || !data.candidates[0]?.content?.parts?.[0]?.text) {
          throw new Error("Invalid response format received from Gemini.");
        }

        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const parsedData = JSON.parse(rawText);
        questions = parsedData.quiz || parsedData;

        if (randomize) {
          questions.sort(() => Math.random() - 0.5);
        }

        clearInterval(progressInterval);
        progressBar.style.width = '100%';
        percentageText.textContent = '100%';

        const toast = document.getElementById('toastNotification');
        toast.style.transform = 'translateX(-50%) translateY(0)';
        setTimeout(() => {
          toast.style.transform = 'translateX(-50%) translateY(100px)';
        }, 3000);

        // Smooth transition from loading to active question UI
        setTimeout(() => {
          const loadingEl = document.getElementById('loadingState');
          const questionEl = document.getElementById('questionContainer');
          
          loadingEl.classList.add('hidden-state');
          setTimeout(() => {
            loadingEl.style.display = 'none';
            questionEl.style.display = 'block';
            // Trigger reflow for smooth transition entrance
            void questionEl.offsetWidth;
            questionEl.classList.remove('hidden-state');
            buildTracker();
            loadQuestion(currentIndex);
          }, 50);
        }, 400);

      } catch (error) {
        // FIXED: instead of dead-ending on an error screen, fall back to mock
        // questions so the session is still usable when the AI call fails.
        console.error("AI Generation Error, falling back to mock questions:", error);
        questions = getMockQuestions(topic, parseInt(count));

        clearInterval(progressInterval);
        progressBar.style.width = '100%';
        percentageText.textContent = '100%';

        setTimeout(() => {
          const loadingEl = document.getElementById('loadingState');
          const questionEl = document.getElementById('questionContainer');

          loadingEl.classList.add('hidden-state');
          setTimeout(() => {
            loadingEl.style.display = 'none';
            questionEl.style.display = 'block';
            void questionEl.offsetWidth;
            questionEl.classList.remove('hidden-state');
            buildTracker();
            loadQuestion(currentIndex);
          }, 50);
        }, 400);
      }

      function buildTracker() {
        const trackerContainer = document.getElementById('trackerContainer');
        trackerContainer.innerHTML = '';
        questions.forEach((_, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'tracker-btn';
          btn.textContent = idx + 1;
          btn.id = `tracker-${idx}`;
          btn.addEventListener('click', () => {
            transitionQuestion(idx);
          });
          trackerContainer.appendChild(btn);
        });
      }

      function updateTrackerUI() {
        questions.forEach((_, idx) => {
          const btn = document.getElementById(`tracker-${idx}`);
          if (!btn) return;
          btn.classList.remove('active');
          if (userAnswers[idx] !== undefined) {
            btn.classList.add('answered');
          } else {
            btn.classList.remove('answered');
          }
        });
        const activeBtn = document.getElementById(`tracker-${currentIndex}`);
        if (activeBtn) {
          activeBtn.classList.add('active');
        }
      }

      function transitionQuestion(index) {
        if (index < 0 || index >= questions.length) {
          if (index >= questions.length) showResults();
          return;
        }

        const container = document.getElementById('questionContainer');
        container.style.opacity = '0';
        container.style.transform = 'translateY(6px)';

        setTimeout(() => {
          loadQuestionData(index);
          container.style.opacity = '1';
          container.style.transform = 'translateY(0)';
        }, 200);
      }

      function loadQuestionData(index) {
        currentIndex = index;
        const q = questions[index];
        document.getElementById('questionText').textContent = `Q${index + 1}: ${q.question}`;
        
        const optionsList = document.getElementById('optionsList');
        optionsList.innerHTML = '';

        const explanationBox = document.getElementById('explanationBox');
        explanationBox.style.display = 'none';
        explanationBox.classList.remove('visible');
        explanationBox.className = 'explanation-box';

        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'option-btn';
          btn.textContent = opt;
          
          const chosenAnswer = userAnswers[index];
          
          if (chosenAnswer !== undefined) {
            btn.disabled = true;
            if (opt === q.answer) {
              btn.style.borderColor = 'var(--emerald)';
              btn.style.background = 'rgba(16, 185, 129, 0.15)';
              btn.style.color = 'var(--emerald-bright)';
            } else if (opt === chosenAnswer && chosenAnswer !== q.answer) {
              btn.style.borderColor = 'var(--red)';
              btn.style.background = 'rgba(248, 113, 113, 0.15)';
              btn.style.color = 'var(--red)';
            }
          }

          btn.addEventListener('click', () => {
            if (userAnswers[index] !== undefined) return;
            
            userAnswers[index] = opt;
            
            Array.from(optionsList.children).forEach(b => {
              b.disabled = true;
              if (b.textContent === q.answer) {
                b.style.borderColor = 'var(--emerald)';
                b.style.background = 'rgba(16, 185, 129, 0.15)';
                b.style.color = 'var(--emerald-bright)';
              } else if (b.textContent === opt && opt !== q.answer) {
                b.style.borderColor = 'var(--red)';
                b.style.background = 'rgba(248, 113, 113, 0.15)';
                b.style.color = 'var(--red)';
              }
            });

            if (opt === q.answer) {
              explanationBox.className = 'explanation-box correct-feedback';
              explanationBox.innerHTML = `<strong>Correct! 🎉</strong> ${q.explanation || 'No explanation provided.'}`;
            } else {
              explanationBox.className = 'explanation-box incorrect-feedback';
              explanationBox.innerHTML = `<strong>Incorrect.</strong> You chose "${opt}". The correct option is "${q.answer}".<br><br>${q.explanation || ''}`;
            }
            explanationBox.style.display = 'block';
            void explanationBox.offsetWidth;
            explanationBox.classList.add('visible');

            updateTrackerUI();
          });

          optionsList.appendChild(btn);
        });

        if (userAnswers[index] !== undefined) {
          const chosen = userAnswers[index];
          if (chosen === q.answer) {
            explanationBox.className = 'explanation-box correct-feedback';
            explanationBox.innerHTML = `<strong>Correct! 🎉</strong> ${q.explanation || ''}`;
          } else {
            explanationBox.className = 'explanation-box incorrect-feedback';
            explanationBox.innerHTML = `<strong>Incorrect.</strong> You chose "${chosen}". The correct option is "${q.answer}".<br><br>${q.explanation || ''}`;
          }
          explanationBox.style.display = 'block';
          explanationBox.classList.add('visible');
        }

        document.getElementById('prevQBtn').disabled = index === 0;
        document.getElementById('nextQBtn').textContent = index === questions.length - 1 ? 'Submit Exam' : 'Next Question';
        
        updateTrackerUI();
      }

      function loadQuestion(index) {
        loadQuestionData(index);
      }

      document.getElementById('nextQBtn').addEventListener('click', () => {
        if (currentIndex < questions.length - 1) {
          transitionQuestion(currentIndex + 1);
        } else {
          showResults();
        }
      });

      document.getElementById('prevQBtn').addEventListener('click', () => {
        if (currentIndex > 0) {
          transitionQuestion(currentIndex - 1);
        }
      });

      function showResults() {
        let score = 0;
        questions.forEach((q, idx) => {
          if (userAnswers[idx] === q.answer) score++;
        });

        const total = questions.length;
        const incorrect = total - score;
        const percentage = Math.round((score / total) * 100);

        const resultParams = new URLSearchParams({
          topic: topic,
          score: score,
          total: total,
          incorrect: incorrect,
          percentage: percentage
        });

        window.location.href = `results.html?${resultParams.toString()}`;
      }
    });
  </script>
</body>
</html>
