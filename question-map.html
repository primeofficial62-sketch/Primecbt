<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060b1a">
  <title>PRIME-CBT — Question Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b1a;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --muted-light: #cbd5e1;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --amber: #fbbf24;
      --red: #f87171;
      --slate: #64748b;
      --font-display: 'Lora', Georgia, serif;
      --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --pad: clamp(1rem, 4vw, 2rem);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* Everything is in rem, so the page scales fluidly with the screen */
    html {
      font-size: clamp(14px, 13px + 0.35vw, 18px);
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 64rem;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    @media (min-width: 64rem) {
      .app { border-left: 1px solid rgba(51, 65, 85, 0.5); border-right: 1px solid rgba(51, 65, 85, 0.5); }
    }

    /* ---------- Top bar ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: max(1rem, env(safe-area-inset-top)) var(--pad) 0.9rem;
      padding-left: max(var(--pad), env(safe-area-inset-left));
      padding-right: max(var(--pad), env(safe-area-inset-right));
      background: rgba(6, 11, 26, 0.92);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .back-btn {
      width: 2.75rem;
      height: 2.75rem;
      min-width: 44px;
      min-height: 44px;
      border-radius: 0.7rem;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-light);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .back-btn:hover { background: rgba(30, 41, 59, 0.95); color: var(--text); }
    .back-btn svg { width: 1.15rem; height: 1.15rem; }

    .topbar-title { min-width: 0; }
    .topbar-title h1 { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; }
    .topbar-title p { font-size: 0.82rem; color: var(--muted); margin-top: 1px; overflow-wrap: anywhere; }

    /* ---------- Layout ---------- */
    .content {
      flex: 1;
      display: grid;
      gap: clamp(1rem, 3vw, 1.5rem);
      padding: var(--pad);
      padding-left: max(var(--pad), env(safe-area-inset-left));
      padding-right: max(var(--pad), env(safe-area-inset-right));
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "status"
        "legend"
        "map"
        "summary";
      align-content: start;
    }

    @media (min-width: 52rem) {
      .content {
        grid-template-columns: minmax(0, 1.7fr) minmax(16rem, 1fr);
        grid-template-areas:
          "status status"
          "map    legend"
          "map    summary";
        grid-template-rows: auto auto 1fr;
      }
      .legend, .summary { align-self: start; }
    }

    .status-area { grid-area: status; }
    .legend { grid-area: legend; }
    .map-wrap { grid-area: map; min-width: 0; }
    .summary { grid-area: summary; }

    /* ---------- Status banner / empty state ---------- */
    .status {
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: var(--muted-light);
      border-radius: 0.75rem;
      padding: 0.8rem 1rem;
      font-size: 0.88rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .status[hidden] { display: none; }
    .status strong { color: var(--red); }

    .empty-state {
      background: rgba(15, 23, 42, 0.8);
      border: 1px dashed var(--border);
      border-radius: 1rem;
      padding: 2rem 1.25rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
    }
    .empty-state a { color: var(--emerald-bright); font-weight: 600; text-decoration: none; }

    /* ---------- Legend ---------- */
    .legend {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr));
      gap: 0.65rem;
      padding: 0.85rem 1rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 0.9rem;
    }

    .legend-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; color: var(--muted-light); }
    .legend-dot { width: 0.7rem; height: 0.7rem; border-radius: 3px; flex-shrink: 0; }
    .legend-dot.answered { background: var(--emerald); }
    .legend-dot.unanswered { background: var(--border); }
    .legend-dot.flagged { background: var(--amber); }
    .legend-dot.skipped { background: var(--slate); }

    /* ---------- Question grid ---------- */
    .map-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(3.4rem, 1fr));
      gap: clamp(0.5rem, 1.6vw, 0.75rem);
    }

    .map-item {
      aspect-ratio: 1;
      border-radius: 0.75rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted-light);
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .map-item:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25); }
    .map-item:active { transform: scale(0.95); }

    .map-item.answered { background: rgba(16, 185, 129, 0.15); border-color: var(--emerald); color: var(--emerald-bright); }
    .map-item.skipped { background: rgba(100, 116, 139, 0.15); border-color: var(--slate); color: var(--muted); }
    .map-item.flagged { border-color: var(--amber); }
    .map-item.flagged::after {
      content: "";
      position: absolute;
      top: 0.3rem;
      right: 0.3rem;
      width: 0.4rem;
      height: 0.4rem;
      background: var(--amber);
      border-radius: 50%;
    }
    .map-item.current {
      background: linear-gradient(135deg, var(--emerald), #059669);
      border-color: var(--emerald);
      color: #022c22;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
    }

    .map-item:focus-visible, .btn:focus-visible, .back-btn:focus-visible {
      outline: 2px solid var(--emerald-bright);
      outline-offset: 2px;
    }

    /* ---------- Summary ---------- */
    .summary {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1rem;
    }

    .summary-title {
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(4.5rem, 1fr)); gap: 0.5rem; }

    .summary-item { background: rgba(30, 41, 59, 0.5); border-radius: 0.7rem; padding: 0.65rem 0.25rem; text-align: center; }
    .summary-value { font-size: 1.2rem; font-weight: 700; margin-bottom: 2px; }
    .summary-value.green { color: var(--emerald-bright); }
    .summary-value.amber { color: var(--amber); }
    .summary-value.muted { color: var(--muted); }
    .summary-value.red { color: var(--red); }
    .summary-label { font-size: 0.7rem; color: var(--muted); }

    /* ---------- Bottom buttons (sticky, never covers content) ---------- */
    .bottom-cta {
      position: sticky;
      bottom: 0;
      z-index: 40;
      display: flex;
      gap: 0.75rem;
      padding: 1rem var(--pad);
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-left: max(var(--pad), env(safe-area-inset-left));
      padding-right: max(var(--pad), env(safe-area-inset-right));
      background: linear-gradient(to top, var(--bg) 75%, rgba(6, 11, 26, 0));
    }

    .btn {
      min-height: 3.1rem;
      border-radius: 0.9rem;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      border: none;
      padding: 0 1.25rem;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-secondary { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover:not(:disabled) { background: var(--surface-2); }

    .btn-danger {
      flex: 1.4;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.28);
    }

    @media (min-width: 52rem) {
      .bottom-cta { justify-content: flex-end; }
      .btn-secondary, .btn-danger { flex: 0 1 15rem; }
    }

    /* ---------- Submit modal ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      overflow-y: auto;
      background: rgba(6, 11, 26, 0.78);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-box {
      width: 100%;
      max-width: 24rem;
      margin: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .modal-box h3 { font-family: var(--font-display); font-size: 1.2rem; }
    .modal-box p { font-size: 0.92rem; color: var(--muted-light); line-height: 1.5; }
    .modal-box p strong { color: var(--text); }
    .modal-actions { display: flex; gap: 0.65rem; margin-top: 0.5rem; }
    .modal-actions .btn { flex: 1; min-height: 2.9rem; }

    /* ---------- Edge cases ---------- */
    @media (max-width: 320px) {
      .modal-actions { flex-direction: column-reverse; }
      .bottom-cta { flex-direction: column-reverse; }
    }

    @media (max-height: 480px) and (orientation: landscape) {
      .topbar { position: static; }
      .modal-overlay { align-items: flex-start; }
    }

    @media (min-width: 1800px) { html { font-size: 20px; } }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <!-- Top Bar -->
    <header class="topbar">
      <button type="button" class="back-btn" id="backBtn" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="topbar-title">
        <h1>Question Map</h1>
        <p id="subtitle">Loading session…</p>
      </div>
    </header>

    <!-- Content -->
    <main class="content">
      <div class="status-area">
        <div class="status" id="statusBanner" role="alert" hidden></div>
      </div>

      <!-- Legend -->
      <div class="legend">
        <div class="legend-item"><div class="legend-dot answered"></div> Answered</div>
        <div class="legend-item"><div class="legend-dot unanswered"></div> Unanswered</div>
        <div class="legend-item"><div class="legend-dot flagged"></div> Flagged</div>
        <div class="legend-item"><div class="legend-dot skipped"></div> Skipped</div>
      </div>

      <!-- Grid -->
      <div class="map-wrap">
        <div class="map-grid" id="mapGrid"></div>
        <div class="empty-state" id="emptyState" hidden></div>
      </div>

      <!-- Summary -->
      <div class="summary">
        <div class="summary-title">Session Summary</div>
        <div class="summary-grid">
          <div class="summary-item">
            <div class="summary-value green" id="answeredCount">–</div>
            <div class="summary-label">Answered</div>
          </div>
          <div class="summary-item">
            <div class="summary-value muted" id="unansweredCount">–</div>
            <div class="summary-label">Unanswered</div>
          </div>
          <div class="summary-item">
            <div class="summary-value amber" id="flaggedCount">–</div>
            <div class="summary-label">Flagged</div>
          </div>
          <div class="summary-item">
            <div class="summary-value red" id="skippedCount">–</div>
            <div class="summary-label">Skipped</div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Buttons -->
    <div class="bottom-cta">
      <button type="button" class="btn btn-secondary" id="continueBtn">Continue</button>
      <button type="button" class="btn btn-danger" id="submitBtn" disabled>Submit Exam</button>
    </div>
  </div>

  <!-- Submit confirmation -->
  <div class="modal-overlay" id="submitModal" role="dialog" aria-modal="true" aria-labelledby="submitTitle">
    <div class="modal-box">
      <h3 id="submitTitle">Submit your exam?</h3>
      <p id="submitText"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelSubmit">Keep working</button>
        <button type="button" class="btn btn-danger" id="confirmSubmit">Submit</button>
      </div>
    </div>
  </div>

  <script>
    /* ====== CONFIG ======
       The exam page saves the live session here (JSON). This page only reads it,
       updates when it changes, and writes back the question you jump to.

       {
         "id": "…",
         "mode": "exam" | "practice",
         "course_code": "BIO 101",
         "course_title": "Introduction to Biology",
         "questions": [ { "id": "q1" }, { "id": "q2" }, … ],   // or just "total": 30
         "answers": { "q1": "B", … },        // keyed by question id (or index)
         "flagged": [ "q4", … ],             // question ids (or indexes)
         "skipped": [ "q9", … ],
         "current": 12,                      // zero-based index of the open question
         "examUrl": "exam.html"              // optional: where Continue / question taps go
       }
    */
    const SESSION_KEY = 'cbt_session';
    const RESULTS_URL = 'results.html';
    const SETUP_URL = 'practice-setup.html';
    /* ==================== */

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    let store = null;     // the storage object the session was found in
    let session = null;   // raw session object
    let model = null;     // normalised view model

    /* ---------- Session read / write ---------- */
    function readSession() {
      const stores = [];
      try { stores.push(window.sessionStorage); } catch (e) {}
      try { stores.push(window.localStorage); } catch (e) {}

      for (const s of stores) {
        try {
          const raw = s.getItem(SESSION_KEY);
          if (raw) { store = s; return JSON.parse(raw); }
        } catch (e) {
          showStatus('The saved exam session could not be read: ' + e.message);
        }
      }
      store = null;
      return null;
    }

    function writeSession() {
      if (!store || !session) return;
      try { store.setItem(SESSION_KEY, JSON.stringify(session)); }
      catch (e) { showStatus('Could not save your session: ' + e.message); }
    }

    function showStatus(message) {
      const el = $('statusBanner');
      el.innerHTML = '<strong>Problem:</strong> ' + esc(message);
      el.hidden = false;
    }
    function clearStatus() { $('statusBanner').hidden = true; }

    /* ---------- Normalise ---------- */
    function normalise(s) {
      if (!s || typeof s !== 'object') return null;

      let ids = [];
      if (Array.isArray(s.questions) && s.questions.length) {
        ids = s.questions.map((q, i) => (q && typeof q === 'object' && q.id != null ? String(q.id) : String(i)));
      } else {
        const n = Number(s.total || s.total_questions || 0);
        ids = Array.from({ length: n }, (_, i) => String(i));
      }
      if (!ids.length) return null;

      const answers = s.answers || {};
      const hasAnswer = (id, i) => {
        const v = Array.isArray(answers) ? answers[i] : (answers[id] !== undefined ? answers[id] : answers[i]);
        return v !== undefined && v !== null && v !== '';
      };
      const toSet = (arr) => new Set((Array.isArray(arr) ? arr : []).map(String));
      const flagged = toSet(s.flagged);
      const skipped = toSet(s.skipped);

      const current = Number(s.current != null ? s.current : (s.currentIndex != null ? s.currentIndex : -1));

      const items = ids.map((id, i) => {
        const answered = hasAnswer(id, i);
        const isFlagged = flagged.has(id) || flagged.has(String(i));
        const isSkipped = !answered && (skipped.has(id) || skipped.has(String(i)));
        return { index: i, answered, flagged: isFlagged, skipped: isSkipped, current: i === current };
      });

      return {
        items,
        mode: s.mode === 'practice' ? 'practice' : 'exam',
        code: s.course_code || '',
        title: s.course_title || '',
        counts: {
          answered: items.filter((x) => x.answered).length,
          unanswered: items.filter((x) => !x.answered && !x.skipped).length,
          flagged: items.filter((x) => x.flagged).length,
          skipped: items.filter((x) => x.skipped).length
        }
      };
    }

    /* ---------- Render ---------- */
    function stateLabel(x) {
      const parts = [x.answered ? 'answered' : x.skipped ? 'skipped' : 'unanswered'];
      if (x.flagged) parts.push('flagged');
      if (x.current) parts.push('current question');
      return parts.join(', ');
    }

    function render() {
      session = readSession();
      model = normalise(session);

      const grid = $('mapGrid');
      const empty = $('emptyState');
      const submitBtn = $('submitBtn');

      if (!model) {
        grid.innerHTML = '';
        empty.hidden = false;
        empty.innerHTML = 'No active session found.<br><a href="' + esc(SETUP_URL) + '">Start a practice or exam</a> to see your question map.';
        $('subtitle').textContent = 'No active session';
        ['answeredCount', 'unansweredCount', 'flaggedCount', 'skippedCount'].forEach((id) => { $(id).textContent = '–'; });
        submitBtn.disabled = true;
        $('continueBtn').disabled = false;
        return;
      }

      empty.hidden = true;
      const n = model.items.length;
      $('subtitle').textContent =
        [model.code, `${n} Question${n === 1 ? '' : 's'}`].filter(Boolean).join(' • ');

      const label = model.mode === 'practice' ? 'Finish Practice' : 'Submit Exam';
      submitBtn.textContent = label;
      submitBtn.disabled = false;

      grid.innerHTML = model.items.map((x) => {
        const cls = ['map-item'];
        if (x.answered) cls.push('answered');
        if (x.skipped) cls.push('skipped');
        if (x.flagged) cls.push('flagged');
        if (x.current) cls.push('current');
        return `<button type="button" class="${cls.join(' ')}" data-i="${x.index}" aria-label="Question ${x.index + 1}, ${stateLabel(x)}">${x.index + 1}</button>`;
      }).join('');

      $('answeredCount').textContent = model.counts.answered;
      $('unansweredCount').textContent = model.counts.unanswered;
      $('flaggedCount').textContent = model.counts.flagged;
      $('skippedCount').textContent = model.counts.skipped;

      clearStatus();
    }

    /* ---------- Navigation ---------- */
    function goToExam() {
      if (session && session.examUrl) window.location.href = session.examUrl;
      else history.back();
    }

    function openSubmitModal() {
      if (!model) return;
      const c = model.counts;
      const noun = model.mode === 'practice' ? 'practice' : 'exam';
      $('submitTitle').textContent = `Submit your ${noun}?`;
      const bits = [];
      bits.push(`You have <strong>${c.unanswered}</strong> unanswered`);
      bits.push(`<strong>${c.flagged}</strong> flagged question${c.flagged === 1 ? '' : 's'}`);
      $('submitText').innerHTML = bits.join(' and ') + '. You can’t change your answers after submitting.';
      $('submitModal').classList.add('active');
      $('confirmSubmit').focus();
    }

    function closeSubmitModal() { $('submitModal').classList.remove('active'); }

    function confirmSubmit() {
      if (session) {
        session.status = 'submitted';
        session.submitted_at = new Date().toISOString();
        writeSession();
      }
      window.location.href = RESULTS_URL;
    }

    /* ---------- Wire up ---------- */
    document.addEventListener('DOMContentLoaded', () => {
      $('backBtn').addEventListener('click', () => history.back());
      $('continueBtn').addEventListener('click', goToExam);
      $('submitBtn').addEventListener('click', openSubmitModal);
      $('cancelSubmit').addEventListener('click', closeSubmitModal);
      $('confirmSubmit').addEventListener('click', confirmSubmit);
      $('submitModal').addEventListener('click', (e) => { if (e.target === $('submitModal')) closeSubmitModal(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSubmitModal(); });

      // Tap a question: remember it as the current one, then go back to the exam
      $('mapGrid').addEventListener('click', (e) => {
        const btn = e.target.closest('.map-item');
        if (!btn || !session) return;
        session.current = Number(btn.dataset.i);
        writeSession();
        goToExam();
      });

      // Live updates: another tab/page changed the session, or this page was restored
      window.addEventListener('storage', (e) => { if (e.key === SESSION_KEY || e.key === null) render(); });
      window.addEventListener('pageshow', render);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
      try {
        const bc = new BroadcastChannel(SESSION_KEY);
        bc.onmessage = render;
      } catch (e) { /* BroadcastChannel not supported; storage events still work */ }

      render();
    });
  </script>
</body>
</html>
