<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>PRIME-CBT — Question Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b1a;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --muted-light: #cbd5e1;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --teal: #2dd4bf;
      --amber: #fbbf24;
      --red: #f87171;
      --font-display: 'Lora', serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      border-left: 1px solid rgba(51, 65, 85, 0.4);
      border-right: 1px solid rgba(51, 65, 85, 0.4);
    }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-up { animation: fadeUp 0.45s ease both; }
    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.1s; }
    .delay-3 { animation-delay: 0.15s; }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px 14px;
      padding-top: max(16px, env(safe-area-inset-top));
      flex-shrink: 0;
      background: rgba(6, 11, 26, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 30;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-light);
      cursor: pointer;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .back-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      color: var(--text);
      transform: translateX(-2px);
    }

    .back-btn:active {
      transform: scale(0.94);
    }

    .back-btn svg {
      width: 18px;
      height: 18px;
    }

    .topbar-title h1 {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
    }

    .topbar-title p {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* Content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 150px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }

    /* Legend */
    .legend {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--muted-light);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .legend-dot.answered { background: var(--emerald); }
    .legend-dot.unanswered { background: var(--border); }
    .legend-dot.flagged { background: var(--amber); }
    .legend-dot.skipped { background: #64748b; }

    /* Question Grid */
    .map-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .map-item {
      aspect-ratio: 1;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted-light);
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }

    .map-item:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    }

    .map-item:active {
      transform: scale(0.95);
    }

    .map-item.answered {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--emerald);
      color: var(--emerald-bright);
    }

    .map-item.current {
      background: linear-gradient(135deg, var(--emerald), #059669);
      border-color: var(--emerald);
      color: #022c22;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
    }

    .map-item.flagged {
      background: rgba(251, 191, 36, 0.12);
      border-color: var(--amber);
      color: var(--amber);
    }

    .map-item.flagged::after {
      content: "";
      position: absolute;
      top: 5px;
      right: 5px;
      width: 6px;
      height: 6px;
      background: var(--amber);
      border-radius: 50%;
    }

    .map-item.skipped {
      background: rgba(100, 116, 139, 0.15);
      border-color: #64748b;
      color: #94a3b8;
    }

    /* Summary */
    .summary {
      margin-top: 24px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .summary-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .summary-item {
      background: rgba(30, 41, 59, 0.5);
      border-radius: 11px;
      padding: 10px 4px;
      text-align: center;
    }

    .summary-value {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .summary-value.green { color: var(--emerald-bright); }
    .summary-value.amber { color: var(--amber); }
    .summary-value.muted { color: var(--muted); }
    .summary-value.red { color: var(--red); }

    .summary-label {
      font-size: 10.5px;
      color: var(--muted);
    }

    /* Bottom Buttons */
    .bottom-cta {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 75%, transparent);
      display: flex;
      gap: 12px;
      z-index: 40;
    }

    .btn {
      height: 50px;
      border-radius: 14px;
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
    }

    .btn-secondary {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--surface-2);
    }

    .btn-danger {
      flex: 1.4;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.28);
    }

    .btn:active {
      transform: scale(0.97);
    }
    
    /* Remove slide-up, fade-in, and scale entrance animations globally */
.animate-fade-up, 
.animate-scale, 
.animate-fade-in,
.animate-slide-up,
[class*="animate-"] {
  animation: none !important;
  opacity: 1 !important;
  transform: none !important;
}

  </style>
</head>
<body>
  <div class="app">
    <!-- Top Bar -->
    <div class="topbar animate-fade-up">
      <button type="button" class="back-btn" onclick="history.back()" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="topbar-title">
        <h1>Question Map</h1>
        <p>BIO 101 • 30 Questions</p>
      </div>
    </div>

    <!-- Content -->
    <div class="content">
      <!-- Legend -->
      <div class="legend animate-fade-up delay-1">
        <div class="legend-item">
          <div class="legend-dot answered"></div> Answered
        </div>
        <div class="legend-item">
          <div class="legend-dot unanswered"></div> Unanswered
        </div>
        <div class="legend-item">
          <div class="legend-dot flagged"></div> Flagged
        </div>
        <div class="legend-item">
          <div class="legend-dot skipped"></div> Skipped
        </div>
      </div>

      <!-- Grid -->
      <div class="map-grid animate-fade-up delay-2" id="mapGrid">
        <!-- Questions generated by JS -->
      </div>

      <!-- Summary -->
      <div class="summary animate-fade-up delay-3">
        <div class="summary-title">Session Summary</div>
        <div class="summary-grid">
          <div class="summary-item">
            <div class="summary-value green" id="answeredCount">12</div>
            <div class="summary-label">Answered</div>
          </div>
          <div class="summary-item">
            <div class="summary-value muted" id="unansweredCount">14</div>
            <div class="summary-label">Unanswered</div>
          </div>
          <div class="summary-item">
            <div class="summary-value amber" id="flaggedCount">3</div>
            <div class="summary-label">Flagged</div>
          </div>
          <div class="summary-item">
            <div class="summary-value red" id="skippedCount">1</div>
            <div class="summary-label">Skipped</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Buttons -->
    <div class="bottom-cta animate-fade-up delay-3">
      <button type="button" class="btn btn-secondary" onclick="history.back()">
        Continue
      </button>
      <button type="button" class="btn btn-danger" id="submitBtn">
        Submit Exam
      </button>
    </div>
  </div>

  <script>
    // Demo question statuses
    // 0 = unanswered, 1 = answered, 2 = flagged, 3 = skipped, 4 = current
    const statuses = [
      1, 1, 1, 2, 1, 1, 0, 1, 3, 1, 1, 1, 4, 0, 0, 0, 2, 0, 0, 0, 0, 0, 0, 2, 0, 0, 0, 0, 0, 0
    ];

    const grid = document.getElementById('mapGrid');

    statuses.forEach((status, index) => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'map-item';
      item.textContent = index + 1;

      if (status === 1) item.classList.add('answered');
      if (status === 2) item.classList.add('flagged');
      if (status === 3) item.classList.add('skipped');
      if (status === 4) item.classList.add('current');

      item.addEventListener('click', () => {
        alert(`Jump to Question ${index + 1}`);
      });

      grid.appendChild(item);
    });

    // Dynamic summary calculations based on statuses array
    document.getElementById('answeredCount').textContent = statuses.filter(s => s === 1 || s === 4).length;
    document.getElementById('unansweredCount').textContent = statuses.filter(s => s === 0).length;
    document.getElementById('flaggedCount').textContent = statuses.filter(s => s === 2).length;
    document.getElementById('skippedCount').textContent = statuses.filter(s => s === 3).length;

    // Submit confirmation
    document.getElementById('submitBtn').addEventListener('click', () => {
      const unanswered = statuses.filter(s => s === 0).length;
      const flagged = statuses.filter(s => s === 2).length;

      if (confirm(`Submit your exam?\n\nYou have ${unanswered} unanswered and ${flagged} flagged questions.`)) {
        window.location.href = 'results.html';
      }
    });
  </script>
</body>
</html>
