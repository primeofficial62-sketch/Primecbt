<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"> 
  <title>PRIME-CBT — Material Details</title> 
  <link rel="preconnect" href="https://fonts.googleapis.com"> 
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"> 
  <style> 
    :root { 
      --bg: #060b1a; 
      --surface: #0f172a; 
      --surface-2: #1e293b; 
      --border: #334155; 
      --text: #f1f5f9; 
      --muted: #94a3b8; 
      --muted-light: #cbd5e1; 
      --emerald: #10b981; 
      --emerald-bright: #34d399; 
      --teal: #2dd4bf; 
      --amber: #fbbf24; 
      --red: #f87171; 
      --font-display: 'Lora', serif; 
      --font-body: 'Inter', sans-serif; 
    } 

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
    } 

    html, body { 
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg); 
      color: var(--text); 
      font-family: var(--font-body); 
      -webkit-font-smoothing: antialiased; 
      display: flex;
      justify-content: center;
    } 

    .app { 
      width: 100%; 
      max-width: 768px; 
      min-height: 100vh;
      min-height: 100dvh;
      display: flex; 
      flex-direction: column; 
      background: var(--bg); 
      position: relative; 
      border-left: 1px solid rgba(51, 65, 85, 0.4);
      border-right: 1px solid rgba(51, 65, 85, 0.4);
    } 

    @keyframes fadeUp { 
      from { opacity: 0; transform: translateY(18px); } 
      to { opacity: 1; transform: translateY(0); } 
    } 

    @keyframes scaleIn { 
      from { opacity: 0; transform: scale(0.94); } 
      to { opacity: 1; transform: scale(1); } 
    } 

    .animate-fade-up { animation: fadeUp 0.5s ease both; } 
    .animate-scale { animation: scaleIn 0.45s ease both; } 
    .delay-1 { animation-delay: 0.08s; } 
    .delay-2 { animation-delay: 0.16s; } 
    .delay-3 { animation-delay: 0.24s; } 
    .delay-4 { animation-delay: 0.32s; } 

    .topbar { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 16px 20px 12px; 
      padding-top: max(16px, env(safe-area-inset-top)); 
      flex-shrink: 0; 
      background: rgba(6, 11, 26, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
    } 

    .back-btn { 
      width: 42px; 
      height: 42px; 
      border-radius: 12px; 
      background: rgba(30, 41, 59, 0.6); 
      border: 1px solid var(--border); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: var(--muted-light); 
      cursor: pointer; 
      transition: all 0.25s ease; 
    } 

    .back-btn:hover { 
      background: rgba(30, 41, 59, 0.95); 
      color: var(--text); 
    } 

    .back-btn:active { transform: scale(0.94); } 
    .back-btn svg { width: 20px; height: 20px; } 

    .top-actions { 
      display: flex; 
      gap: 10px; 
    } 

    .icon-btn { 
      width: 42px; 
      height: 42px; 
      border-radius: 12px; 
      background: rgba(30, 41, 59, 0.6); 
      border: 1px solid var(--border); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: var(--muted-light); 
      cursor: pointer; 
      transition: all 0.25s ease; 
    } 

    .icon-btn:hover { 
      background: rgba(30, 41, 59, 0.95); 
      color: var(--text); 
    } 

    .icon-btn.active { 
      color: var(--amber); 
      border-color: rgba(251, 191, 36, 0.4); 
      background: rgba(251, 191, 36, 0.1); 
    } 

    .icon-btn svg { width: 20px; height: 20px; } 

    .content { 
      flex: 1; 
      overflow-y: auto; 
      padding: 20px 20px 40px; 
      scrollbar-width: none; 
    } 

    .content::-webkit-scrollbar { display: none; } 

    .preview-card { 
      background: var(--surface); 
      border: 1px solid var(--border); 
      border-radius: 24px; 
      padding: 32px 24px; 
      text-align: center; 
      margin-bottom: 24px; 
      position: relative; 
      overflow: hidden; 
    } 

    .preview-card::before { 
      content: ""; 
      position: absolute; 
      top: -60px; 
      right: -60px; 
      width: 180px; 
      height: 180px; 
      background: radial-gradient(circle, rgba(248, 113, 113, 0.12), transparent 70%); 
      pointer-events: none; 
    } 

    .file-icon-large { 
      width: 88px; 
      height: 88px; 
      border-radius: 22px; 
      background: rgba(248, 113, 113, 0.15); 
      color: var(--red); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      margin: 0 auto 20px; 
    } 

    .file-icon-large svg { width: 42px; height: 42px; } 

    .file-name { 
      font-family: var(--font-display); 
      font-size: 20px; 
      font-weight: 700; 
      margin-bottom: 8px; 
      line-height: 1.3; 
    } 

    .file-type { 
      font-size: 14px; 
      color: var(--muted); 
      margin-bottom: 16px; 
    } 

    .offline-badge { 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      background: rgba(16, 185, 129, 0.12); 
      color: var(--emerald-bright); 
      font-size: 13px; 
      font-weight: 600; 
      padding: 6px 14px; 
      border-radius: 999px; 
    } 

    .offline-badge svg { width: 14px; height: 14px; } 

    .info-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 12px; 
      margin-bottom: 28px; 
    } 

    .info-item { 
      background: var(--surface); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      padding: 16px 10px; 
      text-align: center; 
      transition: all 0.25s ease; 
    } 

    .info-item:hover { 
      transform: translateY(-2px); 
      border-color: rgba(16, 185, 129, 0.3); 
    } 

    .info-value { 
      font-size: 18px; 
      font-weight: 700; 
      margin-bottom: 4px; 
    } 

    .info-label { 
      font-size: 12px; 
      color: var(--muted); 
    } 

    .section { margin-bottom: 28px; } 

    .section-title { 
      font-size: 13px; 
      font-weight: 600; 
      margin-bottom: 12px; 
      color: var(--muted); 
      text-transform: uppercase; 
      letter-spacing: 0.04em; 
    } 

    .detail-card { 
      background: var(--surface); 
      border: 1px solid var(--border); 
      border-radius: 18px; 
      padding: 6px 18px; 
    } 

    .detail-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 14px 0; 
      border-bottom: 1px solid rgba(51, 65, 85, 0.5); 
      font-size: 14px; 
    } 

    .detail-row:last-child { border-bottom: none; } 
    .detail-label { color: var(--muted); } 
    .detail-value { font-weight: 500; color: var(--text); } 

    /* Actions Wrapper */ 
    .bottom-actions { 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      margin-top: 10px;
    } 

    .btn { 
      height: 52px; 
      border-radius: 16px; 
      font-size: 15px; 
      font-weight: 700; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      border: none; 
    } 

    .btn-primary { 
      background: linear-gradient(135deg, #10b981, #059669); 
      color: #022c22; 
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.25); 
    } 

    .btn-primary:hover { 
      transform: translateY(-1px); 
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35); 
    } 

    .btn-secondary { 
      background: var(--surface); 
      border: 1px solid var(--border); 
      color: var(--text); 
    } 

    .btn-secondary:hover { background: var(--surface-2); border-color: #475569; } 
    .btn-row { display: flex; gap: 10px; } 
    .btn-row .btn { flex: 1; } 
    .btn:active { transform: scale(0.97); } 
    .btn svg { width: 18px; height: 18px; } 
    
    /* Remove slide-up, fade-in, and scale entrance animations globally */
.animate-fade-up, 
.animate-scale, 
.animate-fade-in,
.animate-slide-up,
[class*="animate-"] {
  animation: none !important;
  opacity: 1 !important;
  transform: none !important;
} 

/* Instant View Switcher */
.sub-view {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  background-color: var(--bg-dark);
  z-index: 100;
  display: none; /* Hidden by default */
  overflow-y: auto;
  max-width: 480px;
}

.sub-view.active {
  display: block; /* Shows immediately when clicked */
}



  </style> 
</head> 
<body> 
  <div class="app"> 
    <!-- Top Bar --> 
    <div class="topbar animate-fade-up"> 
      <button class="back-btn" onclick="location.href='materials.html'" aria-label="Go back to Materials"> 
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> 
          <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/> 
        </svg> 
      </button> 
      <div class="top-actions"> 
        <button class="icon-btn" id="saveBtn" title="Save to library"> 
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> 
            <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/> 
          </svg> 
        </button> 
        <button class="icon-btn" id="shareBtn" title="Share"> 
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> 
            <circle cx="18" cy="5" r="3"/> 
            <circle cx="6" cy="12" r="3"/> 
            <circle cx="18" cy="19" r="3"/> 
            <path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/> 
          </svg> 
        </button> 
      </div> 
    </div> 

    <!-- Content Area --> 
    <div class="content"> 
      <!-- Preview Card --> 
      <div class="preview-card animate-scale delay-1"> 
        <div class="file-icon-large"> 
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"> 
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/> 
            <path d="M14 2v6h6"/> 
            <path d="M16 13H8"/> 
            <path d="M16 17H8"/> 
            <path d="M10 9H8"/> 
          </svg> 
        </div> 
        <h1 class="file-name">BIO 101 — Cell Biology Notes</h1> 
        <p class="file-type">PDF Document</p> 
        <div class="offline-badge"> 
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> 
            <path d="M5 12.55a11 11 0 0114.08 0"/> 
            <path d="M1.42 9a16 16 0 0121.16 0"/> 
            <path d="M8.53 16.11a6 6 0 016.95 0"/> 
            <circle cx="12" cy="20" r="1"/> 
          </svg> 
          Available Offline 
        </div> 
      </div> 

      <!-- Info Grid --> 
      <div class="info-grid animate-fade-up delay-2"> 
        <div class="info-item"> 
          <div class="info-value">82</div> 
          <div class="info-label">Pages</div> 
        </div> 
        <div class="info-item"> 
          <div class="info-value">4.2</div> 
          <div class="info-label">MB</div> 
        </div> 
        <div class="info-item"> 
          <div class="info-value">2026</div> 
          <div class="info-label">Updated</div> 
        </div> 
      </div> 

      <!-- Details --> 
      <div class="section animate-fade-up delay-3"> 
        <h2 class="section-title">Details</h2> 
        <div class="detail-card"> 
          <div class="detail-row"> 
            <span class="detail-label">Course</span> 
            <span class="detail-value">BIO 101</span> 
          </div> 
          <div class="detail-row"> 
            <span class="detail-label">Topic</span> 
            <span class="detail-value">Cell Biology</span> 
          </div> 
          <div class="detail-row"> 
            <span class="detail-label">Type</span> 
            <span class="detail-value">Course Notes</span> 
          </div> 
          <div class="detail-row"> 
            <span class="detail-label">Uploaded</span> 
            <span class="detail-value">12 Aug 2024</span> 
          </div> 
        </div> 
      </div> 

      <!-- Inline Bottom Actions --> 
      <div class="bottom-actions animate-fade-up delay-4"> 
        <button class="btn btn-primary" onclick="location.href='pdf-reader.html'"> 
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> 
            <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/> 
            <path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/> 
          </svg> 
          Read Now 
        </button> 
        <div class="btn-row"> 
          <button class="btn btn-secondary" id="downloadBtn"> 
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> 
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/> 
              <polyline points="7 10 12 15 17 10"/> 
              <line x1="12" y1="15" x2="12" y2="3"/> 
            </svg> 
            Download 
          </button> 
          <button class="btn btn-secondary" id="saveBottomBtn"> 
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> 
              <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/> 
            </svg> 
            Save 
          </button> 
        </div> 
      </div> 
    </div> 
  </div> 

  <script> 
    const saveBtn = document.getElementById('saveBtn'); 
    const saveBottomBtn = document.getElementById('saveBottomBtn'); 

    function toggleSave() { 
      saveBtn.classList.toggle('active'); 
      const isSaved = saveBtn.classList.contains('active'); 
       
      if (isSaved) { 
        saveBottomBtn.classList.add('active');
        saveBottomBtn.style.color = 'var(--amber)';
        saveBottomBtn.style.borderColor = 'rgba(251, 191, 36, 0.4)';
        saveBottomBtn.style.background = 'rgba(251, 191, 36, 0.1)';
        saveBottomBtn.innerHTML = ` 
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"> 
            <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/> 
          </svg> 
          Saved 
        `; 
      } else { 
        saveBottomBtn.classList.remove('active');
        saveBottomBtn.style.color = '';
        saveBottomBtn.style.borderColor = '';
        saveBottomBtn.style.background = '';
        saveBottomBtn.innerHTML = ` 
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> 
            <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/> 
          </svg> 
          Save 
        `; 
      } 
    } 

    saveBtn.addEventListener('click', toggleSave); 
    saveBottomBtn.addEventListener('click', toggleSave); 

    document.getElementById('downloadBtn').addEventListener('click', () => { 
      alert('Document download initiated...'); 
    });

    document.getElementById('shareBtn').addEventListener('click', () => {
      if (navigator.share) {
        navigator.share({
          title: 'BIO 101 — Cell Biology Notes',
          url: window.location.href
        }).catch(() => {});
      } else {
        alert('Link copied to clipboard!');
      }
    });
  </script> 
</body> 
</html>
