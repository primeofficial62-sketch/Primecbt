<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060b1a">
  <title>PRIME-CBT — Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #060b1a;
      --card-bg: #0f172a;
      --card-bg-hover: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-subdued: #64748b;

      --emerald-text: #34d399;
      --emerald-bg: rgba(52, 211, 153, 0.12);
      --emerald-gradient: linear-gradient(90deg, #34d399 0%, #2dd4bf 100%);
      --emerald-gradient-v: linear-gradient(0deg, #2dd4bf 0%, #34d399 100%);

      --amber-text: #fbbf24;
      --amber-bg: rgba(251, 191, 36, 0.12);

      --red-text: #f87171;
      --red-bg: rgba(248, 113, 113, 0.12);

      --border-color: #334155;
      --radius: 1rem;
      --pad: clamp(1rem, 4vw, 2rem);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Everything is in rem, so the page scales fluidly with the screen */
    html {
      font-size: clamp(14px, 13px + 0.35vw, 18px);
      -webkit-text-size-adjust: 100%;
      background: var(--bg-color);
    }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 70rem;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg-color);
    }

    @media (min-width: 70rem) {
      .app { border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); }
    }

    /* ---------- Top bar ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: max(1rem, env(safe-area-inset-top)) var(--pad) 1rem;
      padding-left: max(var(--pad), env(safe-area-inset-left));
      padding-right: max(var(--pad), env(safe-area-inset-right));
      border-bottom: 1px solid var(--border-color);
      background: rgba(6, 11, 26, 0.92);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .back-btn, .icon-btn {
      width: 2.75rem;
      height: 2.75rem;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--card-bg);
      color: var(--text-main);
      text-decoration: none;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .back-btn:hover, .icon-btn:hover { background: var(--card-bg-hover); border-color: var(--text-subdued); }
    .back-btn svg, .icon-btn svg { width: 1.25rem; height: 1.25rem; }

    .topbar-text { flex: 1; min-width: 0; }
    .topbar-text h1 { font-size: 1.1rem; font-weight: 700; }
    .topbar-text p { font-size: 0.8rem; color: var(--text-muted); overflow-wrap: anywhere; }

    /* ---------- Content: fluid grid ---------- */
    .content {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr));
      align-content: start;
      align-items: start;
      gap: clamp(1rem, 3vw, 1.5rem);
      padding: var(--pad);
      padding-bottom: max(var(--pad), env(safe-area-inset-bottom));
      padding-left: max(var(--pad), env(safe-area-inset-left));
      padding-right: max(var(--pad), env(safe-area-inset-right));
    }

    .content > * { min-width: 0; }
    .full { grid-column: 1 / -1; }

    /* ---------- Status banner ---------- */
    .status {
      background: var(--red-bg);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #cbd5e1;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      line-height: 1.45;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      overflow-wrap: anywhere;
    }
    .status[hidden] { display: none; }
    .status strong { color: var(--red-text); }
    .status button {
      flex-shrink: 0;
      background: var(--card-bg-hover);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* ---------- Hero ---------- */
    .progress-hero {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: clamp(1rem, 3vw, 1.5rem);
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      transition: opacity 0.3s ease;
    }
    .progress-hero.is-loading { opacity: 0.55; }

    .hero-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-subdued);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .hero-score { font-size: 2.4rem; font-weight: 700; line-height: 1; }
    .hero-score span { font-size: 1.5rem; color: var(--text-muted); }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--emerald-bg);
      color: var(--emerald-text);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 1.25rem;
      border: 1px solid rgba(52, 211, 153, 0.2);
    }
    .hero-badge.down { background: var(--red-bg); color: var(--red-text); border-color: rgba(248, 113, 113, 0.25); }
    .hero-badge[hidden] { display: none; }

    .mini-chart {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      height: clamp(5rem, 14vw, 9rem);
      padding-top: 0.6rem;
      border-bottom: 1px solid var(--border-color);
      gap: clamp(0.3rem, 1.5vw, 0.75rem);
    }

    .bar {
      flex: 1;
      min-width: 0;
      background: #334155;
      border-radius: 4px 4px 0 0;
      transition: height 0.5s ease;
    }
    .bar.empty { background: var(--card-bg-hover); }
    .bar.active { background: var(--emerald-gradient-v); }

    .chart-labels {
      display: flex;
      justify-content: space-between;
      gap: clamp(0.3rem, 1.5vw, 0.75rem);
      font-size: 0.7rem;
      color: var(--text-subdued);
      font-weight: 500;
    }
    .chart-labels span { flex: 1; text-align: center; min-width: 0; }

    /* ---------- Quick stats ---------- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr));
      gap: 0.75rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0;
    }

    .stat-card .stat-label {
      font-size: 0.7rem;
      color: var(--text-subdued);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-value { font-size: 1.2rem; font-weight: 700; overflow-wrap: anywhere; }
    .stat-value.emerald { color: var(--emerald-text); }

    /* ---------- Sections ---------- */
    .section { display: flex; flex-direction: column; gap: 0.75rem; }

    .section-header { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .section-header h2 { font-size: 1rem; font-weight: 700; }

    .see-all-btn { font-size: 0.85rem; font-weight: 600; color: var(--emerald-text); text-decoration: none; }

    .course-list, .focus-list { display: flex; flex-direction: column; gap: 0.65rem; }

    .course-card, .focus-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .course-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
    .course-top > div { min-width: 0; }
    .course-top h3 { font-size: 0.95rem; font-weight: 600; overflow-wrap: anywhere; }
    .course-top p { font-size: 0.8rem; color: var(--text-muted); overflow-wrap: anywhere; }

    .score {
      font-size: 0.88rem;
      font-weight: 700;
      padding: 0.1rem 0.5rem;
      border-radius: 0.4rem;
      flex-shrink: 0;
    }
    .score.emerald { background: var(--emerald-bg); color: var(--emerald-text); border: 1px solid rgba(52, 211, 153, 0.2); }
    .score.amber { background: var(--amber-bg); color: var(--amber-text); border: 1px solid rgba(251, 191, 36, 0.2); }
    .score.red { background: var(--red-bg); color: var(--red-text); border: 1px solid rgba(248, 113, 113, 0.2); }

    .progress-track {
      width: 100%;
      height: 0.4rem;
      background: var(--card-bg-hover);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
    .progress-fill.emerald { background: var(--emerald-gradient); }
    .progress-fill.amber { background: var(--amber-text); }
    .progress-fill.red { background: var(--red-text); }

    .focus-card { flex-direction: row; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.9rem 1rem; }
    .focus-info { min-width: 0; }
    .focus-info h3 { font-size: 0.95rem; font-weight: 600; overflow-wrap: anywhere; }
    .focus-info p { font-size: 0.8rem; color: var(--text-muted); }
    .focus-right { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }

    .practice-btn {
      background: var(--card-bg-hover);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.45rem 0.8rem;
      border-radius: 0.5rem;
      text-decoration: none;
      white-space: nowrap;
    }
    .practice-btn:hover { background: #334155; }

    .empty-state {
      background: var(--card-bg);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius);
      padding: 1.25rem 1rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .empty-state a { color: var(--emerald-text); font-weight: 600; text-decoration: none; }

    /* ---------- Options menu ---------- */
    .menu-dropdown {
      position: absolute;
      top: calc(100% - 0.25rem);
      right: max(var(--pad), env(safe-area-inset-right));
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 0.5rem;
      width: min(15rem, calc(100vw - 2rem));
      display: none;
      flex-direction: column;
      gap: 0.2rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      z-index: 100;
    }
    .menu-dropdown.active { display: flex; }

    .menu-title {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-subdued);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.4rem 0.75rem 0.2rem;
    }

    .menu-divider { height: 1px; background: var(--border-color); margin: 0.3rem 0; }

    .menu-dropdown button {
      width: 100%;
      min-height: 2.5rem;
      padding: 0.55rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      border: none;
      background: transparent;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .menu-dropdown button:hover { background: var(--card-bg-hover); }
    .menu-dropdown button.selected { color: var(--emerald-text); font-weight: 600; }
    .menu-dropdown button.selected::after { content: '✓'; }

    .back-btn:focus-visible, .icon-btn:focus-visible, .menu-dropdown button:focus-visible,
    .practice-btn:focus-visible, .see-all-btn:focus-visible, .status button:focus-visible {
      outline: 2px solid var(--emerald-text);
      outline-offset: 2px;
    }

    /* ---------- Animation ---------- */
    .animate-fade-up { animation: fadeUp 0.4s ease both; }
    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.1s; }
    .delay-3 { animation-delay: 0.15s; }
    .delay-4 { animation-delay: 0.2s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ---------- Edge cases ---------- */
    @media (max-width: 340px) {
      .focus-card { flex-direction: column; align-items: flex-start; }
      .focus-right { width: 100%; justify-content: space-between; }
    }

    @media (max-height: 480px) and (orientation: landscape) {
      .topbar { position: static; }
    }

    @media (min-width: 1800px) { html { font-size: 20px; } }

    @media (prefers-reduced-motion: reduce) {
      .animate-fade-up { animation: none; }
      * { transition: none !important; }
    }

    /* Export (Print / Save as PDF) */
    @media print {
      :root {
        --bg-color: #fff; --card-bg: #fff; --card-bg-hover: #f1f5f9; --text-main: #0f172a;
        --text-muted: #475569; --text-subdued: #475569; --border-color: #cbd5e1;
      }
      html, body, .app { background: #fff !important; }
      .topbar .back-btn, .topbar .icon-btn, .menu-dropdown, .status, .practice-btn, .see-all-btn { display: none !important; }
      .topbar { position: static; background: #fff; }
      .animate-fade-up { animation: none; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Top Bar -->
    <header class="topbar">
      <a href="home.html" class="back-btn" aria-label="Back to Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>

      <div class="topbar-text">
        <h1>Progress</h1>
        <p id="rangeSubtitle">Your performance overview</p>
      </div>

      <button class="icon-btn" id="optionsBtn" type="button" aria-label="Analytics options" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="1"/>
          <circle cx="19" cy="12" r="1"/>
          <circle cx="5" cy="12" r="1"/>
        </svg>
      </button>

      <div class="menu-dropdown" id="optionsMenu">
        <div class="menu-title">Time range</div>
        <button type="button" data-range="all" class="selected">All time</button>
        <button type="button" data-range="90">Last 90 days</button>
        <button type="button" data-range="30">Last 30 days</button>
        <button type="button" data-range="7">Last 7 days</button>
        <div class="menu-divider"></div>
        <button type="button" id="exportBtn">Export report (PDF)</button>
      </div>
    </header>

    <!-- Content -->
    <main class="content">
      <div class="status full" id="statusBanner" role="alert" hidden>
        <span id="statusText"></span>
        <button type="button" id="statusRetry">Retry</button>
      </div>

      <!-- Overall Accuracy -->
      <section class="progress-hero full animate-fade-up delay-1 is-loading" id="hero">
        <p class="hero-label" id="heroLabel">Overall Accuracy</p>
        <div class="hero-top">
          <div class="hero-score" id="heroScore">–</div>
          <div class="hero-badge" id="heroBadge" hidden></div>
        </div>

        <div class="mini-chart" id="miniChart" aria-label="Accuracy over the last 7 days"></div>
        <div class="chart-labels" id="chartLabels"></div>
      </section>

      <!-- Quick Stats -->
      <section class="stats-grid full animate-fade-up delay-2">
        <div class="stat-card">
          <p class="stat-label">Questions Answered</p>
          <p class="stat-value" id="statQuestions">–</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Study Time</p>
          <p class="stat-value" id="statTime">–</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Exams Completed</p>
          <p class="stat-value" id="statExams">–</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Current Streak</p>
          <p class="stat-value emerald" id="statStreak">–</p>
        </div>
      </section>

      <!-- Course Performance -->
      <section class="section animate-fade-up delay-3">
        <div class="section-header">
          <h2>Course Performance</h2>
          <a href="study-activity.html" class="see-all-btn">See all</a>
        </div>
        <div class="course-list" id="courseList"></div>
      </section>

      <!-- Focus Areas -->
      <section class="section animate-fade-up delay-4">
        <div class="section-header">
          <h2>Focus Areas</h2>
        </div>
        <div class="focus-list" id="focusList"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    /* ====== CONFIG ====== */
    const SUPABASE_URL = 'https://xuofkjjhupgmrphzgyun.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_GThKt7BvR1D81U939_EQkw_yCnTQ3xh';

    const T = {
      profiles: 'profiles',      // id (= auth user id), streak
      results: 'test_results'    // user_id, score, total_questions, created_at,
                                 // optional: course_code, course_title, topic, duration_seconds, mode ('exam' | 'practice')
    };
    const WEAK_BELOW = 70;       // courses/topics under this accuracy show in Focus Areas
    /* ===================== */

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (n) => Number(n || 0).toLocaleString();
    const pct = (c, t) => (t > 0 ? Math.round((c / t) * 100) : null);
    const tier = (p) => (p >= 70 ? 'emerald' : p >= 50 ? 'amber' : 'red');
    const sumOf = (rows, f) => rows.reduce((s, r) => s + Number(r[f] || 0), 0);
    const dayKey = (d) => {
      const x = new Date(d);
      return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
    };

    const RANGE_LABELS = { all: 'All time', '90': 'Last 90 days', '30': 'Last 30 days', '7': 'Last 7 days' };

    let sb = null, uid = null, channel = null, refreshTimer = null;
    let allRows = [];
    let streak = 0;
    let range = 'all';
    try { range = localStorage.getItem('progressRange') || 'all'; } catch (e) {}
    if (!RANGE_LABELS[range]) range = 'all';

    function showStatus(message) {
      $('statusText').innerHTML = '<strong>Problem:</strong> ' + esc(message);
      $('statusBanner').hidden = false;
      $('hero').classList.remove('is-loading');
    }
    function clearStatus() { $('statusBanner').hidden = true; }

    function formatDuration(seconds) {
      const m = Math.floor(seconds / 60);
      const h = Math.floor(m / 60);
      if (h > 0) return h + 'h ' + String(m % 60).padStart(2, '0') + 'm';
      return m + 'm';
    }

    function filteredRows() {
      if (range === 'all') return allRows;
      const cutoff = Date.now() - Number(range) * 86400000;
      return allRows.filter((r) => new Date(r.created_at).getTime() >= cutoff);
    }

    function groupBy(rows, keyFn, labelFn) {
      const map = new Map();
      rows.forEach((r) => {
        const key = keyFn(r);
        if (!key) return;
        if (!map.has(key)) map.set(key, { key, label: labelFn(r), c: 0, t: 0, last: 0 });
        const g = map.get(key);
        g.c += Number(r.score || 0);
        g.t += Number(r.total_questions || 0);
        g.last = Math.max(g.last, new Date(r.created_at).getTime() || 0);
      });
      return [...map.values()];
    }

    function renderChart() {
      // Always the last 7 days, independent of the range filter
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() - i);
        days.push(d);
      }
      const byDay = {};
      allRows.forEach((r) => {
        const k = dayKey(r.created_at);
        byDay[k] = byDay[k] || { c: 0, t: 0 };
        byDay[k].c += Number(r.score || 0);
        byDay[k].t += Number(r.total_questions || 0);
      });

      $('miniChart').innerHTML = days.map((d, i) => {
        const g = byDay[dayKey(d)];
        const p = g ? pct(g.c, g.t) : null;
        const label = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
        if (p == null) return `<div class="bar empty" style="height:3%" title="${esc(label)}: no tests"></div>`;
        const active = i === 6 ? ' active' : '';
        return `<div class="bar${active}" style="height:${Math.max(p, 4)}%" title="${esc(label)}: ${p}%"></div>`;
      }).join('');

      $('chartLabels').innerHTML = days.map((d) =>
        `<span>${esc(d.toLocaleDateString(undefined, { weekday: 'short' }))}</span>`).join('');

      // Week over week change
      const weekStart = days[0].getTime();
      const prevStart = weekStart - 7 * 86400000;
      const thisW = allRows.filter((r) => new Date(r.created_at).getTime() >= weekStart);
      const prevW = allRows.filter((r) => {
        const t = new Date(r.created_at).getTime();
        return t >= prevStart && t < weekStart;
      });
      const a = pct(sumOf(thisW, 'score'), sumOf(thisW, 'total_questions'));
      const b = pct(sumOf(prevW, 'score'), sumOf(prevW, 'total_questions'));
      const badge = $('heroBadge');
      if (a != null && b != null) {
        const diff = a - b;
        badge.textContent = (diff >= 0 ? '▲ +' : '▼ ') + diff + '% this week';
        badge.classList.toggle('down', diff < 0);
        badge.hidden = false;
      } else {
        badge.hidden = true;
      }
    }

    function renderCourses(rows) {
      const list = $('courseList');
      const courses = groupBy(rows, (r) => r.course_code, (r) => ({ code: r.course_code, title: r.course_title }))
        .sort((x, y) => y.last - x.last)
        .slice(0, 6);

      if (!courses.length) {
        list.innerHTML = `<div class="empty-state">No course results yet.<br><a href="practice-setup.html">Start a practice session</a> to see your performance here.</div>`;
        return;
      }

      list.innerHTML = courses.map((g) => {
        const p = pct(g.c, g.t);
        const t = tier(p);
        return `
          <div class="course-card">
            <div class="course-top">
              <div>
                <h3>${esc(g.label.code)}</h3>
                ${g.label.title ? `<p>${esc(g.label.title)}</p>` : ''}
              </div>
              <span class="score ${t}">${p}%</span>
            </div>
            <div class="progress-track"><div class="progress-fill ${t}" style="width:${p}%"></div></div>
          </div>`;
      }).join('');
    }

    function renderFocus(rows) {
      const list = $('focusList');
      const hasTopics = rows.some((r) => r.topic);
      const groups = hasTopics
        ? groupBy(rows, (r) => r.topic && (r.course_code + '|' + r.topic), (r) => ({ name: r.topic, course: r.course_code }))
        : groupBy(rows, (r) => r.course_code, (r) => ({ name: r.course_title || r.course_code, course: r.course_code }));

      const weak = groups
        .map((g) => ({ ...g, p: pct(g.c, g.t) }))
        .filter((g) => g.p != null && g.p < WEAK_BELOW)
        .sort((x, y) => x.p - y.p)
        .slice(0, 4);

      if (!weak.length) {
        list.innerHTML = rows.length
          ? `<div class="empty-state">Nothing below ${WEAK_BELOW}% right now. Keep it up!</div>`
          : `<div class="empty-state">Your weakest areas will appear here once you complete some tests.</div>`;
        return;
      }

      list.innerHTML = weak.map((g) => `
        <div class="focus-card">
          <div class="focus-info">
            <h3>${esc(g.label.name)}</h3>
            <p>${fmt(g.t)} question${g.t === 1 ? '' : 's'} attempted</p>
          </div>
          <div class="focus-right">
            <span class="score ${tier(g.p)}">${g.p}%</span>
            <a href="practice-setup.html${g.label.course ? '?course=' + encodeURIComponent(g.label.course) : ''}" class="practice-btn">Practice</a>
          </div>
        </div>`).join('');
    }

    function render() {
      const rows = filteredRows();

      $('rangeSubtitle').textContent = range === 'all' ? 'Your performance overview' : RANGE_LABELS[range];
      $('heroLabel').textContent = 'Overall Accuracy' + (range === 'all' ? '' : ' · ' + RANGE_LABELS[range]);

      const correct = sumOf(rows, 'score');
      const total = sumOf(rows, 'total_questions');
      const acc = pct(correct, total);
      $('heroScore').innerHTML = acc == null ? '–' : acc + '<span>%</span>';

      $('statQuestions').textContent = fmt(total);
      $('statTime').textContent = formatDuration(sumOf(rows, 'duration_seconds'));
      $('statExams').textContent = fmt(rows.filter((r) => r.mode === 'exam').length);
      $('statStreak').textContent = streak + (streak === 1 ? ' day' : ' days');

      renderChart();
      renderCourses(rows);
      renderFocus(rows);

      // Menu selection state
      document.querySelectorAll('#optionsMenu [data-range]').forEach((b) =>
        b.classList.toggle('selected', b.dataset.range === range));

      $('hero').classList.remove('is-loading');
    }

    async function loadAll() {
      if (!sb || !uid) return;

      const results = await Promise.allSettled([
        sb.from(T.results).select('*').eq('user_id', uid).order('created_at', { ascending: true }),
        sb.from(T.profiles).select('*').eq('id', uid).maybeSingle()
      ]);

      const labels = [T.results, T.profiles];
      const errors = [];
      const data = results.map((r, i) => {
        if (r.status === 'rejected') { errors.push(`${labels[i]}: ${(r.reason && r.reason.message) || r.reason}`); return null; }
        if (r.value.error) { errors.push(`${labels[i]}: ${r.value.error.message}`); return null; }
        return r.value;
      });

      allRows = (data[0] && data[0].data) || [];
      streak = Number(((data[1] && data[1].data) || {}).streak || 0);

      render();

      if (errors.length) { console.error('[progress] load errors:', errors); showStatus(errors.join(' | ')); }
      else clearStatus();
    }

    function scheduleRefresh() {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(loadAll, 150);
    }

    function subscribeRealtime() {
      try {
        channel = sb.channel('progress-' + uid)
          .on('postgres_changes', { event: '*', schema: 'public', table: T.results, filter: `user_id=eq.${uid}` }, scheduleRefresh)
          .on('postgres_changes', { event: '*', schema: 'public', table: T.profiles, filter: `id=eq.${uid}` }, scheduleRefresh)
          .subscribe((status, err) => {
            if (status === 'CHANNEL_ERROR') console.error('[progress] realtime error:', err);
          });
      } catch (e) {
        console.error('[progress] realtime failed to start:', e);
      }
    }

    async function init() {
      if (!window.supabase || !window.supabase.createClient) {
        showStatus('The Supabase library did not load. Check your internet connection and reload.');
        return;
      }
      try {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await sb.auth.getSession();
        if (error) throw error;
        if (!data.session) { window.location.href = 'auth.html'; return; }
        uid = data.session.user.id;

        await loadAll();
        subscribeRealtime();

        sb.auth.onAuthStateChange((event) => {
          if (event === 'SIGNED_OUT') window.location.href = 'auth.html';
        });
      } catch (e) {
        console.error('[progress] init error:', e);
        showStatus((e && e.message) || 'Something went wrong while loading your progress.');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const optionsBtn = $('optionsBtn');
      const optionsMenu = $('optionsMenu');

      const setMenu = (open) => {
        optionsMenu.classList.toggle('active', open);
        optionsBtn.setAttribute('aria-expanded', String(open));
      };

      optionsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        setMenu(!optionsMenu.classList.contains('active'));
      });
      document.addEventListener('click', (e) => {
        if (!optionsMenu.contains(e.target) && e.target !== optionsBtn) setMenu(false);
      });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });

      optionsMenu.querySelectorAll('[data-range]').forEach((b) => {
        b.addEventListener('click', () => {
          range = b.dataset.range;
          try { localStorage.setItem('progressRange', range); } catch (e) {}
          render();
          setMenu(false);
        });
      });

      // Opens the browser print dialog, where "Save as PDF" is available
      $('exportBtn').addEventListener('click', () => { setMenu(false); window.print(); });

      $('statusRetry').addEventListener('click', () => { if (sb && uid) loadAll(); else window.location.reload(); });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll(); });

      init();
    });
  </script>
</body>
</html>
